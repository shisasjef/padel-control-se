}

// ==================== MATCH ENGINE (DETERMINISTIC REPLAY) ====================
function createMatchFromPreset(p) {
  const t0 = p.teams[0], t1 = p.teams[1];
  const players0 = [t0.players[0]?.trim() || 'DRIVE 1', t0.players[1]?.trim() || 'REVÉS 1'];
  const players1 = [t1.players[0]?.trim() || 'DRIVE 2', t1.players[1]?.trim() || 'REVÉS 2'];
  const fs = p.firstServer || [0,0];
  const totalSets = Math.max(1, Number(p.totalSets) || (p.setsToWin ? (Number(p.setsToWin) * 2 - 1) : 3));
  const setsToWin = Math.floor(totalSets / 2) + 1;
  const kind = p.matchContext || 'daily';
  const comp = (kind === 'league' || kind === 'tournament') && p.compId ? getCompById(p.compId) : null;
  return {
    id: Math.random().toString(36).slice(2, 5) + Date.now().toString(36).slice(-3),
    createdAt: Date.now(),
    durationMs: 0,
    status: 'playing', // 'playing' | 'paused' | 'finished' | 'abandoned'
    mode: 'doubles',
    competition: {
      kind: comp ? comp.kind : kind,
      compId: comp ? comp.id : null,
      compName: comp ? comp.name : '',
      fixtureId: p.fixtureId || null,
      stageLabel: (p.stageLabel || '').trim()
    },
    teams: [
      {players: players0, color: t0.color || '#d4af37'},
      {players: players1, color: t1.color || '#2f8cff'}
    ],
    rules: {
      totalSets,
      setsToWin,
      gamesPerSet: Math.max(1, Number(p.gamesPerSet) || 6),
      deuceRule: p.deuceRule || 'golden',
      tiebreakAt: p.tiebreakAt !== undefined ? Number(p.tiebreakAt) : Math.max(1, Number(p.gamesPerSet) || 6),
      tiebreakPoints: Math.max(1, Number(p.tiebreakPoints) || 7),
      finalSet: p.finalSet || 'normal',
      changeoverRule: p.changeoverRule || 'odd'
    },
    firstServer: [fs[0] || 0, fs[1] || 0],
    secondServerIdx: p.secondServerIdx ?? null,
    shotPrompt: p.shotPrompt !== undefined ? !!p.shotPrompt : true,
    flipped: false,
    pendingFault: false,
    events: [],
    redoStack: []
  };
}

function getServerRotation(m) {
  const tA = m.firstServer[0];
  const pA1 = m.firstServer[1] || 0;
  const pA2 = 1 - pA1;
  const tB = 1 - tA;
  const pB1 = m.secondServerIdx ?? 0;
  const pB2 = 1 - pB1;
  return [[tA, pA1], [tB, pB1], [tA, pA2], [tB, pB2]];
}

function regularPointCall(p0, p1, deuceRule, deuceCount) {
  const MAP = ['0','15','30','40'];
  if (p0 < 3 || p1 < 3) return `${MAP[Math.min(p0,3)]}-${MAP[Math.min(p1,3)]}`;
  if (p0 === p1) return (deuceRule === 'star' && deuceCount >= 3) ? '40-40 ★' : '40-40';
  return p0 > p1 ? 'AD-40' : '40-AD';
}

function isBreakPointSituation(srvTeam, p0, p1, deuceRule, deuceCount) {
  const sp = srvTeam === 0 ? p0 : p1;
  const rp = srvTeam === 0 ? p1 : p0;
  if (rp < 3) return false;
  if (sp < 3) return true; // 0-40, 15-40, 30-40
  if (deuceRule === 'golden') return sp === 3 && rp === 3;
  if (deuceRule === 'star') return (sp === rp && deuceCount >= 3) || (rp > sp);
  return rp > sp; // advantage receiver
}

function isGoldenPointSituation(p0, p1, deuceRule, deuceCount) {
  if (p0 < 3 || p1 < 3 || p0 !== p1) return false;
  if (deuceRule === 'golden') return true;
  if (deuceRule === 'star' && deuceCount >= 3) return true;
  return false;
}

function isStarPointSituation(p0, p1, deuceRule, deuceCount) {
  return deuceRule === 'star' && p0 >= 3 && p1 >= 3 && p0 === p1 && deuceCount >= 3;
}

function isSetPointFor(m, st, curSet, isTB, isSuperTB, p0, p1, team) {
  const R = m.rules;
  const opp = 1 - team;
  const tp = team === 0 ? p0 : p1;
  const op = team === 0 ? p1 : p0;
  if (isSuperTB) {
    return tp >= 9 && (tp - op) >= 1;
  }
  if (isTB) {
    const target = R.tiebreakPoints || 7;
    return tp >= (target - 1) && (tp - op) >= 1;
  }
  // Does winning this game win the set for `team`?
  const gT = curSet.games[team] + 1;
  const gO = curSet.games[opp];
  const gps = R.gamesPerSet || 6;
  const winsSetIfGame = (gT >= gps && (gT - gO) >= 2);
  if (!winsSetIfGame) return false;
  // Is this point a game point for `team`?
  if (tp < 3) return false;
  if (op < 3) return true;
  if (R.deuceRule === 'golden') return tp === 3 && op === 3;
  if (R.deuceRule === 'star' && tp === op && st.deuceCount >= 3) return true;
  return tp > op;
}

function computeMatch(m) {
  if ((Array.isArray(m.manualSets) && m.manualSets.length) || (m.manualWinner !== undefined && m.manualWinner !== null) || m.isDraw) {
    const sets = (Array.isArray(m.manualSets) ? m.manualSets : []).map(s => {
      const g0 = Number(s[0]) || 0;
      const g1 = Number(s[1]) || 0;
      const w = (s[2] !== undefined && s[2] !== null && s[2] !== 'draw') ? s[2] : (g0 > g1 ? 0 : (g1 > g0 ? 1 : null));
      return { games: [g0, g1], history: [], winner: w, tbScore: s[3] || null, isSuperTB: !!s[4] };
    });
    const setsWon = [
      sets.filter(s => s.winner === 0).length,
      sets.filter(s => s.winner === 1).length
    ];
    const explicitDraw = !!(m.isDraw || m.manualWinner === 'draw');
    const mw = explicitDraw
      ? null
      : ((m.manualWinner !== undefined && m.manualWinner !== null)
          ? m.manualWinner
          : (setsWon[0] > setsWon[1] ? 0 : (setsWon[1] > setsWon[0] ? 1 : null)));
    const lastIdx = Math.max(0, sets.length - 1);
    return {
      sets,
      curSetIdx: lastIdx,
      curSet: sets[lastIdx] || { games: [0, 0], history: [], winner: null, tbScore: null, isSuperTB: false },
      setsWon,
      matchWinner: mw,
      isDraw: explicitDraw,
      p: [0, 0],
      pointDisplay: ['0', '0'],
      srvTeam: 0,
      srvPlayer: 0,
      srvSide: null,
      srvSideLabel: '',
      isTB: false,
      isSuperTB: false,
      isGP: false,
      isStar: false,
      curDeuceCount: 0,
      curAdvNumber: 0,
      isBP: false,
      sp: [false, false],
      mp: [false, false],
      curGamePoints: [],
      allPoints: [],
      totalGamesPlayed: sets.reduce((sum, s) => sum + s.games[0] + s.games[1], 0),
      lastTransition: null
    };
  }
  const R = m.rules;
  const rot = getServerRotation(m);
  let rotIdx = 0;

  const sets = [{games:[0,0], history:[], winner:null, tbScore:null, isSuperTB:false}];
  let curSetIdx = 0;
  let setsWon = [0,0];
  let matchWinner = null;

  // Current game state
  let p = [0,0];
  let deuceCount = 0;
  let curGamePoints = [];
  let totalGamesPlayed = 0;

  // Enriched point list for stats
  const allPoints = [];

  function checkIsSuperTB(sIdx) {
    if (R.finalSet !== 'supertb') return false;
    const maxSets = R.totalSets || (R.setsToWin * 2 - 1);
    return maxSets > 1 && (sIdx === maxSets - 1) && setsWon[0] === setsWon[1];
  }
  function checkIsTB(s) {
    if (s.isSuperTB) return true;
    const tbAt = R.tiebreakAt;
    if (!tbAt || tbAt <= 0) return false;
    return s.games[0] === tbAt && s.games[1] === tbAt;
  }
  function getCurServer(isTB, tbPtsPlayed) {
    if (!isTB) return rot[rotIdx % 4];
    if (tbPtsPlayed === 0) return rot[rotIdx % 4];
    const k = Math.floor((tbPtsPlayed + 1) / 2);
    return rot[(rotIdx + k) % 4];
  }

  let lastTransition = null; // {type, ...}

  for (let idx = 0; idx < m.events.length; idx++) {
    if (matchWinner !== null) break;
    const ev = m.events[idx];
    const curSet = sets[curSetIdx];
    curSet.isSuperTB = checkIsSuperTB(curSetIdx);
    const isSuperTB = curSet.isSuperTB;
    const isTB = checkIsTB(curSet);
    const tbPtsPlayed = p[0] + p[1];
    const srv = getCurServer(isTB, tbPtsPlayed);
    const srvTeam = srv[0], srvPlayer = srv[1];

    if (p[0] >= 3 && p[1] >= 3 && p[0] === p[1] && !isTB) {
      if (p[0] === 3) deuceCount = 1;
      else deuceCount++;
    }

    const scoreBefore = isTB
      ? `${p[0]}-${p[1]}`
      : regularPointCall(p[0], p[1], R.deuceRule, deuceCount);

    const isGP = !isTB && isGoldenPointSituation(p[0], p[1], R.deuceRule, deuceCount);
    const isStar = !isTB && isStarPointSituation(p[0], p[1], R.deuceRule, deuceCount);
    const isBP = !isTB && isBreakPointSituation(srvTeam, p[0], p[1], R.deuceRule, deuceCount);
    const isKey = !isTB && (isBP || (p[0] >= 2 && p[1] >= 2));

    const w = ev.w;
    const pBefore = [p[0], p[1]];
    p[w]++;

    const scoreAfter = isTB
      ? `${p[0]}-${p[1]}`
      : regularPointCall(p[0], p[1], R.deuceRule, deuceCount);

    const ptRecord = {
      idx,
      setIdx: curSetIdx,
      gameIdx: curSet.history.length,
      w,
      srvTeam,
      srvPlayer,
      firstServeIn: ev.fs !== false,
      doubleFault: ev.type === 'df',
      shotType: ev.type || 'pt', // 'winner' | 'ue' | 'fe' | 'df' | 'pt'
      subType: ev.sub || null,   // 'smash' | 'volea' | 'bandeja' | 'bajada' | 'dejada' | 'passing' | 'globo' | 'winner'
      byPlayer: ev.by || null,   // [team, playerIdx]
      scoreBefore,
      scoreAfter,
      pBefore,
      isTB,
      isSuperTB,
      isGP,
      isStar,
      isBP,
      isKey
    };

    curGamePoints.push(ptRecord);
    allPoints.push(ptRecord);

    // Check if game/TB won
    let gameWinner = null;
    if (isTB) {
      const target = isSuperTB ? 10 : (R.tiebreakPoints || 7);
      if (p[w] >= target && (p[w] - p[1 - w]) >= 2) gameWinner = w;
    } else {
      if (isGP) {
        gameWinner = w;
      } else if (p[w] >= 4 && (p[w] - p[1 - w]) >= 2) {
        gameWinner = w;
      }
    }

    lastTransition = null;
    if (gameWinner !== null) {
      const wasBreak = !isTB && (gameWinner !== srvTeam);
      curSet.games[gameWinner]++;
      const gAfter = [curSet.games[0], curSet.games[1]];
      const gameObj = {
        setIdx: curSetIdx,
        gameIdx: curSet.history.length,
        srvTeam,
        srvPlayer,
        winner: gameWinner,
        isBreak: wasBreak,
        isTB,
        isSuperTB,
        tbScore: isTB ? [p[0], p[1]] : null,
        gamesAfter: gAfter,
        points: curGamePoints
      };
      curSet.history.push(gameObj);
      totalGamesPlayed++;

      // Advance server rotation
      rotIdx = (rotIdx + 1) % 4;

      // Check if set won
      const gps = R.gamesPerSet || 6;
      let setWinner = null;
      if (isTB) {
        setWinner = gameWinner;
        curSet.tbScore = [p[0], p[1]];
      } else if (curSet.games[gameWinner] >= gps && (curSet.games[gameWinner] - curSet.games[1 - gameWinner]) >= 2) {
        setWinner = gameWinner;
      }

      // Reset game state
      p = [0,0];
      deuceCount = 0;
      curGamePoints = [];

      if (setWinner !== null) {
        curSet.winner = setWinner;
        setsWon[setWinner]++;
        const coRule = R.changeoverRule || 'odd';
        const sumSetG = curSet.games[0] + curSet.games[1];
        const setCo = coRule === 'set' ? true : (coRule === 'odd' ? (sumSetG % 2 === 1) : false);
        const maxSets = R.totalSets || (R.setsToWin * 2 - 1);
        if (setsWon[setWinner] >= R.setsToWin || (setsWon[0] + setsWon[1]) >= maxSets) {
          matchWinner = setsWon[0] >= setsWon[1] ? 0 : 1;
          lastTransition = {type:'match', winner: matchWinner, setIdx: curSetIdx};
        } else {
          const finishedSetIdx = curSetIdx;
          curSetIdx++;
          sets.push({games:[0,0], history:[], winner:null, tbScore:null, isSuperTB: checkIsSuperTB(curSetIdx)});
          lastTransition = {type:'set', winner: setWinner, setIdx: finishedSetIdx, changeover: setCo};
        }
      } else {
        const coRule = R.changeoverRule || 'odd';
        const sumG = curSet.games[0] + curSet.games[1];
        const needPrompt2nd = (totalGamesPlayed === 1 && m.secondServerIdx === null);
        lastTransition = {
          type: 'game',
          winner: gameWinner,
          wasBreak,
          changeover: (coRule === 'odd') && (sumG % 2 === 1),
          needSecondServerPrompt: needPrompt2nd
        };
      }
    } else if (isTB && (R.changeoverRule || 'odd') === 'odd') {
      const sumTB = p[0] + p[1];
      if (sumTB > 0 && sumTB % 6 === 0) {
        lastTransition = {type:'tb_changeover', tbScore:[p[0], p[1]]};
      }
    }
  }

  const curSet = sets[curSetIdx];
  curSet.isSuperTB = checkIsSuperTB(curSetIdx);
  const isSuperTB = curSet.isSuperTB;
  const isTB = checkIsTB(curSet);
  const srv = getCurServer(isTB, p[0] + p[1]);
  const srvTeam = srv[0], srvPlayer = srv[1];

  let curDeuceCount = deuceCount;
  let curAdvNumber = 0;
  if (!isTB && p[0] >= 3 && p[1] >= 3) {
    if (p[0] === p[1]) {
      curDeuceCount = (p[0] - 3) + 1;
    } else {
      curAdvNumber = Math.min(p[0], p[1]) - 3 + 1; // 1 = 1ª ventaja, 2 = 2ª ventaja
    }
  }

  const isGP = !isTB && isGoldenPointSituation(p[0], p[1], R.deuceRule, curDeuceCount);
  const isStar = !isTB && isStarPointSituation(p[0], p[1], R.deuceRule, curDeuceCount);
  const isBP = !isTB && isBreakPointSituation(srvTeam, p[0], p[1], R.deuceRule, curDeuceCount);
  const sp0 = isSetPointFor(m, {deuceCount:curDeuceCount}, curSet, isTB, isSuperTB, p[0], p[1], 0);
  const sp1 = isSetPointFor(m, {deuceCount:curDeuceCount}, curSet, isTB, isSuperTB, p[0], p[1], 1);
  const mp0 = sp0 && setsWon[0] === (R.setsToWin - 1);
  const mp1 = sp1 && setsWon[1] === (R.setsToWin - 1);

  let pointDisplay = ['0','0'];
  if (isTB) {
    pointDisplay = [String(p[0]), String(p[1])];
  } else {
    const MAP = ['0','15','30','40'];
    if (p[0] < 3 || p[1] < 3) {
      pointDisplay = [MAP[Math.min(p[0],3)], MAP[Math.min(p[1],3)]];
    } else if (p[0] === p[1]) {
      pointDisplay = isStar ? ['40 ★','40 ★'] : ['40','40'];
    } else if (p[0] > p[1]) {
      pointDisplay = ['AD','40'];
    } else {
      pointDisplay = ['40','AD'];
    }
  }

  const srvSide = matchWinner !== null ? null : (((p[0] + p[1]) % 2 === 0) ? 'D' : 'R');
  const srvSideLabel = srvSide === 'D' ? 'Derecha' : (srvSide === 'R' ? 'Revés' : '');

  return {
    sets,
    curSetIdx,
    curSet,
    setsWon,
    matchWinner,
    isDraw: false,
    p,
    pointDisplay,
    srvTeam,
    srvPlayer,
    srvSide,
    srvSideLabel,
    isTB,
    isSuperTB,
    isGP,
    isStar,
    curDeuceCount,
    curAdvNumber,
    isBP,
    sp: [sp0, sp1],
    mp: [mp0, mp1],
    curGamePoints,
    allPoints,
    totalGamesPlayed,
    lastTransition
  };
}

// ==================== ELO RANKING, STANDINGS & COMPETITION ENGINE ====================
const BASE_ELO = 1000;
const K_CALIBRATION = 50;
const K_STANDARD = 32;
const CALIBRATION_MATCHES_THRESHOLD = 10;
const BLOWOUT_GAME_DIFF = 6;
const BLOWOUT_MULTIPLIER = 1.2;
const MIN_ELO = 100;

function getEloLevel(elo) {
  const num = Number(elo) || BASE_ELO;
  let lvl = 2.50 + (num - BASE_ELO) / 200;
  lvl = Math.max(1.00, Math.min(7.00, lvl));
  const levelNum = Number(lvl.toFixed(2));
  const levelStr = levelNum.toFixed(2);

  let tier = 'Iniciación';
  let color = '#94a3b8';
  let icon = '🌱';

  if (lvl >= 6.0) {
    tier = 'Pro / Élite';
    color = '#ef4444';
    icon = '👑';
  } else if (lvl >= 5.0) {
    tier = 'Competición';
    color = '#a855f7';
    icon = '🏆';
  } else if (lvl >= 4.0) {
    tier = 'Avanzado';
    color = '#10b981';
    icon = '💎';
  } else if (lvl >= 3.0) {
    tier = 'Intermedio';
    color = '#f59e0b';
    icon = '⚡';
  } else if (lvl >= 2.0) {
    tier = 'Intermedio Bajo';
    color = '#38bdf8';
    icon = '🔷';
  }

  return { level: levelStr, levelNum, tier, color, icon, elo: Math.round(num) };
}

function getMatchEntities(m, t, entityMode = 'individual') {
  const isSingles = (m.mode === 'singles') || (!m.teams?.[0]?.players?.[1] && !m.teams?.[1]?.players?.[1]);
  if (entityMode === 'pairs') {
    const p0 = playerLabel(m, t, 0).trim();
    const p1 = isSingles ? '' : playerLabel(m, t, 1).trim();
    const name = isSingles ? p0 : formatPairLabel(p0, p1);
    const key = isSingles ? p0.toUpperCase() : canonicalPairKey(p0, p1);
    return [{ name, key, idx: 0, color: m.teams?.[t]?.color || '#d4af37', players: isSingles ? [p0] : [p0, p1] }];
  }
  if (isSingles) {
    const nm = playerLabel(m, t, 0).trim();
    return [{ name: nm, key: nm.toUpperCase(), idx: 0, color: m.teams?.[t]?.color || '#d4af37', players: [nm] }];
  }
  const p0 = playerLabel(m, t, 0).trim();
  const p1 = playerLabel(m, t, 1).trim();
  return [
    { name: p0, key: p0.toUpperCase(), idx: 0, color: m.teams?.[t]?.color || '#d4af37', players: [p0] },
    { name: p1, key: p1.toUpperCase(), idx: 1, color: m.teams?.[t]?.color || '#d4af37', players: [p1] }
  ];
}

function computeSingleMatchEloStep(m, st, ratingsMap, countMap, entityMode = 'individual') {
  const isDraw = !!st.isDraw && st.matchWinner === null;
  const w = st.matchWinner ?? 0;
  const pair0 = getMatchEntities(m, 0, entityMode);
  const pair1 = getMatchEntities(m, 1, entityMode);

  const r0List = pair0.map(p => ratingsMap[p.key] ?? BASE_ELO);
  const r1List = pair1.map(p => ratingsMap[p.key] ?? BASE_ELO);

  const R0 = r0List.reduce((a, b) => a + b, 0) / r0List.length;
  const R1 = r1List.reduce((a, b) => a + b, 0) / r1List.length;

  const exp0 = 1 / (1 + Math.pow(10, (R1 - R0) / 400));
  const exp1 = 1 - exp0;

  const g0 = st.sets.reduce((sum, s) => sum + (s.games ? s.games[0] : 0), 0);
  const g1 = st.sets.reduce((sum, s) => sum + (s.games ? s.games[1] : 0), 0);
  const diffGames = Math.abs(g0 - g1);
  const isBlowout = diffGames >= BLOWOUT_GAME_DIFF;
  const M = isBlowout ? BLOWOUT_MULTIPLIER : 1.0;

  const S0 = isDraw ? 0.5 : (w === 0 ? 1 : 0);
  const S1 = isDraw ? 0.5 : (w === 1 ? 1 : 0);

  const evalSide = (pair, rList, score, exp) => pair.map((p, i) => {
    const eloBefore = rList[i];
    const matchCount = countMap[p.key] || 0;
    const k = matchCount < CALIBRATION_MATCHES_THRESHOLD ? K_CALIBRATION : K_STANDARD;
    const rawDelta = m.isWalkover ? 0 : k * M * (score - exp);
    let delta = 0;
    if (!m.isWalkover) {
      if (score === 1) delta = Math.max(1, Math.round(rawDelta));
      else if (score === 0) delta = Math.min(-1, Math.round(rawDelta));
      else delta = Math.round(rawDelta);
    }
    const eloAfter = Math.max(MIN_ELO, eloBefore + delta);
    return { name: p.name, key: p.key, eloBefore, delta, eloAfter, k };
  });

  return {
    matchId: m.id,
    winner: st.matchWinner,
    isDraw,
    diffGames,
    isBlowout,
    multiplier: M,
    pair0: { avgBefore: Math.round(R0), expPct: Math.round(exp0 * 100), players: evalSide(pair0, r0List, S0, exp0) },
    pair1: { avgBefore: Math.round(R1), expPct: Math.round(exp1 * 100), players: evalSide(pair1, r1List, S1, exp1) }
  };
}

function computeEloRatings(matchesList = historyList, opts = {}) {
  const entityMode = opts.entityMode || 'individual';
  const playerRatings = {};
  const playerMatchCount = {};
  const playerLastDelta = {};
  const playerHistory = {};
  const matchEloMap = {};

  const finished = (matchesList || [])
    .map(m => ({ m, st: computeMatch(m) }))
    .filter(({ st }) => st.matchWinner !== null || st.isDraw)
    .sort((a, b) => ((a.m.createdAt || 0) - (b.m.createdAt || 0)) || String(a.m.id).localeCompare(String(b.m.id)));

  finished.forEach(({ m, st }) => {
    const step = computeSingleMatchEloStep(m, st, playerRatings, playerMatchCount, entityMode);
    if (!m.isWalkover) {
      [...step.pair0.players, ...step.pair1.players].forEach(res => {
        playerRatings[res.key] = res.eloAfter;
        playerMatchCount[res.key] = (playerMatchCount[res.key] || 0) + 1;
        playerLastDelta[res.key] = res.delta;
        if (!playerHistory[res.key]) playerHistory[res.key] = [];
        playerHistory[res.key].push({
          matchId: m.id,
          delta: res.delta,
          newElo: res.eloAfter,
          date: m.createdAt
        });
      });
    }
    matchEloMap[m.id] = step;
  });

  return { playerRatings, playerMatchCount, playerLastDelta, playerHistory, matchEloMap };
}

function calculateMatchEloPreview(m, eloState = null, opts = {}) {
  if (!m) return null;
  const entityMode = opts.entityMode || 'individual';
  const scopeMatches = eloState ? null : getMatchScopeMatches(m, historyList);
  const state = eloState || computeEloRatings(scopeMatches, { entityMode });
  if (state.matchEloMap[m.id]) return state.matchEloMap[m.id];

  const st = computeMatch(m);
  return computeSingleMatchEloStep(m, st, state.playerRatings, state.playerMatchCount, entityMode);
}

function isProyectoPadelComp(comp) {
  return comp?.format === 'proyecto_padel';
}

function getCompetitionScoringConfig(comp) {
  if (!comp) {
    return {
      winPts: Number.isFinite(Number(prefs.dailyWinPts)) ? Number(prefs.dailyWinPts) : 3,
      lossPts: Number.isFinite(Number(prefs.dailyLossPts)) ? Number(prefs.dailyLossPts) : 1,
      drawPts: 2,
      setBonusPts: 0,
      gameBonusPts: 0
    };
  }
  const isPP = isProyectoPadelComp(comp);
  return {
    winPts: Number.isFinite(Number(comp.winPts)) ? Number(comp.winPts) : 3,
    lossPts: Number.isFinite(Number(comp.lossPts)) ? Number(comp.lossPts) : 1,
    drawPts: Number.isFinite(Number(comp.drawPts)) ? Number(comp.drawPts) : 2,
    setBonusPts: Number.isFinite(Number(comp.setBonusPts)) ? Number(comp.setBonusPts) : 0,
    gameBonusPts: Number.isFinite(Number(comp.gameBonusPts)) ? Number(comp.gameBonusPts) : (isPP ? 1 : 0)
  };
}

function getCompScoringSummaryLabel(comp, sc = null, compact = false) {
  const cfg = sc || getCompetitionScoringConfig(comp);
  if (isProyectoPadelComp(comp) || (cfg.gameBonusPts || 0) > 0) {
    return compact
      ? `+${cfg.winPts}V / +${cfg.drawPts ?? 2}E / +${cfg.lossPts}D · +${cfg.gameBonusPts}/g`
      : `ELO Principal · Sec: +${cfg.winPts}V / +${cfg.drawPts ?? 2}E / +${cfg.lossPts}D + ${cfg.gameBonusPts}/game`;
  }
  const sbTxt = cfg.setBonusPts ? ` · +${cfg.setBonusPts}/set` : '';
  return compact
    ? `+${cfg.winPts}V / +${cfg.lossPts}D${sbTxt}`
    : `+${cfg.winPts}V / +${cfg.lossPts}D${sbTxt} + ELO`;
}

function createEmptyStandingRec(name, key, color, eloState) {
  return {
    name,
    key,
    color: color || '#d4af37',
    elo: eloState.playerRatings[key] ?? BASE_ELO,
    lastDelta: eloState.playerLastDelta[key] ?? 0,
    finishedMatches: eloState.playerMatchCount[key] ?? 0,
    pts: 0,
    matches: 0,
    wins: 0,
    draws: 0,
    losses: 0,
    setsWon: 0,
    setsLost: 0,
    setsDiff: 0,
    gamesWon: 0,
    gamesLost: 0,
    gamesDiff: 0,
    winners: 0,
    ue: 0,
    fe: 0,
    shots: { smash: 0, volea: 0, bandeja: 0, bajada: 0, dejada: 0, passing: 0, globo: 0 },
    srvPtsWon: 0,
    srvPtsTotal: 0,
    firstServeIn: 0,
    doubleFaults: 0
  };
}

function computeScopeStandings(matchesList, config = {}) {
  const entityMode = config.entityMode || 'individual';
  const winPts = Number.isFinite(Number(config.winPts)) ? Number(config.winPts) : 3;
  const lossPts = Number.isFinite(Number(config.lossPts)) ? Number(config.lossPts) : 1;
  const drawPts = Number.isFinite(Number(config.drawPts)) ? Number(config.drawPts) : 2;
  const setBonusPts = Number.isFinite(Number(config.setBonusPts)) ? Number(config.setBonusPts) : 0;
  const gameBonusPts = Number.isFinite(Number(config.gameBonusPts)) ? Number(config.gameBonusPts) : 0;
  const todayOnly = !!config.todayOnly;
  const todayKey = config.todayDateKey || getDateKey(Date.now());
  const seedParticipants = Array.isArray(config.seedParticipants) ? config.seedParticipants : [];

  const eloMatches = config.eloBaseMatches || matchesList;
  const eloState = computeEloRatings(eloMatches, { entityMode });
  const map = new Map();

  // Optional seeding of registered League / Tournament participants
  seedParticipants.forEach(part => {
    if (!part) return;
    if (entityMode === 'pairs' && part.type === 'pair') {
      const p0 = (part.players?.[0] || '').trim();
      const p1 = (part.players?.[1] || '').trim();
      if (!p0 && !p1) return;
      const key = canonicalPairKey(p0, p1);
      const name = formatPairLabel(p0, p1);
      if (!map.has(key)) map.set(key, createEmptyStandingRec(name, key, part.color, eloState));
    } else if (entityMode === 'individual') {
      const names = part.type === 'pair' ? (part.players || []) : [part.name];
      names.forEach(nmRaw => {
        const nm = String(nmRaw || '').trim();
        if (!nm) return;
        const key = nm.toUpperCase();
        if (!map.has(key)) map.set(key, createEmptyStandingRec(nm, key, part.color, eloState));
      });
    }
  });

  const targetMatches = todayOnly
    ? (matchesList || []).filter(m => getDateKey(m.createdAt) === todayKey)
    : (matchesList || []);

  const periodDeltaMap = {};

  targetMatches.forEach(m => {
    const S = computeStats(m, 'all');
    const st = S.st;
    const w = st.matchWinner;
    const isDraw = !!st.isDraw && w === null;
    const isFinished = (w !== null || isDraw);
    const matchElo = eloState.matchEloMap[m.id];

    // Sets & games summary per side
    const setsByTeam = [0, 0];
    const gamesByTeam = [0, 0];
    st.sets.forEach(s => {
      if (s.winner === 0) setsByTeam[0]++;
      else if (s.winner === 1) setsByTeam[1]++;
      if (s.games) {
        gamesByTeam[0] += Number(s.games[0]) || 0;
        gamesByTeam[1] += Number(s.games[1]) || 0;
      }
    });

    if (todayOnly && matchElo) {
      [...matchElo.pair0.players, ...matchElo.pair1.players].forEach(r => {
        periodDeltaMap[r.key] = (periodDeltaMap[r.key] || 0) + (r.delta || 0);
      });
    }

    for (let t = 0; t < 2; t++) {
      const opp = 1 - t;
      const entities = getMatchEntities(m, t, entityMode);
      entities.forEach(ent => {
        if (!ent.key) return;
        if (!map.has(ent.key)) {
          map.set(ent.key, createEmptyStandingRec(ent.name, ent.key, ent.color, eloState));
        }
        const rec = map.get(ent.key);
        rec.matches++;
        if (isFinished) {
          const bonusPts = (setsByTeam[t] * setBonusPts) + (gamesByTeam[t] * gameBonusPts);
          if (isDraw) {
            rec.draws++;
            rec.pts += drawPts + bonusPts;
          } else if (w === t) {
            rec.wins++;
            rec.pts += winPts + bonusPts;
          } else {
            rec.losses++;
            rec.pts += lossPts + bonusPts;
          }
        }
        rec.setsWon += setsByTeam[t];
        rec.setsLost += setsByTeam[opp];
        rec.setsDiff = rec.setsWon - rec.setsLost;
        rec.gamesWon += gamesByTeam[t];
        rec.gamesLost += gamesByTeam[opp];
        rec.gamesDiff = rec.gamesWon - rec.gamesLost;

        // Aggregate player/team stats from S.P
        const matchingSP = entityMode === 'pairs'
          ? S.P.filter(sp => sp.team === t)
          : S.P.filter(sp => sp.team === t && sp.playerIdx === ent.idx);
        matchingSP.forEach(sp => {
          rec.winners += sp.winners;
          rec.ue += sp.ue;
          rec.fe += sp.fe;
          if (sp.shots) {
            Object.entries(sp.shots).forEach(([k, v]) => {
              rec.shots[k] = (rec.shots[k] || 0) + v;
            });
          }
          rec.srvPtsWon += sp.srvPtsWon;
          rec.srvPtsTotal += sp.srvPtsTotal;
          rec.firstServeIn += sp.firstServeIn;
          rec.doubleFaults += sp.doubleFaults;
        });
      });
    }
  });

  const rows = Array.from(map.values());
  if (todayOnly) {
    rows.forEach(r => {
      r.lastDelta = periodDeltaMap[r.key] ?? 0;
    });
  }
  return rows;
}

// ==================== COMPETITION FIXTURE & BRACKET ENGINE ====================
function newCompId(prefix = 'cmp') {
  return `${prefix}_` + Math.random().toString(36).slice(2, 6) + Date.now().toString(36).slice(-3);
}

function participantToTeamObj(part) {
  if (!part) return null;
  if (part.type === 'pair') {
    const p0 = (part.players?.[0] || '').trim() || 'DRIVE';
    const p1 = (part.players?.[1] || '').trim() || 'REVÉS';
    return {
      players: [p0, p1],
      color: part.color || '#d4af37',
      label: formatPairLabel(p0, p1),
      participantId: part.id
    };
  }
  return {
    players: [part.name || 'Jugador', ''],
    color: part.color || '#d4af37',
    label: part.name || 'Jugador',
    participantId: part.id
  };
}

function generateRoundRobinFixtures(comp, opts = {}) {
  const parts = opts.participants || comp.participants || [];
  const phase = opts.phase || 'league';
  const group = opts.group || null;
  const doubleRound = !!opts.doubleRound;

  // Individual Americano rotating-partner scheduler if participants are individual players
  const allIndividual = parts.length >= 4 && parts.every(p => p.type === 'player');
  const out = [];

  if (allIndividual) {
    const N = parts.length;
    const courts = Math.floor(N / 4);
    const totalRounds = N === 4 ? 3 : (N % 4 === 0 ? N - 1 : N);
    const playedCount = new Array(N).fill(0);
    const partnered = Array.from({ length: N }, () => new Array(N).fill(0));
    const faced = Array.from({ length: N }, () => new Array(N).fill(0));

    for (let r = 0; r < totalRounds; r++) {
      const order = Array.from({ length: N }, (_, i) => i).sort((a, b) => {
        if (playedCount[a] !== playedCount[b]) return playedCount[a] - playedCount[b];
        return ((a + r) % N) - ((b + r) % N);
      });
      const activeIdxs = order.slice(0, courts * 4);
      const used = new Set();

      for (let c = 0; c < courts; c++) {
        const avail = activeIdxs.filter(idx => !used.has(idx));
        const quad = avail.slice(0, 4);
        quad.forEach(idx => used.add(idx));

        const splits = [
          [[quad[0], quad[1]], [quad[2], quad[3]]],
          [[quad[0], quad[2]], [quad[1], quad[3]]],
          [[quad[0], quad[3]], [quad[1], quad[2]]]
        ];
        let bestSplit = splits[0];
        let bestScore = Infinity;
        splits.forEach((sp) => {
          const [tA, tB] = sp;
          const pPen = (partnered[tA[0]][tA[1]] + partnered[tB[0]][tB[1]]) * 100;
          const fPen = faced[tA[0]][tB[0]] + faced[tA[0]][tB[1]] + faced[tA[1]][tB[0]] + faced[tA[1]][tB[1]];
          const sc = pPen + fPen;
          if (sc < bestScore) { bestScore = sc; bestSplit = sp; }
        });

        const [tA, tB] = bestSplit;
        partnered[tA[0]][tA[1]]++; partnered[tA[1]][tA[0]]++;
        partnered[tB[0]][tB[1]]++; partnered[tB[1]][tB[0]]++;
        tA.forEach(i => tB.forEach(j => { faced[i][j]++; faced[j][i]++; }));
        quad.forEach(i => { playedCount[i]++; });

        const pA0 = parts[tA[0]], pA1 = parts[tA[1]];
        const pB0 = parts[tB[0]], pB1 = parts[tB[1]];
        out.push({
          id: newCompId('fx'),
          phase,
          roundIdx: r,
          roundLabel: group ? `Grupo ${group} · Fecha ${r + 1}` : `Fecha ${r + 1}`,
          slotIdx: c,
          group,
          team0: { players: [pA0.name, pA1.name], color: pA0.color || '#d4af37', label: formatPairLabel(pA0.name, pA1.name) },
          team1: { players: [pB0.name, pB1.name], color: pB0.color || '#2f8cff', label: formatPairLabel(pB0.name, pB1.name) },
          source0: null,
          source1: null,
          matchId: null,
          winnerSide: null,
          isBye: false
        });
      }
    }
    return out;
  }

  // Standard Pair Round-Robin (Circle Method)
  if (parts.length < 2) return out;
  const list = [...parts];
  if (list.length % 2 === 1) list.push(null); // BYE
  const n = list.length;
  const rounds = n - 1;
  const arr = [...list];

  const makePass = (roundOffset, swapSides) => {
    const rotArr = [...arr];
    for (let r = 0; r < rounds; r++) {
      let slot = 0;
      for (let i = 0; i < n / 2; i++) {
        const a = rotArr[i];
        const b = rotArr[n - 1 - i];
        if (a && b) {
          const flip = swapSides ? (i % 2 === 0) : (r % 2 === 1 && i === 0);
          const first = flip ? b : a;
          const second = flip ? a : b;
          const rIdx = r + roundOffset;
          out.push({
            id: newCompId('fx'),
            phase,
            roundIdx: rIdx,
            roundLabel: group ? `Grupo ${group} · Fecha ${rIdx + 1}` : `Fecha ${rIdx + 1}`,
            slotIdx: slot++,
            group,
            team0: participantToTeamObj(first),
            team1: participantToTeamObj(second),
            source0: null,
            source1: null,
            matchId: null,
            winnerSide: null,
            isBye: false
          });
        }
      }
      // Rotate everything except index 0
      const last = rotArr.pop();
      rotArr.splice(1, 0, last);
    }
  };

  makePass(0, false);
  if (doubleRound) makePass(rounds, true);
  return out;
}

function generateGroupsFixtures(comp, numGroups = 2) {
  const parts = comp.participants || [];
  if (parts.length < 4) return [];
  const gCount = Math.max(2, Math.min(4, Number(numGroups) || 2));
  const letters = ['A', 'B', 'C', 'D'].slice(0, gCount);

  // Assign groups if not already assigned to valid letters
  parts.forEach((p, idx) => {
    if (!p.group || !letters.includes(p.group)) {
      p.group = letters[idx % gCount];
    }
  });

  const fixtures = [];
  letters.forEach(g => {
    const gParts = parts.filter(p => p.group === g);
    if (gParts.length >= 2) {
      fixtures.push(...generateRoundRobinFixtures(comp, { participants: gParts, phase: 'group', group: g }));
    }
  });
  return fixtures;
}

function getBracketRoundLabel(matchCount) {
  if (matchCount === 1) return 'Final';
  if (matchCount === 2) return 'Semifinales';
  if (matchCount === 4) return 'Cuartos de Final';
  if (matchCount === 8) return 'Octavos de Final';
  return `Ronda de ${matchCount * 2}`;
}

function buildBracketSeedOrder(size) {
  let order = [0, 1];
  let curSize = 2;
  while (curSize < size) {
    curSize *= 2;
    order = order.flatMap((x, idx) => (idx % 2 === 0 ? [x, curSize - 1 - x] : [curSize - 1 - x, x]));
  }
  return order;
}

function generatePlayoffBracket(comp, teamsOverride = null) {
  const teams = (teamsOverride || (comp.participants || []).map(participantToTeamObj)).filter(Boolean);
  if (teams.length < 2) return [];

  let size = 2;
  while (size < teams.length && size < 32) size *= 2;
  const order = buildBracketSeedOrder(size);

  const fixtures = [];
  const roundsFixtures = [];

  // Round 0
  const r0Count = size / 2;
  const r0Label = getBracketRoundLabel(r0Count);
  const r0 = [];
  for (let i = 0; i < r0Count; i++) {
    const sA = order[2 * i];
    const sB = order[2 * i + 1];
    const t0 = sA < teams.length ? clone(teams[sA]) : null;
    const t1 = sB < teams.length ? clone(teams[sB]) : null;
    const isBye = (t0 && !t1) || (!t0 && t1);
    const fx = {
      id: newCompId('fx'),
      phase: 'playoff',
      roundIdx: 0,
      roundLabel: r0Label,
      slotIdx: i,
      group: null,
      team0: t0,
      team1: t1,
      source0: null,
      source1: null,
      matchId: null,
      winnerSide: isBye ? (t0 ? 0 : 1) : null,
      isBye
    };
    r0.push(fx);
    fixtures.push(fx);
  }
  roundsFixtures.push(r0);

  // Subsequent rounds
  let prevRound = r0;
  let rIdx = 1;
  while (prevRound.length > 1) {
    const count = prevRound.length / 2;
    const label = getBracketRoundLabel(count);
    const curRound = [];
    for (let i = 0; i < count; i++) {
      const fx = {
        id: newCompId('fx'),
        phase: 'playoff',
        roundIdx: rIdx,
        roundLabel: label,
        slotIdx: i,
        group: null,
        team0: null,
        team1: null,
        source0: { fixtureId: prevRound[2 * i].id, pick: 'winner' },
        source1: { fixtureId: prevRound[2 * i + 1].id, pick: 'winner' },
        matchId: null,
        winnerSide: null,
        isBye: false
      };
      curRound.push(fx);
      fixtures.push(fx);
    }
    roundsFixtures.push(curRound);
    prevRound = curRound;
    rIdx++;
  }

  return fixtures;
}

function getCompetitionMatches(comp, includeActive = false) {
  if (!comp) return [];
  const list = historyList.filter(m => getMatchCompId(m) === comp.id);
  if (includeActive && activeMatch && getMatchCompId(activeMatch) === comp.id) {
    if (!list.some(x => x.id === activeMatch.id)) list.unshift(activeMatch);
  }
  return list;
}

function getGroupStandingsForComp(comp, groupLetter) {
  const scoring = getCompetitionScoringConfig(comp);
  const allMatches = getCompetitionMatches(comp, false);
  const groupFixtureIds = new Set((comp.fixtures || []).filter(f => f.phase === 'group' && f.group === groupLetter).map(f => f.id));
  const groupMatches = allMatches.filter(m => m.competition?.fixtureId && groupFixtureIds.has(m.competition.fixtureId));
  const gParts = (comp.participants || []).filter(p => p.group === groupLetter);
  const entityMode = comp.rankingMode === 'individual' ? 'individual' : 'pairs';
  const rows = computeScopeStandings(groupMatches, {
    ...scoring,
    entityMode,
    eloBaseMatches: allMatches,
    seedParticipants: gParts
  });
  rows.sort((a, b) => (b.pts - a.pts) || (b.setsDiff - a.setsDiff) || (b.gamesDiff - a.gamesDiff) || (b.wins - a.wins) || (b.elo - a.elo));
  return rows;
}

function advanceGroupsToPlayoffs(comp) {
  if (!comp) return false;
  const letters = Array.from(new Set((comp.participants || []).map(p => p.group).filter(Boolean))).sort();
  if (letters.length < 2) return false;
  const adv = Math.max(1, Number(comp.advancePerGroup) || 2);
  const byGroup = letters.map(g => {
    const rows = getGroupStandingsForComp(comp, g);
    return rows.slice(0, adv).map(r => {
      const part = (comp.participants || []).find(p => {
        if (p.type === 'pair') return canonicalPairKey(p.players?.[0], p.players?.[1]) === r.key;
        return p.name.trim().toUpperCase() === r.key;
      });
      return part ? participantToTeamObj(part) : { players: [r.name, ''], color: r.color || '#d4af37', label: r.name };
    });
  });

  // Seed ordered by group rank (all #1s, then rotated/crossed #2s) so buildBracketSeedOrder prevents early rematches
  const seeded = [];
  for (let pos = 0; pos < adv; pos++) {
    if (pos % 2 === 0) {
      for (let gIdx = 0; gIdx < letters.length; gIdx++) {
        if (byGroup[gIdx]?.[pos]) seeded.push(byGroup[gIdx][pos]);
      }
    } else if (letters.length === 2) {
      // buildBracketSeedOrder(4) = [0, 3, 2, 1]: keeping [2ºA, 2ºB] pairs 1ºA vs 2ºB and 2ºA vs 1ºB
      for (let gIdx = 0; gIdx < letters.length; gIdx++) {
        if (byGroup[gIdx]?.[pos]) seeded.push(byGroup[gIdx][pos]);
      }
    } else if (letters.length === 4) {
      // buildBracketSeedOrder(8) pairs 0-7, 3-4, 2-5, 1-6: swapping pairs [2ºB, 2ºA, 2ºD, 2ºC] keeps halves conflict-free until Final
      for (let gIdx = 0; gIdx < letters.length; gIdx++) {
        const oppG = gIdx ^ 1;
        if (byGroup[oppG]?.[pos]) seeded.push(byGroup[oppG][pos]);
      }
    } else {
      // Shift by 1 for 3 groups so 1ºX avoids 2ºX
      for (let gIdx = 0; gIdx < letters.length; gIdx++) {
        const shiftG = (gIdx + 1) % letters.length;
        if (byGroup[shiftG]?.[pos]) seeded.push(byGroup[shiftG][pos]);
      }
    }
  }

  if (seeded.length < 2) return false;
  const groupFixtures = (comp.fixtures || []).filter(f => f.phase !== 'playoff');
  const playoffFixtures = generatePlayoffBracket(comp, seeded);
  comp.fixtures = [...groupFixtures, ...playoffFixtures];
  resolveCompetitionFixtures(comp);
  saveCompetitions();
  return true;
}

function resolveCompetitionFixtures(comp) {
  if (!comp || !Array.isArray(comp.fixtures)) return;
  const byId = new Map(comp.fixtures.map(f => [f.id, f]));

  const findMatchById = (mid) => {
    if (!mid) return null;
    if (activeMatch && activeMatch.id === mid) return activeMatch;
    return historyList.find(m => m.id === mid) || null;
  };

  // Pass 1: sync match winners from linked matches
  comp.fixtures.forEach(fx => {
    if (fx.isBye) {
      fx.winnerSide = fx.team0 ? 0 : (fx.team1 ? 1 : null);
      return;
    }
    if (fx.matchId) {
      const m = findMatchById(fx.matchId);
      if (!m) {
        fx.matchId = null;
        fx.winnerSide = null;
      } else {
        const st = computeMatch(m);
        fx.winnerSide = st.isDraw ? 'draw' : (st.matchWinner !== null ? st.matchWinner : null);
      }
    }
  });

  // Pass 2: propagate winners down bracket in roundIdx order
  const playoffs = comp.fixtures
    .filter(f => f.phase === 'playoff')
    .sort((a, b) => (a.roundIdx - b.roundIdx) || (a.slotIdx - b.slotIdx));

  playoffs.forEach(fx => {
    const resolveSource = (src) => {
      if (!src || !src.fixtureId) return null;
      const srcFx = byId.get(src.fixtureId);
      if (!srcFx || srcFx.winnerSide === null || srcFx.winnerSide === undefined) return null;
      const winTeam = srcFx.winnerSide === 0 ? srcFx.team0 : srcFx.team1;
      return winTeam ? clone(winTeam) : null;
    };

    if (fx.source0) {
      const nextT0 = resolveSource(fx.source0);
      if (!fx.matchId) fx.team0 = nextT0;
    }
    if (fx.source1) {
      const nextT1 = resolveSource(fx.source1);
      if (!fx.matchId) fx.team1 = nextT1;
    }
  });
}

function syncCompetitionForMatch(m, opts = {}) {
  const compId = getMatchCompId(m);
  if (!compId) return;
  const comp = getCompById(compId);
  if (!comp) return;
  if (m.competition?.fixtureId) {
    const fx = (comp.fixtures || []).find(f => f.id === m.competition.fixtureId);
    if (fx) {
      if (!fx.matchId) {
        fx.matchId = m.id;
      } else if (fx.matchId !== m.id && m.status === 'finished') {
        const prevM = historyList.find(x => x.id === fx.matchId);
        if (!prevM || prevM.status !== 'finished') fx.matchId = m.id;
      }
    }
  }
  resolveCompetitionFixtures(comp);
  saveCompetitions();
  if (!opts.skipSyncPublish && comp.syncCode && (m.status === 'finished' || m.isDraw || m.manualWinner === 'draw' || (m.manualWinner !== undefined && m.manualWinner !== null))) {
    if (typeof publishCompMatch === 'function') publishCompMatch(comp, m);
  }
}

function startFixtureMatch(compId, fixtureId) {
  const comp = getCompById(compId);
  if (!comp) return;
  const fx = (comp.fixtures || []).find(f => f.id === fixtureId);
  if (!fx || !fx.team0 || !fx.team1) {
    showToast('Faltan definir los equipos de este cruce');
    return;
  }
  if (fx.matchId) {
    if (activeMatch && activeMatch.id === fx.matchId) {
      navigate('board');
      return;
    }
    const existing = historyList.find(m => m.id === fx.matchId);
    if (existing) {
      ui.statsId = existing.id;
      navigate('stats');
      return;
    }
  }
  const dr = comp.defaultRules || {};
  preset.matchContext = comp.kind;
  preset.compId = comp.id;
  preset.fixtureId = fx.id;
  preset.stageLabel = fx.roundLabel || '';
  preset.teams = [
    { players: [fx.team0.players?.[0] || 'DRIVE 1', fx.team0.players?.[1] || 'REVÉS 1'], color: fx.team0.color || '#d4af37' },
    { players: [fx.team1.players?.[0] || 'DRIVE 2', fx.team1.players?.[1] || 'REVÉS 2'], color: fx.team1.color || '#2f8cff' }
  ];
  if (dr.totalSets) {
    preset.totalSets = dr.totalSets;
    preset.setsToWin = Math.floor(dr.totalSets / 2) + 1;
  }
  if (dr.gamesPerSet) preset.gamesPerSet = dr.gamesPerSet;
  if (dr.deuceRule) preset.deuceRule = dr.deuceRule;
  if (dr.tiebreakAt !== undefined) preset.tiebreakAt = dr.tiebreakAt;
  if (dr.tiebreakPoints) preset.tiebreakPoints = dr.tiebreakPoints;
  if (dr.finalSet) preset.finalSet = dr.finalSet;
  if (dr.changeoverRule) preset.changeoverRule = dr.changeoverRule;

  saveJSON(LS_PRESET, preset);
  activeMatch = createMatchFromPreset(preset);
  fx.matchId = activeMatch.id;
  persistActive();
  saveCompetitions();
  ui.shotSheet = null;
  ui.changeoverOverlay = null;
  ui.secondSrvPrompt = false;
  ui.matchEndDismissed = false;
  navigate('board');
}

function getCompQuickPlayerPool(comp) {
  if (!comp) return [];
  const seen = new Map();
  const skip = new Set(['DRIVE 1', 'REVÉS 1', 'REVES 1', 'DRIVE 2', 'REVÉS 2', 'REVES 2', 'DRIVE', 'REVÉS', 'REVES']);
  const pushName = (raw) => {
    const nm = String(raw || '').trim();
    if (!nm) return;
    const k = nm.toUpperCase();
    if (skip.has(k) || seen.has(k)) return;
    seen.set(k, nm);
  };
  (comp.participants || []).forEach(pt => {
    if (!pt) return;
    if (pt.type === 'pair') (pt.players || []).forEach(pushName);
    else pushName(pt.name);
  });
  getCompetitionMatches(comp, false).forEach(m => {
    (m.teams || []).forEach(tm => (tm.players || []).forEach(pushName));
  });
  return Array.from(seen.values()).sort((a, b) => a.localeCompare(b, 'es'));
}

function resolveQuickScoreOutcome(comp, setsArr, winSel = 'auto', isWo = false) {
  if (isWo) {
    if (winSel === '0' || winSel === '1') return { ok: true, winnerSide: Number(winSel), isDraw: false };
    return { ok: false, error: 'Elegí qué pareja ganó por W.O.' };
  }
  if (winSel === '0' || winSel === '1') {
    return { ok: true, winnerSide: Number(winSel), isDraw: false };
  }
  let w0 = 0, w1 = 0, g0 = 0, g1 = 0;
  (setsArr || []).forEach(s => {
    const a = Number(s[0]) || 0;
    const b = Number(s[1]) || 0;
    g0 += a; g1 += b;
    if (a > b) w0++;
    else if (b > a) w1++;
  });
  if (winSel === 'draw') {
    if (w0 !== w1 || g0 !== g1) return { ok: false, error: 'Para guardar empate, ambos lados deben igualar el marcador' };
    return { ok: true, winnerSide: 'draw', isDraw: true };
  }
  if (w0 > w1) return { ok: true, winnerSide: 0, isDraw: false };
  if (w1 > w0) return { ok: true, winnerSide: 1, isDraw: false };
  if (isProyectoPadelComp(comp) && g0 === g1) {
    return { ok: true, winnerSide: 'draw', isDraw: true };
  }
  return { ok: false, error: 'Empate en sets: elegí manualmente la pareja ganadora' };
}

function buildQuickScoreState(opts = {}) {
  const mode = opts.mode || (opts.fixtureId ? 'fixture' : (opts.compId ? 'comp-adhoc' : 'preset'));
  let comp = opts.compId ? getCompById(opts.compId) : null;
  let fx = null;
  let teams = opts.teams || null;
  let stageLabel = opts.stageLabel || '';
  let defaultTotalSets = Number(opts.totalSets) || 3;

  if (mode === 'fixture' && opts.fixtureKey) {
    const [cid, fxid] = String(opts.fixtureKey).split(':');
    comp = getCompById(cid);
    fx = (comp?.fixtures || []).find(f => f.id === fxid) || null;
    if (fx) {
      teams = [
        { players: [fx.team0?.players?.[0] || 'DRIVE 1', fx.team0?.players?.[1] || 'REVÉS 1'], color: fx.team0?.color || '#d4af37' },
        { players: [fx.team1?.players?.[0] || 'DRIVE 2', fx.team1?.players?.[1] || 'REVÉS 2'], color: fx.team1?.color || '#2f8cff' }
      ];
      stageLabel = fx.roundLabel || '';
    }
    defaultTotalSets = Number(comp?.defaultRules?.totalSets) || 3;
  } else if (mode === 'comp-adhoc' && comp) {
    const pairParts = (comp.participants || []).filter(pt => pt.type === 'pair');
    const isInd = comp.rankingMode === 'individual' || pairParts.length < 2;
    defaultTotalSets = isProyectoPadelComp(comp) ? 1 : (Number(comp.defaultRules?.totalSets) || 3);
    teams = isInd
      ? [
          { players: ['', ''], color: '#d4af37' },
          { players: ['', ''], color: '#2f8cff' }
        ]
      : [
          { players: [pairParts[0]?.players?.[0] || 'DRIVE 1', pairParts[0]?.players?.[1] || 'REVÉS 1'], color: pairParts[0]?.color || '#d4af37' },
          { players: [pairParts[1]?.players?.[0] || 'DRIVE 2', pairParts[1]?.players?.[1] || 'REVÉS 2'], color: pairParts[1]?.color || '#2f8cff' }
        ];
    stageLabel = isProyectoPadelComp(comp) ? '' : (comp.kind === 'tournament' ? 'Cruce / Ronda' : 'Fecha');
  } else if (mode === 'preset') {
    const p = preset;
    const ctx = p.matchContext || 'daily';
    comp = (ctx === 'league' || ctx === 'tournament') && p.compId ? getCompById(p.compId) : null;
    fx = comp && p.fixtureId ? (comp.fixtures || []).find(f => f.id === p.fixtureId) || null : null;
    teams = [
      { players: [p.teams[0]?.players?.[0]?.trim() || 'DRIVE 1', p.teams[0]?.players?.[1]?.trim() || 'REVÉS 1'], color: p.teams[0]?.color || '#d4af37' },
      { players: [p.teams[1]?.players?.[0]?.trim() || 'DRIVE 2', p.teams[1]?.players?.[1]?.trim() || 'REVÉS 2'], color: p.teams[1]?.color || '#2f8cff' }
    ];
    stageLabel = fx?.roundLabel || p.stageLabel || '';
    defaultTotalSets = Math.max(1, Number(p.totalSets) || (p.setsToWin ? (Number(p.setsToWin) * 2 - 1) : 3));
  }

  const initialRows = (isProyectoPadelComp(comp) || defaultTotalSets === 1) ? 1 : 2;
  const pairParts = comp ? (comp.participants || []).filter(pt => pt.type === 'pair') : [];
  return {
    mode,
    compId: comp?.id || null,
    fixtureId: fx?.id || opts.fixtureId || null,
    fixtureKey: opts.fixtureKey || (comp && fx ? `${comp.id}:${fx.id}` : ''),
    stageLabel,
    teams: teams || [
      { players: ['DRIVE 1', 'REVÉS 1'], color: '#d4af37' },
      { players: ['DRIVE 2', 'REVÉS 2'], color: '#2f8cff' }
    ],
    selPartIds: [pairParts[0]?.id || '', pairParts[1]?.id || ''],
    useManualTeams: mode === 'comp-adhoc' ? (pairParts.length < 2 || comp?.rankingMode === 'individual') : false,
    activeSlot: 0,
    sets: Array.from({ length: initialRows }, () => [null, null]),
    wo: false,
    winner: 'auto',
    hasSuperTbFinal: (comp?.defaultRules?.finalSet || preset.finalSet) === 'supertb'
  };
}

function openQuickScoreModal(opts = {}) {
  ui.quickScoreFixtureId = opts.fixtureKey || null;
  ui.quickScoreState = buildQuickScoreState(opts);
  ui.compModal = 'quick-score';
  render();
}

function submitQuickMatchResult(cfg = {}) {
  const comp = cfg.comp || (cfg.compId ? getCompById(cfg.compId) : null);
  const kind = cfg.kind || (comp ? comp.kind : 'daily');
  const fx = comp && cfg.fixtureId ? (comp.fixtures || []).find(f => f.id === cfg.fixtureId) || null : null;
  const t0 = cfg.teams?.[0] || fx?.team0 || preset.teams[0];
  const t1 = cfg.teams?.[1] || fx?.team1 || preset.teams[1];
  const p0 = [String(t0?.players?.[0] || '').trim() || 'DRIVE 1', String(t0?.players?.[1] || '').trim() || 'REVÉS 1'];
  const p1 = [String(t1?.players?.[0] || '').trim() || 'DRIVE 2', String(t1?.players?.[1] || '').trim() || 'REVÉS 2'];
  const setsArr = Array.isArray(cfg.setsArr) ? cfg.setsArr : [];
  const dr = cfg.rules || comp?.defaultRules || preset;
  const totalSets = Math.max(1, setsArr.length || Number(dr.totalSets) || 3);
  const isDraw = !!(cfg.isDraw || cfg.winnerSide === 'draw');
  const resolvedWinner = isDraw ? 'draw' : cfg.winnerSide;

  const compMeta = comp
    ? {
        kind: comp.kind,
        compId: comp.id,
        compName: comp.name,
        fixtureId: fx ? fx.id : (cfg.fixtureId || ''),
        stageLabel: cfg.stageLabel || fx?.roundLabel || ''
      }
    : (kind === 'league' || kind === 'tournament'
        ? { kind, compId: '', compName: kind === 'league' ? 'Liga' : 'Torneo', fixtureId: '', stageLabel: cfg.stageLabel || '' }
        : { kind: 'daily', compId: '', compName: 'Partido del Día', fixtureId: '', stageLabel: '' });

  const nowTs = Date.now();
  const topTs = Number(historyList[0]?.createdAt) || 0;
  const matchTs = (topTs >= nowTs && topTs - nowTs < 5000) ? topTs + 1 : nowTs;

  const m = {
    id: fx?.matchId || newCompId('mq'),
    createdAt: matchTs,
    durationMs: 0,
    status: 'finished',
    mode: 'doubles',
    isWalkover: !!cfg.isWalkover,
    isDraw,
    manualSets: setsArr,
    manualWinner: resolvedWinner,
    competition: compMeta,
    teams: [
      { players: p0, color: t0?.color || '#d4af37' },
      { players: p1, color: t1?.color || '#2f8cff' }
    ],
    rules: {
      totalSets,
      setsToWin: Math.floor(totalSets / 2) + 1,
      gamesPerSet: Number(dr.gamesPerSet) || 6,
      deuceRule: dr.deuceRule || 'golden',
      tiebreakAt: dr.tiebreakAt ?? 6,
      tiebreakPoints: dr.tiebreakPoints || 7,
      finalSet: dr.finalSet || 'normal',
      changeoverRule: dr.changeoverRule || 'odd'
    },
    firstServer: [0, 0],
    secondServerIdx: 0,
    shotPrompt: false,
    flipped: false,
    pendingFault: false,
    events: [],
    redoStack: []
  };

  if (fx) {
    fx.matchId = m.id;
    fx.winnerSide = resolvedWinner;
  }
  archiveMatchToHistory(m);
  if (comp) {
    resolveCompetitionFixtures(comp);
    saveCompetitions();
  }
  return m;
}

function submitQuickFixtureResult(compId, fixtureId, setsArr, winnerSide, isWalkover = false) {
  const comp = getCompById(compId);
  if (!comp) return null;
  const fx = (comp.fixtures || []).find(f => f.id === fixtureId);
  if (!fx || !fx.team0 || !fx.team1) return null;
  return submitQuickMatchResult({
    comp,
    fixtureId: fx.id,
    stageLabel: fx.roundLabel || '',
    teams: [fx.team0, fx.team1],
    setsArr,
    winnerSide,
    isWalkover
  });
}


// ==================== ANALYTICS & STATS ENGINE ====================
function computeStats(m, setFilter = 'all') {
  const st = computeMatch(m);
  const filterIdx = setFilter === 'all' ? null : Number(setFilter);
  const pts = st.allPoints.filter(pt => filterIdx === null || pt.setIdx === filterIdx);
  const games = [];
  st.sets.forEach((s, sIdx) => {
    if (filterIdx === null || sIdx === filterIdx) {
      s.history.forEach(g => games.push(g));
    }
  });

  // Team aggregates
  const T = [0,1].map(() => ({
    ptsWon: 0,
    winners: 0,
    ue: 0,
    fe: 0,
    shots: { smash: 0, volea: 0, bandeja: 0, bajada: 0, dejada: 0, passing: 0, globo: 0, otro: 0 },
    srvPtsWon: 0,
    srvPtsTotal: 0,
    retPtsWon: 0,
    retPtsTotal: 0,
    firstServeIn: 0,
    doubleFaults: 0,
    bpWon: 0,
    bpTotal: 0,
    bpSaved: 0,
    bpFaced: 0,
    gpWon: 0,
    gpTotal: 0,
    gpSrvWon: 0,
    gpSrvTotal: 0,
    gpRetWon: 0,
    gpRetTotal: 0,
    keyWon: 0,
    keyTotal: 0,
    maxPtStreak: 0,
    gamesWon: 0,
    srvGamesWon: 0,
    srvGamesTotal: 0,
    maxGameStreak: 0
  }));

  // Player aggregates: key = `${t}_${p}`
  const P = {};
  for (let t = 0; t < 2; t++) {
    for (let pi = 0; pi < 2; pi++) {
      P[`${t}_${pi}`] = {
        team: t,
        playerIdx: pi,
        name: playerLabel(m, t, pi),
        color: m.teams[t].color,
        winners: 0,
        ue: 0,
        fe: 0,
        shots: { smash: 0, volea: 0, bandeja: 0, bajada: 0, dejada: 0, passing: 0, globo: 0, otro: 0 },
        srvPtsTotal: 0,
        srvPtsWon: 0,
        firstServeIn: 0,
        doubleFaults: 0,
        srvGamesWon: 0,
        srvGamesTotal: 0
      };
    }
  }

  if (!pts.length && m.manualPlayerStats) {
    Object.entries(m.manualPlayerStats).forEach(([k, v]) => {
      if (P[k] && v) {
        const tm = P[k].team;
        P[k].winners = Number(v.w) || 0;
        P[k].ue = Number(v.u) || 0;
        P[k].fe = Number(v.f) || 0;
        P[k].srvPtsTotal = Number(v.st) || 0;
        P[k].srvPtsWon = Number(v.sw) || 0;
        P[k].firstServeIn = Number(v.fs) || 0;
        P[k].doubleFaults = Number(v.df) || 0;
        if (v.sh) Object.assign(P[k].shots, v.sh);
        T[tm].winners += P[k].winners;
        T[tm].ue += P[k].ue;
        T[tm].fe += P[k].fe;
        T[tm].srvPtsTotal += P[k].srvPtsTotal;
        T[tm].srvPtsWon += P[k].srvPtsWon;
        T[tm].firstServeIn += P[k].firstServeIn;
        T[tm].doubleFaults += P[k].doubleFaults;
      }
    });
  }

  let curPtStreak = [0,0];
  const momentum = [0]; // diff (team0 - team1) after each point
  const setBoundaries = []; // point index where each set ends
  let lastSetSeen = 0;

  pts.forEach((pt, i) => {
    if (pt.setIdx !== lastSetSeen && i > 0) {
      setBoundaries.push(i);
      lastSetSeen = pt.setIdx;
    }
    const w = pt.w;
    const l = 1 - w;
    T[w].ptsWon++;

    curPtStreak[w]++;
    curPtStreak[l] = 0;
    if (curPtStreak[w] > T[w].maxPtStreak) T[w].maxPtStreak = curPtStreak[w];

    momentum.push(momentum[momentum.length - 1] + (w === 0 ? 1 : -1));

    const stTeam = pt.srvTeam;
    const rtTeam = 1 - stTeam;
    const pKeySrv = `${stTeam}_${pt.srvPlayer}`;
    const pSrv = P[pKeySrv];

    T[stTeam].srvPtsTotal++;
    T[rtTeam].retPtsTotal++;
    if (pSrv) pSrv.srvPtsTotal++;

    if (pt.doubleFault) {
      T[stTeam].doubleFaults++;
      if (pSrv) pSrv.doubleFaults++;
    } else if (pt.firstServeIn) {
      T[stTeam].firstServeIn++;
      if (pSrv) pSrv.firstServeIn++;
    }

    if (w === stTeam) {
      T[stTeam].srvPtsWon++;
      if (pSrv) pSrv.srvPtsWon++;
    } else {
      T[rtTeam].retPtsWon++;
    }

    // Shot attribution
    if (pt.shotType === 'winner') {
      const bt = pt.byPlayer ? pt.byPlayer[0] : w;
      const bp = pt.byPlayer ? pt.byPlayer[1] : 0;
      T[bt].winners++;
      const pk = `${bt}_${bp}`;
      const sub = (pt.subType && ['smash','volea','bandeja','bajada','dejada','passing','globo'].includes(pt.subType))
        ? pt.subType
        : (pt.subType === 'winner' ? 'otro' : (pt.subType || 'otro'));
      T[bt].shots[sub] = (T[bt].shots[sub] || 0) + 1;
      if (P[pk]) {
        P[pk].winners++;
        P[pk].shots[sub] = (P[pk].shots[sub] || 0) + 1;
      }
    } else if (pt.shotType === 'ue') {
      const bt = pt.byPlayer ? pt.byPlayer[0] : l;
      const bp = pt.byPlayer ? pt.byPlayer[1] : 0;
      T[bt].ue++;
      const pk = `${bt}_${bp}`;
      if (P[pk]) P[pk].ue++;
    } else if (pt.shotType === 'fe') {
      const bt = pt.byPlayer ? pt.byPlayer[0] : l;
      const bp = pt.byPlayer ? pt.byPlayer[1] : 0;
      T[bt].fe++;
      const pk = `${bt}_${bp}`;
      if (P[pk]) P[pk].fe++;
    } else if (pt.shotType === 'df') {
      T[stTeam].ue++;
      if (pSrv) pSrv.ue++;
    }

    // Break points
    if (pt.isBP) {
      T[rtTeam].bpTotal++;
      T[stTeam].bpFaced++;
      if (w === rtTeam) T[rtTeam].bpWon++;
      else T[stTeam].bpSaved++;
    }

    // Golden points / Star points
    if (pt.isGP) {
      T[0].gpTotal++;
      T[1].gpTotal++;
      T[w].gpWon++;
      T[stTeam].gpSrvTotal++;
      T[rtTeam].gpRetTotal++;
      if (w === stTeam) T[stTeam].gpSrvWon++;
      else T[rtTeam].gpRetWon++;
    }

    // Key points (break points + points from 30-30 onwards)
    if (pt.isKey) {
      T[0].keyTotal++;
      T[1].keyTotal++;
      T[w].keyWon++;
    }
  });

  // Games stats
  let curGStreak = [0,0];
  games.forEach(g => {
    const gw = g.winner;
    const gl = 1 - gw;
    T[gw].gamesWon++;
    curGStreak[gw]++;
    curGStreak[gl] = 0;
    if (curGStreak[gw] > T[gw].maxGameStreak) T[gw].maxGameStreak = curGStreak[gw];

    if (!g.isTB) {
      const stTeam = g.srvTeam;
      T[stTeam].srvGamesTotal++;
      const pk = `${stTeam}_${g.srvPlayer}`;
      if (P[pk]) P[pk].srvGamesTotal++;
      if (gw === stTeam) {
        T[stTeam].srvGamesWon++;
        if (P[pk]) P[pk].srvGamesWon++;
      }
    }
  });

  // Generate automated narrative analysis (just like the reference PDF)
  const insights = [];
  const name0 = teamLabel(m, 0);
  const name1 = teamLabel(m, 1);
  const totalPts = T[0].ptsWon + T[1].ptsWon;

  if (totalPts > 0) {
    // 1. Breaks difference
    if (T[0].bpTotal + T[1].bpTotal > 0) {
      const wSide = T[1].bpWon > T[0].bpWon ? 1 : 0;
      const oSide = 1 - wSide;
      const wName = wSide === 0 ? name0 : name1;
      const oName = oSide === 0 ? name0 : name1;
      insights.push(`Los breaks marcaron la diferencia: ${wName} convirtió ${T[wSide].bpWon} de ${T[wSide].bpTotal}, ${oName} ${T[oSide].bpWon} de ${T[oSide].bpTotal}.`);
    }
    // 2. Break points saved
    const bestSaver = T[1].bpSaved >= T[0].bpSaved ? 1 : 0;
    if (T[bestSaver].bpFaced >= 2 && T[bestSaver].bpSaved > 0) {
      insights.push(`${bestSaver === 0 ? name0 : name1} salvó ${T[bestSaver].bpSaved} de ${T[bestSaver].bpFaced} bolas de break.`);
    }
    // 3. Points difference
    const diff = Math.abs(T[0].ptsWon - T[1].ptsWon);
    if (diff === 0) {
      insights.push(`Máxima igualdad: empate exacto a ${T[0].ptsWon} puntos ganados por pareja.`);
    } else if (diff <= 6) {
      insights.push(`Solo ${diff} ${diff === 1 ? 'punto' : 'puntos'} de diferencia en todo el partido.`);
    } else {
      const dom = T[0].ptsWon > T[1].ptsWon ? name0 : name1;
      insights.push(`${dom} dominó el global con +${diff} puntos de ventaja (${T[0].ptsWon} a ${T[1].ptsWon}).`);
    }
    // 4. Golden points / Star points (40-40)
    if (T[0].gpTotal > 0) {
      const gpLeader = T[1].gpWon >= T[0].gpWon ? 1 : 0;
      const lbl = m.rules.deuceRule === 'star' ? 'Star Points (tras 2 ventajas)' : 'Puntos decisivos con 40-40';
      insights.push(`${lbl}: ${gpLeader === 0 ? name0 : name1} ganó ${T[gpLeader].gpWon} de ${T[gpLeader].gpTotal}.`);
    }
    // 5. Most winners individual & specific shot highlights
    const pArr = Object.values(P);
    pArr.sort((a,b) => b.winners - a.winners);
    if (pArr[0] && pArr[0].winners > 0) {
      insights.push(`${pArr[0].name} hizo más ganadores que nadie: ${pArr[0].winners}.`);
    }
    pArr.forEach(pl => {
      const best = Object.entries(pl.shots || {})
        .filter(([k, v]) => v >= 2 && k !== 'otro')
        .sort((a, b) => b[1] - a[1])[0];
      if (best) {
        const labels = { smash: 'smash / remates', volea: 'voleas ganadoras', bandeja: 'bandejas', bajada: 'bajadas de pared', dejada: 'dejadas', passing: 'passings', globo: 'globos ganadores' };
        insights.push(`${pl.name} se destacó en ataque con ${best[1]} ${labels[best[0]] || best[0]}.`);
      }
    });
    // 6. Best streak
    const strkLeader = T[1].maxPtStreak >= T[0].maxPtStreak ? 1 : 0;
    if (T[strkLeader].maxPtStreak >= 3) {
      insights.push(`Mejor racha del partido: ${T[strkLeader].maxPtStreak} puntos seguidos para ${strkLeader === 0 ? name0 : name1}.`);
    }
  }

  return { st, T, P: Object.values(P), pts, games, momentum, setBoundaries, insights, totalPts };
}
