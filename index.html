<style>
:root{
  --bg:#050507;
  --bg2:#0c0c10;
  --card:rgba(16, 16, 22, 0.86);
  --card-solid:#121218;
  --card2:rgba(26, 26, 35, 0.82);
  --line:rgba(212, 175, 55, 0.22);
  --line-hi:rgba(255, 226, 138, 0.28);
  --tx:#faf7f0;
  --tx2:#c2b8a3;
  --tx3:#7d7461;
  --acc:#d4af37;
  --acc2:#ffe58f;
  --acc-tx:#080600;
  --acc-ink:#f5d061;
  --red:#ff4d5e;
  --gold:#f5d061;
  --radius:24px;
  --font:'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
  --sig:'Great Vibes',cursive;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --shadow:0 22px 55px -15px rgba(0,0,0,.85), 0 0 0 1px var(--line);
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:var(--font);
  background-color:var(--bg);
  background-image:
    radial-gradient(1100px 600px at 12% -10%, rgba(212,175,55,.15), transparent 60%),
    radial-gradient(900px 520px at 95% 0%, rgba(255,229,143,.10), transparent 55%),
    radial-gradient(800px 500px at 50% 105%, rgba(180,130,25,.12), transparent 60%);
  background-attachment:fixed;
  color:var(--tx);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .18s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease), opacity .2s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.36;cursor:default}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.ic{width:20px;height:20px;flex:none}
.hidden{display:none!important}
.muted{color:var(--tx2);font-size:14px}
.print-only{display:none}

/* ---------- Pages ---------- */
.page{
  width:100%;
  max-width:960px;
  min-width:0;
  margin:0 auto;
  padding:calc(22px + var(--safe-t)) 18px calc(126px + var(--safe-b));
  animation:pageIn .28s var(--ease);
  box-sizing:border-box;
}
.page.stats{
  overflow-x:clip;
}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-h{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
  min-width:0;
  max-width:100%;
  flex-wrap:wrap;
}
.page-h h1{
  font-family:var(--cond);
  font-size:clamp(22px, 5.2vw, 32px);
  font-weight:800;
  font-style:italic;
  letter-spacing:.6px;
  text-transform:uppercase;
  flex:1 1 auto;
  min-width:0;
  line-height:1;
}
.icon-btn{
  width:46px;height:46px;border-radius:16px;display:grid;place-items:center;
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--line-hi), 0 8px 20px -6px rgba(0,0,0,.35);
  flex:none;
}
.icon-btn:hover{border-color:rgba(212,175,55,.55);transform:translateY(-1px)}
.icon-btn .ic{width:21px;height:21px}

.card{
  position:relative;
  background:var(--card);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
  box-shadow:var(--shadow), inset 0 1px 0 var(--line-hi);
  overflow:hidden;
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
}
.card h3{font-size:14px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--acc-ink);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .tag-s{margin-left:auto;font-family:var(--cond);font-size:14px;letter-spacing:1.6px;color:var(--acc-ink);font-weight:800;background:color-mix(in srgb,var(--acc) 16%,transparent);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.sec-t{font-family:var(--cond);font-size:15px;font-style:italic;letter-spacing:2.8px;color:var(--acc-ink);text-transform:uppercase;margin:28px 0 12px;font-weight:800;display:flex;align-items:center;gap:10px}
.sec-t:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:48px;padding:0 20px;border-radius:16px;font-weight:700;
  background:var(--card2);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--line-hi), 0 8px 18px -6px rgba(0,0,0,.45);
  font-size:15px;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:rgba(245,208,97,.45);transform:translateY(-1px)}
.btn.primary{
  background:linear-gradient(135deg, #ffe58f 0%, #d4af37 52%, #a87910 100%);
  color:var(--acc-tx);border-color:transparent;
  box-shadow:0 12px 30px -6px rgba(212,175,55,.5), inset 0 1px 0 rgba(255,255,255,.75);
}
.btn.primary:hover:not(:disabled){box-shadow:0 16px 36px -6px rgba(212,175,55,.68), inset 0 1px 0 rgba(255,255,255,.88)}
.btn.danger{color:var(--red);border-color:rgba(255,77,94,.25);background:rgba(255,77,94,.08)}
.btn.block{width:100%}
.btn.big{min-height:62px;font-size:18px;border-radius:20px;font-weight:800;letter-spacing:.3px}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px;border-radius:12px}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}
.btn-row .btn{flex:1 1 160px}

/* ---------- Floating Glass Pill Tabbar ---------- */
.tabbar{
  position:fixed;
  bottom:calc(10px + var(--safe-b));
  left:12px;
  right:12px;
  margin:0 auto;
  width:auto;
  max-width:480px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  gap:2px;
  background:rgba(12, 12, 17, 0.92);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--line-hi);
  border-radius:26px;
  padding:6px 6px;
  box-shadow:0 22px 50px -8px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,229,143,.2);
  z-index:80;
  box-sizing:border-box;
}
.tabbar a{
  flex:1 1 0;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:6px 2px;
  color:var(--tx3);
  text-decoration:none;
  font-size:11px;
  font-weight:700;
  border-radius:16px;
  transition:all .2s var(--ease);
  box-sizing:border-box;
}
.tabbar a span{
  font-size:10.5px;
  letter-spacing:.1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
  display:block;
  line-height:1.15;
}
.tabbar a .ic{width:20px;height:20px;transition:transform .2s var(--ease);flex:none}
.tabbar a:hover{color:var(--tx)}
.tabbar a.on{color:var(--acc-ink);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.tabbar a.on .ic{transform:translateY(-1px)}
.tabbar a.fab{
  flex:0 0 50px;
  width:50px;
  height:50px;
  margin:-18px 2px 0;
  border-radius:18px;
  background:linear-gradient(135deg, #ffe58f 0%, #d4af37 55%, #a87910 100%);
  color:var(--acc-tx);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 12px 28px -4px rgba(212,175,55,.6), inset 0 1.5px 0 rgba(255,255,255,.78);
}
.tabbar a.fab:hover{transform:translateY(-2px) scale(1.03)}
.tabbar a.fab .ic{width:26px;height:26px}
@media (max-width:360px){
  .tabbar{left:8px;right:8px;width:calc(100% - 16px);padding:5px 3px;gap:1px}
  .tabbar a{padding:5px 1px;font-size:10px}
  .tabbar a span{font-size:9.5px}
  .tabbar a.fab{flex:0 0 44px;width:44px;height:44px;margin:-14px 1px 0}
  .tabbar a.fab .ic{width:22px;height:22px}
}

/* ---------- Home & Virtual Signature ---------- */
.hero{
  position:relative;display:flex;align-items:center;gap:18px;margin:4px 0 22px;
  padding:22px;border-radius:28px;
  background:linear-gradient(135deg, rgba(212,175,55,.20) 0%, rgba(15,15,21,.92) 55%, rgba(245,208,97,.12) 100%);
  border:1px solid var(--line-hi);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,229,143,.28);
  overflow:hidden;
}
.hero{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:18px;
  padding:22px 24px;margin-bottom:18px;border-radius:26px;
  background:linear-gradient(135deg, rgba(212,175,55,.16) 0%, rgba(18,16,12,.92) 55%, rgba(8,8,10,.96) 100%);
  border:1px solid rgba(212,175,55,.32);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,235,160,.25);
}
.hero:before{
  content:'';position:absolute;right:-30px;top:-40px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle, rgba(212,175,55,.28), transparent 70%);pointer-events:none;
}
.hero svg.logo-ic{width:76px;height:76px;border-radius:22px;display:block;flex:none;box-shadow:0 14px 32px rgba(0,0,0,.75), 0 0 24px rgba(212,175,55,.22)}
.hero h1{
  font-family:var(--cond);font-size:clamp(30px,6vw,42px);font-weight:800;font-style:italic;text-transform:uppercase;line-height:1.12;letter-spacing:1px;
  padding:2px 8px 2px 0;
  margin:0 0 4px 0;
  background:linear-gradient(90deg, #ffffff 0%, #ffe58f 60%, #d4af37 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.sig-sub{
  display:inline-flex;flex-direction:column;align-items:flex-start;margin-top:2px;
}
.sig-name{
  display:inline-block;
  font-family:var(--sig);font-size:25px;line-height:1.45;font-weight:400;
  color:#f5d572;
  text-shadow:0 1px 0 rgba(255,250,220,.35), 0 3px 10px rgba(212,175,55,.45);
  padding:2px 10px 4px 2px;
  overflow:visible;
}
.sig-footer{
  text-align:center;margin:24px 0 6px;padding:12px;
  border-top:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:0;
}
.sig-footer .sig-name{font-size:25px}
.sig-flourish{width:105px;height:12px;stroke:var(--acc);fill:none;opacity:.75;margin-top:-4px}
.live-card{
  background:linear-gradient(135deg, rgba(255,77,94,.12), var(--card) 55%);
  border-color:color-mix(in srgb,var(--acc) 45%,var(--line));
}
.live-dot{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:1.5px;color:var(--red);margin-bottom:10px;background:rgba(255,77,94,.12);padding:5px 12px;border-radius:999px}
.live-dot:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.feat div{
  background:var(--card);backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:22px;padding:18px;
  box-shadow:var(--shadow), inset 0 1px 0 var(--line-hi);
  transition:transform .2s var(--ease), border-color .2s;
}
.feat div:hover{transform:translateY(-3px);border-color:rgba(215,245,66,.35)}
.feat .ic{color:var(--acc-ink);width:26px;height:26px;padding:8px;width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--acc) 14%,transparent)}
.feat b{display:block;margin:12px 0 5px;font-size:15px;font-weight:700}
.feat p{font-size:13px;color:var(--tx2);line-height:1.5}
.empty{text-align:center;color:var(--tx2);padding:42px 14px;font-size:14.5px;line-height:1.55;background:var(--card);border-radius:var(--radius);border:1px dashed var(--line)}
.empty .ic{width:44px;height:44px;opacity:.55;margin-bottom:10px;color:var(--acc-ink)}

/* match cards */
.mcard{
  display:block;width:100%;text-align:left;
  background:var(--card);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px;
  box-shadow:var(--shadow), inset 0 1px 0 var(--line-hi);
  transition:transform .2s var(--ease), border-color .2s, box-shadow .2s;
}
.mcard:hover{transform:translateY(-2px);border-color:rgba(212,175,55,.48)}
.mmeta{font-size:12px;color:var(--tx2);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600}
.mrow{display:flex;align-items:center;gap:12px;padding:5px 0}
.mrow .bar{width:5px;height:26px;border-radius:99px;background:var(--c);box-shadow:0 0 12px var(--c);flex:none}
.mrow .nm{flex:1;font-family:var(--cond);font-size:21px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
.mrow.win .nm{font-weight:800;color:var(--tx)}
.mrow .tro{width:18px;height:18px;color:#facc15;filter:drop-shadow(0 0 6px rgba(250,204,21,.45))}
.mrow .s{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card2);font-family:var(--cond);font-size:22px;font-weight:800;color:var(--tx3);flex:none}
.mrow .s.w{color:var(--tx);background:color-mix(in srgb,var(--tx) 12%,var(--card2))}
.mrow .s.cur{color:var(--acc-ink);box-shadow:inset 0 0 0 1.5px var(--acc-ink)}
.badge{font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--tx2);border:1px solid var(--line)}
.badge.live{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red);border-color:rgba(255,77,94,.3)}
.badge.ab{background:color-mix(in srgb,#f59e0b 18%,transparent);color:#f59e0b}

/* ---------- Forms & Steppers ---------- */
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field>label{font-size:11.5px;color:var(--tx2);font-weight:800;text-transform:uppercase;letter-spacing:1.1px}
.hint{font-size:12.5px;color:var(--tx2);line-height:1.5;padding:2px 2px 0}
.inp{
  height:50px;border-radius:16px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--bg2) 85%,transparent);padding:0 16px;font-size:16px;font-weight:600;
  outline:none;width:100%;transition:border-color .2s, box-shadow .2s;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35);
}
.inp:focus{border-color:var(--acc-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.seg{display:flex;background:color-mix(in srgb,var(--bg2) 90%,transparent);border:1px solid var(--line);border-radius:18px;padding:5px;gap:5px;flex-wrap:wrap;box-shadow:inset 0 2px 5px rgba(0,0,0,.35)}
.seg button{flex:1;min-width:68px;min-height:42px;border-radius:13px;font-size:14px;font-weight:700;color:var(--tx2);padding:6px 12px}
.seg button:hover{color:var(--tx)}
.seg button.on{
  background:linear-gradient(135deg, #ffe58f 0%, #d4af37 55%, #a87910 100%);
  color:var(--acc-tx);font-weight:800;
  box-shadow:0 6px 18px rgba(212,175,55,.4), inset 0 1px 0 rgba(255,255,255,.7);
}
/* Rounded Pill Selector & Steppers (like reference config) */
.rule-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 0;border-bottom:1px solid var(--line);
}
.rule-row:first-of-type{padding-top:4px}
.rule-row:last-child{border-bottom:0;padding-bottom:2px}
.rule-row .r-lbl b{display:block;font-size:16px;font-weight:700;color:var(--tx)}
.rule-row .r-lbl small{display:block;font-size:12.5px;color:var(--tx2);margin-top:2px;line-height:1.35}
.stepper{display:inline-flex;align-items:center;gap:14px;flex:none}
.step-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(212,175,55,.12);
  border:1px solid rgba(212,175,55,.35);
  color:var(--acc-ink);
  display:grid;place-items:center;font-size:22px;font-weight:700;line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,229,143,.25), 0 4px 10px rgba(0,0,0,.35);
}
.step-btn:hover:not(:disabled){
  background:linear-gradient(135deg, #ffe58f 0%, #d4af37 100%);
  color:#080600;border-color:transparent;
  box-shadow:0 0 18px rgba(212,175,55,.55);
}
.step-val{
  min-width:28px;text-align:center;
  font-family:var(--cond);font-size:26px;font-weight:800;color:var(--tx);
  font-variant-numeric:tabular-nums;
}
.rule-block{padding:14px 0;border-bottom:1px solid var(--line)}
.rule-block:last-child{border-bottom:0;padding-bottom:2px}
.rule-block b{display:block;font-size:16px;font-weight:700;color:var(--tx)}
.rule-block small{display:block;font-size:13px;color:var(--tx2);margin:3px 0 12px;line-height:1.4}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{
  flex:1;min-width:92px;min-height:42px;padding:8px 16px;border-radius:999px;
  background:rgba(26,26,35,.9);border:1px solid var(--line);
  color:var(--tx2);font-size:14px;font-weight:700;
}
.pills button:hover{color:var(--tx);border-color:rgba(212,175,55,.45)}
.pills button.on{
  background:linear-gradient(135deg, #ffe58f 0%, #d4af37 55%, #a87910 100%);
  color:var(--acc-tx);border-color:transparent;font-weight:800;
  box-shadow:0 6px 20px rgba(212,175,55,.45), inset 0 1px 0 rgba(255,255,255,.75);
}
.pill.sm{padding:5px 11px;font-size:12px;min-height:30px;min-width:auto;border-radius:999px;cursor:pointer}
.pill.sm:hover{background:rgba(212,175,55,.18);border-color:var(--gold);color:#fff}
.row{display:flex;gap:12px;margin-bottom:16px}
.row:last-child{margin-bottom:0}
.row>.field{margin-bottom:0}
.row>*{flex:1;min-width:0}
@media(max-width:480px){.row.wrap{flex-direction:column;gap:14px}}
.team-card{
  border-left:0;
  background:linear-gradient(135deg, color-mix(in srgb,var(--c) 18%,var(--card-solid)) 0%, var(--card) 65%);
  border-color:color-mix(in srgb,var(--c) 40%,var(--line));
}
.team-card h3:before{content:'';width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:38px;height:38px;border-radius:14px;background:var(--c);border:2px solid rgba(255,255,255,.25);box-shadow:0 6px 14px -4px var(--c);transition:transform .18s var(--ease), box-shadow .18s}
.colors button:hover{transform:translateY(-2px) scale(1.06)}
.colors button.on{transform:scale(1.1);border-color:#fff;box-shadow:0 0 0 3px var(--bg2), 0 0 0 5px var(--c), 0 8px 20px var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:9px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.chip.on{background:var(--c);color:var(--f);border-color:transparent;box-shadow:0 8px 22px -4px var(--c)}
.chip.on .dot{background:var(--f);box-shadow:none}
.tog{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.tog b{display:block;font-size:15px;font-weight:700}
.tog small{display:block;font-size:12.5px;color:var(--tx2);margin-top:3px;line-height:1.4}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;z-index:1;cursor:pointer;margin:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.25s var(--ease)}
.sw span:after{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.25s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sw input:checked+span{background:linear-gradient(135deg,#ffe58f,#d4af37);box-shadow:0 0 16px rgba(212,175,55,.45)}
.sw input:checked+span:after{transform:translateX(22px);background:#080600}
.kbd{display:inline-block;font-family:ui-monospace,monospace;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line-hi);margin:2px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
table.keys{width:100%;border-collapse:collapse;font-size:14px}
table.keys td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:middle}

/* ---------- Broadcast Arena Scoreboard ---------- */
.board{
  position:fixed;inset:0;width:100%;max-width:100vw;overflow:hidden;
  display:flex;flex-direction:column;
  background:radial-gradient(circle at 50% 0%, #17140b 0%, #050507 72%);
  color:#fff;user-select:none;-webkit-user-select:none;color-scheme:dark;
}
.sb-top{
  display:flex;align-items:center;gap:10px;min-width:0;
  padding:calc(10px + var(--safe-t)) 14px 8px;
  background:rgba(10, 10, 14, 0.82);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(212,175,55,.18);
}
.sb-top .icon-btn,.board .icon-btn{
  background:rgba(22, 22, 30, 0.85);
  border:1px solid rgba(212,175,55,.22);
  box-shadow:inset 0 1px 0 rgba(255,229,143,.18), 0 6px 16px rgba(0,0,0,.45);
  color:#fff;width:44px;height:44px;border-radius:15px;flex:none;
}
.sb-top .icon-btn.on{
  background:linear-gradient(135deg,#ffe58f,#d4af37);
  color:#080600;border-color:transparent;
  box-shadow:0 0 20px rgba(212,175,55,.55);
}
.sb-clock{
  flex:1;min-width:0;text-align:center;font-family:var(--cond);font-weight:800;font-size:26px;letter-spacing:1.4px;line-height:1;font-variant-numeric:tabular-nums;
  padding:4px 8px;border-radius:14px;transition:background .2s;
}
.sb-clock:hover{background:rgba(212,175,55,.06)}
.sb-clock small{display:block;font-family:var(--font);font-size:11px;color:#d6c79c;letter-spacing:1.1px;text-transform:uppercase;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-clock small b.red{color:#ff5d6c}

.court{
  flex:1;display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);
  gap:10px;padding:10px 14px;
  min-height:0;min-width:0;width:100%;max-width:100%;overflow:hidden;
}
.half{
  position:relative;
  border-radius:30px;
  background:
    radial-gradient(120% 110% at 85% 15%, color-mix(in srgb, var(--tc) 100%, #ffffff 22%) 0%, transparent 55%),
    linear-gradient(145deg, color-mix(in srgb, var(--tc) 92%, #050914) 0%, color-mix(in srgb, var(--tc) 58%, #040711) 100%);
  color:var(--tf);
  padding:20px 24px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);gap:8px 16px;
  overflow:hidden;cursor:pointer;touch-action:manipulation;
  border:1px solid rgba(255,255,255,.22);
  box-shadow:
    0 22px 50px -14px color-mix(in srgb, var(--tc) 55%, #000),
    inset 0 1.5px 0 rgba(255,255,255,.35),
    inset 0 -20px 40px rgba(0,0,0,.22);
  transition:transform .16s var(--ease), box-shadow .22s var(--ease), border-color .22s;
  min-height:0;min-width:0;width:100%;max-width:100%;outline:none;
}
/* Subtle padel court line & mesh watermark inside each half */
.half:before{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(90deg, transparent 62%, rgba(255,255,255,.07) 62%, rgba(255,255,255,.07) calc(62% + 2px), transparent calc(62% + 2px)),
    linear-gradient(180deg, transparent 48%, rgba(255,255,255,.05) 48%, rgba(255,255,255,.05) calc(48% + 1.5px), transparent calc(48% + 1.5px)),
    radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px);
  background-size:100% 100%, 100% 100%, 18px 18px;
  pointer-events:none;
}
.half:hover:not([data-ro]){border-color:rgba(255,255,255,.42);transform:translateY(-1px)}
.half:active:not([data-ro]){transform:scale(.986)}
.half[data-ro]{cursor:default}
.half.flash:after{content:'';position:absolute;inset:0;background:radial-gradient(circle, rgba(255,255,255,.75), rgba(255,255,255,.2));opacity:0;animation:flash .55s var(--ease);pointer-events:none}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

.half .players{display:flex;flex-direction:column;gap:6px;z-index:1;min-width:0;align-self:start}
.pn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--cond);font-weight:800;font-size:clamp(20px,3.6vmin,38px);
  text-transform:uppercase;letter-spacing:.8px;
  opacity:.72;white-space:nowrap;min-width:0;line-height:1.08;
  padding:4px 12px 4px 8px;border-radius:999px;
  width:fit-content;max-width:100%;
  transition:all .22s var(--ease);
}
.pn .nm{overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 10px rgba(0,0,0,.28)}

.pn .srv-side-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--cond);
  font-weight: 900;
  font-size: .48em;
  line-height: 1;
  padding: .2em .45em;
  border-radius: 6px;
  flex: none;
  letter-spacing: .5px;
  text-transform: uppercase;
  margin-left: 5px;
  vertical-align: middle;
}
.pn .srv-side-badge.srv-side-d {
  background: linear-gradient(135deg, #ffe58f 0%, #d4af37 100%);
  color: #080600;
  box-shadow: 0 0 10px rgba(212, 175, 55, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.7);
  border: 1px solid rgba(255, 229, 143, 0.5);
}
.pn .srv-side-badge.srv-side-r {
  background: linear-gradient(135deg, #7dd3fc 0%, #0284c7 100%);
  color: #04131f;
  box-shadow: 0 0 10px rgba(2, 132, 199, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.7);
  border: 1px solid rgba(125, 211, 252, 0.5);
}

.pn .ball{width:.55em;height:.55em;border-radius:50%;flex:none;background:rgba(255,255,255,.22);transition:all .25s var(--ease)}
.pn.srv{
  opacity:1;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), 0 6px 16px rgba(0,0,0,.22);
}
.pn.srv .ball{
  background:#ffe58f;
  box-shadow:0 0 0 3px rgba(212,175,55,.35), 0 0 16px #f5d061;
  animation:srvPulse 1.8s infinite;
}
@keyframes srvPulse{50%{transform:scale(1.18);box-shadow:0 0 0 5px rgba(212,175,55,.2), 0 0 22px #f5d061}}
.pn .fault{font-style:normal;font-family:var(--font);font-weight:800;font-size:.44em;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:3px 9px;border-radius:999px;letter-spacing:1px;box-shadow:0 4px 10px rgba(0,0,0,.3)}

.h-sets{justify-self:end;align-self:start;display:flex;gap:8px;z-index:1}
.h-sets span{
  min-width:1.65em;height:1.65em;padding:0 .25em;display:grid;place-items:center;
  border-radius:14px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.15);
  font-family:var(--cond);font-weight:800;font-size:clamp(20px,3.6vmin,36px);
  opacity:.75;position:relative;
}
.h-sets span.won{opacity:1;background:rgba(0,0,0,.5);border-color:rgba(255,255,255,.35);box-shadow:0 6px 16px rgba(0,0,0,.28)}
.h-sets sup{font-size:.48em;position:absolute;top:.06em;right:.14em;opacity:.9}

.h-games{
  align-self:end;justify-self:start;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(5, 10, 22, 0.36);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 12px 26px rgba(0,0,0,.28);
  border-radius:22px;padding:8px 20px 10px;min-width:2.6em;
}
.h-games small{font-size:clamp(10px,1.5vmin,12.5px);letter-spacing:2.4px;font-weight:800;opacity:.85}
.h-games b{font-family:var(--cond);font-size:clamp(46px,11.5vmin,126px);line-height:.92;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 4px 16px rgba(0,0,0,.35)}

.h-pts{
  align-self:center;justify-self:end;
  font-family:var(--cond);font-weight:800;font-style:italic;
  font-size:clamp(102px,29vmin,360px);line-height:.82;z-index:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  padding-right:6px;
  filter:drop-shadow(0 12px 28px rgba(0,0,0,.38));
}
.h-pts .ic{width:.68em;height:.68em;stroke-width:2.2}

.mid{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;min-height:34px;padding:2px 4px;min-width:0;max-width:100%;overflow:hidden}
.tag{
  font-family:var(--cond);font-weight:800;letter-spacing:1.4px;text-transform:uppercase;font-size:14.5px;
  padding:5px 14px;border-radius:999px;
  background:rgba(18, 18, 25, 0.9);backdrop-filter:blur(12px);
  border:1px solid rgba(212,175,55,.28);
  color:#f5e7c1;line-height:1.2;text-align:center;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.5);
}
.tag.gold{
  background:linear-gradient(135deg, #ffe58f 0%, #d4af37 55%, #a87910 100%);
  color:#080600;border-color:rgba(255,255,255,.55);
  box-shadow:0 0 24px rgba(212,175,55,.6);
}
.tag.warn{
  background:linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
  color:#fff;border-color:rgba(255,255,255,.35);
  box-shadow:0 0 22px rgba(234,88,12,.5);
}
.tag.hot{background:var(--c);color:var(--f);border-color:rgba(255,255,255,.4);box-shadow:0 0 24px var(--c)}
.tag.dim{background:transparent;border-color:transparent;box-shadow:none;color:#8e846c;font-weight:600}
.tag.mic{background:linear-gradient(135deg,#ef4444,#991b1b);color:#fff;box-shadow:0 0 18px rgba(239,68,68,.5)}

.sb-foot{
  display:flex;gap:10px;padding:8px 14px calc(10px + var(--safe-b));
  background:rgba(10, 10, 14, 0.85);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(212,175,55,.18);
}
.sb-foot button{
  flex:1;height:54px;border-radius:18px;
  background:rgba(22, 22, 30, 0.82);
  border:1px solid rgba(212,175,55,.2);
  box-shadow:inset 0 1px 0 rgba(255,229,143,.14), 0 8px 20px -6px rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;color:#faf7f0;
}
.sb-foot button:hover:not(:disabled){background:rgba(34, 34, 46, 0.92);border-color:rgba(212,175,55,.45);transform:translateY(-1px)}
.sb-foot .fault-btn{
  flex:1.25;
  background:linear-gradient(135deg, rgba(245,158,11,.22), rgba(180,83,9,.28));
  border-color:rgba(245,158,11,.45);color:#fde68a;font-weight:800;letter-spacing:.7px;
}
.sb-foot .fault-btn.on{
  background:linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  border-color:rgba(255,255,255,.4);color:#fff;
  box-shadow:0 0 26px rgba(245,158,11,.55);
}
@media (orientation:landscape) and (min-width:640px){
  .court{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding:12px 16px}
  .mid{flex-direction:column;width:clamp(120px,14vw,180px);flex-wrap:nowrap}
  .mid .tag{white-space:normal;text-align:center}
}
@media (max-height:520px){
  .sb-top{padding-top:calc(4px + var(--safe-t));padding-bottom:4px}
  .sb-top .icon-btn{width:38px;height:38px}
  .sb-foot button{height:44px}
  .sb-clock{font-size:20px}
  .half{padding:12px 16px;border-radius:22px}
}
@media (max-width:520px){
  .sb-top{gap:6px;padding:calc(6px + var(--safe-t)) 10px 6px}
  .sb-top .icon-btn{width:38px;height:38px;border-radius:12px}
  .sb-clock{font-size:22px;padding:2px 4px}
  .sb-clock small{font-size:10px;letter-spacing:.7px}
  .court{padding:6px 10px;gap:6px}
  .half{padding:14px 16px;border-radius:24px;gap:6px 10px}
  .h-games{padding:6px 14px 8px;border-radius:18px}
  .h-games b{font-size:clamp(38px,10.5vmin,64px)}
  .h-pts{font-size:clamp(84px,26vmin,150px);padding-right:2px}
  .tag{font-size:13px;padding:4px 11px;letter-spacing:1px}
  .sb-foot{gap:6px;padding:6px 10px calc(8px + var(--safe-b))}
  .sb-foot button{height:48px;border-radius:15px}
  .sb-foot .lbl{display:none}
}
.display .court{padding:16px}
.display .sb-top{justify-content:center}

/* ---------- Glass Sheets / Overlays ---------- */
.scrim{
  position:fixed;inset:0;
  background:rgba(4, 8, 18, 0.68);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s var(--ease);
}
.sheet{
  width:100%;max-width:560px;
  background:linear-gradient(180deg, rgba(20, 20, 28, 0.98) 0%, rgba(10, 10, 14, 0.99) 100%);
  color:#faf7f0;
  border-radius:30px 30px 0 0;
  padding:24px 22px calc(22px + var(--safe-b));
  max-height:92dvh;overflow:auto;
  animation:up .26s var(--ease);
  border:1px solid rgba(212,175,55,.28);
  box-shadow:0 -20px 60px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,229,143,.25);
}
@media(min-width:700px){.scrim{align-items:center;padding:18px}.sheet{border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.88), inset 0 1px 0 rgba(255,229,143,.25)}}
.sheet h2{font-family:var(--cond);font-size:30px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.7px;line-height:1.05;margin-bottom:4px;color:var(--acc-ink)}
.opt-sec{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx2);margin:16px 0 8px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{
  position:relative;min-height:66px;border-radius:18px;
  background:linear-gradient(135deg, color-mix(in srgb,var(--c) 24%, rgba(22,22,30,.92)) 0%, rgba(14,14,20,.94) 100%);
  border:1px solid color-mix(in srgb,var(--c) 50%, rgba(212,175,55,.18));
  box-shadow:0 8px 20px -6px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);
  font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:8px 12px;text-transform:uppercase;font-family:var(--cond);letter-spacing:.6px;font-size:21px;color:#fff;
}
.opt:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 12px 24px -6px color-mix(in srgb,var(--c) 45%,#000)}
.opt small{font-size:11.5px;color:#ded6c4;font-weight:600;text-transform:none;font-family:var(--font);letter-spacing:0}
.opt.wide{grid-column:1/-1;width:100%;margin-top:10px}
.opt .k,.btn .k{position:absolute;top:6px;right:8px;font-size:10px;font-family:ui-monospace,monospace;color:rgba(255,255,255,.45);background:rgba(0,0,0,.28);padding:1px 6px;border-radius:6px;display:none}
@media(hover:hover){.opt .k,.btn .k{display:block}}
.sheet .btn-row{margin-top:18px}
.sheet .btn{position:relative}
.menu-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.menu-list button{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:14px 16px;border-radius:18px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(212,175,55,.14);
  font-size:15.5px;text-align:left;font-weight:600;color:#faf7f0;
}
.menu-list button:hover{background:rgba(212,175,55,.10);border-color:rgba(212,175,55,.35);transform:translateX(3px)}
.menu-list button .ic{color:var(--acc-ink);width:22px;height:22px;padding:9px;width:40px;height:40px;border-radius:13px;background:rgba(212,175,55,.14)}
.menu-list small{display:block;font-size:12.5px;color:var(--tx2);margin-top:2px;font-weight:500}
.menu-list .danger{background:rgba(255,77,94,.08);border-color:rgba(255,77,94,.22);color:#ff6b7a}
.menu-list .danger .ic{color:#ff6b7a;background:rgba(255,77,94,.16)}

@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(32px) scale(.98);opacity:0}}
.overlay{
  position:fixed;inset:0;z-index:60;
  background:radial-gradient(circle at 50% 30%, rgba(30,24,10,.96), rgba(5,5,7,.98));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  color:#fff;text-align:center;padding:26px;animation:fade .22s var(--ease);
}
.overlay h2{font-family:var(--cond);font-size:clamp(42px,9vw,88px);font-style:italic;text-transform:uppercase;letter-spacing:1px;line-height:.95;font-weight:800;color:var(--acc-ink)}
.overlay p{color:var(--tx2);font-size:16px;font-weight:600}
.overlay .big-ic{width:80px;height:80px;color:var(--acc-ink);padding:18px;border-radius:26px;background:rgba(212,175,55,.14);box-shadow:0 0 40px rgba(212,175,55,.3)}
.overlay .count{font-family:var(--cond);font-weight:800;font-size:clamp(84px,24vw,210px);line-height:.9;font-variant-numeric:tabular-nums;color:var(--acc-ink);text-shadow:0 0 40px rgba(212,175,55,.45)}
.overlay .btn{background:rgba(22,22,30,.9);border-color:rgba(212,175,55,.25);color:#fff}
.overlay .btn.primary{background:linear-gradient(135deg,#ffe58f,#d4af37);color:#080600}
.overlay .btn-row{max-width:560px;width:100%}
.ov-score{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px}
.ov-score .mrow{background:rgba(18,18,24,.9);border:1px solid rgba(212,175,55,.22);border-radius:18px;padding:12px 16px}
.ov-score .mrow .nm{font-family:var(--cond);font-size:25px;text-transform:uppercase;color:#fff}
.ov-score .mrow .s{color:#8a806b;font-size:28px;width:38px;height:38px}
.ov-score .mrow .s.w{color:#fff}
.toast{
  position:fixed;left:50%;top:calc(76px + var(--safe-t));transform:translateX(-50%);
  background:linear-gradient(135deg,#ffe58f,#d4af37);color:#080600;
  padding:12px 22px;border-radius:999px;font-weight:800;z-index:80;
  box-shadow:0 16px 40px rgba(0,0,0,.65);animation:toast 2.4s var(--ease) forwards;
  white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;font-size:14.5px;
}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px) scale(.95)}12%,85%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-8px)}}

/* ---------- Stats & Analytics ---------- */
.st-head{
  background:linear-gradient(135deg, rgba(212,175,55,.16) 0%, var(--card) 55%, rgba(180,130,25,.12) 100%);
}
.st-head .tr{display:flex;align-items:center;gap:14px;padding:7px 0}
.st-head .bar{width:6px;height:34px;border-radius:99px;background:var(--c);box-shadow:0 0 14px var(--c);flex:none}
.st-head .nm{flex:1;font-family:var(--cond);font-size:clamp(24px,4.8vw,34px);font-weight:800;font-style:italic;text-transform:uppercase;min-width:0;line-height:1;color:var(--tx2);letter-spacing:.5px}
.st-head .tr.win .nm{color:var(--tx)}
.st-head .tro{color:#facc15;width:24px;height:24px;filter:drop-shadow(0 0 8px rgba(250,204,21,.5))}
.sboxes{display:flex;gap:8px}
.sbox{position:relative;width:44px;height:44px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:25px;color:var(--tx3)}
.sbox.w{color:var(--tx);background:color-mix(in srgb,var(--tx) 12%,var(--card2));border-color:var(--line-hi)}
.sbox.cur{color:var(--acc-ink);box-shadow:inset 0 0 0 2px var(--acc-ink)}
.sbox sup{position:absolute;top:2px;right:4px;font-size:11px}
.st-head .meta{color:var(--tx2);font-size:13px;font-weight:600;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.stats .seg{margin-bottom:16px}
.analysis{padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.5}
.analysis li::marker{color:var(--acc-ink)}
.grid2{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.grid2 .card{margin:0}
.cmp{margin:13px 0}
.cmp-l{text-align:center;font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.cmp-r{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;gap:12px}
.cmp-r b{font-family:var(--cond);font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.cmp-r b:last-child{text-align:right}
.cbar{display:flex;height:9px;border-radius:999px;overflow:hidden;background:var(--card2);gap:3px;padding:1px}
.cbar i{display:block;height:100%;border-radius:999px;transition:width .4s var(--ease)}
.note{font-size:12.5px;color:var(--tx2);margin-top:6px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;max-width:100%;min-width:0;display:block;margin:0}
table.pt{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.pt th{font-size:11px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:8px 4px;text-align:center;line-height:1.25;vertical-align:bottom}
table.pt td{padding:13px 4px;text-align:center;border-top:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
table.pt td:first-child{text-align:left;font-family:var(--cond);font-size:19px;font-weight:800;text-transform:uppercase;border-left:4px solid var(--c);padding-left:12px;white-space:nowrap}
.evo-row{display:flex;align-items:center;gap:12px;margin:8px 0}
.evo-row .lb{width:98px;font-family:var(--cond);font-weight:800;font-size:17px;flex:none}
.evo-chips{display:flex;gap:5px;flex-wrap:wrap}
.gch{min-width:30px;height:22px;border-radius:7px;background:color-mix(in srgb,var(--c) 38%,transparent);font-size:11px;font-weight:800;display:grid;place-items:center;color:#fff;padding:0 5px}
.gch.b,.gch.tb{background:var(--c);color:var(--f);box-shadow:0 4px 10px -2px var(--c)}
.mom{width:100%;height:175px;display:block;color:var(--tx);margin-top:12px}
.mom-leg{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;margin-top:4px}
.mom-leg span{display:flex;align-items:center;gap:7px}
.mom-leg i{width:11px;height:11px;border-radius:4px;background:var(--c);box-shadow:0 0 8px var(--c)}
details.pbp{border-top:1px solid var(--line)}
details.pbp:first-of-type{border-top:0}
details.pbp summary{cursor:pointer;padding:14px 0;font-family:var(--cond);font-weight:800;font-size:19px;letter-spacing:.6px;list-style:none;display:flex;justify-content:space-between}
details.pbp summary::-webkit-details-marker{display:none}
details.pbp summary:after{content:'+';color:var(--acc-ink);font-size:22px}
details.pbp[open] summary:after{content:'–'}
.pbp-game{display:grid;grid-template-columns:134px 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
@media(max-width:560px){.pbp-game{grid-template-columns:1fr auto}.pbp-game .pseq{grid-column:1/-1;grid-row:2}}
.pbp-h b{font-family:var(--cond);font-size:17px;font-weight:800;display:block}
.pbp-h small{color:var(--tx2);font-size:12px;font-weight:600}
.pseq{display:flex;flex-wrap:wrap;gap:6px}
.pseq span{font-size:12px;font-weight:700;padding:4px 8px 3px;border-radius:8px;background:var(--card2);border-bottom:3px solid var(--c);font-variant-numeric:tabular-nums;white-space:nowrap}
.pseq span.gp{box-shadow:inset 0 0 0 1.5px var(--tx)}
.brk-badge{background:linear-gradient(135deg,#ffe58f,#d4af37);color:#080600;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:1px}

/* players */
.pcard{display:flex;gap:16px;align-items:center;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px;width:100%;text-align:left;box-shadow:var(--shadow), inset 0 1px 0 var(--line-hi)}
.avatar{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:22px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));color:var(--f);box-shadow:0 8px 18px -4px var(--c);flex:none}
.pcard .info{flex:1;min-width:0}
.pcard .info b{font-family:var(--cond);font-size:22px;font-weight:800;text-transform:uppercase;display:block;letter-spacing:.4px}
.pcard .info small{color:var(--tx2);font-size:12.5px;font-weight:600;display:block;margin-top:2px}
.pcard .pct{font-family:var(--cond);font-weight:800;font-size:32px;color:var(--acc-ink);text-align:right;line-height:1}
.pcard .pct small{display:block;font-size:11px;color:var(--tx2);font-family:var(--font);font-weight:700;margin-top:2px}
.pstats{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.pstats span{font-size:12px;color:var(--tx2);background:var(--card2);padding:3px 9px;border-radius:8px}
.pstats b{color:var(--tx);font-size:13px}

/* ---------- Print (PDF) ---------- */
@media print{
  :root,:root[data-theme]{--bg:#fff;--bg2:#fff;--card:#f6f8fb;--card-solid:#fff;--card2:#e8edf5;--line:#e2e8f0;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;--acc-ink:#4d7c0f;color-scheme:light}
  body{background:#fff!important;background-image:none!important}
  .no-print,.tabbar,.toast,.scrim,.overlay{display:none!important}
  .print-only{display:block}
  .page{padding:0;max-width:none}
  .card{break-inside:avoid;border-color:#e2e8f0;box-shadow:none;backdrop-filter:none}
  .grid2{grid-template-columns:1fr 1fr}
  .print-title{font-family:var(--cond);letter-spacing:3px;font-weight:700;font-size:13px;color:#64748b;margin-bottom:10px;text-transform:uppercase}
  .pbp-game{break-inside:avoid}
  .mom{height:140px}
  @page{margin:14mm}
}

/* ---------- OBS & Live Stream Overlay Mode ---------- */
html.obs-mode, body.obs-mode {
  background: transparent !important;
  background-color: transparent !important;
  background-image: none !important;
  overflow: hidden !important;
  margin: 0 !important;
  padding: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  -webkit-font-smoothing: antialiased;
}
html.obs-mode #app, body.obs-mode #app {
  background: transparent !important;
  background-color: transparent !important;
  background-image: none !important;
  overflow: hidden !important;
  width: 100vw !important;
  height: 100vh !important;
  position: relative !important;
}

.obs-overlay {
  position: fixed;
  z-index: 9999;
  font-family: var(--font);
  user-select: none;
  -webkit-user-select: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
  animation: obsFadeIn .3s var(--ease) both;
}
@keyframes obsFadeIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Positions */
.obs-overlay.obs-pos-tl { top: 32px; left: 36px; }
.obs-overlay.obs-pos-tr { top: 32px; right: 36px; }
.obs-overlay.obs-pos-bl { bottom: 32px; left: 36px; }
.obs-overlay.obs-pos-br { bottom: 32px; right: 36px; }
.obs-overlay.obs-pos-bar {
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: min(920px, calc(100vw - 48px));
}

/* Scorebug Card */
.obs-scorebug {
  background: rgba(10, 10, 15, 0.94);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1.5px solid rgba(212, 175, 55, 0.45);
  border-radius: 18px;
  box-shadow: 0 18px 40px -10px rgba(0, 0, 0, 0.9), 0 0 1px rgba(255, 255, 255, 0.3), inset 0 1px 0 rgba(255, 229, 143, 0.25);
  padding: 8px 12px 10px;
  min-width: 410px;
  max-width: 480px;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.obs-overlay.obs-pos-bar .obs-scorebug {
  min-width: unset;
  max-width: none;
  width: 100%;
}

/* Header */
.obs-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 4px 6px;
  border-bottom: 1px solid rgba(212, 175, 55, 0.18);
  font-size: 11px;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--tx2);
  font-weight: 700;
}
.obs-brand {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--gold);
  font-family: var(--cond);
  font-weight: 800;
  font-size: 12.5px;
  letter-spacing: 1px;
}
.obs-brand svg {
  width: 14px;
  height: 14px;
}
.obs-status-pill {
  background: rgba(212, 175, 55, 0.12);
  border: 1px solid rgba(212, 175, 55, 0.35);
  color: var(--gold);
  padding: 2px 8px;
  border-radius: 8px;
  font-family: var(--cond);
  font-weight: 800;
  font-size: 11.5px;
  letter-spacing: .6px;
}
.obs-clock {
  font-family: var(--cond);
  font-weight: 800;
  font-size: 13px;
  color: #fff;
  letter-spacing: .6px;
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  gap: 4px;
}
.obs-clock-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ef4444;
  box-shadow: 0 0 8px #ef4444;
  animation: obsPulse 1.8s infinite;
}
@keyframes obsPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(0.85); }
}

/* Team Rows */
.obs-team-row {
  display: grid;
  grid-template-columns: 5px 1fr auto auto auto;
  align-items: center;
  gap: 10px;
  padding: 5px 6px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.02);
  transition: background .2s ease;
}
.obs-team-row.serving {
  background: rgba(212, 175, 55, 0.08);
}
.obs-team-bar {
  width: 5px;
  height: 28px;
  border-radius: 4px;
  background: var(--tc, #d4af37);
  box-shadow: 0 0 10px var(--tc, #d4af37);
}
.obs-team-names {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--cond);
  font-weight: 800;
  font-size: 17px;
  letter-spacing: .3px;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
.obs-team-names .obs-ball {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 17px;
  height: 17px;
  font-size: 12px;
  line-height: 1;
  filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.9));
  animation: obsServeBounce 1.2s infinite ease-in-out;
  flex: none;
}
@keyframes obsServeBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}

.obs-p.srv {
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
}
.obs-srv-side {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--cond);
  font-weight: 900;
  font-size: 11px;
  line-height: 1;
  width: 17px;
  height: 17px;
  border-radius: 5px;
  flex: none;
  letter-spacing: 0;
  margin-left: 2px;
}
.obs-srv-side.srv-d {
  background: linear-gradient(135deg, #ffe58f 0%, #d4af37 100%);
  color: #080600;
  box-shadow: 0 0 8px rgba(212, 175, 55, 0.65);
}
.obs-srv-side.srv-r {
  background: linear-gradient(135deg, #7dd3fc 0%, #0284c7 100%);
  color: #04131f;
  box-shadow: 0 0 8px rgba(2, 132, 199, 0.65);
}

.obs-team-names .obs-fault {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 6px;
  background: #f59e0b;
  color: #000;
  font-weight: 800;
  letter-spacing: .5px;
  flex: none;
}
.obs-sets-wrap {
  display: flex;
  align-items: center;
  gap: 5px;
}
.obs-set-box {
  width: 24px;
  height: 28px;
  display: grid;
  place-items: center;
  font-family: var(--cond);
  font-weight: 800;
  font-size: 16px;
  color: var(--tx2);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.04);
}
.obs-set-box.won {
  color: var(--gold);
  background: rgba(212, 175, 55, 0.16);
  border: 1px solid rgba(212, 175, 55, 0.35);
  font-weight: 900;
}
.obs-set-box sup {
  font-size: 9px;
  margin-left: 1px;
}
.obs-games-box {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  font-family: var(--cond);
  font-weight: 900;
  font-size: 21px;
  color: #ffffff;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.obs-pts-box {
  min-width: 44px;
  height: 32px;
  padding: 0 8px;
  display: grid;
  place-items: center;
  font-family: var(--cond);
  font-weight: 900;
  font-size: 20px;
  border-radius: 8px;
  background: linear-gradient(135deg, #ffe58f 0%, #d4af37 60%, #a87910 100%);
  color: #080600;
  box-shadow: 0 4px 14px rgba(212, 175, 55, 0.45);
  letter-spacing: .5px;
}
.obs-pts-box.dim {
  background: rgba(255, 255, 255, 0.05);
  color: var(--tx3);
  box-shadow: none;
}
.obs-pts-box.gold {
  animation: obsGoldPulse 1.2s infinite ease-in-out;
}
@keyframes obsGoldPulse {
  0%, 100% { box-shadow: 0 0 16px rgba(212, 175, 55, 0.8); }
  50% { box-shadow: 0 0 6px rgba(212, 175, 55, 0.3); }
}

/* Event Tickers */
.obs-ticker {
  margin-top: 2px;
  padding: 5px 10px;
  border-radius: 8px;
  font-family: var(--cond);
  font-weight: 800;
  font-size: 12.5px;
  text-align: center;
  letter-spacing: .8px;
  text-transform: uppercase;
  background: rgba(212, 175, 55, 0.12);
  border: 1px solid rgba(212, 175, 55, 0.35);
  color: var(--gold);
}
.obs-ticker.obs-ticker-gold {
  background: linear-gradient(135deg, rgba(255, 229, 143, 0.25) 0%, rgba(212, 175, 55, 0.35) 100%);
  border-color: var(--gold);
  color: #fff;
  text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
  animation: obsTickerPulse 1.5s infinite;
}
.obs-ticker.obs-ticker-warn {
  background: rgba(245, 158, 11, 0.22);
  border-color: #f59e0b;
  color: #fbbf24;
}
.obs-ticker.obs-ticker-hot {
  background: rgba(239, 68, 68, 0.25);
  border-color: #ef4444;
  color: #fca5a5;
  animation: obsTickerPulse 1.2s infinite;
}
@keyframes obsTickerPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

/* Standby Bug */
.obs-scorebug.obs-waiting {
  padding: 12px 18px;
  flex-direction: row;
  align-items: center;
  gap: 14px;
}
.obs-waiting-logo svg {
  width: 32px;
  height: 32px;
}
.obs-waiting-info {
  display: flex;
  flex-direction: column;
}
.obs-waiting-title {
  font-family: var(--cond);
  font-weight: 800;
  font-size: 16px;
  letter-spacing: 1px;
  color: var(--gold);
}
.obs-waiting-sub {
  font-size: 11px;
  color: var(--tx2);
  letter-spacing: .6px;
  font-weight: 700;
}

/* ==================== ELO RANKING & PLAYTOMIC STYLES ==================== */
.badge.elo {
  background: rgba(212, 175, 55, 0.15);
  border: 1px solid rgba(212, 175, 55, 0.38);
  color: var(--gold);
  font-weight: 800;
  letter-spacing: .3px;
}

.rank-pos {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-family: var(--cond);
  font-weight: 800;
  font-size: 15px;
  flex: none;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--tx2);
}
.rank-pos.rank-gold {
  background: linear-gradient(135deg, #ffe58f 0%, #d4af37 60%, #b8860b 100%);
  color: #080600;
  border: none;
  font-size: 16px;
  box-shadow: 0 4px 14px rgba(212, 175, 55, 0.45);
}
.rank-pos.rank-silver {
  background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 60%, #94a3b8 100%);
  color: #080600;
  border: none;
  font-size: 16px;
  box-shadow: 0 4px 12px rgba(203, 213, 225, 0.35);
}
.rank-pos.rank-bronze {
  background: linear-gradient(135deg, #fcd34d 0%, #d97706 60%, #92400e 100%);
  color: #080600;
  border: none;
  font-size: 16px;
  box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
}

.tier-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .3px;
  background: color-mix(in srgb, var(--tcol) 15%, transparent);
  color: var(--tcol);
  border: 1px solid color-mix(in srgb, var(--tcol) 35%, transparent);
}

.calib-pill {
  display: inline-flex;
  align-items: center;
  padding: 2.5px 8px;
  border-radius: 7px;
  font-size: 10.5px;
  font-weight: 700;
}
.calib-pill.calib {
  background: rgba(245, 158, 11, 0.15);
  color: #fbbf24;
  border: 1px solid rgba(245, 158, 11, 0.32);
}
.calib-pill.fixed {
  background: rgba(16, 185, 129, 0.12);
  color: #34d399;
  border: 1px solid rgba(16, 185, 129, 0.28);
}

.elo-trend {
  font-size: 11px;
  font-weight: 800;
  margin-top: 4px;
  letter-spacing: .3px;
  font-family: var(--font);
}
.elo-trend.up { color: #10b981; }
.elo-trend.down { color: #ef4444; }
.elo-trend.neu { color: var(--tx3); }

/* FAQ guide accordion */
.elo-guide-card {
  margin-top: 20px;
  margin-bottom: 24px;
  background: rgba(16, 16, 22, 0.7);
  border: 1px solid rgba(212, 175, 55, 0.25);
  border-radius: 18px;
  padding: 14px 18px;
  text-align: left;
}
.elo-guide-card summary {
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  color: var(--gold);
  user-select: none;
  outline: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.elo-guide-content {
  margin-top: 14px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  font-size: 12.5px;
  color: var(--tx2);
  line-height: 1.45;
}
.guide-item {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  padding: 10px 12px;
}
.guide-item b {
  color: #f5f3ef;
  display: block;
  margin-bottom: 4px;
  font-size: 13px;
}
.guide-item p {
  margin: 0;
  color: var(--tx2);
}

/* Victory celebration ELO box */
.ov-elo-box {
  margin-top: 14px;
  background: rgba(10, 10, 14, 0.9);
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: 16px;
  padding: 12px 14px;
  width: 100%;
  max-width: 440px;
}
.ov-elo-title {
  font-family: var(--cond);
  font-weight: 800;
  font-size: 12px;
  letter-spacing: 1.2px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.ov-elo-pairs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.ov-elo-card {
  padding: 8px 10px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.ov-elo-card.win {
  background: rgba(16, 185, 129, 0.08);
  border-color: rgba(16, 185, 129, 0.3);
}
.ov-elo-card.lose {
  background: rgba(239, 68, 68, 0.08);
  border-color: rgba(239, 68, 68, 0.25);
}
.ov-elo-tag {
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .8px;
  text-transform: uppercase;
}
.ov-elo-card.win .ov-elo-tag { color: #34d399; }
.ov-elo-card.lose .ov-elo-tag { color: #f87171; }
.ov-elo-card b {
  font-family: var(--cond);
  font-size: 15px;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ov-elo-delta {
  font-family: var(--cond);
  font-size: 18px;
  font-weight: 900;
}
.ov-elo-card.win .ov-elo-delta { color: #10b981; }
.ov-elo-card.lose .ov-elo-delta { color: #ef4444; }
.ov-elo-card small {
  font-size: 10px;
  color: var(--tx3);
  font-weight: 600;
}

/* Match Stats ELO Card */
.elo-match-card {
  text-align: left;
}
.elo-teams-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
  margin-top: 10px;
}
.elo-team-col {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 14px;
  padding: 12px 14px;
}
.elo-team-col.winner-col {
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
  border-color: rgba(212, 175, 55, 0.35);
}
.elo-team-hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.elo-team-hdr b {
  font-family: var(--cond);
  font-size: 18px;
  font-weight: 800;
  text-transform: uppercase;
}
.elo-team-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--tx2);
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  margin-bottom: 8px;
}
.elo-team-meta b {
  color: var(--gold);
}
.elo-players-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.elo-player-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12.5px;
  padding: 4px 0;
}
.elo-player-row .p-name {
  font-weight: 700;
  color: #fff;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.elo-player-row .p-delta {
  font-family: var(--cond);
  font-weight: 800;
  font-size: 14px;
  margin: 0 10px;
}
.elo-player-row .p-delta.up { color: #10b981; }
.elo-player-row .p-delta.down { color: #ef4444; }
.elo-player-row .p-after {
  font-size: 11.5px;
  color: var(--tx2);
}
.elo-player-row .p-after b {
  color: var(--gold);
}

</style>
