function downloadAppQR() {
  try {
    const url = getAppShareUrl();
    const qrCanvas = document.createElement('canvas');
    if (typeof window.QRious !== 'undefined') {
      new window.QRious({
        element: qrCanvas,
        value: url,
        size: 380,
        level: 'H',
        padding: 14,
        background: '#ffffff',
        foreground: '#060609'
      });
    }

    const W = 560, H = 740;
    const card = document.createElement('canvas');
    card.width = W;
    card.height = H;
    const ctx = card.getContext('2d');
    if (!ctx) return;

    // Dark luxury background
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#161410');
    bgGrad.addColorStop(0.5, '#0a0a0d');
    bgGrad.addColorStop(1, '#040406');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Outer Gold border
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 3;
    ctx.strokeRect(16, 16, W - 32, H - 32);

    // Inner subtle gold line
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(22, 22, W - 44, H - 44);

    // Title
    ctx.fillStyle = '#f5d061';
    ctx.font = 'bold italic 32px "Barlow Condensed", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PÁDEL CONTROL SÉ', W / 2, 75);

    // Subtitle Signature
    ctx.fillStyle = '#d4af37';
    ctx.font = 'italic 20px "Great Vibes", cursive, sans-serif';
    ctx.fillText('By Sairaf Engel', W / 2, 108);

    // White rounded card for QR
    const qrX = (W - 380) / 2;
    const qrY = 135;
    ctx.fillStyle = '#ffffff';
    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(qrX - 10, qrY - 10, 400, 400, 18);
      ctx.fill();
    } else {
      ctx.fillRect(qrX - 10, qrY - 10, 400, 400);
    }

    // Draw QR
    ctx.drawImage(qrCanvas, qrX, qrY, 380, 380);

    // Instruction text
    ctx.fillStyle = '#c2b8a3';
    ctx.font = '15px "Plus Jakarta Sans", sans-serif';
    ctx.fillText('Apuntá con la cámara de tu celular para abrir la app', W / 2, 580);

    // URL badge
    ctx.fillStyle = 'rgba(212, 175, 55, 0.12)';
    ctx.fillRect(36, 608, W - 72, 42);
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.45)';
    ctx.lineWidth = 1;
    ctx.strokeRect(36, 608, W - 72, 42);

    ctx.fillStyle = '#f5d061';
    ctx.font = 'bold 14px "Plus Jakarta Sans", monospace';
    ctx.fillText(url, W / 2, 634);

    // Footer
    ctx.fillStyle = '#7d7461';
    ctx.font = '12.5px "Plus Jakarta Sans", sans-serif';
    ctx.fillText('Marcador Profesional · Estadísticas · Voz · Transmisión en Vivo', W / 2, 692);

    // Download trigger
    const link = document.createElement('a');
    link.download = 'QR-Padel-Control-SE.png';
    link.href = card.toDataURL('image/png');
    link.click();
    showToast('¡Imagen del QR descargada!');
  } catch (err) {
    console.error('Error downloading QR card:', err);
    showToast('Error al descargar imagen');
  }
}

// ==================== OBS & BROADCAST OVERLAY RENDERER ====================
function getOBSPosition() {
  const h = (location.hash || '').slice(1);
  const qIdx = h.indexOf('?');
  const ampIdx = h.indexOf('&');
  const paramStr = qIdx >= 0 ? h.slice(qIdx + 1) : (ampIdx >= 0 ? h.slice(ampIdx + 1) : '');
  const sp = new URLSearchParams(paramStr);
  const p = sp.get('pos');
  if (['tl', 'tr', 'bl', 'br', 'bar'].includes(p)) return p;
  return 'tl';
}

function renderOBSOverlay() {
  const isRemoteLive = (ui.route === 'live' || !!ui.liveId);
  const m = (isRemoteLive && ui.liveMatch) ? ui.liveMatch : (activeMatch || ui.liveMatch);
  const pos = getOBSPosition();

  if (!m) {
    return `
    <div class="obs-overlay obs-pos-${pos}">
      <div class="obs-scorebug obs-waiting">
        <div class="obs-waiting-logo">${LOGO_SVG}</div>
        <div class="obs-waiting-info">
          <div class="obs-waiting-title">PÁDEL CONTROL SÉ</div>
          <div class="obs-waiting-sub">ESPERANDO INICIO DEL PARTIDO...</div>
        </div>
      </div>
    </div>`;
  }

  const st = computeMatch(m);

  const pastSets = st.sets.filter((s, idx) => {
    if (idx === st.curSetIdx && st.matchWinner === null) return false;
    if (s.games[0] === 0 && s.games[1] === 0 && s.winner === null) return false;
    return true;
  });

  const renderTeamRow = (t) => {
    const col = m.teams[t].color;
    const isSrv = (st.matchWinner === null && st.srvTeam === t);
    const names = esc(teamLabel(m, t));

    const setsHtml = pastSets.map(s => {
      const won = (s.winner === t);
      const tb = s.tbScore ? `<sup>${s.tbScore[t]}</sup>` : '';
      return `<div class="obs-set-box ${won ? 'won' : ''}">${s.games[t]}${tb}</div>`;
    }).join('');

    const ptVal = st.matchWinner !== null
      ? (st.matchWinner === t ? '🏆' : '—')
      : esc(st.pointDisplay[t]);

    const isGoldPt = (st.pointDisplay[t] === 'ADV' || st.pointDisplay[t] === 'GP' || st.isGP || st.isStar);

    const playersLine = [0, 1].map(pi => {
      const nm = esc(playerLabel(m, t, pi));
      const pIsSrv = (isSrv && st.srvPlayer === pi);
      if (pIsSrv) {
        return `<span class="obs-p srv">${nm} <span class="obs-ball" title="Al saque">🎾</span><span class="obs-srv-side srv-${st.srvSide.toLowerCase()}" title="Saque desde la ${st.srvSide === 'D' ? 'Derecha' : 'Revés'}">${st.srvSide}</span></span>`;
      }
      return `<span class="obs-p">${nm}</span>`;
    }).join(' <span style="opacity:0.4;margin:0 2px">·</span> ');

    return `
    <div class="obs-team-row ${isSrv ? 'serving' : ''}">
      <div class="obs-team-bar" style="--tc:${esc(col)}"></div>
      <div class="obs-team-names">
        ${playersLine}
        ${isSrv && m.pendingFault ? `<span class="obs-fault">2º</span>` : ''}
      </div>
      <div class="obs-sets-wrap">${setsHtml}</div>
      <div class="obs-games-box">${st.curSet.games[t]}</div>
      <div class="obs-pts-box ${st.matchWinner !== null ? 'dim' : (isGoldPt ? 'gold' : '')}">${ptVal}</div>
    </div>`;
  };

  let tickerHtml = '';
  if (st.matchWinner !== null) {
    tickerHtml = `<div class="obs-ticker obs-ticker-gold">🏆 PARTIDO FINALIZADO · GANADORES: ${esc(teamLabel(m, st.matchWinner))}</div>`;
  } else if (st.isStar) {
    tickerHtml = `<div class="obs-ticker obs-ticker-gold">★ STAR POINT (PUNTO DECISIVO)</div>`;
  } else if (st.isGP) {
    tickerHtml = `<div class="obs-ticker obs-ticker-gold">★ PUNTO DE ORO</div>`;
  } else if (st.mp[0] || st.mp[1]) {
    const winTeam = st.mp[0] ? 0 : 1;
    tickerHtml = `<div class="obs-ticker obs-ticker-hot">MATCH POINT · ${esc(teamLabel(m, winTeam))}</div>`;
  } else if (st.sp[0] || st.sp[1]) {
    const winTeam = st.sp[0] ? 0 : 1;
    tickerHtml = `<div class="obs-ticker obs-ticker-hot">SET POINT · ${esc(teamLabel(m, winTeam))}</div>`;
  } else if (st.isBP) {
    const rcv = 1 - st.srvTeam;
    tickerHtml = `<div class="obs-ticker obs-ticker-warn">BOLA DE BREAK · ${esc(teamLabel(m, rcv))}</div>`;
  } else if (st.isSuperTB) {
    tickerHtml = `<div class="obs-ticker">SÚPER TIE-BREAK A 10</div>`;
  } else if (st.isTB) {
    tickerHtml = `<div class="obs-ticker">TIE-BREAK A 7</div>`;
  }

  const setLabel = st.matchWinner !== null ? 'FINALIZADO' : (st.isSuperTB ? 'SÚPER TB' : (st.isTB ? 'TIE-BREAK' : `SET ${st.curSetIdx + 1}`));

  return `
  <div class="obs-overlay obs-pos-${pos}">
    <div class="obs-scorebug">
      <div class="obs-header">
        <div class="obs-brand">${LOGO_SVG} <span>PÁDEL CONTROL SÉ</span></div>
        <div class="obs-status-pill">${setLabel}</div>
        <div class="obs-clock">
          <span class="obs-clock-dot"></span>
          <span id="sb-clock-val">${esc(fmtClock(m.durationMs))}</span>
        </div>
      </div>
      ${renderTeamRow(0)}
      ${renderTeamRow(1)}
      ${tickerHtml}
    </div>
  </div>`;
}

function getOBSUrls(pos = 'tl') {
  const baseUrl = location.href.split('#')[0];
  const posParam = pos !== 'tl' ? `&pos=${pos}` : '';
  const localUrl = `${baseUrl}#obs${posParam}`;
  
  const m = activeMatch || ui.liveMatch;
  let remoteCode = '';
  if (m) {
    publishLiveMatchState(m, true);
    remoteCode = shortMatchCode(m.id);
  }
  const remoteUrl = remoteCode ? `${baseUrl}#obs&v=${remoteCode}${posParam}` : `${baseUrl}#obs${posParam}`;
  return { localUrl, remoteUrl, remoteCode };
}

// ==================== SCOREBOARD & MODALS RENDERER ====================
function renderBoard(isDisplayOnly = false) {
  const isRemoteLive = (ui.route === 'live');
  const m = isRemoteLive ? ui.liveMatch : activeMatch;

  if (!m) {
    if (isRemoteLive) {
      return `
      <div class="page">
        <div class="empty">
          ${ICONS.live}<br>
          <b>Conectando con la cancha en vivo...</b><br>
          <span class="muted">Esperando señal en tiempo real del partido.</span><br><br>
          <button class="btn" data-act="exit-live">Salir al inicio</button>
        </div>
      </div>`;
    }
    return `<div class="page"><div class="empty">No hay ningún partido activo.<br><br><button class="btn primary" data-nav="new">Crear Partido</button></div></div>`;
  }
  const st = computeMatch(m);
  const order = m.flipped ? [1, 0] : [0, 1];

  const renderHalf = (t) => {
    const col = m.teams[t].color;
    const fg = fgFor(col);
    const playersHtml = [];
    for (let pi = 0; pi < 2; pi++) {
      const isSrv = st.matchWinner === null && st.srvTeam === t && st.srvPlayer === pi;
      playersHtml.push(`
        <div class="pn ${isSrv?'srv':''}">
          <span class="ball"></span>
          <span class="nm">${esc(playerLabel(m, t, pi))}</span>
          ${isSrv && st.srvSide ? `<span class="srv-side-badge srv-side-${st.srvSide.toLowerCase()}" title="Saque desde la ${st.srvSide==='D'?'Derecha':'Revés'}">${st.srvSide}</span>` : ''}
          ${isSrv && m.pendingFault ? `<em class="fault">2º SAQUE</em>` : ''}
        </div>`);
    }

    const setsHtml = st.sets.map((s, idx) => {
      if (idx === st.curSetIdx && st.matchWinner === null) return '';
      if (s.games[0] === 0 && s.games[1] === 0 && s.winner === null) return '';
      const won = s.winner === t;
      const tbSup = s.tbScore ? `<sup>${s.tbScore[t]}</sup>` : '';
      return `<span class="${won?'won':''}">${s.games[t]}${tbSup}</span>`;
    }).join('');

    const ptVal = st.matchWinner !== null
      ? (st.matchWinner === t ? ICONS.trophy : '—')
      : esc(st.pointDisplay[t]);

    return `
    <div class="half" data-team="${t}" ${isDisplayOnly ? 'data-ro="1"' : 'tabindex="0" role="button"'} style="--tc:${esc(col)};--tf:${fg}">
      <div class="players">${playersHtml.join('')}</div>
      <div class="h-sets">${setsHtml}</div>
      <div class="h-games">
        <small>${st.isSuperTB ? 'SÚPER TB' : 'JUEGOS'}</small>
        <b>${st.curSet.games[t]}</b>
      </div>
      <div class="h-pts">${ptVal}</div>
    </div>`;
  };

  // Center status pills
  const tags = [];
  if (st.matchWinner !== null) {
    tags.push(`<span class="tag gold">FINALIZADO</span>`);
  } else {
    tags.push(`<span class="tag">${st.isSuperTB ? 'SÚPER TIE-BREAK' : st.isTB ? 'TIE-BREAK' : `SET ${st.curSetIdx + 1}`}</span>`);
    if (st.isStar) {
      tags.push(`<span class="tag gold">★ STAR POINT (PUNTO DECISIVO)</span>`);
    } else if (st.isGP) {
      tags.push(`<span class="tag gold">PUNTO DE ORO</span>`);
    } else if (m.rules.deuceRule === 'star' && !st.isTB && st.p[0] >= 3 && st.p[1] >= 3) {
      if (st.p[0] !== st.p[1]) {
        tags.push(`<span class="tag">${st.curAdvNumber}ª VENTAJA (DE 2)</span>`);
      } else if (st.curDeuceCount === 2) {
        tags.push(`<span class="tag">IGUALES (QUEDA 1 VENTAJA ANTES DEL ★ STAR POINT)</span>`);
      } else if (st.curDeuceCount === 1) {
        tags.push(`<span class="tag">IGUALES (HASTA 2 VENTAJAS)</span>`);
      }
    }
    for (let t = 0; t < 2; t++) {
      if (st.mp[t]) tags.push(`<span class="tag hot" style="--c:${esc(m.teams[t].color)};--f:${fgFor(m.teams[t].color)}">MATCH POINT · ${esc(teamLabel(m,t))}</span>`);
      else if (st.sp[t]) tags.push(`<span class="tag hot" style="--c:${esc(m.teams[t].color)};--f:${fgFor(m.teams[t].color)}">SET POINT · ${esc(teamLabel(m,t))}</span>`);
    }
    if (st.isBP && !st.isGP) {
      const rcv = 1 - st.srvTeam;
      tags.push(`<span class="tag warn">BOLA DE BREAK · ${esc(teamLabel(m, rcv))}</span>`);
    }
    if (ui.voiceListening) {
      tags.push(`<span class="tag mic">● MIC ACTIVO</span>`);
    }
    if (tags.length === 1 && !isDisplayOnly) {
      tags.push(`<span class="tag dim">Tocá el lado ganador del punto</span>`);
    }
  }

  return `
  <div class="board ${isDisplayOnly?'display':''}">
    <header class="sb-top">
      ${isRemoteLive ? `
        <button class="icon-btn" data-act="exit-live" title="Salir de la transmisión">${ICONS.back}</button>
        <div class="sb-clock">
          <span id="sb-clock-val">${esc(fmtClock(m.durationMs))}</span>
          <small><b class="red">● EN VIVO</b> · ${st.matchWinner !== null ? 'FINALIZADO' : `SET ${st.curSetIdx + 1} · SACA ${esc(playerLabel(m, st.srvTeam, st.srvPlayer))} (${st.srvSide === 'D' ? 'DERECHA' : 'REVÉS'})`}</small>
        </div>
        <button class="icon-btn ${prefs.voice?'on':''}" data-act="toggle-voice-tts" title="Activar voz de árbitro en vivo">${prefs.voice ? ICONS.vol : ICONS.mute}</button>
        <button class="icon-btn" data-open-stats="live" title="Estadísticas en tiempo real">${ICONS.chart}</button>
        <button class="icon-btn" data-act="fullscreen" title="Pantalla completa">${ICONS.full}</button>
      ` : isDisplayOnly ? `
        <button class="icon-btn" data-nav="board" title="Salir de modo TV">${ICONS.back}</button>
        <div class="sb-clock">
          <span id="sb-clock-val">${esc(fmtClock(m.durationMs))}</span>
          <small><b class="red">● EN VIVO</b> · ${esc(teamLabel(m,0))} vs ${esc(teamLabel(m,1))}</small>
        </div>
        <button class="icon-btn" data-act="fullscreen" title="Pantalla completa">${ICONS.full}</button>
      ` : `
        <button class="icon-btn" data-nav="home" title="Inicio">${ICONS.back}</button>
        <button class="icon-btn" data-act="share-live" title="Compartir partido en vivo por link">${ICONS.live}</button>
        <div class="sb-clock" data-act="toggle-pause" style="cursor:pointer" title="Tocar para pausar/reanudar reloj">
          <span id="sb-clock-val">${esc(fmtClock(m.durationMs))}</span>
          <small>${m.status==='paused' ? '<b class="red">PAUSADO</b>' : `SET ${st.curSetIdx + 1} · SACA ${esc(playerLabel(m, st.srvTeam, st.srvPlayer))} (${st.srvSide === 'D' ? 'DERECHA' : 'REVÉS'})`}</small>
        </div>
        <button class="icon-btn ${prefs.voice?'on':''}" data-act="toggle-voice-tts" title="Voz de árbitro">${prefs.voice ? ICONS.vol : ICONS.mute}</button>
        <button class="icon-btn ${ui.voiceListening?'on':''}" data-act="toggle-voice-rec" title="Control por voz manos libres">${ICONS.mic}</button>
        <button class="icon-btn" data-act="open-menu" title="Opciones">${ICONS.dots}</button>
      `}
    </header>

    <main class="court">
      ${renderHalf(order[0])}
      <div class="mid">${tags.join('')}</div>
      ${renderHalf(order[1])}
    </main>

    ${isDisplayOnly ? '' : `
    <footer class="sb-foot">
      <button data-act="undo" ${(!m.events.length && !m.pendingFault)?'disabled':''} title="Deshacer (Z / Backspace)">${ICONS.undo}<span class="lbl">Deshacer</span></button>
      <button data-act="redo" ${(!m.redoStack || !m.redoStack.length)?'disabled':''} title="Rehacer (Y)">${ICONS.redo}<span class="lbl">Rehacer</span></button>
      <button class="fault-btn ${m.pendingFault?'on':''}" data-act="fault" ${st.matchWinner!==null?'disabled':''} title="Falta de saque / Doble falta (F)">
        ${m.pendingFault ? 'DOBLE FALTA' : 'FALTA SAQUE'}
      </button>
      <button data-act="flip" title="Cambiar lados de cancha (S)">${ICONS.swap}<span class="lbl">Lados</span></button>
      <button data-open-stats="active" title="Ver estadísticas en vivo">${ICONS.chart}<span class="lbl">Stats</span></button>
    </footer>`}

    ${!isDisplayOnly ? renderBoardOverlays(m, st) : (isRemoteLive && st.matchWinner !== null && !ui.matchEndDismissed ? `
    <div class="overlay">
      <div class="big-ic">${ICONS.trophy}</div>
      <p>¡PARTIDO FINALIZADO EN VIVO!</p>
      <h2>${esc(teamLabel(m, st.matchWinner))}</h2>
      <div class="ov-score">
        ${[0,1].map(t => `
          <div class="mrow">
            <span class="bar" style="--c:${esc(m.teams[t].color)}"></span>
            <span class="nm">${esc(teamLabel(m, t))}</span>
            ${st.sets.map(s => `<span class="s ${s.winner===t?'w':''}">${s.games[t]}</span>`).join('')}
          </div>`).join('')}
      </div>
      <div class="btn-row">
        <button class="btn primary big" data-open-stats="live">${ICONS.chart} Ver Estadísticas del Partido</button>
        <button class="btn big" data-act="save-live">Guardar en mi historial</button>
      </div>
    </div>` : '')}
  </div>`;
}

// ==================== STATS & PDF REPORT RENDERER ====================
function getStatsTargetMatch() {
  if (ui.statsId === 'live' && ui.liveMatch) return ui.liveMatch;
  if (ui.statsId === 'shared' && ui.sharedMatch) return ui.sharedMatch;
  if (ui.statsId === 'active' && activeMatch) return activeMatch;
  const found = historyList.find(x => x.id === ui.statsId);
  if (found) return found;
  if (activeMatch && activeMatch.id === ui.statsId) return activeMatch;
  if (ui.liveMatch && ui.liveMatch.id === ui.statsId) return ui.liveMatch;
  return historyList[0] || activeMatch || ui.liveMatch || null;
}

function renderComparisonBar(label, val0, val1, num0, num1, c0, c1) {
  const n0 = Number(num0) || 0;
  const n1 = Number(num1) || 0;
  const sum = n0 + n1;
  const p0 = sum > 0 ? Math.round((n0 * 100) / sum) : (n0 === n1 && n0 > 0 ? 50 : 0);
  const p1 = sum > 0 ? (100 - p0) : 0;
  return `
  <div class="cmp">
    <div class="cmp-l">${esc(label)}</div>
    <div class="cmp-r">
      <b>${esc(val0)}</b>
      <div class="cbar">
        ${sum > 0 ? `
          <i style="width:${p0}%;background:${esc(c0)}"></i>
          <i style="width:${p1}%;background:${esc(c1)}"></i>
        ` : `<i style="width:100%;background:transparent"></i>`}
      </div>
      <b>${esc(val1)}</b>
    </div>
  </div>`;
}

function renderMomentumSVG(momentum, setBoundaries, c0, c1) {
  if (!momentum || momentum.length < 2) {
    return `<div class="muted" style="padding:18px 0;text-align:center">Se mostrará el gráfico cuando haya puntos jugados.</div>`;
  }
  const N = momentum.length - 1;
  const W = 720, H = 180, padX = 12, padY = 18;
  const plotW = W - padX * 2;
  const plotH = H - padY * 2;
  const maxAbs = Math.max(4, ...momentum.map(v => Math.abs(v)));
  const zeroY = padY + plotH / 2;

  const xAt = i => padX + (N > 0 ? (i / N) * plotW : 0);
  const yAt = v => zeroY - (v / maxAbs) * (plotH / 2);

  let dLine = '';
  momentum.forEach((v, i) => {
    const x = xAt(i).toFixed(1), y = yAt(v).toFixed(1);
    dLine += (i === 0 ? `M${x},${y}` : ` L${x},${y}`);
  });
  const dArea = `${dLine} L${xAt(N).toFixed(1)},${zeroY.toFixed(1)} L${xAt(0).toFixed(1)},${zeroY.toFixed(1)} Z`;

  const uid = 'mom_' + Math.random().toString(36).slice(2,7);
  const boundsSvg = setBoundaries.map(bIdx => {
    const bx = xAt(bIdx).toFixed(1);
    return `<line x1="${bx}" y1="${padY}" x2="${bx}" y2="${H-padY}" stroke="currentColor" stroke-opacity=".22" stroke-dasharray="4 4"/>`;
  }).join('');

  return `
  <svg class="mom" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <clipPath id="${uid}_top"><rect x="0" y="0" width="${W}" height="${zeroY}"/></clipPath>
      <clipPath id="${uid}_bot"><rect x="0" y="${zeroY}" width="${W}" height="${H - zeroY}"/></clipPath>
      <linearGradient id="${uid}_g0" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${esc(c0)}" stop-opacity=".55"/>
        <stop offset="100%" stop-color="${esc(c0)}" stop-opacity=".04"/>
      </linearGradient>
      <linearGradient id="${uid}_g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${esc(c1)}" stop-opacity=".04"/>
        <stop offset="100%" stop-color="${esc(c1)}" stop-opacity=".55"/>
      </linearGradient>
    </defs>
    <line x1="${padX}" y1="${padY}" x2="${W-padX}" y2="${padY}" stroke="currentColor" stroke-opacity=".08"/>
    <line x1="${padX}" y1="${zeroY}" x2="${W-padX}" y2="${zeroY}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 3"/>
    <line x1="${padX}" y1="${H-padY}" x2="${W-padX}" y2="${H-padY}" stroke="currentColor" stroke-opacity=".08"/>
    ${boundsSvg}
    <path d="${dArea}" fill="url(#${uid}_g0)" clip-path="url(#${uid}_top)"/>
    <path d="${dArea}" fill="url(#${uid}_g1)" clip-path="url(#${uid}_bot)"/>
    <path d="${dLine}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function renderStats() {
  const m = getStatsTargetMatch();
  if (!m) {
    return `<div class="page"><div class="empty">Partido no encontrado.<br><br><button class="btn" data-nav="home">Volver</button></div></div>`;
  }
  const f = ui.statsSetFilter || 'all';
  const S = computeStats(m, f);
  const st = S.st;
  const T = S.T;
  const c0 = m.teams[0].color, c1 = m.teams[1].color;
  const isRemoteLiveStats = (ui.statsId === 'live' && ui.liveMatch);
  const isLive = (activeMatch && activeMatch.id === m.id && activeMatch.status === 'playing') || (isRemoteLiveStats && m.status === 'playing');
  const backRoute = isRemoteLiveStats ? 'live' : (activeMatch && activeMatch.id === m.id && activeMatch.status === 'playing' ? 'board' : 'history');
  const isStarRule = m.rules.deuceRule === 'star';
  const gpLabel = isStarRule ? 'Star Points ganados' : 'Puntos de oro ganados';
  const gpSrvLabel = isStarRule ? 'Star Points ganados al saque' : 'Puntos de oro ganados al saque';
  const gpRetLabel = isStarRule ? 'Star Points ganados al resto' : 'Puntos de oro ganados al resto';

  const eloInfo = calculateMatchEloPreview(m);
  let eloCardHtml = '';
  if (eloInfo && st.matchWinner !== null) {
    const p0 = eloInfo.pair0;
    const p1 = eloInfo.pair1;
    eloCardHtml = `
    <div class="sec-t">Ranking ELO & Niveles</div>
    <div class="card elo-match-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div style="display:flex;align-items:center;gap:8px">
          ${ICONS.trophy}
          <h3 style="margin:0">Impacto en Ranking ELO</h3>
        </div>
        ${eloInfo.isBlowout ? `<span class="tag-gold" style="font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(212,175,55,0.15);color:var(--gold);border:1px solid rgba(212,175,55,0.35);font-weight:700">💥 Bonus x1.2 (+6 juegos de ventaja)</span>` : ''}
      </div>

      <div class="elo-teams-grid">
        <!-- Team 0 -->
        <div class="elo-team-col ${st.matchWinner===0?'winner-col':''}">
          <div class="elo-team-hdr">
            <span class="bar" style="--c:${esc(m.teams[0].color)}"></span>
            <b>${esc(teamLabel(m, 0))}</b>
            ${st.matchWinner===0?'<span class="tro">🏆</span>':''}
          </div>
          <div class="elo-team-meta">
            <span>Promedio previo: <b>${p0.avgBefore} pts</b></span>
            <span>Probabilidad esperada: <b>${p0.expPct}%</b></span>
          </div>
          <div class="elo-players-list">
            ${p0.players.map(pl => {
              const lvl = getEloLevel(pl.eloAfter);
              const sign = pl.delta >= 0 ? '+' : '';
              return `
              <div class="elo-player-row">
                <span class="p-name">${esc(pl.name)}</span>
                <span class="p-delta ${pl.delta>=0?'up':'down'}">${sign}${pl.delta} pts</span>
                <span class="p-after"><b>${pl.eloAfter} pts</b> (${lvl.icon} ${lvl.level})</span>
              </div>`;
            }).join('')}
          </div>
        </div>

        <!-- Team 1 -->
        <div class="elo-team-col ${st.matchWinner===1?'winner-col':''}">
          <div class="elo-team-hdr">
            <span class="bar" style="--c:${esc(m.teams[1].color)}"></span>
            <b>${esc(teamLabel(m, 1))}</b>
            ${st.matchWinner===1?'<span class="tro">🏆</span>':''}
          </div>
          <div class="elo-team-meta">
            <span>Promedio previo: <b>${p1.avgBefore} pts</b></span>
            <span>Probabilidad esperada: <b>${p1.expPct}%</b></span>
          </div>
          <div class="elo-players-list">
            ${p1.players.map(pl => {
              const lvl = getEloLevel(pl.eloAfter);
              const sign = pl.delta >= 0 ? '+' : '';
              return `
              <div class="elo-player-row">
                <span class="p-name">${esc(pl.name)}</span>
                <span class="p-delta ${pl.delta>=0?'up':'down'}">${sign}${pl.delta} pts</span>
                <span class="p-after"><b>${pl.eloAfter} pts</b> (${lvl.icon} ${lvl.level})</span>

          </div>

      </div>
    </div>`;
  }

  const playedSets = st.sets.filter((s, idx) => s.games[0] > 0 || s.games[1] > 0 || idx === 0);

  // Evolution chips per set
  const evoHtml = playedSets.map((s, sIdx) => {
    const chips = s.history.map(g => {
      const col = m.teams[g.winner].color;
      const fg = fgFor(col);
      const cls = g.isTB ? 'gch tb' : g.isBreak ? 'gch b' : 'gch';

      return `<span class="${cls}" style="--c:${esc(col)};--f:${fg}" title="Set ${sIdx+1} · ${g.gamesAfter[0]}-${g.gamesAfter[1]} (saca ${esc(playerLabel(m,g.srvTeam,g.srvPlayer))})">${txt}</span>`;

  }).join('');

  return `
  <div class="page stats">
    <div class="print-only print-title">DETALLES DEL PARTIDO · PÁDEL CONTROL SÉ · BY SAIRAF ENGEL</div>

      <div style="display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap">
        ${isLive ? `<button class="btn primary sm" data-nav="${isRemoteLiveStats ? 'live' : 'board'}">${ICONS.play} Volver</button>` : ''}

      </div>

    <!-- Header Score Card -->
    <div class="card st-head">
      ${[0,1].map(t => `
        <div class="tr ${st.matchWinner===t?'win':''}">
          <span class="bar" style="--c:${esc(m.teams[t].color)}"></span>
          <span class="nm">${esc(teamLabel(m, t))}</span>
          ${st.matchWinner===t ? `<span class="tro">${ICONS.trophy}</span>` : ''}

              const cls = s.winner === t ? 'sbox w' : (s.winner === null && isLive ? 'sbox cur' : 'sbox');

    <div class="grid2">
      <div class="card">
        <h3>Parejas <span class="tag-s">${S.totalPts} PUNTOS</span></h3>
        ${renderComparisonBar('Puntos ganados', T[0].ptsWon, T[1].ptsWon, T[0].ptsWon, T[1].ptsWon, c0, c1)}
        ${renderComparisonBar('Golpes ganadores', T[0].winners, T[1].winners, T[0].winners, T[1].winners, c0, c1)}

      </div>

      <div class="card">
        <h3>Momentos</h3>
        ${renderComparisonBar('Puntos de break ganados', `${T[0].bpWon}/${T[0].bpTotal}`, `${T[1].bpWon}/${T[1].bpTotal}`, T[0].bpWon, T[1].bpWon, c0, c1)}
        ${renderComparisonBar(gpLabel, `${T[0].gpWon}/${T[0].gpTotal}`, `${T[1].gpWon}/${T[1].gpTotal}`, T[0].gpWon, T[1].gpWon, c0, c1)}
        ${renderComparisonBar('Puntos seguidos (máximo)', T[0].maxPtStreak, T[1].maxPtStreak, T[0].maxPtStreak, T[1].maxPtStreak, c0, c1)}
        ${renderComparisonBar('Juegos ganados', T[0].gamesWon, T[1].gamesWon, T[0].gamesWon, T[1].gamesWon, c0, c1)}
        ${renderComparisonBar('Primeros saques dentro', pct(T[0].firstServeIn,T[0].srvPtsTotal)+'%', pct(T[1].firstServeIn,T[1].srvPtsTotal)+'%', pct(T[0].firstServeIn,T[0].srvPtsTotal), pct(T[1].firstServeIn,T[1].srvPtsTotal), c0, c1)}
        ${renderComparisonBar('Dobles faltas', T[0].doubleFaults, T[1].doubleFaults, T[0].doubleFaults, T[1].doubleFaults, c0, c1)}
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3>Saque y resto</h3>
        ${renderComparisonBar('Puntos ganados al resto', pct(T[0].retPtsWon,T[0].retPtsTotal)+'%', pct(T[1].retPtsWon,T[1].retPtsTotal)+'%', pct(T[0].retPtsWon,T[0].retPtsTotal), pct(T[1].retPtsWon,T[1].retPtsTotal), c0, c1)}
        ${renderComparisonBar('Juegos de saque ganados', `${T[0].srvGamesWon}/${T[0].srvGamesTotal}`, `${T[1].srvGamesWon}/${T[1].srvGamesTotal}`, T[0].srvGamesWon, T[1].srvGamesWon, c0, c1)}
        ${renderComparisonBar('Bolas de break salvadas', `${T[0].bpSaved}/${T[0].bpFaced}`, `${T[1].bpSaved}/${T[1].bpFaced}`, T[0].bpSaved, T[1].bpSaved, c0, c1)}
      </div>

      <div class="card">
        <h3>Bajo presión</h3>
        ${renderComparisonBar('Puntos clave ganados', `${T[0].keyWon}/${T[0].keyTotal}`, `${T[1].keyWon}/${T[1].keyTotal}`, T[0].keyWon, T[1].keyWon, c0, c1)}
        ${renderComparisonBar(gpSrvLabel, `${T[0].gpSrvWon}/${T[0].gpSrvTotal}`, `${T[1].gpSrvWon}/${T[1].gpSrvTotal}`, T[0].gpSrvWon, T[1].gpSrvWon, c0, c1)}
        ${renderComparisonBar(gpRetLabel, `${T[0].gpRetWon}/${T[0].gpRetTotal}`, `${T[1].gpRetWon}/${T[1].gpRetTotal}`, T[0].gpRetWon, T[1].gpRetWon, c0, c1)}
        ${renderComparisonBar('Juegos seguidos (máximo)', T[0].maxGameStreak, T[1].maxGameStreak, T[0].maxGameStreak, T[1].maxGameStreak, c0, c1)}
      </div>
    </div>
    <p class="note">Puntos clave: bolas de break y puntos desde el 30-30.</p>

    <div class="sec-t">Jugadores</div>
    <div class="card">
      <div class="tbl-wrap">
        <table class="pt">
          <thead>
            <tr>
              <th></th>
              <th>Golpes<br>ganadores</th>
              <th>Errores no<br>forzados</th>
              <th>Errores<br>forzados</th>
              <th>Primeros<br>saques<br>dentro</th>
              <th>Puntos<br>ganados al<br>saque</th>
              <th>Juegos de<br>saque<br>ganados</th>
              <th>Dobles<br>faltas</th>
            </tr>
          </thead>
          <tbody>
            ${S.P.map(pl => `
              <tr>
                <td style="--c:${esc(pl.color)}">${esc(pl.name)}</td>
                <td>${pl.winners}</td>
                <td>${pl.ue}</td>
                <td>${pl.fe}</td>
                <td>${pct(pl.firstServeIn, pl.srvPtsTotal)}%</td>
                <td>${pct(pl.srvPtsWon, pl.srvPtsTotal)}%</td>
                <td>${pl.srvGamesWon}/${pl.srvGamesTotal}</td>
                <td>${pl.doubleFaults}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="sec-t">Desglose de Golpes Ganadores (Winners)</div>
    <div class="card">
      <h3>Tipos de Golpe por Pareja</h3>
      ${renderComparisonBar('💥 Smash / Remate', T[0].shots.smash, T[1].shots.smash, T[0].shots.smash, T[1].shots.smash, c0, c1)}
      ${renderComparisonBar('🎾 Volea ganadora', T[0].shots.volea, T[1].shots.volea, T[0].shots.volea, T[1].shots.volea, c0, c1)}
      ${renderComparisonBar('🌀 Bandeja / Víbora', T[0].shots.bandeja, T[1].shots.bandeja, T[0].shots.bandeja, T[1].shots.bandeja, c0, c1)}
      ${renderComparisonBar('⚡ Bajada de pared', T[0].shots.bajada, T[1].shots.bajada, T[0].shots.bajada, T[1].shots.bajada, c0, c1)}
      ${renderComparisonBar('🎯 Dejada / Chiquita', T[0].shots.dejada, T[1].shots.dejada, T[0].shots.dejada, T[1].shots.dejada, c0, c1)}
      ${renderComparisonBar('🏹 Passing shot', T[0].shots.passing, T[1].shots.passing, T[0].shots.passing, T[1].shots.passing, c0, c1)}
      ${(T[0].shots.globo > 0 || T[1].shots.globo > 0) ? renderComparisonBar('🎈 Globo ganador', T[0].shots.globo, T[1].shots.globo, T[0].shots.globo, T[1].shots.globo, c0, c1) : ''}
      ${(T[0].shots.otro > 0 || T[1].shots.otro > 0) ? renderComparisonBar('Otros winners directos', T[0].shots.otro, T[1].shots.otro, T[0].shots.otro, T[1].shots.otro, c0, c1) : ''}

      <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
        <div style="font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--tx2);margin-bottom:8px">Winners registrados por Jugador</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px">
          ${S.P.map(pl => {
            const shotList = Object.entries(pl.shots || {})
              .filter(([k,v]) => v > 0)
              .map(([k,v]) => {
                const icon = { smash:'💥', volea:'🎾', bandeja:'🌀', bajada:'⚡', dejada:'🎯', passing:'🏹', globo:'🎈', otro:'✨' }[k] || '';
                const name = { smash:'Smash', volea:'Volea', bandeja:'Bandeja', bajada:'Bajada', dejada:'Dejada', passing:'Passing', globo:'Globo', otro:'Directo' }[k] || k;
                return `<span class="tag-s" style="margin:2px;display:inline-flex;align-items:center;gap:3px;font-size:11px">${icon} ${v} ${name}</span>`;
              });
            return `
              <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-left:3px solid ${esc(pl.color)};border-radius:8px;padding:8px 10px">
                <div style="font-weight:700;font-size:13px;color:var(--text);margin-bottom:4px">${esc(pl.name)} <span style="font-weight:400;color:var(--muted);font-size:12px">(${pl.winners} winners)</span></div>
                <div style="display:flex;flex-wrap:wrap">${shotList.length ? shotList.join('') : '<span class="muted" style="font-size:11px">Sin detalle de golpe</span>'}</div>
              </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="sec-t">Evolución</div>
    <div class="card">
      ${evoHtml}
      <div class="mom-leg" style="margin-top:14px">
        <span style="color:${esc(c0)}"><i style="--c:${esc(c0)}"></i>${esc(teamLabel(m,0))}</span>
        <span style="color:${esc(c1)}"><i style="--c:${esc(c1)}"></i>${esc(teamLabel(m,1))}</span>
      </div>
      ${renderMomentumSVG(S.momentum, S.setBoundaries, c0, c1)}
      <p class="note">La línea sube cuando ${esc(teamLabel(m,0))} ganan un punto y baja cuando lo ganan ${esc(teamLabel(m,1))}. B = break.</p>
    </div>

    <div class="sec-t">Punto a Punto</div>
    <div class="card">
      ${pbpHtml}
    </div>

    <div class="btn-row no-print" style="margin-top:18px">
      <button class="btn primary" data-act="print-pdf">${ICONS.pdf} Exportar PDF / Imprimir</button>
      <button class="btn" data-act="export-png">${ICONS.img} Descargar Imagen</button>
      <button class="btn" data-act="share-link">${ICONS.share} Compartir Enlace</button>
      ${ui.statsId === 'shared' ? `<button class="btn primary" data-act="save-shared">Guardar en mi historial</button>` : ''}
      ${isRemoteLiveStats ? `<button class="btn primary" data-act="save-live">Guardar en mi historial</button>` : ''}
      ${!isLive && ui.statsId !== 'shared' && !isRemoteLiveStats ? `<button class="btn danger" data-del-match="${esc(m.id)}">${ICONS.trash} Eliminar partido</button>` : ''}
    </div>
    ${renderSignatureFooter()}
  </div>
  ${renderTabbar('history')}`;
}

// ==================== HISTORY, PLAYERS & SETTINGS VIEWS ====================
function renderHistory() {
  const q = (ui.histQuery || '').toLowerCase().trim();
  const list = historyList.filter(m => {
    if (!q) return true;
    const names = m.teams.flatMap(t => t.players).join(' ').toLowerCase();
    return names.includes(q) || fmtDateLong(m.createdAt).toLowerCase().includes(q);
  });

  return `
  <div class="page">
    <div class="page-h">
      <h1>Historial (${historyList.length})</h1>
      <button class="btn sm" data-act="export-json" title="Exportar copia de seguridad">${ICONS.dl} Backup</button>
      <label class="btn sm" style="cursor:pointer" title="Importar partidos desde archivo JSON">
        ${ICONS.up} Importar
        <input type="file" accept=".json,application/json" style="display:none" id="imp-json-file">
      </label>
    </div>

    <div class="field">
      <input class="inp" placeholder="Buscar por jugador o fecha..." value="${esc(ui.histQuery)}" id="hist-search-inp">
    </div>

    ${list.length
      ? list.map(renderMatchCard).join('')
      : `<div class="empty">${ICONS.hist}<br>No se encontraron partidos.</div>`}
    ${renderSignatureFooter()}
  </div>
  ${renderTabbar('history')}`;
}

function renderPlayers() {
  const eloState = computeEloRatings(historyList);
  const currentSort = ui.playerSort || 'elo';

  // Aggregate career stats per player name across all matches in history
  const map = new Map();
  historyList.forEach(m => {
    const S = computeStats(m, 'all');
    const w = S.st.matchWinner;
    S.P.forEach(p => {
      const key = p.name.trim().toUpperCase();
      if (!key) return;
      if (!map.has(key)) {
        const elo = eloState.playerRatings[key] ?? BASE_ELO;
        const lastDelta = eloState.playerLastDelta[key] ?? 0;
        const finishedMatches = eloState.playerMatchCount[key] ?? 0;
        map.set(key, {
          name: p.name.trim(),
          key,
          color: p.color,
          elo,
          lastDelta,
          finishedMatches,
          matches: 0,
          wins: 0,
          winners: 0,
          ue: 0,
          fe: 0,
          shots: { smash: 0, volea: 0, bandeja: 0, bajada: 0, dejada: 0, passing: 0, globo: 0 },
          srvPtsWon: 0,
          srvPtsTotal: 0,
          firstServeIn: 0,
          doubleFaults: 0
        });
      }
      const rec = map.get(key);
      rec.matches++;
      if (w === p.team) rec.wins++;
      rec.winners += p.winners;
      rec.ue += p.ue;
      rec.fe += p.fe;
      rec.shots = rec.shots || { smash: 0, volea: 0, bandeja: 0, bajada: 0, dejada: 0, passing: 0, globo: 0 };
      if (p.shots) {
        Object.entries(p.shots).forEach(([k, v]) => {
          rec.shots[k] = (rec.shots[k] || 0) + v;
        });
      }
      rec.srvPtsWon += p.srvPtsWon;
      rec.srvPtsTotal += p.srvPtsTotal;
      rec.firstServeIn += p.firstServeIn;
      rec.doubleFaults += p.doubleFaults;
    });
  });

  let players = Array.from(map.values());
  if (currentSort === 'elo') {
    players.sort((a, b) => (b.elo - a.elo) || (b.wins - a.wins) || (b.matches - a.matches));
  } else if (currentSort === 'wins') {
    players.sort((a, b) => (b.wins - a.wins) || (b.elo - a.elo) || (b.matches - a.matches));
  } else if (currentSort === 'matches') {
    players.sort((a, b) => (b.matches - a.matches) || (b.elo - a.elo) || (b.wins - a.wins));
  }

  return `
  <div class="page">
    <div class="page-h">
      <h1 style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Jugadores y Ranking</h1>
      <div style="display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap">
        <button class="btn primary sm" data-act="share-ranking" title="Compartir Ranking por WhatsApp o enlace">${ICONS.share} Compartir</button>
        <button class="btn sm" data-act="export-ranking-img" title="Descargar imagen oficial del Ranking">${ICONS.img} Imagen</button>
      </div>
    </div>
    <p class="muted" style="margin-bottom:14px">Ranking oficial ELO, nivel Playtomic (1.00 a 7.00) y estadísticas acumuladas de todos los partidos guardados.</p>

    <!-- Sort segmented controls -->
    <div class="seg" style="margin-bottom:16px">
      <button class="${currentSort==='elo'?'on':''}" data-set-psort="elo">⭐ Ranking ELO</button>
      <button class="${currentSort==='wins'?'on':''}" data-set-psort="wins">🏆 Más Victorias</button>
      <button class="${currentSort==='matches'?'on':''}" data-set-psort="matches">🎾 Más Partidos</button>
    </div>

    ${players.length ? players.map((p, idx) => {
      const winPct = pct(p.wins, p.matches);
      const initials = p.name.split(/\s+/).map(x => x[0]).join('').slice(0,2).toUpperCase();
      const lvl = getEloLevel(p.elo);
      const isCalib = p.finishedMatches < CALIBRATION_MATCHES_THRESHOLD;
      const rankBadge = idx === 0
        ? `<div class="rank-pos rank-gold" title="1º del Ranking">🥇 1º</div>`
        : idx === 1
          ? `<div class="rank-pos rank-silver" title="2º del Ranking">🥈 2º</div>`
          : idx === 2
            ? `<div class="rank-pos rank-bronze" title="3º del Ranking">🥉 3º</div>`
            : `<div class="rank-pos" title="${idx+1}º del Ranking">#${idx+1}</div>`;

      const trendHtml = p.lastDelta > 0
        ? `<div class="elo-trend up">▲ +${p.lastDelta} pts</div>`
        : p.lastDelta < 0
          ? `<div class="elo-trend down">▼ ${p.lastDelta} pts</div>`
          : `<div class="elo-trend neu">Sin cambios</div>`;

      const shotBadges = [];
      if (p.shots) {
        if (p.shots.smash) shotBadges.push(`💥 ${p.shots.smash} Smash`);
        if (p.shots.volea) shotBadges.push(`🎾 ${p.shots.volea} Volea`);
        if (p.shots.bandeja) shotBadges.push(`🌀 ${p.shots.bandeja} Bandeja`);
        if (p.shots.bajada) shotBadges.push(`⚡ ${p.shots.bajada} Bajada`);
        if (p.shots.dejada) shotBadges.push(`🎯 ${p.shots.dejada} Dejada`);
        if (p.shots.passing) shotBadges.push(`🏹 ${p.shots.passing} Passing`);
      }

      return `
      <div class="pcard">
        ${rankBadge}
        <div class="avatar" style="--c:${esc(p.color)};--f:${fgFor(p.color)}">${esc(initials)}</div>
        <div class="info">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <b>${esc(p.name)}</b>
            <span class="tier-pill" style="--tcol:${lvl.color}">${lvl.icon} Nivel ${lvl.level} · ${lvl.tier}</span>
            ${isCalib
              ? `<span class="calib-pill calib" title="Factor K=50 para calibración rápida">Calibrando (${p.finishedMatches}/10 · K=50)</span>`
              : `<span class="calib-pill fixed" title="Factor K=32 consolidado">Consolidado (K=32)</span>`}
          </div>
          <small>${p.matches} ${p.matches===1?'partido':'partidos'} · ${p.wins} ${p.wins===1?'victoria':'victorias'} (${winPct}% efectividad)</small>
          <div class="pstats">
            <span>Winners: <b>${p.winners}</b></span>
            <span>ENF: <b>${p.ue}</b></span>
            <span>1º Saque: <b>${pct(p.firstServeIn, p.srvPtsTotal)}%</b></span>
            <span>Gan. al saque: <b>${pct(p.srvPtsWon, p.srvPtsTotal)}%</b></span>
          </div>
          ${shotBadges.length ? `
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">
            ${shotBadges.map(b => `<span class="tag-s" style="font-size:10px">${esc(b)}</span>`).join('')}
          </div>` : ''}
        </div>
        <div class="pct" style="min-width:85px">
          <span style="font-family:var(--cond);font-size:30px;font-weight:900;color:var(--gold);display:block;line-height:1">${p.elo}</span>
          <small>Puntos ELO</small>
          ${trendHtml}
        </div>
      </div>`;
    }).join('') : `<div class="empty">${ICONS.users}<br>Todavía no hay jugadores registrados.<br>Iniciá un partido para calcular el Ranking ELO.</div>`}

    ${players.length ? `
    <div class="btn-row" style="margin-top:14px;margin-bottom:14px">
      <button class="btn primary big" data-act="share-ranking">${ICONS.share} Compartir Tabla de Ranking</button>
      <button class="btn big" data-act="export-ranking-img">${ICONS.img} Descargar Imagen en HD</button>
    </div>` : ''}

    <!-- Expandable ELO explanation guide -->
    <details class="elo-guide-card">
      <summary>
        <span>ℹ️ ¿Cómo funciona el Sistema de Ranking ELO y Niveles?</span>
        <span style="font-size:12px;opacity:0.8">Tocar para ver</span>
      </summary>
      <div class="elo-guide-content">
        <div class="guide-item">
          <b>🎯 Base de 1000 puntos</b>
          <p>Todos los jugadores nuevos inician con 1000 pts base (equivalente a Nivel Playtomic 2.50).</p>
        </div>
        <div class="guide-item">
          <b>👥 Promedio de pareja</b>
          <p>Antes de cada partido se calcula el promedio ELO de la pareja para estimar la probabilidad matemática de victoria.</p>
        </div>
        <div class="guide-item">
          <b>📈 Calibración rápida (Factor K dinámico)</b>

// ==================== MASTER RENDER & EVENT DELEGATION ====================
function render() {
  applyTheme();
  const root = document.getElementById('app');
  if (!root) return;

  if (ui.route === 'obs') {
    document.documentElement.classList.add('obs-mode');
    document.body.classList.add('obs-mode');
  } else {
    document.documentElement.classList.remove('obs-mode');
    document.body.classList.remove('obs-mode');
  }

  let html = '';
  switch (ui.route) {
    case 'new': html = renderNewMatch(); break;
    case 'board': html = renderBoard(false); break;
    case 'display': html = renderBoard(true); break;
    case 'obs': html = renderOBSOverlay(); break;
    case 'live': html = renderBoard(true); break;
    case 'stats': html = renderStats(); break;
    case 'history': html = renderHistory(); break;
    case 'players': html = renderPlayers(); break;
    case 'settings': html = renderSettings(); break;
    default: html = renderHome(); break;
  }
  if (ui.qrModalOpen) {
    html += renderQRModal();
  }
  if (ui.obsModalOpen) {
    html += renderOBSModal();
  }
  root.innerHTML = html;
  afterRenderQR();
}

// Click delegation
document.addEventListener('click', (ev) => {
  const t = ev.target;

  // Navigation
  const navEl = t.closest('[data-nav]');
  if (navEl) {
    ev.preventDefault();
    navigate(navEl.getAttribute('data-nav'));
    return;
  }

  // Open match stats
  const stEl = t.closest('[data-open-stats]');
  if (stEl) {
    ev.preventDefault();
    ui.statsId = stEl.getAttribute('data-open-stats');
    ui.statsSetFilter = 'all';
    ui.matchEndDismissed = true;
    navigate('stats');
    return;
  }

  // Stats set filter
  const sfEl = t.closest('[data-st-filter]');
  if (sfEl) {
    ui.statsSetFilter = sfEl.getAttribute('data-st-filter');
    render();
    return;
  }

  // Player ranking sort (elo, wins, matches)
  const psEl = t.closest('[data-set-psort]');
  if (psEl) {
    ui.playerSort = psEl.getAttribute('data-set-psort');
    render();
    return;
  }

  // Stepper (- / +) buttons for sets, games, tie-break points
  const stepEl = t.closest('[data-step]');
  if (stepEl) {
    const [k, deltaStr] = stepEl.getAttribute('data-step').split(':');
    const delta = Number(deltaStr) || 0;
    if (k === 'totalSets') {
      const cur = Math.max(1, Number(preset.totalSets) || (preset.setsToWin ? preset.setsToWin * 2 - 1 : 3));
      const next = Math.max(1, Math.min(15, cur + delta));
      preset.totalSets = next;
      preset.setsToWin = Math.floor(next / 2) + 1;
    } else if (k === 'gamesPerSet') {
      const cur = Math.max(1, Number(preset.gamesPerSet) || 6);
      const next = Math.max(1, Math.min(21, cur + delta));
      preset.gamesPerSet = next;
      if (preset.tiebreakAt > 0) preset.tiebreakAt = next;
    } else if (k === 'tiebreakPoints') {
      const cur = Math.max(1, Number(preset.tiebreakPoints) || 7);
      const next = Math.max(1, Math.min(30, cur + delta));
      preset.tiebreakPoints = next;
      if (preset.tiebreakAt === 0) preset.tiebreakAt = preset.gamesPerSet || 6;
    }
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  // Preset pill / segmented buttons
  const prEl = t.closest('[data-preset]');
  if (prEl) {
    const [k, v] = prEl.getAttribute('data-preset').split(':');
    if (k === 'setsToWin') {
      preset.setsToWin = Number(v);
      preset.totalSets = preset.setsToWin * 2 - 1;
    } else if (k === 'gamesPerSet') {
      preset.gamesPerSet = Number(v);
      if (preset.tiebreakAt > 0) preset.tiebreakAt = Number(v);
    } else if (k === 'deuceRule') preset.deuceRule = v;
    else if (k === 'tb') {
      const nv = Number(v);
      if (nv === 0) preset.tiebreakAt = 0;
      else { preset.tiebreakAt = preset.gamesPerSet || 6; preset.tiebreakPoints = nv; }
    } else if (k === 'finalSet') preset.finalSet = v;
    else if (k === 'changeoverRule') preset.changeoverRule = v;
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  // Team color picker
  const tcEl = t.closest('[data-tcolor]');
  if (tcEl) {
    const [tm, col] = tcEl.getAttribute('data-tcolor').split(',');
    preset.teams[Number(tm)].color = col;
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  // First server picker
  const srvEl = t.closest('[data-set-srv]');
  if (srvEl) {
    const [tm, pi] = srvEl.getAttribute('data-set-srv').split(',').map(Number);
    preset.firstServer = [tm, pi];
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  // Scoreboard court half tap
  const halfEl = t.closest('.half[data-team]');
  if (halfEl && !halfEl.hasAttribute('data-ro')) {
    const team = Number(halfEl.getAttribute('data-team'));
    onTapTeam(team);
    return;
  }

  // Shot sheet selection
  const shotEl = t.closest('[data-shot]');
  if (shotEl && ui.shotSheet) {
    const [sType, bTeam, bPlayer, subType] = shotEl.getAttribute('data-shot').split(',');
    const w = ui.shotSheet.team;
    const by = Number(bPlayer) >= 0 ? [Number(bTeam), Number(bPlayer)] : null;
    scorePoint(w, sType, by, subType || null);
    return;
  }

  // Pick second server in doubles
  const p2El = t.closest('[data-pick-2ndsrv]');
  if (p2El && activeMatch) {
    activeMatch.secondServerIdx = Number(p2El.getAttribute('data-pick-2ndsrv'));
    ui.secondSrvPrompt = false;
    persistActive();
    render();
    return;
  }

  // Edit team color inside active match modal
  const etcEl = t.closest('[data-edit-tcolor]');
  if (etcEl && activeMatch) {
    const [tm, col] = etcEl.getAttribute('data-edit-tcolor').split(',');
    for (let i = 0; i < 2; i++) {
      const p0 = document.getElementById(`ed-p-${i}-0`)?.value.trim();
      const p1 = document.getElementById(`ed-p-${i}-1`)?.value.trim();
      if (p0) activeMatch.teams[i].players[0] = p0;
      if (p1) activeMatch.teams[i].players[1] = p1;
    }
    activeMatch.teams[Number(tm)].color = col;
    persistActive();
    render();
    return;
  }

  // Close modals (buttons or clicking the dark backdrop outside .sheet)
  const closeObsEl = t.closest('[data-close-obs-modal]');
  if (closeObsEl && (closeObsEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.obsModalOpen = false; render(); return;
  }
  const posBtn = t.closest('[data-set-obs-pos]');
  if (posBtn) {
    ui.obsSelectedPos = posBtn.getAttribute('data-set-obs-pos');
    render();
    return;
  }
  const copyInpBtn = t.closest('[data-copy-input]');
  if (copyInpBtn) {
    const inputId = copyInpBtn.getAttribute('data-copy-input');
    const inputEl = document.getElementById(inputId);
    if (inputEl) {
      inputEl.select?.();
      const val = inputEl.value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).then(() => {
          showToast('Enlace copiado al portapapeles');
        }).catch(() => {
          try { document.execCommand('copy'); showToast('Enlace copiado'); } catch {}
        });
      } else {
        try { document.execCommand('copy'); showToast('Enlace copiado'); } catch {}
      }
    }
    return;
  }
  const closeQrEl = t.closest('[data-close-qr]');
  if (closeQrEl && (closeQrEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.qrModalOpen = false; render(); return;
  }
  const closeSheetEl = t.closest('[data-close-sheet]');
  if (closeSheetEl && (closeSheetEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.shotSheet = null; render(); return;
  }
  const closeMenuEl = t.closest('[data-close-menu]');
  if (closeMenuEl && (closeMenuEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.menuOpen = false; render(); return;
  }
  const closeEditEl = t.closest('[data-close-edit]');
  if (closeEditEl && (closeEditEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.editNamesOpen = false; render(); return;
  }

  // Preferences
  const pfEl = t.closest('[data-pref]');
  if (pfEl) {
    const [k, v] = pfEl.getAttribute('data-pref').split(':');
    prefs[k] = v;
    saveJSON(LS_PREFS, prefs);
    render();
    return;
  }

  // Delete match from history
  const delEl = t.closest('[data-del-match]');
  if (delEl) {
    const id = delEl.getAttribute('data-del-match');
    if (confirm('¿Eliminar este partido del historial?')) {
      historyList = historyList.filter(x => x.id !== id);
      saveJSON(LS_HIST, historyList);
      navigate('history');
      showToast('Partido eliminado');
    }
    return;
  }

  // Named actions
  const actEl = t.closest('[data-act]');
  if (actEl) {
    const act = actEl.getAttribute('data-act');
    switch (act) {
      case 'start-match': startNewMatch(); break;
      case 'resume-match': navigate('board'); break;
      case 'swap-preset-teams':
        preset.teams.reverse();
        preset.firstServer[0] = 1 - preset.firstServer[0];
        saveJSON(LS_PRESET, preset);
        render();
        break;
      case 'undo': undoPoint(); break;
      case 'undo-from-end': ui.matchEndDismissed = false; undoPoint(); break;
      case 'redo': redoPoint(); break;
      case 'fault': recordFault(); break;
      case 'flip': flipSides(); break;
      case 'toggle-shot-prompt':
        if (activeMatch) {
          activeMatch.shotPrompt = !activeMatch.shotPrompt;
          persistActive();
          showToast(activeMatch.shotPrompt ? 'Detalle de golpe activado' : 'Anotación rápida activada');
          render();
        }
        break;
      case 'toggle-pause':
        if (activeMatch) {
          activeMatch.status = activeMatch.status === 'paused' ? 'playing' : 'paused';
          persistActive();
          render();
        }
        break;
      case 'toggle-voice-tts':
        prefs.voice = !prefs.voice;
        saveJSON(LS_PREFS, prefs);
        showToast(prefs.voice ? 'Voz de árbitro activada' : 'Voz de árbitro silenciada');
        render();
        break;
      case 'toggle-voice-rec':
        toggleVoiceControl();
        break;
      case 'open-menu': ui.menuOpen = true; render(); break;
      case 'dismiss-co': ui.changeoverOverlay = null; render(); break;
      case 'open-qr-modal':
        ui.menuOpen = false;
        ui.qrModalOpen = true;
        render();
        break;
      case 'close-qr-modal':
        ui.qrModalOpen = false;
        render();
        break;
      case 'share-app-wa':
        shareAppViaWhatsApp();
        break;
      case 'copy-app-link':
        copyAppUrl();
        break;
      case 'dl-app-qr':
        downloadAppQR();
        break;
      case 'share-live':
        ui.menuOpen = false;
        if (activeMatch) shareLiveMatchLink(activeMatch);
        break;
      case 'exit-live':
        disconnectLiveSpectator();
        navigate('home');
        break;
      case 'save-live':
        if (ui.liveMatch) {
          archiveMatchToHistory(ui.liveMatch);
          showToast('Partido en vivo guardado en tu historial');
          render();
        }
        break;
      case 'open-obs-modal':
        ui.menuOpen = false;
        ui.obsModalOpen = true;
        render();
        break;
      case 'close-obs-modal':
        ui.obsModalOpen = false;
        render();
        break;
      case 'open-tv': {
        ui.menuOpen = false;
        const tvUrl = `${location.href.split('#')[0]}#display`;
        const w = window.open(tvUrl, '_blank');
        if (!w) {
          ui.route = 'display';
          showToast('Modo TV activado (tocá ← arriba a la izquierda para volver)');
        }
        render();
        break;
      }
      case 'fullscreen':
        ui.menuOpen = false;
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(()=>{});
        } else {
          document.exitFullscreen?.().catch(()=>{});
        }
        render();
        break;
      case 'rotate-server':
        if (activeMatch) {
          const rot = [
            [0, 0],
            [1, 0],
            [0, 1],
            [1, 1]
          ];
          const curIdx = rot.findIndex(r => r[0] === activeMatch.firstServer[0] && r[1] === activeMatch.firstServer[1]);
          const next = rot[(curIdx + 1) % 4];
          activeMatch.firstServer = [next[0], next[1]];
          if (activeMatch.secondServerIdx !== null) {
            activeMatch.secondServerIdx = 1 - activeMatch.secondServerIdx;
          }
          persistActive();
          ui.menuOpen = false;
          const stNow = computeMatch(activeMatch);
          showToast(`Saca ahora: ${playerLabel(activeMatch, stNow.srvTeam, stNow.srvPlayer)}`);
          render();
        }
        break;
      case 'open-edit-names':
        ui.menuOpen = false;
        ui.editNamesOpen = true;
        render();
        break;
      case 'save-edit-names':
        if (activeMatch) {
          for (let tm = 0; tm < 2; tm++) {
            const p0 = document.getElementById(`ed-p-${tm}-0`)?.value.trim();
            const p1 = document.getElementById(`ed-p-${tm}-1`)?.value.trim();
            activeMatch.teams[tm].players[0] = p0 || (tm === 0 ? 'DRIVE 1' : 'DRIVE 2');
            activeMatch.teams[tm].players[1] = p1 || (tm === 0 ? 'REVÉS 1' : 'REVÉS 2');
          }
          ui.editNamesOpen = false;
          persistActive();
          render();
        }
        break;
      case 'finish-early':
        finishMatchEarly();
        break;
      case 'print-pdf':
        window.print();
        break;
      case 'export-png': {
        const m = getStatsTargetMatch();
        if (m) exportMatchSummaryImage(m);
        break;
      }
      case 'share-ranking':
        shareRankingText();
        break;
      case 'export-ranking-img':
        exportRankingImage();
        break;
      case 'share-img-active':
        if (activeMatch) exportMatchSummaryImage(activeMatch);
        break;
      case 'share-link': {
        const m = getStatsTargetMatch();
        if (m) shareMatchLink(m);
        break;
      }
      case 'save-shared':
        if (ui.sharedMatch) {
          archiveMatchToHistory(ui.sharedMatch);
          ui.statsId = ui.sharedMatch.id;
          showToast('Partido guardado en tu historial');
          render();
        }
        break;
      case 'export-json': {
        const blob = new Blob([JSON.stringify(historyList, null, 2)], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `padel-historial-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        break;
      }
      case 'clear-all-data':
        if (confirm('¿Seguro que querés borrar todos los partidos del historial?')) {
          historyList = [];
          saveJSON(LS_HIST, historyList);
          showToast('Historial vaciado');
          render();
        }
        break;
    }
  }
});

// Input & change listeners
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.hasAttribute('data-pname')) {
    const [tm, pi] = t.getAttribute('data-pname').split(',').map(Number);
    preset.teams[tm].players[pi] = t.value;
    saveJSON(LS_PRESET, preset);
    // Live update server chips text without losing input focus
    const box = document.getElementById('srv-chips-box');
    if (box) {
      const btns = box.querySelectorAll('[data-set-srv]');
      btns.forEach(b => {
        const [bt, bp] = b.getAttribute('data-set-srv').split(',').map(Number);
        const nm = preset.teams[bt].players[bp] || (bp === 0 ? `DRIVE ${bt+1}` : `REVÉS ${bt+1}`);
        b.innerHTML = `<span class="dot"></span>${esc(nm)}`;
      });
    }
    return;
  }
  if (t.id === 'hist-search-inp') {
    const pos = t.selectionStart;
    ui.histQuery = t.value;
    render();
    const inp = document.getElementById('hist-search-inp');
    if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
  }
});

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.hasAttribute('data-preset-bool')) {
    const k = t.getAttribute('data-preset-bool');
    preset[k] = t.checked;
    saveJSON(LS_PRESET, preset);
    return;
  }
  if (t.hasAttribute('data-pref-bool')) {
    const k = t.getAttribute('data-pref-bool');
    prefs[k] = t.checked;
    saveJSON(LS_PREFS, prefs);
    updateWakeLock();
    return;
  }
  if (t.id === 'imp-json-file' && t.files && t.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const arr = JSON.parse(reader.result);
        if (Array.isArray(arr)) {
          arr.forEach(m => { if (m && m.id && m.teams) archiveMatchToHistory(m); });
          showToast(`${arr.length} partidos importados`);
          render();
        }
      } catch { showToast('Archivo JSON inválido'); }
    };
    reader.readAsText(t.files[0]);
  }
});

// Keyboard shortcuts (PC & Bluetooth clickers)
document.addEventListener('keydown', (ev) => {
  if (['INPUT','TEXTAREA','SELECT'].includes(ev.target?.tagName)) return;

  if (ui.shotSheet && activeMatch) {
    const w = ui.shotSheet.team;
    const l = 1 - w;
    if (ev.key === 'Escape') { ui.shotSheet = null; render(); return; }
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); scorePoint(w, 'pt', null); return; }
    if (ev.key === '1') { scorePoint(w, 'winner', [w, 0]); return; }
    if (ev.key === '2') { scorePoint(w, 'winner', [w, 1]); return; }
    if (ev.key === '3') { scorePoint(w, 'ue', [l, 0]); return; }
    if (ev.key === '4') { scorePoint(w, 'ue', [l, 1]); return; }
    if (ev.key === '5') { scorePoint(w, 'fe', [l, 0]); return; }
    if (ev.key === '6') { scorePoint(w, 'fe', [l, 1]); return; }
    return;
  }

  if (ui.changeoverOverlay && (ev.key === ' ' || ev.key === 'Enter' || ev.key === 'Escape')) {
    ev.preventDefault();
    ui.changeoverOverlay = null;
    render();
    return;
  }

  if (ui.route === 'board' && activeMatch) {
    const k = ev.key.toLowerCase();
    if (k === '1' || k === 'a' || ev.key === 'ArrowLeft' || ev.key === 'ArrowUp' || ev.key === 'PageUp') {
      ev.preventDefault(); onTapTeam(0);
    } else if (k === '2' || k === 'l' || ev.key === 'ArrowRight' || ev.key === 'ArrowDown' || ev.key === 'PageDown') {
      ev.preventDefault(); onTapTeam(1);
    } else if (k === 'f') {
      ev.preventDefault(); recordFault();
    } else if (k === 'z' || ev.key === 'Backspace') {
      ev.preventDefault(); undoPoint();
    } else if (k === 'y') {
      ev.preventDefault(); redoPoint();
    } else if (k === 's') {
      ev.preventDefault(); flipSides();
    } else if (k === 'v') {
      ev.preventDefault();
      prefs.voice = !prefs.voice;
      saveJSON(LS_PREFS, prefs);
      showToast(prefs.voice ? 'Voz activada' : 'Voz desactivada');
      render();
    }
  }
});

// Hash routing & shared links
function checkHashRoute() {
  const h = location.hash.slice(1);
  if (h === 'obs' || h.startsWith('obs?') || h.startsWith('obs&') || h.startsWith('obs=')) {
    let code = '';
    if (h.startsWith('obs=')) {
      code = h.slice(4);
    } else {
      const qIdx = h.indexOf('?');
      const ampIdx = h.indexOf('&');
      const paramStr = qIdx >= 0 ? h.slice(qIdx + 1) : (ampIdx >= 0 ? h.slice(ampIdx + 1) : '');
      const sp = new URLSearchParams(paramStr);
      code = sp.get('v') || sp.get('live') || sp.get('code') || '';
    }
    ui.route = 'obs';
    if (code) {
      connectLiveSpectator(code);
    } else {
      render();
    }
    return;
  }

  if (h.startsWith('v=')) {
    connectLiveSpectator(h.slice(2));
    return;
  }
  if (h.startsWith('live=')) {
    connectLiveSpectator(h.slice(5));
    return;
  }
  if (h.startsWith('s=')) {
    openShortSharedMatch(h.slice(2));
    return;
  }
  if (h.startsWith('share=')) {
    const m = decodeMatchShare(h.slice(6));
    if (m) {
      ui.sharedMatch = m;
      ui.statsId = 'shared';
      ui.route = 'stats';
      render();
      return;
    }
  }
  if (h === 'display') {
    ui.route = 'display';
    render();
    return;
  }
  if (['home','new','board','stats','history','players','settings'].includes(h)) {
    if (h === 'home' || h === 'new') disconnectLiveSpectator();
    ui.route = h;
    render();
  }
}
window.addEventListener('hashchange', checkHashRoute);

// Initial boot
checkHashRoute();
render();
</script>
