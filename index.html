  }

  // 5. Board options menu
  if (ui.menuOpen) {
    html += `
    <div class="scrim" data-close-menu="1">
      <div class="sheet">
        <h2>Opciones del marcador</h2>
        <div class="menu-list">
          <button data-act="share-live">${ICONS.live}<div><b>Compartir partido EN VIVO (Link)</b><small>Enviá un enlace por WhatsApp para que sigan el marcador en tiempo real desde cualquier lugar</small></div></button>
          <button data-act="toggle-shot-prompt">${ICONS.edit}<div><b>${m.shotPrompt ? 'Desactivar' : 'Activar'} pregunta de golpe</b><small>${m.shotPrompt ? 'Actualmente pregunta Winner / Error al anotar' : 'Actualmente anota punto directo con un toque'}</small></div></button>
          <button data-act="open-tv">${ICONS.tv}<div><b>Abrir Modo TV / Espectador</b><small>Segunda ventana sincronizada en vivo para proyector o monitor</small></div></button>
          <button data-act="fullscreen">${ICONS.full}<div><b>Pantalla completa</b><small>Ocultar barras del navegador</small></div></button>
          <button data-act="rotate-server">${ICONS.ball}<div><b>Cambiar sacador actual</b><small>Alternar quién saca si hubo un ajuste manual</small></div></button>
          <button data-act="open-edit-names">${ICONS.edit}<div><b>Editar nombres y colores</b><small>Modificar jugadores sin perder el marcador</small></div></button>
          <button data-open-stats="active">${ICONS.chart}<div><b>Ver estadísticas hasta ahora</b><small>Análisis completo en tiempo real</small></div></button>
          <button class="danger" data-act="finish-early">${ICONS.flag}<div><b>Terminar y guardar partido</b><small>Cerrar partido actual y archivar en el historial</small></div></button>
        </div>
        <div class="btn-row">
          <button class="btn block" data-close-menu="1">Cerrar</button>
        </div>
      </div>
    </div>`;
  }

  // 6. Edit names modal
  if (ui.editNamesOpen) {
    html += `
    <div class="scrim" data-close-edit="1">
      <div class="sheet">
        <h2>Editar Jugadores y Colores</h2>
        ${[0,1].map(t => `
          <div class="opt-sec">Pareja ${t+1}</div>
          <div class="row wrap">
            <div class="field"><input class="inp" id="ed-p-${t}-0" value="${esc(m.teams[t].players[0]||'')}"></div>
            <div class="field"><input class="inp" id="ed-p-${t}-1" value="${esc(m.teams[t].players[1]||'')}"></div>
          </div>
          <div class="colors" style="margin:6px 0 10px">
            ${COLORS.map(c => `<button type="button" style="--c:${c.c}" class="${m.teams[t].color===c.c?'on':''}" data-edit-tcolor="${t},${c.c}" title="${c.n}"></button>`).join('')}
          </div>`).join('')}
        <div class="btn-row">
          <button class="btn primary" data-act="save-edit-names">Guardar</button>
          <button class="btn" data-close-edit="1">Cancelar</button>
        </div>
      </div>
    </div>`;
  }

  return html;
}

// ==================== STATS & PDF REPORT RENDERER ====================
function getStatsTargetMatch() {
  if (ui.statsId === 'live' && ui.liveMatch) return ui.liveMatch;
  if (ui.statsId === 'shared' && ui.sharedMatch) return ui.sharedMatch;
  if (ui.statsId === 'active' && activeMatch) return activeMatch;
  const found = historyList.find(x => x.id === ui.statsId);
  if (found) return found;
  if (activeMatch && activeMatch.id === ui.statsId) return activeMatch;
  if (ui.liveMatch && ui.liveMatch.id === ui.statsId) return ui.liveMatch;
  return historyList[0] || activeMatch || ui.liveMatch || null;
}

function renderComparisonBar(label, val0, val1, num0, num1, c0, c1) {
  const n0 = Number(num0) || 0;
  const n1 = Number(num1) || 0;
  const sum = n0 + n1;
  const p0 = sum > 0 ? Math.round((n0 * 100) / sum) : (n0 === n1 && n0 > 0 ? 50 : 0);
  const p1 = sum > 0 ? (100 - p0) : 0;
  return `
  <div class="cmp">
    <div class="cmp-l">${esc(label)}</div>
    <div class="cmp-r">
      <b>${esc(val0)}</b>
      <div class="cbar">
        ${sum > 0 ? `
          <i style="width:${p0}%;background:${esc(c0)}"></i>
          <i style="width:${p1}%;background:${esc(c1)}"></i>
        ` : `<i style="width:100%;background:transparent"></i>`}
      </div>
      <b>${esc(val1)}</b>
    </div>
  </div>`;
}

function renderMomentumSVG(momentum, setBoundaries, c0, c1) {
  if (!momentum || momentum.length < 2) {
    return `<div class="muted" style="padding:18px 0;text-align:center">Se mostrará el gráfico cuando haya puntos jugados.</div>`;
  }
  const N = momentum.length - 1;
  const W = 720, H = 180, padX = 12, padY = 18;
  const plotW = W - padX * 2;
  const plotH = H - padY * 2;
  const maxAbs = Math.max(4, ...momentum.map(v => Math.abs(v)));
  const zeroY = padY + plotH / 2;

  const xAt = i => padX + (N > 0 ? (i / N) * plotW : 0);
  const yAt = v => zeroY - (v / maxAbs) * (plotH / 2);

  let dLine = '';
  momentum.forEach((v, i) => {
    const x = xAt(i).toFixed(1), y = yAt(v).toFixed(1);
    dLine += (i === 0 ? `M${x},${y}` : ` L${x},${y}`);
  });
  const dArea = `${dLine} L${xAt(N).toFixed(1)},${zeroY.toFixed(1)} L${xAt(0).toFixed(1)},${zeroY.toFixed(1)} Z`;

  const uid = 'mom_' + Math.random().toString(36).slice(2,7);
  const boundsSvg = setBoundaries.map(bIdx => {
    const bx = xAt(bIdx).toFixed(1);
    return `<line x1="${bx}" y1="${padY}" x2="${bx}" y2="${H-padY}" stroke="currentColor" stroke-opacity=".22" stroke-dasharray="4 4"/>`;
  }).join('');

  return `
  <svg class="mom" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <clipPath id="${uid}_top"><rect x="0" y="0" width="${W}" height="${zeroY}"/></clipPath>
      <clipPath id="${uid}_bot"><rect x="0" y="${zeroY}" width="${W}" height="${H - zeroY}"/></clipPath>
      <linearGradient id="${uid}_g0" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${esc(c0)}" stop-opacity=".55"/>
        <stop offset="100%" stop-color="${esc(c0)}" stop-opacity=".04"/>
      </linearGradient>
      <linearGradient id="${uid}_g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${esc(c1)}" stop-opacity=".04"/>
        <stop offset="100%" stop-color="${esc(c1)}" stop-opacity=".55"/>
      </linearGradient>
    </defs>
    <line x1="${padX}" y1="${padY}" x2="${W-padX}" y2="${padY}" stroke="currentColor" stroke-opacity=".08"/>
    <line x1="${padX}" y1="${zeroY}" x2="${W-padX}" y2="${zeroY}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 3"/>
    <line x1="${padX}" y1="${H-padY}" x2="${W-padX}" y2="${H-padY}" stroke="currentColor" stroke-opacity=".08"/>
    ${boundsSvg}
    <path d="${dArea}" fill="url(#${uid}_g0)" clip-path="url(#${uid}_top)"/>
    <path d="${dArea}" fill="url(#${uid}_g1)" clip-path="url(#${uid}_bot)"/>
    <path d="${dLine}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function renderStats() {
  const m = getStatsTargetMatch();

  }
  const f = ui.statsSetFilter || 'all';
  const S = computeStats(m, f);
  const st = S.st;
  const T = S.T;
  const c0 = m.teams[0].color, c1 = m.teams[1].color;
  const isRemoteLiveStats = (ui.statsId === 'live' && ui.liveMatch);

  const backRoute = isRemoteLiveStats ? 'live' : (activeMatch && activeMatch.id === m.id && activeMatch.status === 'playing' ? 'board' : 'history');
  const isStarRule = m.rules.deuceRule === 'star';
  const gpLabel = isStarRule ? 'Star Points ganados' : 'Puntos de oro ganados';
  const gpSrvLabel = isStarRule ? 'Star Points ganados al saque' : 'Puntos de oro ganados al saque';
  const gpRetLabel = isStarRule ? 'Star Points ganados al resto' : 'Puntos de oro ganados al resto';

  const playedSets = st.sets.filter((s, idx) => s.games[0] > 0 || s.games[1] > 0 || idx === 0);

  // Evolution chips per set
  const evoHtml = playedSets.map((s, sIdx) => {
    const chips = s.history.map(g => {

      return `<span class="${cls}" style="--c:${esc(col)};--f:${fg}" title="Set ${sIdx+1} · ${g.gamesAfter[0]}-${g.gamesAfter[1]} (saca ${esc(playerLabel(m,g.srvTeam,g.srvPlayer))})">${txt}</span>`;

  // Point-by-point games grouped by set

function renderHistory() {
  const q = (ui.histQuery || '').toLowerCase().trim();
  const list = historyList.filter(m => {
    if (!q) return true;
    const names = m.teams.flatMap(t => t.players).join(' ').toLowerCase();
    return names.includes(q) || fmtDateLong(m.createdAt).toLowerCase().includes(q);
  });

  return `
  <div class="page">
    <div class="page-h">
      <h1>Historial (${historyList.length})</h1>
      <button class="btn sm" data-act="export-json" title="Exportar copia de seguridad">${ICONS.dl} Backup</button>
      <label class="btn sm" style="cursor:pointer" title="Importar partidos desde archivo JSON">
        ${ICONS.up} Importar
        <input type="file" accept=".json,application/json" style="display:none" id="imp-json-file">
      </label>
    </div>

    <div class="field">
      <input class="inp" placeholder="Buscar por jugador o fecha..." value="${esc(ui.histQuery)}" id="hist-search-inp">
    </div>

    ${list.length
      ? list.map(renderMatchCard).join('')
      : `<div class="empty">${ICONS.hist}<br>No se encontraron partidos.</div>`}
    ${renderSignatureFooter()}
  </div>
  ${renderTabbar('history')}`;
}

function renderPlayers() {
  // Aggregate career stats per player name across all matches in history
  const map = new Map();
  historyList.forEach(m => {
    const S = computeStats(m, 'all');
    const w = S.st.matchWinner;
    S.P.forEach(p => {
      const key = p.name.trim().toUpperCase();
      if (!key) return;
      if (!map.has(key)) {
        map.set(key, {
          name: p.name.trim(),
          color: p.color,
          matches: 0,
          wins: 0,
          winners: 0,
          ue: 0,
          fe: 0,
          shots: { smash: 0, volea: 0, bandeja: 0, bajada: 0, dejada: 0, passing: 0, globo: 0 },
          srvPtsWon: 0,
          srvPtsTotal: 0,
          firstServeIn: 0,
          doubleFaults: 0
        });
      }
      const rec = map.get(key);
      rec.matches++;
      if (w === p.team) rec.wins++;
      rec.winners += p.winners;
      rec.ue += p.ue;
      rec.fe += p.fe;
      rec.shots = rec.shots || { smash: 0, volea: 0, bandeja: 0, bajada: 0, dejada: 0, passing: 0, globo: 0 };
      if (p.shots) {
        Object.entries(p.shots).forEach(([k, v]) => {
          rec.shots[k] = (rec.shots[k] || 0) + v;
        });
      }
      rec.srvPtsWon += p.srvPtsWon;
      rec.srvPtsTotal += p.srvPtsTotal;
      rec.firstServeIn += p.firstServeIn;
      rec.doubleFaults += p.doubleFaults;
    });
  });

  const players = Array.from(map.values()).sort((a,b) => b.wins - a.wins || b.matches - a.matches);

  return `
  <div class="page">

        if (p.shots.dejada) shotBadges.push(`🎯 ${p.shots.dejada} Dejada`);
        if (p.shots.passing) shotBadges.push(`🏹 ${p.shots.passing} Passing`);
      }

      <div class="pcard">

  </div>

}

// ==================== MASTER RENDER & EVENT DELEGATION ====================
function render() {
  applyTheme();
  const root = document.getElementById('app');
  if (!root) return;

  let html = '';
  switch (ui.route) {
    case 'new': html = renderNewMatch(); break;
    case 'board': html = renderBoard(false); break;
    case 'display': html = renderBoard(true); break;
    case 'live': html = renderBoard(true); break;
    case 'stats': html = renderStats(); break;
    case 'history': html = renderHistory(); break;
    case 'players': html = renderPlayers(); break;
    case 'settings': html = renderSettings(); break;
    default: html = renderHome(); break;
  }
  root.innerHTML = html;
}

// Click delegation
document.addEventListener('click', (ev) => {
  const t = ev.target;

  // Navigation
  const navEl = t.closest('[data-nav]');
  if (navEl) {
    ev.preventDefault();
    navigate(navEl.getAttribute('data-nav'));
    return;
  }

  // Open match stats
  const stEl = t.closest('[data-open-stats]');
  if (stEl) {
    ev.preventDefault();
    ui.statsId = stEl.getAttribute('data-open-stats');
    ui.statsSetFilter = 'all';
    ui.matchEndDismissed = true;
    navigate('stats');
    return;
  }

  // Stats set filter
  const sfEl = t.closest('[data-st-filter]');
  if (sfEl) {
    ui.statsSetFilter = sfEl.getAttribute('data-st-filter');
    render();
    return;
  }

  // Stepper (- / +) buttons for sets, games, tie-break points
  const stepEl = t.closest('[data-step]');
  if (stepEl) {
    const [k, deltaStr] = stepEl.getAttribute('data-step').split(':');
    const delta = Number(deltaStr) || 0;
    if (k === 'totalSets') {
      const cur = Math.max(1, Number(preset.totalSets) || (preset.setsToWin ? preset.setsToWin * 2 - 1 : 3));
      const next = Math.max(1, Math.min(15, cur + delta));
      preset.totalSets = next;
      preset.setsToWin = Math.floor(next / 2) + 1;
    } else if (k === 'gamesPerSet') {
      const cur = Math.max(1, Number(preset.gamesPerSet) || 6);
      const next = Math.max(1, Math.min(21, cur + delta));
      preset.gamesPerSet = next;
      if (preset.tiebreakAt > 0) preset.tiebreakAt = next;
    } else if (k === 'tiebreakPoints') {
      const cur = Math.max(1, Number(preset.tiebreakPoints) || 7);
      const next = Math.max(1, Math.min(30, cur + delta));
      preset.tiebreakPoints = next;
      if (preset.tiebreakAt === 0) preset.tiebreakAt = preset.gamesPerSet || 6;
    }
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  // Preset pill / segmented buttons
  const prEl = t.closest('[data-preset]');
  if (prEl) {
    const [k, v] = prEl.getAttribute('data-preset').split(':');
    if (k === 'setsToWin') {
      preset.setsToWin = Number(v);
      preset.totalSets = preset.setsToWin * 2 - 1;
    } else if (k === 'gamesPerSet') {
      preset.gamesPerSet = Number(v);
      if (preset.tiebreakAt > 0) preset.tiebreakAt = Number(v);
    } else if (k === 'deuceRule') preset.deuceRule = v;
    else if (k === 'tb') {
      const nv = Number(v);
      if (nv === 0) preset.tiebreakAt = 0;
      else { preset.tiebreakAt = preset.gamesPerSet || 6; preset.tiebreakPoints = nv; }
    } else if (k === 'finalSet') preset.finalSet = v;
    else if (k === 'changeoverRule') preset.changeoverRule = v;
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  // Team color picker
  const tcEl = t.closest('[data-tcolor]');
  if (tcEl) {
    const [tm, col] = tcEl.getAttribute('data-tcolor').split(',');
    preset.teams[Number(tm)].color = col;
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  // First server picker
  const srvEl = t.closest('[data-set-srv]');
  if (srvEl) {
    const [tm, pi] = srvEl.getAttribute('data-set-srv').split(',').map(Number);
    preset.firstServer = [tm, pi];
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  // Scoreboard court half tap
  const halfEl = t.closest('.half[data-team]');
  if (halfEl && !halfEl.hasAttribute('data-ro')) {
    const team = Number(halfEl.getAttribute('data-team'));
    onTapTeam(team);
    return;
  }

  // Shot sheet selection
  const shotEl = t.closest('[data-shot]');
  if (shotEl && ui.shotSheet) {
    const [sType, bTeam, bPlayer, subType] = shotEl.getAttribute('data-shot').split(',');
    const w = ui.shotSheet.team;
    const by = Number(bPlayer) >= 0 ? [Number(bTeam), Number(bPlayer)] : null;
    scorePoint(w, sType, by, subType || null);
    return;
  }

  // Pick second server in doubles
  const p2El = t.closest('[data-pick-2ndsrv]');
  if (p2El && activeMatch) {
    activeMatch.secondServerIdx = Number(p2El.getAttribute('data-pick-2ndsrv'));
    ui.secondSrvPrompt = false;
    persistActive();
    render();
    return;
  }

  // Edit team color inside active match modal
  const etcEl = t.closest('[data-edit-tcolor]');
  if (etcEl && activeMatch) {
    const [tm, col] = etcEl.getAttribute('data-edit-tcolor').split(',');
    for (let i = 0; i < 2; i++) {
      const p0 = document.getElementById(`ed-p-${i}-0`)?.value.trim();
      const p1 = document.getElementById(`ed-p-${i}-1`)?.value.trim();
      if (p0) activeMatch.teams[i].players[0] = p0;
      if (p1) activeMatch.teams[i].players[1] = p1;
    }
    activeMatch.teams[Number(tm)].color = col;
    persistActive();
    render();
    return;
  }

  // Close modals (buttons or clicking the dark backdrop outside .sheet)
  const closeSheetEl = t.closest('[data-close-sheet]');
  if (closeSheetEl && (closeSheetEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.shotSheet = null; render(); return;
  }
  const closeMenuEl = t.closest('[data-close-menu]');
  if (closeMenuEl && (closeMenuEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.menuOpen = false; render(); return;
  }
  const closeEditEl = t.closest('[data-close-edit]');
  if (closeEditEl && (closeEditEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.editNamesOpen = false; render(); return;
  }

  // Preferences
  const pfEl = t.closest('[data-pref]');
  if (pfEl) {
    const [k, v] = pfEl.getAttribute('data-pref').split(':');
    prefs[k] = v;
    saveJSON(LS_PREFS, prefs);
    render();
    return;
  }

  // Delete match from history
  const delEl = t.closest('[data-del-match]');
  if (delEl) {
    const id = delEl.getAttribute('data-del-match');
    if (confirm('¿Eliminar este partido del historial?')) {
      historyList = historyList.filter(x => x.id !== id);
      saveJSON(LS_HIST, historyList);
      navigate('history');
      showToast('Partido eliminado');
    }
    return;
  }

  // Named actions
  const actEl = t.closest('[data-act]');
  if (actEl) {
    const act = actEl.getAttribute('data-act');
    switch (act) {
      case 'start-match': startNewMatch(); break;
      case 'resume-match': navigate('board'); break;
      case 'swap-preset-teams':
        preset.teams.reverse();
        preset.firstServer[0] = 1 - preset.firstServer[0];
        saveJSON(LS_PRESET, preset);
        render();
        break;
      case 'undo': undoPoint(); break;
      case 'undo-from-end': ui.matchEndDismissed = false; undoPoint(); break;
      case 'redo': redoPoint(); break;
      case 'fault': recordFault(); break;
      case 'flip': flipSides(); break;
      case 'toggle-shot-prompt':
        if (activeMatch) {
          activeMatch.shotPrompt = !activeMatch.shotPrompt;
          persistActive();
          showToast(activeMatch.shotPrompt ? 'Detalle de golpe activado' : 'Anotación rápida activada');
          render();
        }
        break;
      case 'toggle-pause':
        if (activeMatch) {
          activeMatch.status = activeMatch.status === 'paused' ? 'playing' : 'paused';
          persistActive();
          render();
        }
        break;
      case 'toggle-voice-tts':
        prefs.voice = !prefs.voice;
        saveJSON(LS_PREFS, prefs);
        showToast(prefs.voice ? 'Voz de árbitro activada' : 'Voz de árbitro silenciada');
        render();
        break;
      case 'toggle-voice-rec':
        toggleVoiceControl();
        break;
      case 'open-menu': ui.menuOpen = true; render(); break;
      case 'dismiss-co': ui.changeoverOverlay = null; render(); break;
      case 'share-live':
        ui.menuOpen = false;
        if (activeMatch) shareLiveMatchLink(activeMatch);
        break;
      case 'exit-live':
        disconnectLiveSpectator();
        navigate('home');
        break;
      case 'save-live':
        if (ui.liveMatch) {
          archiveMatchToHistory(ui.liveMatch);
          showToast('Partido en vivo guardado en tu historial');
          render();
        }
        break;
      case 'open-tv': {
        ui.menuOpen = false;
        const tvUrl = `${location.href.split('#')[0]}#display`;
        const w = window.open(tvUrl, '_blank');
        if (!w) {
          ui.route = 'display';
          showToast('Modo TV activado (tocá ← arriba a la izquierda para volver)');
        }
        render();
        break;
      }
      case 'fullscreen':
        ui.menuOpen = false;
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(()=>{});
        } else {
          document.exitFullscreen?.().catch(()=>{});
        }
        render();
        break;
      case 'rotate-server':
        if (activeMatch) {
          const rot = [
            [0, 0],
            [1, 0],
            [0, 1],
            [1, 1]
          ];
          const curIdx = rot.findIndex(r => r[0] === activeMatch.firstServer[0] && r[1] === activeMatch.firstServer[1]);
          const next = rot[(curIdx + 1) % 4];
          activeMatch.firstServer = [next[0], next[1]];
          if (activeMatch.secondServerIdx !== null) {
            activeMatch.secondServerIdx = 1 - activeMatch.secondServerIdx;
          }
          persistActive();
          ui.menuOpen = false;
          const stNow = computeMatch(activeMatch);
          showToast(`Saca ahora: ${playerLabel(activeMatch, stNow.srvTeam, stNow.srvPlayer)}`);
          render();
        }
        break;
      case 'open-edit-names':
        ui.menuOpen = false;
        ui.editNamesOpen = true;
        render();
        break;
      case 'save-edit-names':
        if (activeMatch) {
          for (let tm = 0; tm < 2; tm++) {
            const p0 = document.getElementById(`ed-p-${tm}-0`)?.value.trim();
            const p1 = document.getElementById(`ed-p-${tm}-1`)?.value.trim();
            if (p0) activeMatch.teams[tm].players[0] = p0;
            if (p1) activeMatch.teams[tm].players[1] = p1;
          }
          ui.editNamesOpen = false;
          persistActive();
          render();
        }
        break;
      case 'finish-early':
        finishMatchEarly();
        break;
      case 'print-pdf':
        window.print();
        break;
      case 'export-png': {
        const m = getStatsTargetMatch();
        if (m) exportMatchSummaryImage(m);
        break;
      }
      case 'share-img-active':
        if (activeMatch) exportMatchSummaryImage(activeMatch);
        break;
      case 'share-link': {
        const m = getStatsTargetMatch();
        if (m) shareMatchLink(m);
        break;
      }
      case 'save-shared':
        if (ui.sharedMatch) {
          archiveMatchToHistory(ui.sharedMatch);
          ui.statsId = ui.sharedMatch.id;
          showToast('Partido guardado en tu historial');
          render();
        }
        break;
      case 'export-json': {
        const blob = new Blob([JSON.stringify(historyList, null, 2)], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `padel-historial-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        break;
      }
      case 'clear-all-data':
        if (confirm('¿Seguro que querés borrar todos los partidos del historial?')) {
          historyList = [];
          saveJSON(LS_HIST, historyList);
          showToast('Historial vaciado');
          render();
        }
        break;
    }
  }
});

// Input & change listeners
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.hasAttribute('data-pname')) {
    const [tm, pi] = t.getAttribute('data-pname').split(',').map(Number);
    preset.teams[tm].players[pi] = t.value;
    saveJSON(LS_PRESET, preset);
    // Live update server chips text without losing input focus
    const box = document.getElementById('srv-chips-box');
    if (box) {
      const btns = box.querySelectorAll('[data-set-srv]');
      btns.forEach(b => {
        const [bt, bp] = b.getAttribute('data-set-srv').split(',').map(Number);
        const nm = preset.teams[bt].players[bp] || `Jugador ${bt*2 + bp + 1}`;
        b.innerHTML = `<span class="dot"></span>${esc(nm)}`;
      });
    }
    return;
  }
  if (t.id === 'hist-search-inp') {
    const pos = t.selectionStart;
    ui.histQuery = t.value;
    render();
    const inp = document.getElementById('hist-search-inp');
    if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
  }
});

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.hasAttribute('data-preset-bool')) {
    const k = t.getAttribute('data-preset-bool');
    preset[k] = t.checked;
    saveJSON(LS_PRESET, preset);
    return;
  }
  if (t.hasAttribute('data-pref-bool')) {
    const k = t.getAttribute('data-pref-bool');
    prefs[k] = t.checked;
    saveJSON(LS_PREFS, prefs);
    updateWakeLock();
    return;
  }
  if (t.id === 'imp-json-file' && t.files && t.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const arr = JSON.parse(reader.result);
        if (Array.isArray(arr)) {
          arr.forEach(m => { if (m && m.id && m.teams) archiveMatchToHistory(m); });
          showToast(`${arr.length} partidos importados`);
          render();
        }
      } catch { showToast('Archivo JSON inválido'); }
    };
    reader.readAsText(t.files[0]);
  }
});

// Keyboard shortcuts (PC & Bluetooth clickers)
document.addEventListener('keydown', (ev) => {
  if (['INPUT','TEXTAREA','SELECT'].includes(ev.target?.tagName)) return;

  if (ui.shotSheet && activeMatch) {
    const w = ui.shotSheet.team;
    const l = 1 - w;
    if (ev.key === 'Escape') { ui.shotSheet = null; render(); return; }
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); scorePoint(w, 'pt', null); return; }
    if (ev.key === '1') { scorePoint(w, 'winner', [w, 0]); return; }
    if (ev.key === '2') { scorePoint(w, 'winner', [w, 1]); return; }
    if (ev.key === '3') { scorePoint(w, 'ue', [l, 0]); return; }
    if (ev.key === '4') { scorePoint(w, 'ue', [l, 1]); return; }
    if (ev.key === '5') { scorePoint(w, 'fe', [l, 0]); return; }
    if (ev.key === '6') { scorePoint(w, 'fe', [l, 1]); return; }
    return;
  }

  if (ui.changeoverOverlay && (ev.key === ' ' || ev.key === 'Enter' || ev.key === 'Escape')) {
    ev.preventDefault();
    ui.changeoverOverlay = null;
    render();
    return;
  }

  if (ui.route === 'board' && activeMatch) {
    const k = ev.key.toLowerCase();
    if (k === '1' || k === 'a' || ev.key === 'ArrowLeft' || ev.key === 'ArrowUp' || ev.key === 'PageUp') {
      ev.preventDefault(); onTapTeam(0);
    } else if (k === '2' || k === 'l' || ev.key === 'ArrowRight' || ev.key === 'ArrowDown' || ev.key === 'PageDown') {
      ev.preventDefault(); onTapTeam(1);
    } else if (k === 'f') {
      ev.preventDefault(); recordFault();
    } else if (k === 'z' || ev.key === 'Backspace') {
      ev.preventDefault(); undoPoint();
    } else if (k === 'y') {
      ev.preventDefault(); redoPoint();
    } else if (k === 's') {
      ev.preventDefault(); flipSides();
    } else if (k === 'v') {
      ev.preventDefault();
      prefs.voice = !prefs.voice;
      saveJSON(LS_PREFS, prefs);
      showToast(prefs.voice ? 'Voz activada' : 'Voz desactivada');
      render();
    }
  }
});

// Hash routing & shared links
function checkHashRoute() {
  const h = location.hash.slice(1);
  if (h.startsWith('v=')) {
    connectLiveSpectator(h.slice(2));
    return;
  }
  if (h.startsWith('live=')) {
    connectLiveSpectator(h.slice(5));
    return;
  }
  if (h.startsWith('s=')) {
    openShortSharedMatch(h.slice(2));
    return;
  }
  if (h.startsWith('share=')) {
    const m = decodeMatchShare(h.slice(6));
    if (m) {
      ui.sharedMatch = m;
      ui.statsId = 'shared';
      ui.route = 'stats';
      render();
      return;
    }
  }
  if (h === 'display') {
    ui.route = 'display';
    render();
    return;
  }
  if (['home','new','board','stats','history','players','settings'].includes(h)) {
    if (h === 'home' || h === 'new') disconnectLiveSpectator();
    ui.route = h;
    render();
  }
}
window.addEventListener('hashchange', checkHashRoute);

// Initial boot
checkHashRoute();
render();
</script>
</body>
</html>
