function syncCompFormFromDom() {
  const f = ui.compFormState;
  if (!f) return;
  const nm = document.getElementById('cf-name');
  if (nm) f.name = nm.value;
  const wp = document.getElementById('cf-wpts');
  if (wp) f.winPts = Math.max(0, Number(wp.value) || 0);
  const dp = document.getElementById('cf-dpts');
  if (dp) f.drawPts = Math.max(0, Number(dp.value) || 0);
  const lp = document.getElementById('cf-lpts');
  if (lp) f.lossPts = Math.max(0, Number(lp.value) || 0);
  const sp = document.getElementById('cf-spts');
  if (sp) f.setBonusPts = Math.max(0, Number(sp.value) || 0);
  const gp = document.getElementById('cf-gpts');
  if (gp) f.gameBonusPts = Math.max(0, Number(gp.value) || 0);
  const ng = document.getElementById('cf-ngroups');
  if (ng) f.numGroups = Math.max(2, Math.min(4, Number(ng.value) || 2));
  const adv = document.getElementById('cf-adv');
  if (adv) f.advancePerGroup = Math.max(1, Math.min(4, Number(adv.value) || 2));
  const sets = document.getElementById('cf-sets');
  const deuce = document.getElementById('cf-deuce');
  if (sets || deuce) {
    f.defaultRules = f.defaultRules || {};
    if (sets) f.defaultRules.totalSets = Number(sets.value) || 3;
    if (deuce) f.defaultRules.deuceRule = deuce.value || 'golden';
  }
}

function openCompModal(mode, kindOrComp) {
  if (mode === 'edit' && kindOrComp && typeof kindOrComp === 'object') {
    const c = kindOrComp;
    const sc = getCompetitionScoringConfig(c);
    ui.compFormState = {
      id: c.id,
      kind: c.kind || 'league',
      name: c.name || '',
      format: c.format || (c.kind === 'tournament' ? 'knockout' : 'league_rr'),
      rankingMode: c.rankingMode || 'pairs',
      winPts: sc.winPts,
      drawPts: sc.drawPts,
      lossPts: sc.lossPts,
      setBonusPts: sc.setBonusPts,
      gameBonusPts: sc.gameBonusPts,
      numGroups: Number(c.numGroups) || 2,
      advancePerGroup: Number(c.advancePerGroup) || 2,
      defaultRules: clone(c.defaultRules || {
        totalSets: 3, gamesPerSet: 6, deuceRule: 'golden',
        tiebreakAt: 6, tiebreakPoints: 7, finalSet: 'normal', changeoverRule: 'odd'
      })
    };
    ui.compModal = 'edit';
    return;
  }
  const kind = kindOrComp === 'tournament' ? 'tournament' : 'league';
  ui.compFormState = {
    id: null,
    kind,
    name: '',
    format: kind === 'tournament' ? 'knockout' : 'league_rr',
    rankingMode: 'pairs',
    winPts: 3,
    drawPts: 2,
    lossPts: 1,
    setBonusPts: 0,
    gameBonusPts: 0,
    numGroups: 2,
    advancePerGroup: 2,
    defaultRules: {
      totalSets: preset.totalSets || 3,
      gamesPerSet: preset.gamesPerSet || 6,
      deuceRule: preset.deuceRule || 'golden',
      tiebreakAt: preset.tiebreakAt ?? 6,
      tiebreakPoints: preset.tiebreakPoints || 7,
      finalSet: preset.finalSet || 'normal',
      changeoverRule: preset.changeoverRule || 'odd'
    }
  };
  ui.compModal = 'create';
}

function fillPresetFromComp(comp, fx = null) {
  if (!comp) return;
  preset.matchContext = comp.kind;
  preset.compId = comp.id;
  const dr = comp.defaultRules || {};
  if (dr.totalSets) {
    preset.totalSets = dr.totalSets;
    preset.setsToWin = Math.floor(dr.totalSets / 2) + 1;
  }
  if (dr.gamesPerSet) preset.gamesPerSet = dr.gamesPerSet;
  if (dr.deuceRule) preset.deuceRule = dr.deuceRule;
  if (dr.tiebreakAt !== undefined) preset.tiebreakAt = dr.tiebreakAt;
  if (dr.tiebreakPoints) preset.tiebreakPoints = dr.tiebreakPoints;
  if (dr.finalSet) preset.finalSet = dr.finalSet;
  if (dr.changeoverRule) preset.changeoverRule = dr.changeoverRule;

  if (fx) {
    preset.fixtureId = fx.id;
    preset.stageLabel = fx.roundLabel || '';
    if (fx.team0) {
      preset.teams[0].players = [fx.team0.players?.[0] || 'DRIVE 1', fx.team0.players?.[1] || 'REVÉS 1'];
      if (fx.team0.color) preset.teams[0].color = fx.team0.color;
    }
    if (fx.team1) {
      preset.teams[1].players = [fx.team1.players?.[0] || 'DRIVE 2', fx.team1.players?.[1] || 'REVÉS 2'];
      if (fx.team1.color) preset.teams[1].color = fx.team1.color;
    }
  } else {
    preset.fixtureId = '';
  }
}

function buildCompRankingContext(comp) {
  if (!comp) return getCurrentRankingContext();
  const sc = getCompetitionScoringConfig(comp);
  const isPP = isProyectoPadelComp(comp);
  const entityMode = comp.rankingMode === 'both' ? (ui.playerEntityMode || 'pairs') : (comp.rankingMode || 'pairs');
  const sortKey = getEffectiveSortKey(comp, comp.id);
  const sortOpts = { tiebreakMode: isPP ? 'games' : 'sets' };
  const raw = computeScopeStandings(getCompetitionMatches(comp, false), {
    ...sc,
    entityMode,
    seedParticipants: comp.participants || []
  });
  const players = assignPlayerRanks(sortStandingsRows(raw, sortKey, sortOpts), sortKey, sortOpts);
  return {
    scope: comp.kind,
    id: `${prefs.rankingId || 'RK'}-${comp.id.slice(-4).toUpperCase()}`,
    title: comp.name,
    subtitle: getCompSubtitle(comp, entityMode, sc),
    entityMode,
    primaryMetric: isPP ? 'elo' : 'pts',
    comp,
    scoring: sc,
    sortKey,
    players
  };
}

function render() {
  applyTheme();
  const root = document.getElementById('app');
  if (!root) return;

  if (ui.route === 'obs') {
    document.documentElement.classList.add('obs-mode');
    document.body.classList.add('obs-mode');
  } else {
    document.documentElement.classList.remove('obs-mode');
    document.body.classList.remove('obs-mode');
  }

  let html = '';
  switch (ui.route) {
    case 'new': html = renderNewMatch(); break;
    case 'board': html = renderBoard(false); break;
    case 'display': html = renderBoard(true); break;
    case 'obs': html = renderOBSOverlay(); break;
    case 'live': html = renderBoard(true); break;
    case 'stats': html = renderStats(); break;
    case 'history': html = renderHistory(); break;
    case 'players': html = renderPlayers(); break;
    case 'competitions': html = renderCompetitions(); break;
    case 'comp-detail': html = renderCompDetail(); break;
    case 'player-card': html = renderPlayerCardView(); break;
    case 'settings': html = renderSettings(); break;
    default: html = renderHome(); break;
  }
  if (ui.qrModalOpen) {
    html += renderQRModal();
  }
  if (ui.obsModalOpen) {
    html += renderOBSModal();
  }
  if (ui.compModal) {
    html += renderCompetitionModals();
  }
  root.innerHTML = html;
  afterRenderQR();
  ensureCompLiveWatcherForCurrentView();
}

      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });

    const id = pcDelCardEl.getAttribute('data-pc-del');

    if (found && confirm(`¿Eliminar la tarjeta guardada de "${found.name || 'Jugador'}"?`)) {
      deletePlayerCardFromIDB(id).then(() => {
        render();
        showToast('Tarjeta eliminada');
      });
    }
    return;
  }

  // Competition navigation & actions
  const ocEl = t.closest('[data-open-comp]');
  if (ocEl) {
    ev.preventDefault();
    const cid = ocEl.getAttribute('data-open-comp');
    if (getCompById(cid)) {
      ui.compId = cid;
      ui.compTab = 'standings';
      ui.matchEndDismissed = true;
      navigate('comp-detail');
    }
    return;
  }

  const ocrEl = t.closest('[data-open-comp-rank]');
  if (ocrEl) {
    ev.preventDefault();
    const cid = ocrEl.getAttribute('data-open-comp-rank');
    const c = getCompById(cid);
    if (c) {
      ui.playerScope = c.kind;
      ui.playerRankingView = 'local';
      if (c.kind === 'league') ui.selectedLeagueId = c.id;
      else ui.selectedTournId = c.id;
      ui.selectedGroupFilter = 'all';
      navigate('players');
    }
    return;
  }

  const picEl = t.closest('[data-play-in-comp]');
  if (picEl) {
    ev.preventDefault();
    const c = getCompById(picEl.getAttribute('data-play-in-comp'));
    if (c) {
      fillPresetFromComp(c, null);
      saveJSON(LS_PRESET, preset);
      navigate('new');
    }

  }

  if (ecEl) {
    ev.preventDefault();
    const c = getCompById(ecEl.getAttribute('data-edit-comp'));
    if (c) {
      openCompModal('edit', c);
      render();
    }
    return;
  }

  const dcEl = t.closest('[data-del-comp]');
  if (dcEl) {
    const cid = dcEl.getAttribute('data-del-comp');
    const c = getCompById(cid);
    if (c && confirm(`¿Eliminar "${c.name}" y sus cruces? (Los partidos jugados quedarán en el historial)`)) {
      competitionsList = competitionsList.filter(x => x.id !== cid);
      saveCompetitions();
      if (preset.compId === cid) { preset.compId = ''; preset.fixtureId = ''; saveJSON(LS_PRESET, preset); }
      ui.compId = competitionsList[0]?.id || null;
      navigate('competitions');
      showToast('Competencia eliminada');
    }
    return;
  }

  const mctxEl = t.closest('[data-match-ctx]');
  if (mctxEl) {
    const nextCtx = mctxEl.getAttribute('data-match-ctx');
    preset.matchContext = nextCtx;
    preset.fixtureId = '';
    if (nextCtx === 'league' || nextCtx === 'tournament') {
      const firstC = competitionsList.find(c => c.kind === nextCtx);
      if (firstC) fillPresetFromComp(firstC, null);
      else preset.compId = '';
    } else {
      preset.compId = '';
      preset.stageLabel = '';
    }
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  const pfxEl = t.closest('[data-pick-fixture]');
  if (pfxEl) {
    const [cid, fxid] = pfxEl.getAttribute('data-pick-fixture').split(':');
    const c = getCompById(cid);
    const fx = (c?.fixtures || []).find(f => f.id === fxid);
    if (c && fx) {
      fillPresetFromComp(c, fx);
      saveJSON(LS_PRESET, preset);
      render();
      showToast(`Cruce cargado: ${fx.roundLabel}`);
    }
    return;
  }

  const playFxEl = t.closest('[data-play-fixture]');
  if (playFxEl) {
    const [cid, fxid] = playFxEl.getAttribute('data-play-fixture').split(':');
    startFixtureMatch(cid, fxid);
    return;
  }

  const qsFxEl = t.closest('[data-quick-score]');
  if (qsFxEl) {
    openQuickScoreModal({ mode: 'fixture', fixtureKey: qsFxEl.getAttribute('data-quick-score') });
    return;
  }

  const qsSlotEl = t.closest('[data-qs-slot]');
  if (qsSlotEl && ui.quickScoreState) {
    const slot = Number(qsSlotEl.getAttribute('data-qs-slot')) || 0;
    ui.quickScoreState.activeSlot = slot;
    document.querySelectorAll?.('.qs-slot-inp').forEach(el => {
      el.classList.toggle('active-slot', Number(el.getAttribute('data-qs-slot')) === slot);
    });
  }

  const qsPickPlEl = t.closest('[data-qs-pick-player]');
  if (qsPickPlEl && ui.quickScoreState) {
    syncQuickScoreStateFromDom();
    const qs = ui.quickScoreState;
    const nm = qsPickPlEl.getAttribute('data-qs-pick-player');
    const slot = Math.max(0, Math.min(3, Number(qs.activeSlot) || 0));
    qs.teams[Math.floor(slot / 2)].players[slot % 2] = nm;
    // Advance activeSlot to next empty box (or cycle modulo 4)
    const flat = [
      qs.teams[0].players[0], qs.teams[0].players[1],
      qs.teams[1].players[0], qs.teams[1].players[1]
    ];
    let nextSlot = (slot + 1) % 4;
    for (let k = 1; k <= 4; k++) {
      const idx = (slot + k) % 4;
      if (!String(flat[idx] || '').trim()) { nextSlot = idx; break; }
    }
    qs.activeSlot = nextSlot;
    render();
    return;
  }

  const qsPickEl = t.closest('[data-qs-pick]');
  if (qsPickEl) {
    const [sIdxStr, sideStr, gValStr] = qsPickEl.getAttribute('data-qs-pick').split(':');
    const sIdx = Number(sIdxStr), side = Number(sideStr), gVal = Number(gValStr);
    const inp = document.getElementById(`qs-s${sIdx + 1}-${side}`);
    if (inp) inp.value = String(gVal);
    if (ui.quickScoreState?.sets?.[sIdx]) {
      ui.quickScoreState.sets[sIdx][side] = gVal;
    }
    const row = qsPickEl.closest('.qs-pills');
    if (row && row.querySelectorAll) {
      row.querySelectorAll('.qs-g-pill').forEach(btn => {
        btn.classList.toggle('on', btn === qsPickEl);
      });
    }
    updateQuickScorePreviewDom();
    return;
  }

  const qsClrEl = t.closest('[data-qs-clear-set]');
  if (qsClrEl) {
    const sIdx = Number(qsClrEl.getAttribute('data-qs-clear-set'));
    const i0 = document.getElementById(`qs-s${sIdx + 1}-0`);
    const i1 = document.getElementById(`qs-s${sIdx + 1}-1`);
    if (i0) i0.value = '';
    if (i1) i1.value = '';
    if (ui.quickScoreState?.sets?.[sIdx]) ui.quickScoreState.sets[sIdx] = [null, null];
    const card = qsClrEl.closest('.qs-set-card');
    if (card && card.querySelectorAll) {
      card.querySelectorAll('.qs-g-pill.on').forEach(btn => btn.classList.remove('on'));
    }
    updateQuickScorePreviewDom();
    return;
  }

  const syncOpenEl = t.closest('[data-open-comp-sync]');
  if (syncOpenEl) {
    ev.preventDefault();
    const cid = syncOpenEl.getAttribute('data-open-comp-sync');
    const c = getCompById(cid);
    if (c) {
      ensureCompSyncCode(c);
      ui.compId = c.id;
      ui.compModal = 'sync-qr';
      publishCompFullSync(c);
      render();
    }
    return;
  }

  const syncNowEl = t.closest('[data-sync-comp]');
  if (syncNowEl) {
    ev.preventDefault();
    const sc = syncNowEl.getAttribute('data-sync-comp');
    pollCompChannelOnce(sc, '24h', true);
    return;
  }

  const dFxEl = t.closest('[data-del-fixture]');
  if (dFxEl) {
    const [cid, fxid] = dFxEl.getAttribute('data-del-fixture').split(':');
    const c = getCompById(cid);
    if (c) {
      c.fixtures = (c.fixtures || []).filter(f => f.id !== fxid);
      saveCompetitions();
      if (c.syncCode) publishCompSetup(c, true);
      render();
      showToast('Cruce eliminado');
    }
    return;
  }

  const dPartEl = t.closest('[data-del-part]');
  if (dPartEl) {
    const [cid, ptid] = dPartEl.getAttribute('data-del-part').split(':');
    const c = getCompById(cid);
    if (c) {
      c.participants = (c.participants || []).filter(p => p.id !== ptid);
      saveCompetitions();
      if (c.syncCode) publishCompParticipantChange(c, 'del', ptid);
      render();
      showToast('Inscripto eliminado');
    }
    return;
  }

  const closeCompModalEl = t.closest('[data-close-comp-modal]');
  if (closeCompModalEl && (closeCompModalEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.compModal = null;
    ui.quickScoreState = null;
    ui.quickScoreFixtureId = null;
    render();
    return;
  }

  const cfKindEl = t.closest('[data-cf-kind]');
  if (cfKindEl && ui.compFormState) {
    syncCompFormFromDom();
    const nk = cfKindEl.getAttribute('data-cf-kind');
    ui.compFormState.kind = nk;
    ui.compFormState.format = nk === 'tournament' ? 'knockout' : 'league_rr';
    render();

  const cfFmtEl = t.closest('[data-cf-fmt]');
  if (cfFmtEl && ui.compFormState) {
    syncCompFormFromDom();
    const nfmt = cfFmtEl.getAttribute('data-cf-fmt');
    ui.compFormState.format = nfmt;
    if (nfmt === 'proyecto_padel') {
      ui.compFormState.kind = 'tournament';
      ui.compFormState.rankingMode = 'individual';
      ui.compFormState.winPts = 3;
      ui.compFormState.drawPts = 2;
      ui.compFormState.lossPts = 1;
      ui.compFormState.setBonusPts = 0;
      ui.compFormState.gameBonusPts = 1;
      ui.compFormState.defaultRules = {
        ...(ui.compFormState.defaultRules || {}),
        totalSets: 1,
        deuceRule: 'golden'
      };
    }
    render();
    return;
  }

  const cfRmEl = t.closest('[data-cf-rmode]');
  if (cfRmEl && ui.compFormState) {
    syncCompFormFromDom();
    ui.compFormState.rankingMode = cfRmEl.getAttribute('data-cf-rmode');
    render();
    return;
  }

  const cFilterEl = t.closest('[data-set-cfilter]');
  if (cFilterEl) {
    ui.compFilter = cFilterEl.getAttribute('data-set-cfilter');
    render();
    return;
  }

  const cTabEl = t.closest('[data-set-ctab]');
  if (cTabEl) {
    ui.compTab = cTabEl.getAttribute('data-set-ctab');
    render();
    return;
  }

  const hFilterEl = t.closest('[data-set-hfilter]');
  if (hFilterEl) {
    ui.histFilter = hFilterEl.getAttribute('data-set-hfilter');
    render();
    return;
  }

  const pScopeEl = t.closest('[data-set-pscope]');
  if (pScopeEl) {
    ui.playerScope = pScopeEl.getAttribute('data-set-pscope');
    ui.playerRankingView = ui.playerScope === 'shared' ? 'shared' : 'local';
    ui.selectedGroupFilter = 'all';
    render();
    return;
  }

  const dTimeEl = t.closest('[data-set-daily-time]');
  if (dTimeEl) {
    ui.dailyTimeFilter = dTimeEl.getAttribute('data-set-daily-time');
    render();
    return;
  }

  const pEntEl = t.closest('[data-set-pentity]');
  if (pEntEl) {
    ui.playerEntityMode = pEntEl.getAttribute('data-set-pentity');
    render();
    return;
  }

  const gFiltEl = t.closest('[data-set-gfilter]');
  if (gFiltEl) {
    ui.selectedGroupFilter = gFiltEl.getAttribute('data-set-gfilter');
    render();
    return;
  }

  // Stats set filter
  const sfEl = t.closest('[data-st-filter]');
  if (sfEl) {
    ui.statsSetFilter = sfEl.getAttribute('data-st-filter');
    render();
    return;
  }

  // Player ranking sort (pts, elo, wins, matches)
  const psEl = t.closest('[data-set-psort]');
  if (psEl) {
    ui.playerSort = psEl.getAttribute('data-set-psort');
    if (ui.route === 'comp-detail') ui.playerSortScope = ui.compId || 'comp';
    else if (ui.playerScope === 'league') ui.playerSortScope = ui.selectedLeagueId || 'league';
    else if (ui.playerScope === 'tournament') ui.playerSortScope = ui.selectedTournId || 'tournament';
    else ui.playerSortScope = ui.playerScope || 'daily';
    render();
    return;
  }

  // Ranking view (local vs shared)
  const prvEl = t.closest('[data-set-prview]');
  if (prvEl) {
    ui.playerRankingView = prvEl.getAttribute('data-set-prview');
    ui.playerScope = ui.playerRankingView === 'shared' ? 'shared' : 'daily';
    render();
    return;
  }

  // Select specific shared ranking from vault
  const selRkEl = t.closest('[data-select-ranking]');
  if (selRkEl) {
    const id = selRkEl.getAttribute('data-select-ranking');
    const vault = loadJSON('padel_ranking_vault', {});
    if (vault[id]) {
      ui.sharedRanking = vault[id];
      saveJSON('padel_shared_ranking', vault[id]);
      ui.playerRankingView = 'shared';
      ui.playerScope = 'shared';
      render();
    }
    return;
  }

  // Stepper (- / +) buttons for sets, games, tie-break points
  const stepEl = t.closest('[data-step]');
  if (stepEl) {
    const [k, deltaStr] = stepEl.getAttribute('data-step').split(':');
    const delta = Number(deltaStr) || 0;
    if (k === 'totalSets') {
      const cur = Math.max(1, Number(preset.totalSets) || (preset.setsToWin ? preset.setsToWin * 2 - 1 : 3));
      const next = Math.max(1, Math.min(15, cur + delta));
      preset.totalSets = next;
      preset.setsToWin = Math.floor(next / 2) + 1;
    } else if (k === 'gamesPerSet') {
      const cur = Math.max(1, Number(preset.gamesPerSet) || 6);
      const next = Math.max(1, Math.min(21, cur + delta));
      preset.gamesPerSet = next;
      if (preset.tiebreakAt > 0) preset.tiebreakAt = next;
    } else if (k === 'tiebreakPoints') {
      const cur = Math.max(1, Number(preset.tiebreakPoints) || 7);
      const next = Math.max(1, Math.min(30, cur + delta));
      preset.tiebreakPoints = next;
      if (preset.tiebreakAt === 0) preset.tiebreakAt = preset.gamesPerSet || 6;
    }
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  // Preset pill / segmented buttons
  const prEl = t.closest('[data-preset]');
  if (prEl) {
    const [k, v] = prEl.getAttribute('data-preset').split(':');
    if (k === 'setsToWin') {
      preset.setsToWin = Number(v);
      preset.totalSets = preset.setsToWin * 2 - 1;
    } else if (k === 'gamesPerSet') {
      preset.gamesPerSet = Number(v);
      if (preset.tiebreakAt > 0) preset.tiebreakAt = Number(v);
    } else if (k === 'deuceRule') preset.deuceRule = v;
    else if (k === 'tb') {
      const nv = Number(v);
      if (nv === 0) preset.tiebreakAt = 0;
      else { preset.tiebreakAt = preset.gamesPerSet || 6; preset.tiebreakPoints = nv; }
    } else if (k === 'finalSet') preset.finalSet = v;
    else if (k === 'changeoverRule') preset.changeoverRule = v;
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  // Team color picker
  const tcEl = t.closest('[data-tcolor]');
  if (tcEl) {
    const [tm, col] = tcEl.getAttribute('data-tcolor').split(',');
    preset.teams[Number(tm)].color = col;
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  // First server picker
  const srvEl = t.closest('[data-set-srv]');
  if (srvEl) {
    const [tm, pi] = srvEl.getAttribute('data-set-srv').split(',').map(Number);
    preset.firstServer = [tm, pi];
    saveJSON(LS_PRESET, preset);
    render();
    return;
  }

  // Scoreboard court half tap
  const halfEl = t.closest('.half[data-team]');
  if (halfEl && !halfEl.hasAttribute('data-ro')) {
    const team = Number(halfEl.getAttribute('data-team'));
    onTapTeam(team);
    return;
  }

  // Shot sheet selection
  const shotEl = t.closest('[data-shot]');
  if (shotEl && ui.shotSheet) {
    const [sType, bTeam, bPlayer, subType] = shotEl.getAttribute('data-shot').split(',');
    const w = ui.shotSheet.team;
    const by = Number(bPlayer) >= 0 ? [Number(bTeam), Number(bPlayer)] : null;
    scorePoint(w, sType, by, subType || null);
    return;
  }

  // Pick second server in doubles
  const p2El = t.closest('[data-pick-2ndsrv]');
  if (p2El && activeMatch) {
    activeMatch.secondServerIdx = Number(p2El.getAttribute('data-pick-2ndsrv'));
    ui.secondSrvPrompt = false;
    persistActive();
    render();
    return;
  }

  // Edit team color inside active match modal
  const etcEl = t.closest('[data-edit-tcolor]');
  if (etcEl && activeMatch) {
    const [tm, col] = etcEl.getAttribute('data-edit-tcolor').split(',');
    for (let i = 0; i < 2; i++) {
      const p0 = document.getElementById(`ed-p-${i}-0`)?.value.trim();
      const p1 = document.getElementById(`ed-p-${i}-1`)?.value.trim();
      if (p0) activeMatch.teams[i].players[0] = p0;
      if (p1) activeMatch.teams[i].players[1] = p1;
    }
    activeMatch.teams[Number(tm)].color = col;
    persistActive();
    render();
    return;
  }

  // Close modals (buttons or clicking the dark backdrop outside .sheet)
  const closeObsEl = t.closest('[data-close-obs-modal]');
  if (closeObsEl && (closeObsEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.obsModalOpen = false; render(); return;
  }
  const posBtn = t.closest('[data-set-obs-pos]');
  if (posBtn) {
    ui.obsSelectedPos = posBtn.getAttribute('data-set-obs-pos');
    render();
    return;
  }
  const copyInpBtn = t.closest('[data-copy-input]');
  if (copyInpBtn) {
    const inputId = copyInpBtn.getAttribute('data-copy-input');
    const inputEl = document.getElementById(inputId);
    if (inputEl) {
      inputEl.select?.();
      const val = inputEl.value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).then(() => {
          showToast('Enlace copiado al portapapeles');
        }).catch(() => {
          try { document.execCommand('copy'); showToast('Enlace copiado'); } catch {}
        });
      } else {
        try { document.execCommand('copy'); showToast('Enlace copiado'); } catch {}
      }
    }
    return;
  }
  const closeQrEl = t.closest('[data-close-qr]');
  if (closeQrEl && (closeQrEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.qrModalOpen = false; render(); return;
  }
  const closeSheetEl = t.closest('[data-close-sheet]');
  if (closeSheetEl && (closeSheetEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.shotSheet = null; render(); return;
  }
  const closeMenuEl = t.closest('[data-close-menu]');
  if (closeMenuEl && (closeMenuEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.menuOpen = false; render(); return;
  }
  const closeEditEl = t.closest('[data-close-edit]');
  if (closeEditEl && (closeEditEl.tagName === 'BUTTON' || !t.closest('.sheet'))) {
    ui.editNamesOpen = false; render(); return;
  }

  // Preferences
  const pfEl = t.closest('[data-pref]');
  if (pfEl) {
    const [k, v] = pfEl.getAttribute('data-pref').split(':');
    prefs[k] = v;
    saveJSON(LS_PREFS, prefs);
    render();
    return;
  }

  // Delete match from history
  const delEl = t.closest('[data-del-match]');
  if (delEl) {
    const id = delEl.getAttribute('data-del-match');
    if (confirm('¿Eliminar este partido del historial?')) {
      const victim = historyList.find(x => x.id === id);
      historyList = historyList.filter(x => x.id !== id);
      saveJSON(LS_HIST, historyList);
      let compsChanged = false;
      competitionsList.forEach(c => {
        const hadFx = (c.fixtures || []).some(f => f.matchId === id);
        if (hadFx) {
          resolveCompetitionFixtures(c);
          compsChanged = true;
        }
        if (c.syncCode && (hadFx || (victim && getMatchCompId(victim) === c.id))) {
          publishCompDeleteMatch(c, id);
        }
      });
      if (compsChanged) saveCompetitions();
      navigate('history');
      showToast('Partido eliminado');
    }
    return;
  }

  // Named actions
  const actEl = t.closest('[data-act]');
  if (actEl) {
    const act = actEl.getAttribute('data-act');
    switch (act) {
      case 'start-match': startNewMatch(); break;
      case 'resume-match': navigate('board'); break;
      case 'swap-preset-teams':
        preset.teams.reverse();
        preset.firstServer[0] = 1 - preset.firstServer[0];
        saveJSON(LS_PRESET, preset);
        render();
        break;
      case 'undo': undoPoint(); break;
      case 'undo-from-end': ui.matchEndDismissed = false; undoPoint(); break;
      case 'redo': redoPoint(); break;
      case 'fault': recordFault(); break;
      case 'flip': flipSides(); break;
      case 'toggle-shot-prompt':
        if (activeMatch) {
          activeMatch.shotPrompt = !activeMatch.shotPrompt;
          persistActive();
          showToast(activeMatch.shotPrompt ? 'Detalle de golpe activado' : 'Anotación rápida activada');
          render();
        }
        break;
      case 'toggle-pause':
        if (activeMatch) {
          activeMatch.status = activeMatch.status === 'paused' ? 'playing' : 'paused';
          persistActive();
          render();
        }
        break;
      case 'toggle-voice-tts':
        prefs.voice = !prefs.voice;
        saveJSON(LS_PREFS, prefs);
        showToast(prefs.voice ? 'Voz de árbitro activada' : 'Voz de árbitro silenciada');
        render();
        break;
      case 'toggle-voice-rec':
        toggleVoiceControl();
        break;
      case 'open-menu': ui.menuOpen = true; render(); break;
      case 'dismiss-co': ui.changeoverOverlay = null; render(); break;
      case 'open-qr-modal':
        ui.menuOpen = false;
        ui.qrModalOpen = true;
        render();
        break;
      case 'close-qr-modal':
        ui.qrModalOpen = false;
        render();
        break;
      case 'share-app-wa':
        shareAppViaWhatsApp();
        break;
      case 'copy-app-link':
        copyAppUrl();
        break;
      case 'dl-app-qr':
        downloadAppQR();
        break;
      case 'share-live':
        ui.menuOpen = false;
        if (activeMatch) shareLiveMatchLink(activeMatch);
        break;
      case 'exit-live':
        disconnectLiveSpectator();
        navigate('home');
        break;
      case 'save-live':
        if (ui.liveMatch) {
          archiveMatchToHistory(ui.liveMatch);
          showToast('Partido en vivo guardado en tu historial');
          render();
        }
        break;
      case 'open-obs-modal':
        ui.menuOpen = false;
        ui.obsModalOpen = true;
        render();
        break;
      case 'close-obs-modal':
        ui.obsModalOpen = false;
        render();
        break;
      case 'open-tv': {
        ui.menuOpen = false;
        const tvUrl = `${location.href.split('#')[0]}#display`;
        const w = window.open(tvUrl, '_blank');
        if (!w) {
          ui.route = 'display';
          showToast('Modo TV activado (tocá ← arriba a la izquierda para volver)');
        }
        render();
        break;
      }
      case 'fullscreen':
        ui.menuOpen = false;
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(()=>{});
        } else {
          document.exitFullscreen?.().catch(()=>{});
        }
        render();
        break;
      case 'rotate-server':
        if (activeMatch) {
          const rot = [
            [0, 0],
            [1, 0],
            [0, 1],
            [1, 1]
          ];
          const curIdx = rot.findIndex(r => r[0] === activeMatch.firstServer[0] && r[1] === activeMatch.firstServer[1]);
          const next = rot[(curIdx + 1) % 4];
          activeMatch.firstServer = [next[0], next[1]];
          if (activeMatch.secondServerIdx !== null) {
            activeMatch.secondServerIdx = 1 - activeMatch.secondServerIdx;
          }
          persistActive();
          ui.menuOpen = false;
          const stNow = computeMatch(activeMatch);
          showToast(`Saca ahora: ${playerLabel(activeMatch, stNow.srvTeam, stNow.srvPlayer)}`);
          render();
        }
        break;
      case 'open-edit-names':
        ui.menuOpen = false;
        ui.editNamesOpen = true;
        render();
        break;
      case 'save-edit-names':
        if (activeMatch) {
          for (let tm = 0; tm < 2; tm++) {
            const p0 = document.getElementById(`ed-p-${tm}-0`)?.value.trim();
            const p1 = document.getElementById(`ed-p-${tm}-1`)?.value.trim();
            activeMatch.teams[tm].players[0] = p0 || (tm === 0 ? 'DRIVE 1' : 'DRIVE 2');
            activeMatch.teams[tm].players[1] = p1 || (tm === 0 ? 'REVÉS 1' : 'REVÉS 2');
          }
          ui.editNamesOpen = false;
          persistActive();
          render();
        }
        break;
      case 'finish-early':
        finishMatchEarly();
        break;
      case 'print-pdf':
        window.print();
        break;
      case 'export-png': {
        const m = getStatsTargetMatch();
        if (m) exportMatchSummaryImage(m);
        break;
      }
      case 'share-ranking':
        shareRankingText();
        break;
      case 'export-ranking-img':
        exportRankingImage();
        break;
      case 'clear-shared-ranking':
        ui.sharedRanking = null;
        try { localStorage.removeItem('padel_shared_ranking'); } catch {}
        ui.playerRankingView = 'local';
        if (ui.playerScope === 'shared') ui.playerScope = 'daily';
        render();
        showToast('Ranking compartido cerrado');
        break;
      case 'open-daily-ranking':
        ui.playerScope = 'daily';
        ui.playerRankingView = 'local';
        navigate('players');
        break;
      case 'open-daily-pts':
        ui.compModal = 'daily-pts';
        render();
        break;
      case 'save-daily-pts': {
        const wInp = document.getElementById('dp-win');
        const lInp = document.getElementById('dp-loss');
        prefs.dailyWinPts = Math.max(0, Number(wInp?.value) || 0);
        prefs.dailyLossPts = Math.max(0, Number(lInp?.value) || 0);
        saveJSON(LS_PREFS, prefs);
        ui.compModal = null;
        render();
        showToast('Puntaje del Día guardado');
        break;
      }
      case 'save-daily-pts-inline': {
        const wInp = document.getElementById('cfg-daily-win');
        const lInp = document.getElementById('cfg-daily-loss');
        prefs.dailyWinPts = Math.max(0, Number(wInp?.value) || 0);
        prefs.dailyLossPts = Math.max(0, Number(lInp?.value) || 0);
        saveJSON(LS_PREFS, prefs);
        render();
        showToast('Puntaje de Partido del Día actualizado');
        break;
      }
      case 'new-comp':
        openCompModal('create', actEl.getAttribute('data-kind') || 'league');
        render();
        break;
      case 'save-comp-modal': {
        syncCompFormFromDom();
        const f = ui.compFormState;
        if (!f || !String(f.name || '').trim()) {
          showToast('Ingresá un nombre para la competencia');
          return;
        }
        const now = Date.now();
        const isPP = f.format === 'proyecto_padel';
        const totalSets = isPP ? 1 : (Number(f.defaultRules?.totalSets) || 3);
        const cleanRules = {
          ...(f.defaultRules || {}),
          totalSets,
          setsToWin: Math.floor(totalSets / 2) + 1,
          ...(isPP ? { deuceRule: 'golden' } : {})
        };
        const rankingMode = isPP ? 'individual' : f.rankingMode;
        const winPts = Number(f.winPts) || 0;
        const drawPts = Number.isFinite(Number(f.drawPts)) ? Number(f.drawPts) : 2;
        const lossPts = Number(f.lossPts) || 0;
        const setBonusPts = isPP ? 0 : (Number(f.setBonusPts) || 0);
        const gameBonusPts = isPP ? (Number.isFinite(Number(f.gameBonusPts)) ? Number(f.gameBonusPts) : 1) : (Number(f.gameBonusPts) || 0);
        if (ui.compModal === 'edit' && f.id) {
          const comp = getCompById(f.id);
          if (comp) {
            comp.kind = f.kind;
            comp.name = f.name.trim();
            comp.format = f.format;
            comp.rankingMode = rankingMode;
            comp.winPts = winPts;
            comp.drawPts = drawPts;
            comp.lossPts = lossPts;
            comp.setBonusPts = setBonusPts;
            comp.gameBonusPts = gameBonusPts;
            comp.numGroups = Number(f.numGroups) || 2;
            comp.advancePerGroup = Number(f.advancePerGroup) || 2;
            comp.defaultRules = cleanRules;
            saveCompetitions();
            if (comp.syncCode) publishCompSetup(comp, false);
            ui.compModal = null;
            render();
            showToast('Competencia actualizada');
          }
        } else {
          const newComp = {
            id: newCompId(f.kind === 'tournament' ? 'trn' : 'lig'),
            kind: f.kind,
            name: f.name.trim(),
            format: f.format,
            rankingMode,
            winPts,
            drawPts,
            lossPts,
            setBonusPts,
            gameBonusPts,
            numGroups: Number(f.numGroups) || 2,
            advancePerGroup: Number(f.advancePerGroup) || 2,
            defaultRules: cleanRules,
            participants: [],
            fixtures: [],
            createdAt: now
          };
          competitionsList.unshift(newComp);
          saveCompetitions();
          ui.compModal = null;
          if (ui.route === 'new') {
            fillPresetFromComp(newComp, null);
            saveJSON(LS_PRESET, preset);
            render();
          } else {
            ui.compId = newComp.id;
            ui.compTab = isPP ? 'standings' : 'participants';
            navigate('comp-detail');
          }
          showToast(`${newComp.kind === 'league' ? 'Liga' : 'Torneo'} creado`);
        }
        break;
      }
      case 'clear-picked-fixture':
        preset.fixtureId = '';
        saveJSON(LS_PRESET, preset);
        render();
        break;
      case 'add-part': {
        const comp = getCompById(actEl.getAttribute('data-comp'));
        if (!comp) break;
        const col = document.getElementById('part-color')?.value || '#d4af37';
        const grp = document.getElementById('part-group')?.value || null;
        let addedPart = null;
        if (comp.rankingMode === 'individual') {
          const nm = document.getElementById('part-ind-name')?.value.trim();
          if (!nm) { showToast('Ingresá el nombre del jugador'); break; }
          comp.participants = comp.participants || [];
          addedPart = {
            id: newCompId('pt'),
            type: 'player',
            name: nm,
            color: col,
            group: grp
          };
          comp.participants.push(addedPart);
        } else {
          const p0 = document.getElementById('part-p0')?.value.trim();
          const p1 = document.getElementById('part-p1')?.value.trim();
          if (!p0 && !p1) { showToast('Ingresá al menos un jugador de la pareja'); break; }
          comp.participants = comp.participants || [];
          addedPart = {
            id: newCompId('pt'),
            type: 'pair',
            players: [p0 || 'DRIVE', p1 || 'REVÉS'],
            color: col,
            group: grp
          };
          comp.participants.push(addedPart);
        }
        saveCompetitions();
        if (comp.syncCode && addedPart) publishCompParticipant(comp, addedPart);
        render();
        showToast('Inscripto agregado');
        break;
      }
      case 'gen-rr': {
        const comp = getCompById(actEl.getAttribute('data-comp'));
        if (!comp) break;
        if ((comp.fixtures || []).some(f => f.matchId) && !confirm('Ya hay partidos jugados en el fixture. ¿Regenerar todos los cruces?')) break;
        comp.fixtures = generateRoundRobinFixtures(comp, { doubleRound: comp.format === 'league_rr2' });
        saveCompetitions();
        if (comp.syncCode) publishCompSetup(comp, true);
        render();
        showToast(`${comp.fixtures.length} cruces generados`);
        break;
      }
      case 'gen-groups': {
        const comp = getCompById(actEl.getAttribute('data-comp'));
        if (!comp) break;
        if ((comp.fixtures || []).some(f => f.matchId) && !confirm('Ya hay partidos jugados en grupos. ¿Re-sortear grupos y fixture?')) break;
        const groupFx = generateGroupsFixtures(comp, comp.numGroups || 2);
        comp.fixtures = groupFx;
        saveCompetitions();
        if (comp.syncCode) publishCompSetup(comp, true);
        render();
        showToast(`${groupFx.length} partidos de grupos generados`);
        break;
      }
      case 'gen-bracket': {
        const comp = getCompById(actEl.getAttribute('data-comp'));
        if (!comp) break;
        if ((comp.fixtures || []).some(f => f.matchId) && !confirm('Ya hay partidos jugados en el cuadro. ¿Regenerar las llaves?')) break;
        comp.fixtures = generatePlayoffBracket(comp);
        resolveCompetitionFixtures(comp);
        saveCompetitions();
        if (comp.syncCode) publishCompSetup(comp, true);
        render();
        showToast('Cuadro eliminatorio generado');
        break;
      }
      case 'advance-playoffs': {
        const comp = getCompById(actEl.getAttribute('data-comp'));
        if (!comp) break;
        if ((comp.fixtures || []).some(f => f.phase === 'playoff' && f.matchId) && !confirm('Ya hay cruces jugados en Playoffs. ¿Regenerar llaves eliminatorias?')) break;
        const ok = advanceGroupsToPlayoffs(comp);
        if (ok) {
          if (comp.syncCode) publishCompSetup(comp, true);
          render();
          showToast('Llaves eliminatorias creadas según la tabla');
        } else {
          showToast('Necesitás al menos 2 grupos con participantes para armar playoffs');
        }
        break;
      }
      case 'open-add-fixture':
        ui.compId = actEl.getAttribute('data-comp') || ui.compId;
        ui.compModal = 'add-fixture';
        render();
        break;
      case 'save-manual-fixture': {
        const comp = getCompById(actEl.getAttribute('data-comp'));
        if (!comp) break;
        const rLabel = document.getElementById('af-round')?.value.trim() || 'Cruce';
        let team0 = null, team1 = null;
        const sel0 = document.getElementById('af-sel0');
        const sel1 = document.getElementById('af-sel1');
        if (sel0 && sel1) {
          if (sel0.value === sel1.value) { showToast('Elegí dos parejas distintas'); break; }
          team0 = participantToTeamObj((comp.participants || []).find(p => p.id === sel0.value));
          team1 = participantToTeamObj((comp.participants || []).find(p => p.id === sel1.value));
        } else {
          const p00 = document.getElementById('af-t0p0')?.value.trim() || 'DRIVE 1';
          const p01 = document.getElementById('af-t0p1')?.value.trim() || 'REVÉS 1';
          const p10 = document.getElementById('af-t1p0')?.value.trim() || 'DRIVE 2';
          const p11 = document.getElementById('af-t1p1')?.value.trim() || 'REVÉS 2';
          team0 = { players: [p00, p01], color: '#d4af37', label: formatPairLabel(p00, p01) };
          team1 = { players: [p10, p11], color: '#2f8cff', label: formatPairLabel(p10, p11) };
        }
        if (team0 && team1) {
          comp.fixtures = comp.fixtures || [];
          const newFx = {
            id: newCompId('fx'),
            phase: 'manual',
            roundIdx: comp.fixtures.length,
            roundLabel: rLabel,
            slotIdx: comp.fixtures.length,
            group: null,
            team0,
            team1,
            source0: null,
            source1: null,
            matchId: null,
            winnerSide: null,
            isBye: false
          };
          comp.fixtures.push(newFx);
          saveCompetitions();
          if (comp.syncCode) publishCompFixtureAdd(comp, newFx);
          ui.compModal = null;
          render();
          showToast('Cruce agregado');
        }
        break;
      }
      case 'open-preset-quick-score':
        openQuickScoreModal({ mode: 'preset' });
        break;
      case 'open-comp-quick-score':
        openQuickScoreModal({ mode: 'comp-adhoc', compId: actEl.getAttribute('data-comp') || ui.compId });
        break;
      case 'qs-add-set':
        if (ui.quickScoreState && ui.quickScoreState.sets.length < 5) {
          syncQuickScoreStateFromDom();
          ui.quickScoreState.sets.push([null, null]);
          render();
        }
        break;
      case 'qs-toggle-manual-teams':
        if (ui.quickScoreState && ui.quickScoreState.mode === 'comp-adhoc') {
          syncQuickScoreStateFromDom();
          ui.quickScoreState.useManualTeams = !ui.quickScoreState.useManualTeams;
          render();
        }
        break;
      case 'qs-clear-players':
        if (ui.quickScoreState) {
          syncQuickScoreStateFromDom();
          ui.quickScoreState.teams[0].players = ['', ''];
          ui.quickScoreState.teams[1].players = ['', ''];
          ui.quickScoreState.activeSlot = 0;
          render();
        }
        break;
      case 'save-quick-score': {
        syncQuickScoreStateFromDom();
        const qs = ui.quickScoreState;
        const target = actEl.getAttribute('data-target') || qs?.fixtureKey || ui.quickScoreFixtureId;
        const [cid, fxid] = String(target || '').split(':');
        const mode = qs?.mode || (cid && fxid ? 'fixture' : 'preset');
        const targetComp = mode === 'fixture'
          ? getCompById(cid)
          : (mode === 'comp-adhoc' ? getCompById(qs?.compId || cid) : ((preset.matchContext === 'league' || preset.matchContext === 'tournament') && preset.compId ? getCompById(preset.compId) : null));
        const isPP = isProyectoPadelComp(targetComp);
        const isWo = !isPP && !!document.getElementById('qs-wo')?.checked;
        const winSel = document.getElementById('qs-winner')?.value || 'auto';

        if (isPP && mode === 'comp-adhoc') {
          const four = [
            qs?.teams?.[0]?.players?.[0], qs?.teams?.[0]?.players?.[1],
            qs?.teams?.[1]?.players?.[0], qs?.teams?.[1]?.players?.[1]
          ].map(x => String(x || '').trim());
          if (four.some(x => !x)) {
            showToast('Ingresá o tocá los 4 nombres de los jugadores');
            break;
          }
          if (new Set(four.map(x => x.toUpperCase())).size < 4) {
            showToast('Cada uno de los 4 jugadores debe ser distinto');
            break;
          }
        }

        const setsArr = [];
        if (!isWo) {
          for (let i = 1; i <= 5; i++) {
            const el0 = document.getElementById(`qs-s${i}-0`);
            const el1 = document.getElementById(`qs-s${i}-1`);
            const v0 = el0?.value;
            const v1 = el1?.value;
            if (v0 !== '' && v0 !== undefined && v1 !== '' && v1 !== undefined) {
              setsArr.push([Math.max(0, Number(v0) || 0), Math.max(0, Number(v1) || 0)]);
            }
          }
          if (!setsArr.length) {
            showToast(isPP ? 'Ingresá los games finales de ambas parejas' : 'Seleccioná al menos el resultado de un set o activá W.O.');
            break;
          }
        }
        const resolved = resolveQuickScoreOutcome(targetComp, setsArr, winSel, isWo);
        if (!resolved.ok) {
          showToast(resolved.error);
          break;
        }
        const winnerSide = resolved.winnerSide;
        const isDraw = !!resolved.isDraw;

        let savedMatch = null;
        if (mode === 'fixture' && cid && fxid) {
          savedMatch = submitQuickFixtureResult(cid, fxid, setsArr, winnerSide, isWo);
        } else if (mode === 'comp-adhoc' && targetComp) {
          if (!qs.useManualTeams && qs.selPartIds?.[0] && qs.selPartIds?.[0] === qs.selPartIds?.[1]) {
            showToast('Elegí dos parejas distintas');
            break;
          }
          savedMatch = submitQuickMatchResult({
            comp: targetComp,
            stageLabel: qs.stageLabel || '',
            teams: qs.teams,
            setsArr,
            winnerSide,
            isDraw,
            isWalkover: isWo
          });
        } else {
          const kind = preset.matchContext || 'daily';
          savedMatch = submitQuickMatchResult({
            kind,
            comp: targetComp,
            fixtureId: targetComp && preset.fixtureId ? preset.fixtureId : '',
            stageLabel: qs?.stageLabel || preset.stageLabel || '',
            teams: qs?.teams || preset.teams,
            rules: preset,
            setsArr,
            winnerSide,
            isDraw,
            isWalkover: isWo
          });
          preset.fixtureId = '';
          saveJSON(LS_PRESET, preset);
        }

        ui.compModal = null;
        ui.quickScoreState = null;
        ui.quickScoreFixtureId = null;
        if (mode === 'preset' && savedMatch) {
          const sCompId = getMatchCompId(savedMatch);
          if (sCompId && getCompById(sCompId)) {
            ui.compId = sCompId;
            ui.compTab = 'standings';
            navigate('comp-detail');
          } else {
            ui.statsId = savedMatch.id;
            navigate('stats');
          }
        } else {
          render();
        }
        showToast(isWo ? 'W.O. registrado' : (isDraw ? '🤝 Empate guardado y ELO actualizado' : '✓ Resultado guardado'));
        break;
      }
      case 'share-comp-rank': {
        const comp = getCompById(ui.compId);
        if (comp) shareRankingText(buildCompRankingContext(comp));
        break;
      }
      case 'export-comp-rank': {
        const comp = getCompById(ui.compId);
        if (comp) exportRankingImage(buildCompRankingContext(comp));
        break;
      }
      case 'open-join-comp':
        ui.compModal = 'join-comp';
        render();
        break;
      case 'submit-join-comp': {
        const rawVal = document.getElementById('join-comp-code')?.value || '';
        joinSyncedCompetition(rawVal);
        break;
      }
      case 'share-comp-invite': {
        const comp = getCompById(ui.compId);
        if (comp) shareCompInvite(comp);
        break;
      }
      case 'dl-comp-qr': {
        const comp = getCompById(ui.compId);
        if (comp) downloadCompSyncQR(comp);
        break;
      }
      case 'republish-comp-sync': {
        const comp = getCompById(ui.compId);
        if (comp) {
          publishCompFullSync(comp).then(ok => {
            showToast(ok ? '✓ Datos publicados en la nube' : 'Guardado en cola: se enviará al reconectar');
            render();
          });
        }
        break;
      }
      case 'prompt-ranking-name': {
        const cur = prefs.rankingName || 'Mi Ranking';
        const val = prompt('Ingresá el nombre de tu cuenta o ranking (ej: Ranking de Fabián, Torneo Central):', cur);
        if (val !== null && val.trim()) {
          prefs.rankingName = val.trim();
          saveJSON(LS_PREFS, prefs);
          render();
          showToast('Nombre de ranking actualizado');
        }
        break;
      }
      case 'save-ranking-name': {
        const inp = document.getElementById('cfg-ranking-name');
        if (inp) {
          prefs.rankingName = inp.value.trim() || 'Mi Ranking';
          saveJSON(LS_PREFS, prefs);
          render();
          showToast('Nombre de ranking guardado');
        }
        break;
      }
      case 'copy-ranking-id': {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText('#' + prefs.rankingId).then(() => {
            showToast('ID de cuenta copiado');
          }).catch(() => {
            prompt('Tu ID de cuenta:', '#' + prefs.rankingId);
          });
        } else {
          prompt('Tu ID de cuenta:', '#' + prefs.rankingId);
        }
        break;
      }
      case 'regen-ranking-id': {
        if (confirm('¿Deseás generar un nuevo ID único para tu cuenta de ranking?')) {
          prefs.rankingId = generateRankingId();
          saveJSON(LS_PREFS, prefs);
          render();
          showToast('Nuevo ID generado: #' + prefs.rankingId);
        }
        break;
      }
      case 'share-img-active':
        if (activeMatch) exportMatchSummaryImage(activeMatch);
        break;
      case 'share-link': {
        const m = getStatsTargetMatch();
        if (m) shareMatchLink(m);
        break;
      }
      case 'save-shared':
        if (ui.sharedMatch) {
          archiveMatchToHistory(ui.sharedMatch);
          ui.statsId = ui.sharedMatch.id;
          showToast('Partido guardado en tu historial');
          render();
        }
        break;
      case 'export-json': {
        const payload = {
          version: 2,
          exportedAt: Date.now(),
          matches: historyList,
          competitions: competitionsList
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `padel-se-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        break;
      }
      case 'clear-all-data':
        if (confirm('¿Seguro que querés borrar todos los partidos del historial?')) {
          historyList = [];
          saveJSON(LS_HIST, historyList);
          competitionsList.forEach(c => resolveCompetitionFixtures(c));
          saveCompetitions();
          showToast('Historial vaciado');
          render();
        }
        break;
      case 'clear-all-comps':
        if (confirm('¿Seguro que querés borrar todas las Ligas y Torneos? (Los partidos del historial se conservarán)')) {
          competitionsList = [];
          saveCompetitions();
          preset.compId = '';
          preset.fixtureId = '';
          saveJSON(LS_PRESET, preset);
          ui.compId = null;
          showToast('Ligas y Torneos eliminados');
          render();
        }
        break;
      case 'pc-download':
        downloadPlayerCardImage();
        break;
      case 'pc-save':
        saveCurrentPlayerCard();
        break;
      case 'pc-new-blank':
        pcAiRequestToken++;
        ui.playerCardAiBusy = false;
        ui.playerCardDraft = createDefaultPlayerCardDraft();
        ui.playerCardDraftDirty = true;
        ui.playerCardTouchDrag = false;
        ui.playerCardAiStatus = '';
        ui.playerCardAiText = '';
        scheduleSaveActiveDraftToIDB(true);
        render();
        break;
      case 'pc-clear-photo': {
        pcAiRequestToken++;
        ui.playerCardAiBusy = false;
        const d = getActivePlayerCardDraft();
        d.origPhoto = null;
        d.cutoutPhoto = null;
        d.origHasAlpha = false;
        d.zoom = 1;
        d.offsetX = 0;
        d.offsetY = 0;
        ui.playerCardDraftDirty = true;
        ui.playerCardTouchDrag = false;
        ui.playerCardAiStatus = '';
        ui.playerCardAiText = '';
        scheduleSaveActiveDraftToIDB(true);
        render();
        break;
      }
      case 'pc-reset-frame': {
        const d = getActivePlayerCardDraft();
        d.zoom = 1;
        d.offsetX = 0;
        d.offsetY = 0;
        ui.playerCardDraftDirty = true;
        scheduleSaveActiveDraftToIDB(true);
        render();
        break;
      }
      case 'pc-toggle-touch-drag':
        ui.playerCardTouchDrag = !ui.playerCardTouchDrag;
        render();
        break;
      case 'pc-reset-logo2':
        playerCardLogos.logo2 = DEFAULT_CENTER_LOGO_URL;
        playerCardLogos.logo2Disabled = false;
        saveCardLogosToIDB();
        render();
        showToast('Logo oficial PRO PÁDEL restaurado');
        break;
    }
  }
});

// Input & change listeners
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'pc-name') { getActivePlayerCardDraft().name = t.value; ui.playerCardDraftDirty = true; scheduleSaveActiveDraftToIDB(); refreshPlayerCardPreview(); return; }
  if (t.id === 'pc-nick') { getActivePlayerCardDraft().nickname = t.value; ui.playerCardDraftDirty = true; scheduleSaveActiveDraftToIDB(); refreshPlayerCardPreview(); return; }
  if (t.id === 'pc-cat') { getActivePlayerCardDraft().category = t.value; ui.playerCardDraftDirty = true; scheduleSaveActiveDraftToIDB(); refreshPlayerCardPreview(); return; }
  if (t.id === 'pc-age') { getActivePlayerCardDraft().age = t.value; ui.playerCardDraftDirty = true; scheduleSaveActiveDraftToIDB(); refreshPlayerCardPreview(); return; }
  if (t.id === 'pc-shot') { getActivePlayerCardDraft().bestShot = t.value; ui.playerCardDraftDirty = true; scheduleSaveActiveDraftToIDB(); refreshPlayerCardPreview(); return; }
  if (t.id === 'pc-subtitle') { playerCardLogos.subTitle = t.value; refreshPlayerCardPreview(); return; }
  if (t.id === 'pc-zoom') {
    const v = Number(t.value) || 1;
    getActivePlayerCardDraft().zoom = v;
    const lbl = document.getElementById('pc-zoom-val');
    if (lbl) lbl.textContent = Math.round(v * 100) + '%';
    ui.playerCardDraftDirty = true;
    scheduleSaveActiveDraftToIDB();
    refreshPlayerCardPreview();
    return;
  }
  if (t.id === 'pc-offx') {
    const v = Number(t.value) || 0;
    getActivePlayerCardDraft().offsetX = v;
    const lbl = document.getElementById('pc-offx-val');
    if (lbl) lbl.textContent = String(Math.round(v));
    ui.playerCardDraftDirty = true;
    scheduleSaveActiveDraftToIDB();
    refreshPlayerCardPreview();
    return;
  }
  if (t.id === 'pc-offy') {
    const v = Number(t.value) || 0;
    getActivePlayerCardDraft().offsetY = v;
    const lbl = document.getElementById('pc-offy-val');
    if (lbl) lbl.textContent = String(Math.round(v));
    ui.playerCardDraftDirty = true;
    scheduleSaveActiveDraftToIDB();
    refreshPlayerCardPreview();
    return;
  }
  if (t.hasAttribute('data-pname')) {
    const [tm, pi] = t.getAttribute('data-pname').split(',').map(Number);
    preset.teams[tm].players[pi] = t.value;
    saveJSON(LS_PRESET, preset);
    // Live update server chips text without losing input focus
    const box = document.getElementById('srv-chips-box');
    if (box) {
      const btns = box.querySelectorAll('[data-set-srv]');
      btns.forEach(b => {
        const [bt, bp] = b.getAttribute('data-set-srv').split(',').map(Number);
        const nm = preset.teams[bt].players[bp] || (bp === 0 ? `DRIVE ${bt+1}` : `REVÉS ${bt+1}`);
        b.innerHTML = `<span class="dot"></span>${esc(nm)}`;
      });
    }
    return;
  }
  if (t.hasAttribute('data-preset-txt')) {
    const k = t.getAttribute('data-preset-txt');
    preset[k] = t.value;
    saveJSON(LS_PRESET, preset);
    return;
  }
  if (t.id === 'cfg-ranking-name') {
    prefs.rankingName = t.value;
    saveJSON(LS_PREFS, prefs);
    return;
  }
  if (t.id === 'hist-search-inp') {
    const pos = t.selectionStart;
    ui.histQuery = t.value;
    render();
    const inp = document.getElementById('hist-search-inp');
    if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
    return;
  }
  if (t.id && t.id.startsWith('qs-') && ui.quickScoreState) {
    const mSet = t.id.match(/^qs-s(\d+)-([01])$/);
    if (mSet) {
      const sIdx = Number(mSet[1]) - 1;
      const side = Number(mSet[2]);
      const val = t.value === '' ? null : Math.max(0, Number(t.value) || 0);
      const row = document.querySelector?.(`[data-qs-row="${sIdx}:${side}"]`);
      if (row && row.querySelectorAll) {
        row.querySelectorAll('.qs-g-pill').forEach(btn => {
          btn.classList.toggle('on', val !== null && Number(btn.textContent) === val);
        });
      }
    }
    updateQuickScorePreviewDom();
  }
});

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'pc-photo-inp' && t.files && t.files[0]) {
    processUploadedPlayerPhoto(t.files[0]);
    t.value = '';
    return;
  }
  if (t.id === 'pc-logo1-inp' && t.files && t.files[0]) {
    processUploadedLogo(t.files[0], 1);
    t.value = '';
    return;
  }
  if (t.id === 'pc-logo2-inp' && t.files && t.files[0]) {
    processUploadedLogo(t.files[0], 2);
    t.value = '';
    return;
  }
  if (t.id === 'pc-subtitle') {
    playerCardLogos.subTitle = t.value;
    saveCardLogosToIDB();
    return;
  }
  if (t.id === 'pc-show-brand') {
    getActivePlayerCardDraft().showAppBrand = t.checked;
    ui.playerCardDraftDirty = true;
    scheduleSaveActiveDraftToIDB();
    refreshPlayerCardPreview();
    return;
  }
  if (t.id === 'qs-sel0' || t.id === 'qs-sel1') {
    syncQuickScoreStateFromDom();
    render();
    return;
  }
  if (t.id === 'qs-wo' || t.id === 'qs-winner') {
    updateQuickScorePreviewDom();
    return;
  }
  if (t.hasAttribute('data-preset-bool')) {
    const k = t.getAttribute('data-preset-bool');
    preset[k] = t.checked;
    saveJSON(LS_PRESET, preset);
    return;
  }
  if (t.hasAttribute('data-pref-bool')) {
    const k = t.getAttribute('data-pref-bool');
    prefs[k] = t.checked;
    saveJSON(LS_PREFS, prefs);
    updateWakeLock();
    return;
  }
  if (t.getAttribute('data-act') === 'sel-comp-for-new') {
    const c = getCompById(t.value);
    if (c) {
      fillPresetFromComp(c, null);
      saveJSON(LS_PRESET, preset);
      render();
    }
    return;
  }
  if (t.hasAttribute('data-fill-pair-team') && t.value) {
    const teamIdx = Number(t.getAttribute('data-fill-pair-team'));
    const [cid, ptid] = t.value.split(':');
    const c = getCompById(cid);
    const pt = (c?.participants || []).find(p => p.id === ptid);
    if (pt && pt.type === 'pair') {
      preset.teams[teamIdx].players = [pt.players?.[0] || `DRIVE ${teamIdx+1}`, pt.players?.[1] || `REVÉS ${teamIdx+1}`];
      if (pt.color) preset.teams[teamIdx].color = pt.color;
      saveJSON(LS_PRESET, preset);
      render();
      showToast(`Pareja ${teamIdx + 1} cargada`);
    }
    return;
  }
  if (t.getAttribute('data-act') === 'sel-rank-comp') {
    const c = getCompById(t.value);
    if (c) {
      if (c.kind === 'league') ui.selectedLeagueId = c.id;
      else ui.selectedTournId = c.id;
      ui.selectedGroupFilter = 'all';
      render();
    }
    return;
  }
  if (t.hasAttribute('data-set-part-group')) {
    const [cid, ptid] = t.getAttribute('data-set-part-group').split(':');
    const c = getCompById(cid);
    const pt = (c?.participants || []).find(p => p.id === ptid);
    if (c && pt) {
      pt.group = t.value || null;
      saveCompetitions();
      if (c.syncCode) publishCompParticipantChange(c, 'grp', ptid, pt.group);
      render();
    }
    return;
  }
  if (t.id === 'imp-json-file' && t.files && t.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        let mCount = 0;
        let cCount = 0;
        if (Array.isArray(parsed)) {
          parsed.forEach(m => { if (m && m.id && m.teams) { archiveMatchToHistory(m); mCount++; } });
          showToast(`${mCount} partidos importados`);
          render();
        } else if (parsed && typeof parsed === 'object') {
          if (Array.isArray(parsed.competitions)) {
            parsed.competitions.forEach(nc => {
              if (nc && nc.id && nc.name) {
                const idx = competitionsList.findIndex(x => x.id === nc.id);
                if (idx >= 0) competitionsList[idx] = nc;
                else competitionsList.push(nc);
                cCount++;
              }
            });
            saveCompetitions();
          }
          if (Array.isArray(parsed.matches)) {
            parsed.matches.forEach(m => { if (m && m.id && m.teams) { archiveMatchToHistory(m); mCount++; } });
          }
          showToast(`Importados: ${mCount} partidos y ${cCount} competencias`);
          render();
        }
      } catch { showToast('Archivo JSON inválido'); }
    };
    reader.readAsText(t.files[0]);
  }
});

// Keyboard shortcuts (PC & Bluetooth clickers)
document.addEventListener('keydown', (ev) => {
  if (['INPUT','TEXTAREA','SELECT'].includes(ev.target?.tagName)) return;

  if (ui.shotSheet && activeMatch) {
    const w = ui.shotSheet.team;
    const l = 1 - w;
    if (ev.key === 'Escape') { ui.shotSheet = null; render(); return; }
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); scorePoint(w, 'pt', null); return; }
    if (ev.key === '1') { scorePoint(w, 'winner', [w, 0]); return; }
    if (ev.key === '2') { scorePoint(w, 'winner', [w, 1]); return; }
    if (ev.key === '3') { scorePoint(w, 'ue', [l, 0]); return; }
    if (ev.key === '4') { scorePoint(w, 'ue', [l, 1]); return; }
    if (ev.key === '5') { scorePoint(w, 'fe', [l, 0]); return; }
    if (ev.key === '6') { scorePoint(w, 'fe', [l, 1]); return; }
    return;
  }

  if (ui.changeoverOverlay && (ev.key === ' ' || ev.key === 'Enter' || ev.key === 'Escape')) {
    ev.preventDefault();
    ui.changeoverOverlay = null;
    render();
    return;
  }

  if (ui.route === 'board' && activeMatch) {
    const k = ev.key.toLowerCase();
    if (k === '1' || k === 'a' || ev.key === 'ArrowLeft' || ev.key === 'ArrowUp' || ev.key === 'PageUp') {
      ev.preventDefault(); onTapTeam(0);
    } else if (k === '2' || k === 'l' || ev.key === 'ArrowRight' || ev.key === 'ArrowDown' || ev.key === 'PageDown') {
      ev.preventDefault(); onTapTeam(1);
    } else if (k === 'f') {
      ev.preventDefault(); recordFault();
    } else if (k === 'z' || ev.key === 'Backspace') {
      ev.preventDefault(); undoPoint();
    } else if (k === 'y') {
      ev.preventDefault(); redoPoint();
    } else if (k === 's') {
      ev.preventDefault(); flipSides();
    } else if (k === 'v') {
      ev.preventDefault();
      prefs.voice = !prefs.voice;
      saveJSON(LS_PREFS, prefs);
      showToast(prefs.voice ? 'Voz activada' : 'Voz desactivada');
      render();
    }
  }
});

// Hash routing & shared links
function checkHashRoute() {
  const h = location.hash.slice(1);
  if (h === 'obs' || h.startsWith('obs?') || h.startsWith('obs&') || h.startsWith('obs=')) {
    let code = '';
    if (h.startsWith('obs=')) {
      code = h.slice(4);
    } else {
      const qIdx = h.indexOf('?');
      const ampIdx = h.indexOf('&');
      const paramStr = qIdx >= 0 ? h.slice(qIdx + 1) : (ampIdx >= 0 ? h.slice(ampIdx + 1) : '');
      const sp = new URLSearchParams(paramStr);
      code = sp.get('v') || sp.get('live') || sp.get('code') || '';
    }
    ui.route = 'obs';
    if (code) {
      connectLiveSpectator(code);
    } else {
      render();
    }
    return;
  }

  if (h.startsWith('v=')) {
    connectLiveSpectator(h.slice(2));
    return;
  }
  if (h.startsWith('live=')) {
    connectLiveSpectator(h.slice(5));
    return;
  }
  if (h.startsWith('s=')) {
    openShortSharedMatch(h.slice(2));
    return;
  }
  if (h.startsWith('r=') || h.startsWith('rk_id=')) {
    const code = h.startsWith('r=') ? h.slice(2) : h.slice(6);
    openShortSharedRanking(code);
    return;
  }
  if (h.startsWith('c=') || h.startsWith('join=')) {
    joinSyncedCompetition(h);
    return;
  }
  if (h.startsWith('comp=')) {
    const cid = h.slice(5);
    if (getCompById(cid)) {
      ui.compId = cid;
      ui.route = 'comp-detail';
      render();
      return;
    }
  }
  if (h.startsWith('share=')) {
    const m = decodeMatchShare(h.slice(6));
    if (m) {
      ui.sharedMatch = m;
      ui.statsId = 'shared';
      ui.route = 'stats';
      render();
      return;
    }
  }
  if (h.startsWith('rk=') || h.startsWith('ranking=')) {
    const raw = h.startsWith('rk=') ? h.slice(3) : h.slice(8);
    const decoded = decodeRankingPayload(raw);
    if (decoded && Array.isArray(decoded.players) && decoded.players.length) {
      ui.sharedRanking = decoded;
      saveJSON('padel_shared_ranking', decoded);
      saveSharedRankingToVault(decoded);
      ui.playerRankingView = 'shared';
      ui.playerScope = 'shared';
      ui.route = 'players';
      render();
      showToast(`📡 ${decoded.name || 'Ranking'} (#${decoded.id || 'RK'}) cargado`);
      return;
    }
  }
  if (h === 'display') {
    ui.route = 'display';
    render();
    return;
  }
  if (h === 'cards' || h === 'tarjetas' || h === 'player-card') {
    ui.route = 'player-card';
    render();
    return;
  }
  if (['home','new','board','stats','history','players','competitions','comp-detail','player-card','settings'].includes(h)) {
    if (h === 'home' || h === 'new') disconnectLiveSpectator();
    ui.route = h;
    render();
  }
}
window.addEventListener('hashchange', checkHashRoute);

// Pointer drag-to-reposition photo directly on Player Card preview canvas
document.addEventListener('pointerdown', (ev) => {
  const canvas = ev.target?.closest?.('#pc-preview-canvas');
  if (!canvas) return;
  if (ev.pointerType !== 'mouse' && !ui.playerCardTouchDrag) return;
  const draft = getActivePlayerCardDraft();
  if (!draft.origPhoto) return;
  pcDragState = {
    pointerId: ev.pointerId,
    startX: ev.clientX,
    startY: ev.clientY,
    origX: Number(draft.offsetX) || 0,
    origY: Number(draft.offsetY) || 0,
    rectW: canvas.getBoundingClientRect().width || 360
  };
  canvas.classList.add('dragging');
  try { canvas.setPointerCapture?.(ev.pointerId); } catch {}
});

document.addEventListener('pointermove', (ev) => {
  if (!pcDragState || ev.pointerId !== pcDragState.pointerId) return;
  const draft = getActivePlayerCardDraft();
  const scale = 1080 / pcDragState.rectW;
  const nx = Math.max(-350, Math.min(350, Math.round(pcDragState.origX + (ev.clientX - pcDragState.startX) * scale)));
  const ny = Math.max(-350, Math.min(350, Math.round(pcDragState.origY + (ev.clientY - pcDragState.startY) * scale)));
  draft.offsetX = nx;
  draft.offsetY = ny;
  const xInp = document.getElementById('pc-offx');
  const yInp = document.getElementById('pc-offy');
  const xLbl = document.getElementById('pc-offx-val');
  const yLbl = document.getElementById('pc-offy-val');
  if (xInp) xInp.value = nx;
  if (yInp) yInp.value = ny;
  if (xLbl) xLbl.textContent = String(nx);
  if (yLbl) yLbl.textContent = String(ny);
  refreshPlayerCardPreview();
});

function endPcDrag(ev) {
  if (!pcDragState || (ev && ev.pointerId !== undefined && ev.pointerId !== pcDragState.pointerId)) return;
  const canvas = document.getElementById('pc-preview-canvas');
  if (canvas) canvas.classList.remove('dragging');
  pcDragState = null;
  ui.playerCardDraftDirty = true;
  scheduleSaveActiveDraftToIDB();
}
document.addEventListener('pointerup', endPcDrag);
document.addEventListener('pointercancel', endPcDrag);

// Initial boot
checkHashRoute();
render();
loadPlayerCardDataFromIDB();
</script>
