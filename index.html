let audioCtx = null;
function playTone(kind) {
  if (!prefs.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const notes = {
      point: [[880, 0, 0.06]],
      undo: [[520, 0, 0.05], [380, 0.06, 0.07]],
      fault: [[320, 0, 0.11]],
      game: [[660, 0, 0.08], [880, 0.09, 0.14]],
      set: [[587, 0, 0.09], [784, 0.1, 0.09], [1046, 0.2, 0.18]],
      match: [[523, 0, 0.1], [659, 0.11, 0.1], [784, 0.22, 0.1], [1046, 0.33, 0.26]]
    }[kind] || [[880, 0, 0.06]];

    notes.forEach(([freq, delay, dur]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + delay);
      gain.gain.setValueAtTime(0.18, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + dur + 0.01);
    });
  } catch {}
}

function vibrate(pattern) {
  if (prefs.vibrate && navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch {}
  }
}

function speakScore(m, st) {
  if (!prefs.voice || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    let text = '';
    if (st.lastTransition) {
      const tr = st.lastTransition;
      const wName = teamLabel(m, tr.winner).replace(/·/g, ' y ');
      if (tr.type === 'match') {
        text = `Juego, set y partido para ${wName}.`;
      } else if (tr.type === 'set') {
        const s = st.sets[tr.setIdx];
        text = `Juego y set ${wName}, ${s.games[0]} a ${s.games[1]}.${tr.changeover ? ' Cambio de lado.' : ''}`;
      } else if (tr.type === 'game') {
        const g = st.curSet.games;
        text = `${tr.wasBreak ? 'Break y juego' : 'Juego'} para ${wName}. ${g[0]} a ${g[1]}.${tr.changeover ? ' Cambio de lado.' : ''}`;
      } else if (tr.type === 'tb_changeover') {
        text = `${st.p[0]} a ${st.p[1]}. Cambio de lado.`;
      }
    } else if (st.isTB) {
      const srv = st.srvTeam;
      const a = st.p[srv], b = st.p[1 - srv];
      text = a === b ? `${a} iguales` : `${a} a ${b}, saca ${playerLabel(m, st.srvTeam, st.srvPlayer)}`;
    } else {
      const srv = st.srvTeam;
      const dS = st.pointDisplay[srv], dR = st.pointDisplay[1 - srv];
      const word = v => ({'0':'cero','15':'quince','30':'treinta','40':'cuarenta','40 ★':'cuarenta'}[v] || v);
      if (st.isStar) {
        text = 'Cuarenta iguales. Star Point, punto decisivo.';
      } else if (st.isGP) {
        text = 'Cuarenta iguales. Punto de oro.';
      } else if (dS.startsWith('40') && dR.startsWith('40')) {
        text = (m.rules.deuceRule === 'star' && st.curDeuceCount === 2)
          ? 'Iguales. Segunda ventaja.'
          : 'Iguales.';
      } else if (dS === 'AD') {
        const vTxt = (m.rules.deuceRule === 'star' && st.curAdvNumber === 2) ? 'Segunda ventaja' : 'Ventaja';
        text = `${vTxt} al saque, ${teamLabel(m, srv).replace(/·/g, ' y ')}.`;
      } else if (dR === 'AD') {
        const vTxt = (m.rules.deuceRule === 'star' && st.curAdvNumber === 2) ? 'Segunda ventaja' : 'Ventaja';
        text = `${vTxt} al resto, ${teamLabel(m, 1 - srv).replace(/·/g, ' y ')}.`;
      } else if (dS === dR) {
        text = `${word(dS)} iguales.`;
      } else {
        text = `${word(dS)}, ${word(dR)}.`;
      }
      if (st.mp[0] || st.mp[1]) text += ' Punto de partido.';
      else if (st.sp[0] || st.sp[1]) text += ' Punto de set.';
      else if (st.isBP && !st.isGP) text += ' Bola de break.';
    }
    if (text) {
      isSpeakingTTS = true;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-ES';
      u.rate = 1.05;
      const resumeMic = () => {
        setTimeout(() => { isSpeakingTTS = false; }, 280);
      };
      u.onend = resumeMic;
      u.onerror = resumeMic;
      setTimeout(resumeMic, 2800);
      window.speechSynthesis.speak(u);
    }
  } catch {}
}

// Wake Lock
let wakeLockSentinel = null;
async function updateWakeLock() {
  const isPlayingLocal = (ui.route === 'board' || ui.route === 'display') && activeMatch && activeMatch.status === 'playing';
  const isPlayingRemote = (ui.route === 'live') && ui.liveMatch && ui.liveMatch.status === 'playing';
  const want = prefs.wakeLock && (isPlayingLocal || isPlayingRemote);
  if (!('wakeLock' in navigator)) return;
  try {
    if (want && !wakeLockSentinel) {
      wakeLockSentinel = await navigator.wakeLock.request('screen');
      wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
    } else if (!want && wakeLockSentinel) {
      await wakeLockSentinel.release();
      wakeLockSentinel = null;
    }
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    updateWakeLock();
    if (activeMatch && activeMatch.status === 'playing') publishLiveMatchState(activeMatch, true);
    if ((ui.route === 'live' || ui.route === 'obs') && ui.liveId) {
      const tpc = cleanLiveTopic(ui.liveId);
      if (!liveEvtSource || liveEvtSource.readyState === 2) openLiveEventSource(tpc);
      pollLiveChannelOnce(tpc);
    }
  }
});

// Hands-Free Speech Recognition
let speechRec = null;
let isSpeakingTTS = false;
let speechBlocked = false;
let interimTimer = null;
let lastInterimText = '';
let lastProcessedAt = 0;
let lastProcessedCmd = '';

function isInAppWebView() {
  return /Instagram|FBAN|FBAV|Line\/|MicroMessenger/i.test(navigator.userAgent || '');
}

function dispatchRecognizedSpeech(text) {
  const clean = normVoiceStr(text);
  if (!clean) return;
  const now = Date.now();
  // Deduplicate if both interim fallback and isFinal fire for the same phrase within 1.4s
  if (clean === lastProcessedCmd && (now - lastProcessedAt) < 1400) return;
  lastProcessedCmd = clean;
  lastProcessedAt = now;
  clearTimeout(interimTimer);
  lastInterimText = '';
  handleVoiceCommand(text);
}

function startSpeechSession() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || !ui.voiceListening || ui.route !== 'board') return;
  try {
    if (!speechRec) {
      speechRec = new SR();
      speechRec.lang = 'es-AR';
      speechRec.continuous = true;
      speechRec.interimResults = true;
      speechRec.maxAlternatives = 3;

      speechRec.onresult = (ev) => {
        if (!activeMatch || ui.route !== 'board' || isSpeakingTTS) return;
        const last = ev.results[ev.results.length - 1];
        if (!last) return;
        const combined = Array.from(last).map(a => a.transcript).join(' ').trim();
        if (!combined) return;

        if (last.isFinal) {
          dispatchRecognizedSpeech(combined);
        } else {
          lastInterimText = combined;
          clearTimeout(interimTimer);
          interimTimer = setTimeout(() => {
            if (lastInterimText) {
              const txt = lastInterimText;
              lastInterimText = '';
              dispatchRecognizedSpeech(txt);
            }
          }, 700);
        }
      };

      speechRec.onerror = (ev) => {
        const err = ev && ev.error ? ev.error : '';
        if (err === 'not-allowed' || err === 'service-not-allowed') {
          speechBlocked = true;
          ui.voiceListening = false;
          render();
          showToast('Permiso de micrófono bloqueado en el navegador');
        }
      };

      speechRec.onend = () => {
        if (lastInterimText && !isSpeakingTTS) {
          const txt = lastInterimText;
          lastInterimText = '';
          dispatchRecognizedSpeech(txt);
        }
        if (ui.voiceListening && !speechBlocked && ui.route === 'board') {
          setTimeout(() => {
            if (ui.voiceListening && !speechBlocked && ui.route === 'board') {
              try { speechRec.start(); } catch {}
            }
          }, 350);
        } else if (!ui.voiceListening || speechBlocked) {
          ui.voiceListening = false;
          render();
        }
      };
    }

    try { speechRec.start(); } catch {}
  } catch {
    ui.voiceListening = false;
    render();
    showToast('No se pudo iniciar el micrófono');
  }
}

function toggleVoiceControl() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showToast('Tu navegador no soporta control por voz');
    return;
  }
  if (ui.voiceListening) {
    ui.voiceListening = false;
    speechBlocked = false;
    clearTimeout(interimTimer);
    lastInterimText = '';
    if (speechRec) {
      try { speechRec.stop(); } catch {}
    }
    showToast('Control por voz desactivado');
    render();
    return;
  }

  if (isInAppWebView() && /Android/i.test(navigator.userAgent || '')) {
    showToast('Tip: tocá ••• → "Abrir en Chrome" para mejor reconocimiento de voz');
  }

  speechBlocked = false;
  ui.voiceListening = true;
  render();
  showToast('🎤 Micrófono activo');
  startSpeechSession();
}

function normVoiceStr(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}

function findPlayerInCommand(cmd, m) {
  const c = normVoiceStr(cmd);
  if (!c) return null;

  // 0. Explicit "drive 1/2", "reves 1/2", "jugador 1..4"
  if (/\bdrive\s*(2|dos)\b/.test(c)) return { team: 1, playerIdx: 0, name: playerLabel(m, 1, 0) };
  if (/\breves\s*(2|dos)\b/.test(c)) return { team: 1, playerIdx: 1, name: playerLabel(m, 1, 1) };
  if (/\bdrive\s*(1|uno)?\b/.test(c)) return { team: 0, playerIdx: 0, name: playerLabel(m, 0, 0) };
  if (/\breves\s*(1|uno)?\b/.test(c)) return { team: 0, playerIdx: 1, name: playerLabel(m, 0, 1) };
  if (/\bjugador\s*(1|uno)\b/.test(c)) return { team: 0, playerIdx: 0, name: playerLabel(m, 0, 0) };
  if (/\bjugador\s*(2|dos)\b/.test(c)) return { team: 0, playerIdx: 1, name: playerLabel(m, 0, 1) };
  if (/\bjugador\s*(3|tres)\b/.test(c)) return { team: 1, playerIdx: 0, name: playerLabel(m, 1, 0) };
  if (/\bjugador\s*(4|cuatro)\b/.test(c)) return { team: 1, playerIdx: 1, name: playerLabel(m, 1, 1) };

  const words = c.split(/\s+/);
  // 1. Exact full name or exact token match (3+ chars, excluding generic "jugador")
  for (let t = 0; t < 2; t++) {
    for (let pi = 0; pi < 2; pi++) {
      const raw = m.teams[t].players[pi] || '';
      const fn = normVoiceStr(raw);
      if (!fn) continue;
      if (c.includes(fn)) return { team: t, playerIdx: pi, name: playerLabel(m, t, pi) };
      const parts = fn.split(/\s+/).filter(w => w.length >= 3 && w !== 'jugador');
      for (const part of parts) {
        if (words.includes(part) || c.includes(part)) {
          return { team: t, playerIdx: pi, name: playerLabel(m, t, pi) };
        }
      }
    }
  }
  // 2. Prefix match (4+ chars, e.g., "mati" in "matias", excluding "jugador")
  for (let t = 0; t < 2; t++) {
    for (let pi = 0; pi < 2; pi++) {
      const raw = m.teams[t].players[pi] || '';
      const first = normVoiceStr(raw).split(/\s+/)[0] || '';
      if (first.length >= 4 && first !== 'jugador') {
        const pref = first.slice(0, 4);
        if (words.some(w => w.startsWith(pref))) {
          return { team: t, playerIdx: pi, name: playerLabel(m, t, pi) };
        }
      }
    }
  }
  return null;
}

function findTeamInCommand(cmd, m) {
  const c = normVoiceStr(cmd);
  const c0 = normVoiceStr(COLORS.find(x => x.c === m.teams[0].color)?.n || 'dorado');
  const c1 = normVoiceStr(COLORS.find(x => x.c === m.teams[1].color)?.n || 'azul');
  const isGold0 = m.teams[0].color === '#d4af37' && (c.includes('oro') || c.includes('amarillo'));
  const isGold1 = m.teams[1].color === '#d4af37' && (c.includes('oro') || c.includes('amarillo'));
  if (c.includes(c0) || isGold0 || c.includes('pareja 1') || c.includes('pareja uno') || c.includes('equipo 1') || c.includes('equipo uno') || c.includes('izquierda') || c.includes('arriba') || c.includes('nosotros')) return 0;
  if (c.includes(c1) || isGold1 || c.includes('pareja 2') || c.includes('pareja dos') || c.includes('equipo 2') || c.includes('equipo dos') || c.includes('derecha') || c.includes('abajo') || c.includes('ellos')) return 1;
  return null;
}

function setServerToPlayer(targetTeam, targetPlayer) {
  if (!activeMatch) return;
  const st = computeMatch(activeMatch);
  const rotIdx = st.totalGamesPlayed % 4;
  if (rotIdx % 2 === 0) {
    const pA1 = (rotIdx === 0) ? targetPlayer : (1 - targetPlayer);
    activeMatch.firstServer = [targetTeam, pA1];
  } else {
    const prevP = activeMatch.firstServer ? activeMatch.firstServer[1] : 0;
    activeMatch.firstServer = [1 - targetTeam, prevP];
    const pB1 = (rotIdx === 1) ? targetPlayer : (1 - targetPlayer);
    activeMatch.secondServerIdx = pB1;
  }
  ui.secondSrvPrompt = false;
  persistActive();
  render();
  showToast(`🎤 Al saque: ${playerLabel(activeMatch, targetTeam, targetPlayer)}`);
}

function handleVoiceCommand(rawCmd) {
  if (!activeMatch) return;
  const cmd = normVoiceStr(rawCmd);
  if (!cmd) return;

  // 1. History & modal navigation commands
  if (cmd.includes('deshacer') || cmd.includes('atras') || cmd.includes('corregir')) { undoPoint(); showToast('🎤 Punto deshecho'); return; }
  if (cmd.includes('rehacer')) { redoPoint(); showToast('🎤 Punto rehecho'); return; }
  if (cmd.includes('cancelar') || cmd.includes('cerrar')) {
    if (ui.shotSheet || ui.menuOpen || ui.changeoverOverlay) {
      ui.shotSheet = null; ui.menuOpen = false; ui.changeoverOverlay = null;
      render();
      return;
    }
  }
  if (ui.changeoverOverlay && (cmd.includes('continuar') || cmd.includes('reanudar') || cmd.includes('listo'))) {
    ui.changeoverOverlay = null;
    render();
    return;
  }
  if (cmd.includes('cambio de lado') || cmd.includes('cambiar de lado') || cmd.includes('cambiar lado') || cmd === 'lado' || cmd === 'lados') {
    flipSides();
    showToast('🎤 Lados cambiados');
    return;
  }

  // 2. Serve faults (check before generic "saque" command)
  const st = computeMatch(activeMatch);
  if (cmd.includes('doble falta')) {
    activeMatch.pendingFault = false;
    showToast(`🎤 Doble falta de ${playerLabel(activeMatch, st.srvTeam, st.srvPlayer)}`);
    scorePoint(1 - st.srvTeam, 'df', [st.srvTeam, st.srvPlayer]);
    return;
  }
  if (cmd.includes('falta') || cmd.includes('segundo saque')) {
    recordFault();
    return;
  }

  // 3. Choosing 2nd server modal OR explicit serve assignment ("saca [nombre]", "al saque [nombre]", "siguiente al saque [nombre]")
  const isServeAssignCmd = /\b(saca|saque|sirve|sacador|servir)\b/.test(cmd);
  if (ui.secondSrvPrompt || isServeAssignCmd) {
    const pl = findPlayerInCommand(cmd, activeMatch);
    if (ui.secondSrvPrompt) {
      const tB = 1 - activeMatch.firstServer[0];
      if (pl && pl.team === tB) {
        activeMatch.secondServerIdx = pl.playerIdx;
        ui.secondSrvPrompt = false;
        persistActive();
        render();
        showToast(`🎤 Al saque: ${pl.name}`);
        return;
      }
      if (pl) {
        setServerToPlayer(pl.team, pl.playerIdx);
        return;
      }
      if (cmd.includes('uno') || cmd.includes('primer')) {
        activeMatch.secondServerIdx = 0;
        ui.secondSrvPrompt = false;
        persistActive();
        render();
        showToast(`🎤 Al saque: ${playerLabel(activeMatch, tB, 0)}`);
        return;
      }
      if (cmd.includes('dos') || cmd.includes('segund')) {
        activeMatch.secondServerIdx = 1;
        ui.secondSrvPrompt = false;
        persistActive();
        render();
        showToast(`🎤 Al saque: ${playerLabel(activeMatch, tB, 1)}`);
        return;
      }
      return;
    }

    // Explicit serve assignment command outside the prompt
    if (pl) {
      const isNextKeyword = cmd.includes('siguiente') || cmd.includes('proximo') || cmd.includes('despues');
      if (isNextKeyword && pl.team === (1 - activeMatch.firstServer[0]) && st.totalGamesPlayed === 0) {
        activeMatch.secondServerIdx = pl.playerIdx;
        persistActive();
        render();
        showToast(`🎤 Próximo saque (${teamLabel(activeMatch, pl.team)}): ${pl.name}`);
        return;
      }
      setServerToPlayer(pl.team, pl.playerIdx);
      return;
    }
    // Generic "cambiar sacador" / "siguiente sacador"
    const nextPi = 1 - st.srvPlayer;
    setServerToPlayer(st.srvTeam, nextPi);
    return;
  }

  // 4. Detect detailed shot type: Unforced Error (ue), Forced Error (fe), or Winner (winner)
  const isUE = cmd.includes('no forzado') || cmd.includes('error no') || cmd.includes('fallo') || cmd.includes('afuera') || cmd.includes('a la red') || cmd.includes('en la red') || cmd.includes('al cristal') || cmd.includes('a la reja') || (cmd.includes('error') && !cmd.includes('forzado'));
  const isFE = !isUE && cmd.includes('forzado');
  const isWinner = !isUE && !isFE && (cmd.includes('winner') || cmd.includes('ganador') || cmd.includes('smash') || cmd.includes('remate') || cmd.includes('por tres') || cmd.includes('por 3') || cmd.includes('por cuatro') || cmd.includes('por 4') || cmd.includes('bajada') || cmd.includes('volea') || cmd.includes('bandeja') || cmd.includes('vibora') || cmd.includes('dejada') || cmd.includes('chiquita') || cmd.includes('passing') || cmd.includes('globo'));

  function detectSpecificWinnerShot(str) {
    if (str.includes('smash') || str.includes('remate') || str.includes('por tres') || str.includes('por 3') || str.includes('por cuatro') || str.includes('por 4')) return 'smash';
    if (str.includes('volea')) return 'volea';
    if (str.includes('bandeja') || str.includes('vibora') || str.includes('víbora')) return 'bandeja';
    if (str.includes('bajada')) return 'bajada';
    if (str.includes('dejada') || str.includes('chiquita')) return 'dejada';
    if (str.includes('passing') || str.includes('paralelo')) return 'passing';
    if (str.includes('globo')) return 'globo';
    return 'winner';
  }
  const SHOT_NAMES = { smash:'Smash', volea:'Volea', bandeja:'Bandeja', bajada:'Bajada de pared', dejada:'Dejada', passing:'Passing', globo:'Globo', winner:'Winner' };

  if (isUE || isFE) {
    const sType = isUE ? 'ue' : 'fe';
    const sLabel = isUE ? 'Error no forzado' : 'Error forzado';
    // Look for player mentioned after "error"/"forzado"/"fallo" first (handles "Punto Mati por error no forzado de Fabián")
    const errMatch = cmd.match(/(?:no forzado|forzado|error|fallo|red|cristal|reja|afuera)(.*)$/);
    const plAfter = errMatch && errMatch[1] ? findPlayerInCommand(errMatch[1], activeMatch) : null;
    const pl = plAfter || findPlayerInCommand(cmd, activeMatch);

    if (pl) {
      const winTeam = 1 - pl.team;
      showToast(`🎤 ${sLabel} de ${pl.name} → Punto ${teamLabel(activeMatch, winTeam)}`);
      scorePoint(winTeam, sType, [pl.team, pl.playerIdx]);
      return;
    }
    if (ui.shotSheet) {
      const w = ui.shotSheet.team;
      const l = 1 - w;
      const pi = (cmd.includes('dos') || cmd.includes('segund')) ? 1 : 0;
      const errName = playerLabel(activeMatch, l, pi);
      showToast(`🎤 ${sLabel} de ${errName}`);
      scorePoint(w, sType, [l, pi]);
      return;
    }
    const tmErr = findTeamInCommand(cmd, activeMatch);
    if (tmErr !== null) {
      const winTeam = 1 - tmErr;
      showToast(`🎤 ${sLabel} de ${teamLabel(activeMatch, tmErr)} → Punto ${teamLabel(activeMatch, winTeam)}`);
      scorePoint(winTeam, sType, [tmErr, 0]);
      return;
    }
    showToast(`🎤 Decí el jugador: "${sLabel.toLowerCase()} de [nombre]"`);
    return;
  }

  if (isWinner) {
    const subShot = detectSpecificWinnerShot(cmd);
    const subLabel = SHOT_NAMES[subShot] || 'Winner';
    const winMatch = cmd.match(/(?:winner|ganador|smash|remate|volea|bandeja|vibora|bajada|dejada|chiquita|passing|globo)(.*)$/);
    const plAfter = winMatch && winMatch[1] ? findPlayerInCommand(winMatch[1], activeMatch) : null;
    const pl = plAfter || findPlayerInCommand(cmd, activeMatch);
    if (pl) {
      showToast(`🎤 ${subLabel} de ${pl.name}`);
      scorePoint(pl.team, 'winner', [pl.team, pl.playerIdx], subShot);
      return;
    }
    if (ui.shotSheet) {
      const w = ui.shotSheet.team;
      const pi = (cmd.includes('dos') || cmd.includes('segund')) ? 1 : 0;
      const wName = playerLabel(activeMatch, w, pi);
      showToast(`🎤 ${subLabel} de ${wName}`);
      scorePoint(w, 'winner', [w, pi], subShot);
      return;
    }
    const tmWin = findTeamInCommand(cmd, activeMatch);
    if (tmWin !== null) {
      showToast(`🎤 ${subLabel} de ${teamLabel(activeMatch, tmWin)}`);
      scorePoint(tmWin, 'winner', [tmWin, 0], subShot);
      return;
    }
  }

  // 5. If shot attribution modal is open and user says a player name or "punto rápido"
  if (ui.shotSheet) {
    const w = ui.shotSheet.team;
    if (cmd.includes('rapido') || cmd.includes('sin detalle') || cmd.includes('normal')) {
      scorePoint(w, 'pt', null);
      return;
    }
    const pl = findPlayerInCommand(cmd, activeMatch);
    if (pl) {
      if (pl.team === w) {
        const subShot = detectSpecificWinnerShot(cmd);
        const subLabel = SHOT_NAMES[subShot] || 'Winner';
        showToast(`🎤 ${subLabel} de ${pl.name}`);
        scorePoint(w, 'winner', [w, pl.playerIdx], subShot);
      } else {
        showToast(`🎤 Error no forzado de ${pl.name}`);
        scorePoint(w, 'ue', [pl.team, pl.playerIdx]);
      }
      return;
    }
  }

  // 6. Player name said directly -> Winner for that player (populates player stats!)
  const plDirect = findPlayerInCommand(cmd, activeMatch);
  if (plDirect) {
    showToast(`🎤 Punto (Winner) de ${plDirect.name}`);
    scorePoint(plDirect.team, 'winner', [plDirect.team, plDirect.playerIdx]);
    return;
  }

  // 7. Team color / number / side said directly -> Quick point for that team
  const tmDirect = findTeamInCommand(cmd, activeMatch);
  if (tmDirect !== null) {
    showToast(`🎤 Punto ${teamLabel(activeMatch, tmDirect)}`);
    scorePoint(tmDirect, 'pt', null);
    return;
  }
  if (cmd.includes('uno')) { scorePoint(0, 'pt', null); return; }
  if (cmd.includes('dos')) { scorePoint(1, 'pt', null); return; }
  showToast(`🎤 Escuché: "${rawCmd.trim()}"`);
}

// ==================== TIMERS (MATCH CLOCK & CHANGEOVER) ====================
let lastTickAt = Date.now();
setInterval(() => {
  const now = Date.now();
  const dt = Math.min(2500, Math.max(0, now - lastTickAt));
  lastTickAt = now;

  if (activeMatch && activeMatch.status === 'playing' && (ui.route === 'board' || ui.route === 'obs' || ui.route === 'display') && !ui.changeoverOverlay) {
    activeMatch.durationMs = (activeMatch.durationMs || 0) + dt;
    const clkEl = document.getElementById('sb-clock-val');
    if (clkEl) clkEl.textContent = fmtClock(activeMatch.durationMs);
  } else if ((ui.route === 'live' || ui.route === 'obs') && ui.liveMatch && ui.liveMatch.status === 'playing') {
    ui.liveMatch.durationMs = (ui.liveMatch.durationMs || 0) + dt;
    const clkEl = document.getElementById('sb-clock-val');
    if (clkEl) clkEl.textContent = fmtClock(ui.liveMatch.durationMs);
  }

  if (ui.changeoverOverlay && ui.changeoverOverlay.secondsLeft > 0) {
    ui.changeoverOverlay.secondsLeft = Math.max(0, ui.changeoverOverlay.secondsLeft - 1);
    const cdEl = document.getElementById('co-countdown');
    if (cdEl) cdEl.textContent = `${ui.changeoverOverlay.secondsLeft}s`;
    if (ui.changeoverOverlay.secondsLeft === 0) {
      playTone('game');
      vibrate([120, 80, 120]);
    }
  }
}, 1000);

function fmtClock(ms) {
  const totalSec = Math.floor((ms || 0) / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function fmtDurationLong(ms) {
  const min = Math.max(1, Math.round((ms || 0) / 60000));
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h > 0 ? `${h} h ${String(m).padStart(2,'0')}'` : `${m} min`;
}
function fmtDateLong(ts) {
  try {
    const d = new Date(ts);
    const dateStr = d.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    const timeStr = d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', hour12:false});
    return `${dateStr} · ${timeStr}`;
  } catch { return ''; }
}

// ==================== TOAST HELPER ====================
let toastTimer = null;
function showToast(msg) {
  let el = document.getElementById('live-toast');
  if (el) el.remove();
  el = document.createElement('div');
  el.id = 'live-toast';
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { if (el.parentNode) el.remove(); }, 2400);
}

// ==================== MATCH ACTIONS ====================
function onTapTeam(team) {
  if (!activeMatch || activeMatch.status !== 'playing') return;
  const st = computeMatch(activeMatch);
  if (st.matchWinner !== null) return;
  if (activeMatch.shotPrompt) {
    ui.shotSheet = { team };
    render();
  } else {
    scorePoint(team, 'pt', null);
  }
}

function scorePoint(team, shotType = 'pt', byPlayer = null, subType = null) {
  if (!activeMatch) return;
  const stBefore = computeMatch(activeMatch);
  if (stBefore.matchWinner !== null) return;

  const fs = !activeMatch.pendingFault;
  activeMatch.pendingFault = false;
  activeMatch.redoStack = [];
  activeMatch.events.push({
    w: team,
    type: shotType,
    by: byPlayer,
    fs,
    sub: subType || null
  });
  ui.shotSheet = null;

  const stAfter = computeMatch(activeMatch);
  const tr = stAfter.lastTransition;

  if (tr) {
    if (tr.type === 'match') {
      activeMatch.status = 'finished';
      ui.matchEndDismissed = false;
      archiveMatchToHistory(activeMatch);
      playTone('match');
      vibrate([100, 60, 100, 60, 220]);
    } else if (tr.type === 'set') {
      playTone('set');
      vibrate([90, 50, 140]);
      const setG = stAfter.sets[tr.setIdx].games;
      if (tr.changeover) activeMatch.flipped = !activeMatch.flipped;
      if (prefs.changeoverAlerts) {
        ui.changeoverOverlay = {
          title: tr.changeover ? `FIN DEL SET ${tr.setIdx + 1} · CAMBIO DE LADO` : `FIN DEL SET ${tr.setIdx + 1}`,
          sub: `${teamLabel(activeMatch, tr.winner)} ganó el set ${setG[0]}-${setG[1]}`,
          secondsLeft: 120
        };
      }
    } else if (tr.type === 'game') {
      playTone('game');
      vibrate([80, 50, 80]);
      if (tr.changeover) {
        activeMatch.flipped = !activeMatch.flipped;
        if (prefs.changeoverAlerts) {
          const g = stAfter.curSet.games;
          ui.changeoverOverlay = {
            title: 'CAMBIO DE LADO',
            sub: `Marcador del set: ${g[0]} - ${g[1]}`,
            secondsLeft: Number(prefs.changeoverTimer) || 90
          };
        }
      }
      if (tr.needSecondServerPrompt) {
        ui.secondSrvPrompt = true;
      }
    } else if (tr.type === 'tb_changeover') {
      playTone('game');
      vibrate([70, 50, 70]);
      activeMatch.flipped = !activeMatch.flipped;
      if (prefs.changeoverAlerts) {
        ui.changeoverOverlay = {
          title: 'CAMBIO DE LADO (TIE-BREAK)',
          sub: `Tie-break: ${tr.tbScore[0]} - ${tr.tbScore[1]}`,
          secondsLeft: 20
        };
      }
    }
  } else {
    playTone('point');
    vibrate(35);
  }

  persistActive();
  render();
  speakScore(activeMatch, stAfter);

  // Visual flash on scored half
  requestAnimationFrame(() => {
    const halfEl = document.querySelector(`.half[data-team="${team}"]`);
    if (halfEl) {
      halfEl.classList.add('flash');
      setTimeout(() => halfEl.classList.remove('flash'), 550);
    }
  });
}

function recordFault() {
  if (!activeMatch || activeMatch.status !== 'playing') return;
  const st = computeMatch(activeMatch);
  if (st.matchWinner !== null) return;

  if (!activeMatch.pendingFault) {
    activeMatch.pendingFault = true;
    playTone('fault');
    vibrate(45);
    showToast(`2º saque · ${playerLabel(activeMatch, st.srvTeam, st.srvPlayer)}`);
    persistActive();
    render();
  } else {
    // Double fault -> point to receiver, UE attributed to server
    const srvTeam = st.srvTeam;
    const srvPlayer = st.srvPlayer;
    activeMatch.pendingFault = false;
    showToast(`Doble falta de ${playerLabel(activeMatch, srvTeam, srvPlayer)}`);
    scorePoint(1 - srvTeam, 'df', [srvTeam, srvPlayer]);
  }
}

function undoPoint() {
  if (!activeMatch) return;
  if (activeMatch.pendingFault) {
    activeMatch.pendingFault = false;
    playTone('undo');
    persistActive();
    render();
    return;
  }
  if (!activeMatch.events.length) return;
  const ev = activeMatch.events.pop();
  activeMatch.redoStack = activeMatch.redoStack || [];
  activeMatch.redoStack.push(ev);
  if (activeMatch.status === 'finished') activeMatch.status = 'playing';
  ui.changeoverOverlay = null;
  ui.secondSrvPrompt = false;
  playTone('undo');
  vibrate(30);
  persistActive();
  render();
}

function redoPoint() {
  if (!activeMatch || !activeMatch.redoStack || !activeMatch.redoStack.length) return;
  const ev = activeMatch.redoStack.pop();
  activeMatch.events.push(ev);
  const stAfter = computeMatch(activeMatch);
  if (stAfter.matchWinner !== null) {
    activeMatch.status = 'finished';
    archiveMatchToHistory(activeMatch);
  }
  playTone('point');
  persistActive();
  render();
}

function flipSides() {
  if (!activeMatch) return;
  activeMatch.flipped = !activeMatch.flipped;
  persistActive();
  render();
}

function finishMatchEarly() {
  if (!activeMatch) return;
  const st = computeMatch(activeMatch);
  activeMatch.status = st.matchWinner !== null ? 'finished' : 'abandoned';
  archiveMatchToHistory(activeMatch);
  publishLiveMatchState(activeMatch, true);
  const finishedId = activeMatch.id;
  activeMatch = null;
  persistActive();
  ui.menuOpen = false;
  ui.statsId = finishedId;
  ui.statsSetFilter = 'all';
  navigate('stats');
  showToast('Partido guardado en el historial');
}

function startNewMatch() {
  activeMatch = createMatchFromPreset(preset);
  preset.fixtureId = '';
  saveJSON(LS_PRESET, preset);
  persistActive();
  ui.shotSheet = null;
  ui.changeoverOverlay = null;
  ui.secondSrvPrompt = false;
  ui.matchEndDismissed = false;
  navigate('board');
}

// ==================== URL SHARING, LIVE BROADCAST & EXPORT (PDF / PNG / LINK) ====================
const SUB_TYPES = ['winner', 'smash', 'volea', 'bandeja', 'bajada', 'dejada', 'passing', 'globo'];

function encodeMatchShare(m) {
  try {
    // Compact payload for URL sharing & real-time live broadcast
    const TMAP_REV = { pt: 0, winner: 1, ue: 2, fe: 3, df: 4 };
    const evList = m.events || [];
    let canPack = true;
    const packedTokens = [];
    for (let i = 0; i < evList.length; i++) {
      const ev = evList[i];
      const w = ev.w === 1 ? 1 : 0;
      const tCode = TMAP_REV[ev.type || 'pt'] || 0;
      const by0 = ev.by ? Number(ev.by[0]) : -1;
      const by1 = ev.by ? Number(ev.by[1]) : -1;
      const fsBit = ev.fs === false ? 0 : 1;
      const subIdx = ev.sub ? Math.max(0, SUB_TYPES.indexOf(ev.sub)) : 0;
      if ((by0 !== -1 && (by0 < 0 || by0 > 1)) || (by1 !== -1 && (by1 < 0 || by1 > 1)) || subIdx > 8) {
        canPack = false;
        break;
      }
      packedTokens.push(`${w}${tCode}${by0 < 0 ? 9 : by0}${by1 < 0 ? 9 : by1}${fsBit}${subIdx}`);
    }
    const compact = {
      id: m.id,
      ts: Date.now(),
      c: m.createdAt,
      d: m.durationMs,
      s: m.status,
      m: m.mode,
      cp: m.competition || null,
      ms: m.manualSets || null,
      mw: m.isDraw ? 'draw' : (m.manualWinner ?? null),
      drw: m.isDraw ? 1 : 0,
      wo: m.isWalkover ? 1 : 0,
      t: m.teams,
      r: m.rules,
      fs: m.firstServer,
      ss: m.secondServerIdx,
      fl: m.flipped ? 1 : 0,
      pf: m.pendingFault ? 1 : 0,
      // Pack events as compact 6-char string when possible (>2x smaller than JSON nested arrays)
      e: canPack
        ? packedTokens.join('')
        : evList.map(ev => {
            const subIdx = ev.sub ? SUB_TYPES.indexOf(ev.sub) : 0;
            return [
              ev.w,
              TMAP_REV[ev.type || 'pt'] || 0,
              ev.by ? ev.by[0] : -1,
              ev.by ? ev.by[1] : -1,
              ev.fs === false ? 0 : 1,
              subIdx > 0 ? subIdx : 0
            ];
          })
    };
    const json = JSON.stringify(compact);
    const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    return b64;
  } catch (e) { return ''; }
}

function decodeMatchShare(b64) {
  try {
    const norm = String(b64 || '').trim().replace(/-/g,'+').replace(/_/g,'/');
    if (!norm) return null;
    const json = decodeURIComponent(escape(atob(norm)));
    const c = JSON.parse(json);
    const TMAP = ['pt','winner','ue','fe','df'];
    let rawEvs = [];
    if (Array.isArray(c.e)) {
      rawEvs = c.e;
    } else if (typeof c.e === 'string' && c.e.length >= 6) {
      for (let i = 0; i + 6 <= c.e.length; i += 6) {
        const s = c.e;
        rawEvs.push([
          Number(s[i]),
          Number(s[i + 1]),
          s[i + 2] === '9' ? -1 : Number(s[i + 2]),
          s[i + 3] === '9' ? -1 : Number(s[i + 3]),
          Number(s[i + 4]),
          Number(s[i + 5])
        ]);
      }
    }
    return {
      id: c.id || ('shared_' + (c.c || Date.now())),
      _ts: c.ts || 0,
      createdAt: c.c || Date.now(),
      durationMs: c.d || 0,
      status: c.s || 'finished',
      mode: c.m || 'doubles',
      competition: c.cp || null,
      manualSets: c.ms || null,
      manualWinner: c.mw ?? null,
      isDraw: !!(c.drw || c.mw === 'draw'),
      isWalkover: !!c.wo,
      teams: c.t,
      rules: c.r,
      firstServer: c.fs || [0,0],
      secondServerIdx: c.ss ?? 0,
      shotPrompt: true,
      flipped: !!c.fl,
      pendingFault: !!c.pf,
      events: rawEvs.map(a => ({
        w: a[0],
        type: TMAP[a[1]] || 'pt',
        by: a[2] >= 0 ? [a[2], a[3]] : null,
        fs: a[4] !== 0,
        sub: (a[5] && a[5] > 0 && SUB_TYPES[a[5]]) ? SUB_TYPES[a[5]] : null
      })),
      redoStack: []
    };
  } catch { return null; }
}

// Serverless Real-Time Live Broadcast (Pub/Sub via ntfy.sh SSE + JSON cache)
let livePubTimer = null;
let livePubRetryTimer = null;
let liveEvtSource = null;
let livePollTimer = null;
let livePollBusy = false;
let liveLastPollAt = 0;
let liveLastMsgTime = 0;
let livePollBackoffUntil = 0;
let lastPublishedSig = '';
let lastAppliedSig = '';
let livePubInFlight = false;
let livePubQueued = false;
let livePubLastSentAt = 0;
let livePubRetryCount = 0;
let livePubBackoffUntil = 0;
let livePubTargetMatch = null;

function shortMatchCode(id) {
  const clean = String(id || 'default').replace(/^m_/, '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
  return clean.slice(-6) || 'padel1';
}

function cleanLiveTopic(id) {
  return 'padel_se_live_' + shortMatchCode(id);
}

function matchStateSignature(m) {
  if (!m) return '';
  const lastEv = m.events && m.events.length ? m.events[m.events.length - 1] : null;
  return [
    m.id,
    m.status,
    m.events ? m.events.length : 0,
    lastEv ? `${lastEv.w}:${lastEv.type}:${lastEv.fs}:${lastEv.sub || ''}:${lastEv.by ? lastEv.by.join(',') : ''}` : '',
    m.pendingFault ? 1 : 0,
    m.flipped ? 1 : 0,
    m.firstServer ? m.firstServer.join(',') : '',
    m.secondServerIdx ?? '',
    m.teams ? m.teams.map(t => t.players.join(',') + ':' + t.color).join('|') : '',
    m.rules ? `${m.rules.totalSets}:${m.rules.gamesPerSet}:${m.rules.deuceRule}:${m.rules.finalSet}:${m.rules.changeoverRule}` : ''
  ].join('#');
}

function scheduleLivePublishRetry(retryAfterSec = 0) {
  livePubRetryCount++;
  const backoff = retryAfterSec > 0
    ? Math.min(20000, retryAfterSec * 1000)
    : Math.min(12000, Math.round(1400 * Math.pow(1.6, livePubRetryCount - 1)));
  livePubBackoffUntil = Date.now() + backoff;
  livePubInFlight = false;
  clearTimeout(livePubRetryTimer);
  livePubRetryTimer = setTimeout(() => {
    flushLiveMatchPublish(false);
  }, backoff);
}

async function flushLiveMatchPublish(force = false) {
  if (livePubInFlight) {
    livePubQueued = true;
    return false;
  }
  const m = livePubTargetMatch || activeMatch;
  if (!m || !m.id) return false;
  const sig = matchStateSignature(m);
  if (!force && sig && sig === lastPublishedSig) {
    livePubQueued = false;
    return true;
  }
  const b64 = encodeMatchShare(m);
  if (!b64) return false;

  livePubInFlight = true;
  livePubQueued = false;
  clearTimeout(livePubRetryTimer);
  const topic = cleanLiveTopic(m.id);

  try {
    // Simple CORS POST (no custom headers) avoids doubling traffic with preflight OPTIONS
    const res = await fetch(`https://ntfy.sh/${topic}`, {
      method: 'POST',
      body: b64
    });
    if (res && res.ok) {
      lastPublishedSig = sig;
      livePubLastSentAt = Date.now();
      livePubRetryCount = 0;
      livePubBackoffUntil = 0;
      livePubInFlight = false;
      const latest = livePubTargetMatch || activeMatch;
      if (livePubQueued || (latest && latest.id === m.id && matchStateSignature(latest) !== lastPublishedSig)) {
        publishLiveMatchState(latest, false);
      }
      return true;
    }
    const retryHdr = Number(res?.headers?.get?.('Retry-After')) || 0;
    scheduleLivePublishRetry(retryHdr);
    return false;
  } catch {
    scheduleLivePublishRetry(0);
    return false;
  }
}

function publishLiveMatchState(m, immediate = false, force = false) {
  if (!m || !m.id) return;
  if (livePubTargetMatch && livePubTargetMatch.id !== m.id) {
    lastPublishedSig = '';
    livePubRetryCount = 0;
    livePubBackoffUntil = 0;
  }
  if (force) lastPublishedSig = '';
  livePubTargetMatch = m;
  const sig = matchStateSignature(m);
  if (!force && !immediate && sig && sig === lastPublishedSig) return;

  clearTimeout(livePubTimer);
  const now = Date.now();
  if (immediate && !livePubInFlight && (force || now >= livePubBackoffUntil)) {
    flushLiveMatchPublish(force);
    return;
  }
  const elapsed = now - livePubLastSentAt;
  const backoffWait = Math.max(0, livePubBackoffUntil - now);
  const delay = Math.max(backoffWait, immediate ? 80 : Math.max(260, 650 - elapsed));
  livePubTimer = setTimeout(() => flushLiveMatchPublish(force), delay);
}

function canUseMobileWebShare() {
  if (typeof navigator === 'undefined' || typeof navigator.share !== 'function') return false;
  if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') {
    if (!navigator.userAgentData.mobile) return false;
  }
  const ua = navigator.userAgent || '';
  if (/Windows|Win32|Win64|CrOS|X11/i.test(ua)) return false;
  if (/Linux/i.test(ua) && !/Android/i.test(ua)) return false;
  return /Android|iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1);
}

/** Shares text/URL via native sheet only on mobile devices; copies to clipboard on desktop. */
async function shareOrCopyText({ title, text, url, copyText, toastMsg, promptMsg }) {
  if (canUseMobileWebShare()) {
    try {
      const payload = { title, text };
      if (url) payload.url = url;
      await navigator.share(payload);
      return true;
    } catch {}
  }
  const finalText = copyText != null ? copyText : (url ? `${text}\n${url}` : text);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(finalText);
      showToast(toastMsg || 'Enlace copiado al portapapeles');
      return true;
    } catch {}
  }
  prompt(promptMsg || 'Copiá este texto para compartir:', finalText);
  return false;
}

function applyIncomingLiveSnapshot(b64, isInitial = false) {
  const incoming = decodeMatchShare(b64);
  if (!incoming || !incoming.teams) return;
  if (ui.liveId && incoming.id && shortMatchCode(incoming.id) !== shortMatchCode(ui.liveId)) return;

  const prev = ui.liveMatch;
  // Ignore out-of-order stale HTTP poll responses that are strictly older than applied state
  if (prev && prev.id === incoming.id && incoming._ts > 0 && prev._ts > 0 && incoming._ts < prev._ts) {
    return;
  }

  const sig = matchStateSignature(incoming);
  const prevSig = matchStateSignature(prev);

  if (prev && sig === prevSig) {
    if (incoming.durationMs > (prev.durationMs || 0)) {
      prev.durationMs = incoming.durationMs;
    }
    if (incoming._ts > (prev._ts || 0)) {
      prev._ts = incoming._ts;
    }
    return;
  }

  // Detect what changed to trigger live sound, voice & court flash for spectator
  const prevLen = prev && prev.events ? prev.events.length : null;
  const newLen = incoming.events ? incoming.events.length : 0;
  const prevFault = prev ? !!prev.pendingFault : false;

  ui.liveMatch = incoming;
  lastAppliedSig = sig;

  if (!isInitial && prev !== null) {
    if (prevLen !== null && newLen > prevLen) {
      const stAfter = computeMatch(incoming);
      const lastEv = incoming.events[newLen - 1];
      const tr = stAfter.lastTransition;
      if (tr) {
        if (tr.type === 'match') {
          ui.matchEndDismissed = false;
          playTone('match');
          vibrate([100, 60, 100, 60, 220]);
        } else if (tr.type === 'set') {
          playTone('set');
          vibrate([90, 50, 140]);
        } else if (tr.type === 'game' || tr.type === 'tb_changeover') {
          playTone('game');
          vibrate([80, 50, 80]);
        }
      } else {
        playTone('point');
        vibrate(35);
      }
      speakScore(incoming, stAfter);
      if (lastEv && (lastEv.w === 0 || lastEv.w === 1)) {
        requestAnimationFrame(() => {
          const halfEl = document.querySelector(`.half[data-team="${lastEv.w}"]`);
          if (halfEl) {
            halfEl.classList.add('flash');
            setTimeout(() => halfEl.classList.remove('flash'), 550);
          }
        });
      }
    } else if (prevLen !== null && newLen < prevLen) {
      playTone('undo');
    } else if (incoming.pendingFault && !prevFault) {
      playTone('fault');
    }
  }

  if (ui.route === 'live' || ui.route === 'obs' || (ui.route === 'stats' && ui.statsId === 'live')) {
    render();
  }
}

async function pollLiveChannelOnce(topic, forceFull = false) {
  if (!topic || livePollBusy) return;
  const now = Date.now();
  if (!forceFull && now < livePollBackoffUntil) return;
  livePollBusy = true;
  liveLastPollAt = now;
  const sinceParam = (!forceFull && liveLastMsgTime > 0) ? String(Math.max(0, liveLastMsgTime - 3)) : '12h';
  try {
    const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=${encodeURIComponent(sinceParam)}`, { cache: 'no-store' });
    if (res.status === 429) {
      livePollBackoffUntil = Date.now() + 10000;
      return;
    }
    if (!res.ok) return;
    const txt = await res.text();
    const lines = txt.trim().split('\n').filter(Boolean);
    let latestMsg = null;
    for (const line of lines) {
      try {
        const obj = JSON.parse(line);
        if (obj && obj.time) liveLastMsgTime = Math.max(liveLastMsgTime, Number(obj.time) || 0);
        if (obj && obj.event === 'message' && obj.message) {
          latestMsg = obj.message;
        }
      } catch {}
    }
    if (latestMsg) {
      applyIncomingLiveSnapshot(latestMsg, false);
    }
  } catch {} finally {
    livePollBusy = false;
  }
}

function openLiveEventSource(topic) {
  if (!topic || !('EventSource' in window)) return;
  if (liveEvtSource) {
    try { liveEvtSource.close(); } catch {}
    liveEvtSource = null;
  }
  try {
    liveEvtSource = new EventSource(`https://ntfy.sh/${topic}/sse`);
    liveEvtSource.onopen = () => {
      ui.liveConnected = true;
      pollLiveChannelOnce(topic);
    };
    liveEvtSource.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data && data.time) liveLastMsgTime = Math.max(liveLastMsgTime, Number(data.time) || 0);
        if (data && (data.event === 'message' || !data.event) && data.message) {
          ui.liveConnected = true;
          applyIncomingLiveSnapshot(data.message, false);
        }
      } catch {}
    };
    liveEvtSource.onerror = () => {
      ui.liveConnected = false;
    };
  } catch {}
}

function connectLiveSpectator(rawParam) {
  const cleanRaw = String(rawParam || '').trim();
  if (!cleanRaw) return;
  const dotIdx = cleanRaw.indexOf('.');
  const matchId = decodeURIComponent(dotIdx >= 0 ? cleanRaw.slice(0, dotIdx) : cleanRaw);
  const initialSnap = dotIdx >= 0 ? cleanRaw.slice(dotIdx + 1) : '';

  const isSameChannel = (ui.liveId === matchId && liveEvtSource && liveEvtSource.readyState !== 2);
  ui.liveId = matchId;
  if (ui.route !== 'obs') ui.route = 'live';

  if (initialSnap && !ui.liveMatch) {
    applyIncomingLiveSnapshot(initialSnap, true);
  }
  render();
  updateWakeLock();

  if (isSameChannel) return;

  disconnectLiveStreamOnly();
  const topic = cleanLiveTopic(matchId);

  // 1. Immediate fetch of latest cached message from channel
  pollLiveChannelOnce(topic, true);

  // 2. Real-time Server-Sent Events (SSE) stream
  openLiveEventSource(topic);

  // 3. Adaptive polling: 3.5s when SSE is down, light 18s heartbeat when SSE is live (saves ntfy.sh IP quota)
  livePollTimer = setInterval(() => {
    if (!ui.liveId) return;
    if (liveEvtSource && liveEvtSource.readyState === 2) {
      openLiveEventSource(topic);
    }
    const elapsed = Date.now() - liveLastPollAt;
    if (ui.liveConnected && elapsed < 18000) return;
    pollLiveChannelOnce(topic);
  }, 3500);
}

function disconnectLiveStreamOnly() {
  if (liveEvtSource) {
    try { liveEvtSource.close(); } catch {}
    liveEvtSource = null;
  }
  if (livePollTimer) {
    clearInterval(livePollTimer);
    livePollTimer = null;
  }
  livePollBusy = false;
  liveLastPollAt = 0;
  liveLastMsgTime = 0;
  livePollBackoffUntil = 0;
  ui.liveConnected = false;
}

function disconnectLiveSpectator() {
  disconnectLiveStreamOnly();
  ui.liveId = null;
  ui.liveMatch = null;
  if (location.hash.startsWith('#live=') || location.hash.startsWith('#v=')) {
    history.replaceState(null, '', location.pathname + location.search);
  }
}

// ==================== MULTI-DEVICE COMPETITION SYNC ENGINE ====================
const compSeenMsgKeys = new Set();
let compSyncEvtSource = null;
let compSyncWatchCode = '';
let compSyncPollTimer = null;

function cleanSyncCode(raw) {
  return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
}

function newCompSyncCode() {
  const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  return code;
}

function ensureCompSyncCode(comp) {
  if (!comp) return '';
  if (!comp.syncCode) {
    comp.syncCode = newCompSyncCode();
    comp.syncUpdatedAt = Date.now();
    saveCompetitions();
  }
  return comp.syncCode;
}

function compSyncTopic(syncCode) {
  const clean = cleanSyncCode(syncCode).toLowerCase();
  return clean ? ('padel_se_comp_' + clean) : '';
}

function encodeB64Utf8(obj) {
  const json = JSON.stringify(obj);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeB64Utf8(b64) {
  const norm = String(b64 || '').trim().replace(/-/g, '+').replace(/_/g, '/');
  if (!norm) return null;
  const json = decodeURIComponent(escape(atob(norm)));
  return JSON.parse(json);
}

function encodeSyncMessage(evt) {
  try {
    return 'PCS1:' + encodeB64Utf8(evt);
  } catch {
    return '';
  }
}

function decodeSyncMessage(raw) {
  try {
    const s = String(raw || '').trim();
    if (!s) return null;
    if (s.startsWith('PCS1:')) return decodeB64Utf8(s.slice(5));
    if (s.startsWith('{')) return JSON.parse(s);
    return decodeB64Utf8(s);
  } catch {
    return null;
  }
}

function buildCompactSetupData(comp, fixturesOverride = null) {
  const fxList = fixturesOverride !== null ? fixturesOverride : (comp.fixtures || []);
  return {
    v: 1,
    id: comp.id,
    sc: comp.syncCode,
    c: {
      k: comp.kind,
      n: comp.name,
      f: comp.format,
      rm: comp.rankingMode,
      w: comp.winPts,
      dp: comp.drawPts,
      l: comp.lossPts,
      sb: comp.setBonusPts,
      gb: comp.gameBonusPts,
      ng: comp.numGroups,
      ag: comp.advancePerGroup,
      dr: comp.defaultRules
    },
    pt: comp.participants || [],
    fx: fxList.map(f => ({
      id: f.id,
      ph: f.phase,
      ri: f.roundIdx,
      rl: f.roundLabel,
      si: f.slotIdx,
      g: f.group || null,
      t0: f.team0 || null,
      t1: f.team1 || null,
      s0: f.source0 || null,
      s1: f.source1 || null,
      ib: f.isBye ? 1 : 0
    }))
  };
}

function hydrateFixturesFromCompact(fxCompactList) {
  return (fxCompactList || []).map(f => ({
    id: f.id,
    phase: f.ph || f.phase || 'league',
    roundIdx: Number(f.ri ?? f.roundIdx) || 0,
    roundLabel: f.rl || f.roundLabel || 'Cruce',
    slotIdx: Number(f.si ?? f.slotIdx) || 0,
    group: f.g ?? f.group ?? null,
    team0: f.t0 || f.team0 || null,
    team1: f.t1 || f.team1 || null,
    source0: f.s0 || f.source0 || null,
    source1: f.s1 || f.source1 || null,
    matchId: null,
    winnerSide: f.ib ? (f.t0 ? 0 : (f.t1 ? 1 : null)) : null,
    isBye: !!(f.ib || f.isBye)
  }));
}

function encodeCompSetupInline(comp) {
  try {
    if (!comp) return '';
    const fullB64 = encodeB64Utf8(buildCompactSetupData(comp));
    if (fullB64.length <= 720) return fullB64;
    // Strip fixtures if large bracket; ntfy stream still delivers all fixtures live and keeps QR crisp
    const noFxB64 = encodeB64Utf8(buildCompactSetupData(comp, []));
    return noFxB64.length <= 720 ? noFxB64 : '';
  } catch {
    return '';
  }
}

function getCompShareUrl(comp, includeInline = true) {
  const baseUrl = location.href.split('#')[0];
  if (!comp) return baseUrl;
  const sc = cleanSyncCode(ensureCompSyncCode(comp));
  if (includeInline) {
    const inlineB64 = encodeCompSetupInline(comp);
    if (inlineB64) return `${baseUrl}#c=${sc}.${inlineB64}`;

  return `${baseUrl}#c=${sc}`;
}

  return loadArr(LS_COMP_OUTBOX);

function saveCompSyncOutbox(list) {

async function postToCompTopic(topic, body) {
  if (!topic || !body || typeof fetch !== 'function') return false;
  try {
    const res = await fetch(`https://ntfy.sh/${topic}`, {
      method: 'POST',
      body,
      headers: { 'Title': 'Padel SE Comp Sync', 'Cache': 'yes' }
    });
    return !!res.ok;
  } catch {
    return false;
  }
}

async function enqueueAndPublishCompEvent(syncCode, evt) {
  const topic = compSyncTopic(syncCode);
  if (!topic) return false;
  const body = encodeSyncMessage(evt);
  if (!body) return false;

  const ok = await postToCompTopic(topic, body);
  if (!ok) {
    const box = loadCompSyncOutbox();
    box.push({ topic, body, ts: Date.now() });
    saveCompSyncOutbox(box);
  }
  return ok;
}

let flushOutboxInFlight = false;
async function flushCompSyncOutbox() {
  if (flushOutboxInFlight || typeof fetch !== 'function') return 0;
  const box = loadCompSyncOutbox();
  if (!box.length) return 0;
  flushOutboxInFlight = true;
  const remaining = [];
  let sentCount = 0;
  try {
    for (let i = 0; i < box.length; i++) {
      const item = box[i];
      const ok = await postToCompTopic(item.topic, item.body);
      if (ok) sentCount++;
      else {
        remaining.push(...box.slice(i));
        break;
      }
    }
    saveCompSyncOutbox(remaining);
  } finally {
    flushOutboxInFlight = false;
  }
  return sentCount;
}

function encodeCompSyncMatch(comp, m) {
  const fullB64 = encodeMatchShare(m);
  if (fullB64 && fullB64.length <= 2950) {
    return { t: 'M', v: 1, cid: comp.id, sc: comp.syncCode, dev: getDeviceClientId(), ts: Date.now(), full: fullB64 };
  }
  // Fallback compact summary for marathon matches so ntfy never truncates >4KB
  const S = computeStats(m, 'all');
  const st = S.st;
  const played = st.sets.filter((s, idx) => idx === 0 || s.winner !== null || s.games[0] > 0 || s.games[1] > 0);
  const pStats = {};
  (S.P || []).forEach(v => {
    if (!v) return;
    const pk = `${v.team}_${v.playerIdx}`;
    pStats[pk] = {
      w: v.winners || 0,
      u: v.ue || 0,
      f: v.fe || 0,
      st: v.srvPtsTotal || 0,
      sw: v.srvPtsWon || 0,
      fs: v.firstServeIn || 0,
      df: v.doubleFaults || 0,
      sh: v.shots || {}
    };
  });
  return {
    t: 'M',
    v: 1,
    cid: comp.id,
    sc: comp.syncCode,
    dev: getDeviceClientId(),
    ts: Date.now(),
    sum: {
      id: m.id,
      c: m.createdAt,
      d: m.durationMs || 0,
      s: m.status || 'finished',
      m: m.mode || 'doubles',
      wo: m.isWalkover ? 1 : 0,
      cp: m.competition || null,
      tm: m.teams,
      r: m.rules,
      ms: played.map(s => [s.games[0], s.games[1], s.winner, s.tbScore || null, s.isSuperTB ? 1 : 0]),
      mw: st.isDraw ? 'draw' : st.matchWinner,
      drw: st.isDraw ? 1 : 0,
      ps: pStats
    }
  };
}

function decodeCompSyncMatch(evt, comp) {
  let m = null;
  if (evt.full) {
    m = decodeMatchShare(evt.full);
  } else if (evt.sum) {
    const x = evt.sum;
    m = {
      id: x.id,
      createdAt: x.c || Date.now(),
      durationMs: x.d || 0,
      status: x.s || 'finished',
      mode: x.m || 'doubles',
      isWalkover: !!x.wo,
      manualSets: x.ms || [],
      manualWinner: x.mw ?? null,
      isDraw: !!(x.drw || x.mw === 'draw'),
      manualPlayerStats: x.ps || null,
      competition: x.cp || null,
      teams: x.tm,
      rules: x.r,
      firstServer: [0, 0],
      secondServerIdx: 0,
      shotPrompt: false,
      flipped: false,
      pendingFault: false,
      events: [],
      redoStack: []
    };
  }
  if (!m || !m.id || !m.teams) return null;
  m._syncTs = evt.ts || Date.now();
  if (comp) {
    m.competition = {
      ...(m.competition || {}),
      kind: comp.kind,
      compId: comp.id,
      compName: comp.name
    };
  }
  return m;
}

async function publishCompSetup(comp, forceReset = false) {
  if (!comp || !comp.syncCode) return false;
  const allFx = comp.fixtures || [];
  const devId = getDeviceClientId();
  const nowTs = Date.now();
  const baseEvt = {
    t: 'S',
    v: 1,
    cid: comp.id,
    sc: comp.syncCode,
    dev: devId,
    ts: nowTs,
    reset: !!forceReset,
    data: buildCompactSetupData(comp, [])
  };
  let idx = 0;
  while (idx < allFx.length) {
    const candidateFx = allFx.slice(0, idx + 1);
    const candidateEvt = { ...baseEvt, data: buildCompactSetupData(comp, candidateFx) };
    if (encodeSyncMessage(candidateEvt).length > 2850) break;
    idx++;
  }
  const evts = [
    idx > 0 ? { ...baseEvt, data: buildCompactSetupData(comp, allFx.slice(0, idx)) } : baseEvt
  ];
  while (idx < allFx.length) {
    const chunkFx = [];
    while (idx < allFx.length) {
      const nextCompact = buildCompactSetupData(comp, [allFx[idx]]).fx[0];
      const testEvt = {
        t: 'FXC',
        v: 1,
        cid: comp.id,
        sc: comp.syncCode,
        dev: devId,
        ts: nowTs,
        fx: [...chunkFx, nextCompact]
      };
      if (chunkFx.length > 0 && encodeSyncMessage(testEvt).length > 2850) break;
      chunkFx.push(nextCompact);
      idx++;
    }
    evts.push({
      t: 'FXC',
      v: 1,
      cid: comp.id,
      sc: comp.syncCode,
      dev: devId,
      ts: nowTs,
      fx: chunkFx
    });
  }
  let allOk = true;
  for (const evt of evts) {
    const ok = await enqueueAndPublishCompEvent(comp.syncCode, evt);
    if (!ok) allOk = false;
  }
  return allOk;
}

function publishCompMatch(comp, m) {
  if (!comp || !comp.syncCode || !m) return Promise.resolve(false);
  return enqueueAndPublishCompEvent(comp.syncCode, encodeCompSyncMatch(comp, m));
}

function publishCompParticipant(comp, part) {

    t: 'P',

    cid: comp.id,
    sc: comp.syncCode,
    dev: getDeviceClientId(),

}

function publishCompParticipantChange(comp, op, pid, group = null) {

function publishCompFixtureAdd(comp, fx) {

function publishCompDeleteMatch(comp, mid) {

async function publishCompFullSync(comp) {
  if (!comp) return false;
  ensureCompSyncCode(comp);
  await flushCompSyncOutbox();
  await publishCompSetup(comp, false);
  const matches = getCompetitionMatches(comp, false)
    .filter(m => m.status === 'finished' || (m.manualWinner !== undefined && m.manualWinner !== null))
    .slice(0, 40);
  for (const m of matches) {
    await publishCompMatch(comp, m);
  }
  ui.compLastSyncAt[comp.syncCode] = Date.now();
  return true;
}

function findCompForSyncEvent(cid, syncCode) {
  const sc = cleanSyncCode(syncCode);
  return competitionsList.find(c => (cid && c.id === cid) || (sc && cleanSyncCode(c.syncCode) === sc)) || null;
}

function upsertCompFromSetupData(setupData, ts = 0, forceReset = false) {
  if (!setupData || !setupData.id || !setupData.c) return null;
  const meta = setupData.c;
  const sc = cleanSyncCode(setupData.sc);
  let comp = findCompForSyncEvent(setupData.id, sc);

  if (!comp) {
    comp = {
      id: setupData.id,
      syncCode: sc || newCompSyncCode(),
      syncMetaTs: ts || 0,
      syncUpdatedAt: Date.now(),
      kind: meta.k || 'league',
      name: meta.n || 'Competencia Compartida',
      format: meta.f || (meta.k === 'tournament' ? 'knockout' : 'league_rr'),
      rankingMode: meta.rm || 'pairs',
      winPts: Number.isFinite(Number(meta.w)) ? Number(meta.w) : 3,
      drawPts: Number.isFinite(Number(meta.dp)) ? Number(meta.dp) : 2,
      lossPts: Number.isFinite(Number(meta.l)) ? Number(meta.l) : 1,
      setBonusPts: Number(meta.sb) || 0,
      gameBonusPts: Number.isFinite(Number(meta.gb)) ? Number(meta.gb) : (meta.f === 'proyecto_padel' ? 1 : 0),
      numGroups: Number(meta.ng) || 2,
      advancePerGroup: Number(meta.ag) || 2,
      defaultRules: meta.dr || {},
      participants: Array.isArray(setupData.pt) ? setupData.pt : [],
      fixtures: hydrateFixturesFromCompact(setupData.fx),
      createdAt: ts || Date.now()
    };
    competitionsList.unshift(comp);
  } else {
    if (ts >= (comp.syncMetaTs || 0)) {
      comp.syncMetaTs = ts;
      if (sc) comp.syncCode = sc;
      comp.kind = meta.k || comp.kind;
      comp.name = meta.n || comp.name;
      comp.format = meta.f || comp.format;
      comp.rankingMode = meta.rm || comp.rankingMode;
      comp.winPts = Number.isFinite(Number(meta.w)) ? Number(meta.w) : comp.winPts;
      if (Number.isFinite(Number(meta.dp))) comp.drawPts = Number(meta.dp);
      comp.lossPts = Number.isFinite(Number(meta.l)) ? Number(meta.l) : comp.lossPts;
      comp.setBonusPts = Number(meta.sb) || 0;
      if (Number.isFinite(Number(meta.gb))) comp.gameBonusPts = Number(meta.gb);
      comp.numGroups = Number(meta.ng) || comp.numGroups;
      comp.advancePerGroup = Number(meta.ag) || comp.advancePerGroup;
      if (meta.dr) comp.defaultRules = meta.dr;
    }

    // Merge participants without clobbering concurrent additions unless reset
    const inParts = Array.isArray(setupData.pt) ? setupData.pt : [];
    if (forceReset) {
      comp.participants = inParts;
    } else if (inParts.length) {
      comp.participants = comp.participants || [];
      const curMap = new Map(comp.participants.map(p => [p.id, p]));
      inParts.forEach(np => {
        if (!curMap.has(np.id)) comp.participants.push(np);
      });
    }

    // Merge fixtures safely while preserving played match links
    const inFx = hydrateFixturesFromCompact(setupData.fx);
    if (forceReset) {
      comp.fixtures = inFx;
      // Re-link any existing local matches whose fixtureId still exists
      getCompetitionMatches(comp, false).forEach(m => {
        if (m.competition?.fixtureId) {
          const hit = comp.fixtures.find(f => f.id === m.competition.fixtureId);
          if (hit) hit.matchId = m.id;
        }
      });
    } else if (inFx.length) {
      comp.fixtures = comp.fixtures || [];
      const curFxIds = new Set(comp.fixtures.map(f => f.id));
      inFx.forEach(nf => {
        if (!curFxIds.has(nf.id)) comp.fixtures.push(nf);
      });
    }
    comp.syncUpdatedAt = Date.now();
  }

  resolveCompetitionFixtures(comp);
  saveCompetitions();
  return comp;
}

function shouldAcceptIncomingMatch(existing, incoming) {
  if (!existing) return true;
  if (existing.status !== 'finished' && incoming.status === 'finished') return true;
  if ((incoming.events?.length || 0) > (existing.events?.length || 0)) return true;
  if (incoming.manualWinner !== undefined && incoming.manualWinner !== null && (existing.manualWinner === undefined || existing.manualWinner === null)) return true;
  return false;
}

function applyIncomingCompEvent(evt, sourceSyncCode = '', msgId = '') {
  if (!evt || !evt.t) return false;
  const sc = cleanSyncCode(evt.sc || sourceSyncCode);
  if (msgId) {
    const key = `${sc}:${msgId}`;
    if (compSeenMsgKeys.has(key)) return false;
    compSeenMsgKeys.add(key);
  }

  const isForeign = !evt.dev || evt.dev !== getDeviceClientId();
  let changed = false;

  if (evt.t === 'S' && evt.data) {
    const hadBefore = !!findCompForSyncEvent(evt.cid, sc);
    const comp = upsertCompFromSetupData(evt.data, evt.ts || 0, !!evt.reset);
    if (comp && (!hadBefore || isForeign)) changed = true;
  } else if (evt.t === 'FXC' && Array.isArray(evt.fx)) {
    const comp = findCompForSyncEvent(evt.cid, sc);
    if (comp) {
      comp.fixtures = comp.fixtures || [];
      const existingIds = new Set(comp.fixtures.map(f => f.id));
      hydrateFixturesFromCompact(evt.fx).forEach(nf => {
        if (!existingIds.has(nf.id)) {
          comp.fixtures.push(nf);
          changed = true;
        }
      });
      if (changed) {
        resolveCompetitionFixtures(comp);
        saveCompetitions();
      }
    }
  } else if (evt.t === 'M') {
    const comp = findCompForSyncEvent(evt.cid, sc);
    if (!comp) return false;
    const m = decodeCompSyncMatch(evt, comp);
    if (!m) return false;
    const existing = historyList.find(x => x.id === m.id);
    if (shouldAcceptIncomingMatch(existing, m)) {
      archiveMatchToHistory(m, { skipSyncPublish: true });
      comp.syncUpdatedAt = Date.now();
      saveCompetitions();
      changed = true;
      if (isForeign && !ui.compSyncSilent) {
        showToast(`📡 Resultado sumado en ${comp.name}: ${teamLabel(m, 0)} vs ${teamLabel(m, 1)}`);
      }
    }
  } else if (evt.t === 'P' && evt.part) {
    const comp = findCompForSyncEvent(evt.cid, sc);
    if (comp) {
      comp.participants = comp.participants || [];
      if (!comp.participants.some(p => p.id === evt.part.id)) {
        comp.participants.push(evt.part);
        saveCompetitions();
        changed = true;
      }
    }
  } else if (evt.t === 'PR' && evt.pid) {
    const comp = findCompForSyncEvent(evt.cid, sc);
    if (comp) {
      comp.participants = comp.participants || [];
      if (evt.op === 'del') {
        const before = comp.participants.length;
        comp.participants = comp.participants.filter(p => p.id !== evt.pid);
        if (comp.participants.length !== before) { saveCompetitions(); changed = true; }
      } else if (evt.op === 'grp') {
        const pt = comp.participants.find(p => p.id === evt.pid);
        if (pt && pt.group !== evt.group) {
          pt.group = evt.group || null;
          saveCompetitions();
          changed = true;
        }
      }
    }
  } else if (evt.t === 'FA' && evt.fx) {
    const comp = findCompForSyncEvent(evt.cid, sc);
    if (comp) {
      const fx = hydrateFixturesFromCompact([evt.fx])[0];
      if (fx) {
        comp.fixtures = comp.fixtures || [];
        if (!comp.fixtures.some(f => f.id === fx.id)) {
          comp.fixtures.push(fx);
          saveCompetitions();
          changed = true;
        }
      }
    }
  } else if (evt.t === 'DM' && evt.mid) {
    const comp = findCompForSyncEvent(evt.cid, sc);
    const beforeLen = historyList.length;
    historyList = historyList.filter(x => x.id !== evt.mid);
    if (historyList.length !== beforeLen) {
      saveJSON(LS_HIST, historyList);
      if (comp) {
        resolveCompetitionFixtures(comp);
        saveCompetitions();
      }
      changed = true;
    }
  }

  if (sc) ui.compLastSyncAt[sc] = Date.now();
  return changed;
}

async function pollCompChannelOnce(syncCode, since = '24h', showFeedback = false) {
  const sc = cleanSyncCode(syncCode);
  const topic = compSyncTopic(sc);
  if (!topic || typeof fetch !== 'function') return { ok: false, changed: false, count: 0 };

  await flushCompSyncOutbox();

  try {
    const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=${encodeURIComponent(since)}`, { cache: 'no-store' });
    if (!res.ok) return { ok: false, changed: false, count: 0 };
    const txt = await res.text();
    const lines = txt.trim().split('\n').filter(Boolean);
    const decodedEvts = [];
    for (const line of lines) {
      try {
        const obj = JSON.parse(line);
        if (obj && obj.event === 'message' && obj.message) {
          const evt = decodeSyncMessage(obj.message);
          if (evt) decodedEvts.push({ evt, id: obj.id || '' });
        }
      } catch {}
    }

    // Apply SETUP & FIXTURE events first, then MATCHES & mutations so newly joined devices hydrate cleanly
    const orderRank = { S: 0, FXC: 1, P: 2, PR: 3, FA: 4, M: 5, DM: 6 };
    decodedEvts.sort((a, b) => ((orderRank[a.evt.t] ?? 9) - (orderRank[b.evt.t] ?? 9)) || ((a.evt.ts || 0) - (b.evt.ts || 0)));

    let anyChanged = false;
    const prevSilent = !!ui.compSyncSilent;
    if (decodedEvts.length > 2) ui.compSyncSilent = true;
    try {
      for (const item of decodedEvts) {
        if (applyIncomingCompEvent(item.evt, sc, item.id)) anyChanged = true;
      }
    } finally {
      ui.compSyncSilent = prevSilent;
    }

    ui.compLastSyncAt[sc] = Date.now();
    ui.compSyncConnected[sc] = true;

    if (anyChanged && ['competitions', 'comp-detail', 'players', 'history', 'home', 'new'].includes(ui.route)) {
      render();
    }
    if (showFeedback) {
      showToast(anyChanged ? '✓ Sincronizado con novedades' : '✓ Todo al día');
    }
    return { ok: true, changed: anyChanged, count: decodedEvts.length };
  } catch {
    return { ok: false, changed: false, count: 0 };
  }
}

function stopCompLiveWatcher() {
  if (compSyncEvtSource) {
    try { compSyncEvtSource.close(); } catch {}
    compSyncEvtSource = null;
  }
  if (compSyncPollTimer) {
    clearInterval(compSyncPollTimer);
    compSyncPollTimer = null;
  }
  compSyncWatchCode = '';
}

function ensureCompLiveWatcherForCurrentView() {
  let targetComp = null;
  if (ui.route === 'comp-detail') {
    targetComp = getCompById(ui.compId);
  } else if (ui.route === 'players' && (ui.playerScope === 'league' || ui.playerScope === 'tournament')) {
    const cid = ui.playerScope === 'league' ? ui.selectedLeagueId : ui.selectedTournId;
    targetComp = getCompById(cid);
  } else if (ui.route === 'new' && (preset.matchContext === 'league' || preset.matchContext === 'tournament')) {
    targetComp = getCompById(preset.compId);
  } else if (ui.route === 'competitions' || ui.route === 'home') {
    targetComp = competitionsList.find(c => !!c.syncCode) || null;
  }

  const nextCode = cleanSyncCode(targetComp?.syncCode);
  if (!nextCode) {
    if (compSyncWatchCode) stopCompLiveWatcher();
    return;
  }
  if (compSyncWatchCode === nextCode && compSyncEvtSource) return;

  stopCompLiveWatcher();
  compSyncWatchCode = nextCode;
  const topic = compSyncTopic(nextCode);
  pollCompChannelOnce(nextCode, '24h', false);

  if (typeof EventSource !== 'undefined') {
    try {
      compSyncEvtSource = new EventSource(`https://ntfy.sh/${topic}/sse`);
      compSyncEvtSource.onopen = () => {
        ui.compSyncConnected[nextCode] = true;
      };
      compSyncEvtSource.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (data && (data.event === 'message' || !data.event) && data.message) {
            ui.compSyncConnected[nextCode] = true;
            const parsed = decodeSyncMessage(data.message);
            if (parsed && applyIncomingCompEvent(parsed, nextCode, data.id || '')) {
              if (['competitions', 'comp-detail', 'players', 'history', 'home', 'new'].includes(ui.route)) {
                render();
              }
            }
          }
        } catch {}
      };
      compSyncEvtSource.onerror = () => {
        ui.compSyncConnected[nextCode] = false;
      };
    } catch {}
  }

  compSyncPollTimer = setInterval(() => {
    if (compSyncWatchCode !== nextCode) return;
    pollCompChannelOnce(nextCode, '24h', false);
  }, 9000);
}

async function joinSyncedCompetition(rawInput) {
  let clean = String(rawInput || '').trim();
  const hashIdx = clean.indexOf('#c=');
  if (hashIdx >= 0) clean = clean.slice(hashIdx + 3);
  else if (clean.startsWith('c=')) clean = clean.slice(2);
  else if (clean.startsWith('join=')) clean = clean.slice(5);

  const dotIdx = clean.indexOf('.');
  const code = cleanSyncCode(dotIdx >= 0 ? clean.slice(0, dotIdx) : clean);
  const inlineSnap = dotIdx >= 0 ? clean.slice(dotIdx + 1) : '';
  if (!code || code.length < 4) {
    showToast('Ingresá un código de sala válido');
    return false;
  }

  let bootstrapped = null;
  if (inlineSnap) {
    const inlineObj = decodeSyncMessage(inlineSnap);
    if (inlineObj && inlineObj.id) {
      bootstrapped = upsertCompFromSetupData(inlineObj, 0, false);
    }
  }

  const existingBefore = findCompForSyncEvent(null, code);
  if (bootstrapped || existingBefore) {
    const c = bootstrapped || existingBefore;
    ui.compId = c.id;
    ui.compTab = 'fixtures';
    ui.compModal = null;
    ui.route = 'comp-detail';
    render();
  } else {
    showToast(`📡 Conectando a sala #${code}...`);
  }

  const res = await pollCompChannelOnce(code, 'all', false);
  const resolvedComp = findCompForSyncEvent(null, code);
  if (resolvedComp) {
    ui.compId = resolvedComp.id;
    ui.compModal = null;
    if (ui.route !== 'comp-detail') {
      ui.compTab = resolvedComp.fixtures?.length ? 'fixtures' : 'standings';
      ui.route = 'comp-detail';
    }
    render();
    showToast(`✓ Conectado a ${resolvedComp.name} (#${code})`);
    return true;
  }

  if (!res.ok && !bootstrapped) {
    showToast('Sin conexión o sala no encontrada. Verificá el código o pedí al organizador re-publicar.');
  } else if (!resolvedComp) {
    showToast(`No se encontró una Liga/Torneo activa para #${code}`);
  }
  return false;
}

function downloadCompSyncQR(comp) {
  if (!comp) return;
  try {
    const sc = ensureCompSyncCode(comp);
    const url = getCompShareUrl(comp, true);
    const qrCanvas = document.createElement('canvas');
    renderQRToCanvas(qrCanvas, url, 380);

    const W = 560, H = 760;
    const card = document.createElement('canvas');
    card.width = W;
    card.height = H;
    const ctx = card.getContext('2d');
    if (!ctx) return;

    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#161410');
    bgGrad.addColorStop(0.5, '#0a0a0d');
    bgGrad.addColorStop(1, '#040406');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 3;
    ctx.strokeRect(16, 16, W - 32, H - 32);
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(22, 22, W - 44, H - 44);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#d4af37';
    ctx.font = 'bold 20px Inter, sans-serif';
    ctx.fillText(comp.kind === 'tournament' ? '🏆 TORNEO EN VIVO · PÁDEL CONTROL SÉ' : '🏅 LIGA EN VIVO · PÁDEL CONTROL SÉ', W / 2, 68);

    ctx.fillStyle = '#fff6cc';
    ctx.font = '800 34px "Barlow Condensed", sans-serif';
    ctx.fillText(String(comp.name || '').toUpperCase().slice(0, 30), W / 2, 112);

    const qrX = (W - 380) / 2;
    const qrY = 140;
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, qrX - 10, qrY - 10, 400, 400, 18, '#ffffff');
    ctx.drawImage(qrCanvas, qrX, qrY, 380, 380);

    ctx.fillStyle = '#34d399';
    ctx.font = 'bold 28px monospace';
    ctx.fillText(`CÓDIGO DE SALA: #${sc}`, W / 2, 585);

    ctx.fillStyle = '#c2b8a3';
    ctx.font = '15px "Plus Jakarta Sans", sans-serif';
    ctx.fillText('Escaneá para conectarte con tu celular y sumar resultados', W / 2, 622);

    ctx.fillStyle = 'rgba(212, 175, 55, 0.12)';
    ctx.fillRect(36, 646, W - 72, 40);
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.45)';
    ctx.strokeRect(36, 646, W - 72, 40);
    ctx.fillStyle = '#f5d061';
    ctx.font = 'bold 13px monospace';
    ctx.fillText(getCompShareUrl(comp, false), W / 2, 671);

    ctx.fillStyle = '#7d7461';
    ctx.font = '13px "Plus Jakarta Sans", sans-serif';
    ctx.fillText('Tabla, Puntos, ELO y Cuadros sincronizados en tiempo real', W / 2, 718);

    const link = document.createElement('a');
    link.download = `QR-${comp.kind}-${sc}.png`;
    link.href = card.toDataURL('image/png');
    link.click();
    showToast('¡Tarjeta QR descargada!');
  } catch {
    showToast('Error al generar tarjeta QR');
  }
}

async function exportMatchSummaryImage(m) {
  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch {}
  }
  const stats = computeStats(m, 'all');
  const st = stats.st;
  const T = stats.T;
  const W = 1080, H = 1400;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Background gradient (Obsidian & Gold)
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#050507');
  grad.addColorStop(0.5, '#0c0c10');
  grad.addColorStop(1, '#12100a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Header brand
  ctx.fillStyle = '#d4af37';
  ctx.font = '800 28px Inter, sans-serif';
  ctx.fillText('PÁDEL CONTROL SÉ · RESUMEN DEL PARTIDO', 64, 78);

  ctx.fillStyle = '#a39e93';
  ctx.font = '500 24px Inter, sans-serif';
  ctx.fillText(`${fmtDateLong(m.createdAt)} · Duración ${fmtDurationLong(m.durationMs)}`, 64, 118);

  // Virtual signature top-right
  ctx.save();
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffe58f';
  ctx.font = '42px "Great Vibes", cursive';
  ctx.fillText('Sairaf Engel', W - 64, 96);
  ctx.restore();

  // Scoreboard Card
  roundRect(ctx, 56, 152, W - 112, 250, 28, '#121218');
  for (let t = 0; t < 2; t++) {
    const y = 225 + t * 105;
    ctx.fillStyle = m.teams[t].color;
    roundRect(ctx, 88, y - 38, 12, 54, 6, m.teams[t].color);
    ctx.fillStyle = st.matchWinner === t ? '#ffe58f' : '#e5e0d5';
    ctx.font = `${st.matchWinner === t ? '800' : '700'} 44px "Barlow Condensed", sans-serif`;
    ctx.fillText(teamLabel(m, t).toUpperCase(), 120, y + 6);

    // Sets
    st.sets.forEach((s, idx) => {
