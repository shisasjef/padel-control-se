      const bx = W - 110 - (st.sets.length - 1 - idx) * 86;
      const won = s.winner === t;
      roundRect(ctx, bx - 54, y - 42, 68, 64, 14, won ? '#d4af37' : '#1b1b24');
      ctx.fillStyle = won ? '#080602' : '#a39e93';
      ctx.font = '800 42px "Barlow Condensed", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(s.games[t]), bx - 20, y + 5);
      ctx.textAlign = 'left';
    });
  }

  // Stats comparison bars
  const rows = [
    ['Puntos ganados', T[0].ptsWon, T[1].ptsWon, T[0].ptsWon, T[1].ptsWon],
    ['Golpes ganadores', T[0].winners, T[1].winners, T[0].winners, T[1].winners],
    ['Errores no forzados', T[0].ue, T[1].ue, T[0].ue, T[1].ue],
    ['Puntos de break', `${T[0].bpWon}/${T[0].bpTotal}`, `${T[1].bpWon}/${T[1].bpTotal}`, T[0].bpWon, T[1].bpWon],
    ['Puntos de oro / Star Point', `${T[0].gpWon}/${T[0].gpTotal}`, `${T[1].gpWon}/${T[1].gpTotal}`, T[0].gpWon, T[1].gpWon],
    ['Puntos ganados al saque', pct(T[0].srvPtsWon, T[0].srvPtsTotal)+'%', pct(T[1].srvPtsWon, T[1].srvPtsTotal)+'%', pct(T[0].srvPtsWon, T[0].srvPtsTotal), pct(T[1].srvPtsWon, T[1].srvPtsTotal)],
    ['Primeros saques dentro', pct(T[0].firstServeIn, T[0].srvPtsTotal)+'%', pct(T[1].firstServeIn, T[1].srvPtsTotal)+'%', pct(T[0].firstServeIn, T[0].srvPtsTotal), pct(T[1].firstServeIn, T[1].srvPtsTotal)],
    ['Mejor racha de puntos', T[0].maxPtStreak, T[1].maxPtStreak, T[0].maxPtStreak, T[1].maxPtStreak]
  ];

  roundRect(ctx, 56, 434, W - 112, 820, 28, '#121218');
  rows.forEach((r, i) => {
    const y = 505 + i * 94;
    ctx.fillStyle = '#d4af37';
    ctx.font = '600 22px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(r[0].toUpperCase(), W / 2, y - 16);

    ctx.fillStyle = '#f8f6f0';
    ctx.font = '800 34px "Barlow Condensed", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(String(r[1]), 96, y + 22);
    ctx.textAlign = 'right';
    ctx.fillText(String(r[2]), W - 96, y + 22);

    const barX = 210, barW = W - 420, barY = y + 8;
    roundRect(ctx, barX, barY, barW, 14, 7, '#22222c');
    const sum = (Number(r[3]) || 0) + (Number(r[4]) || 0);
    const p0 = sum > 0 ? (Number(r[3]) / sum) : 0.5;
    const w0 = Math.round(barW * p0);
    if (w0 > 0) roundRect(ctx, barX, barY, w0, 14, 7, m.teams[0].color);
    if (barW - w0 > 0) roundRect(ctx, barX + w0, barY, barW - w0, 14, 7, m.teams[1].color);
  });

  // Bottom signature watermark (dynamic width measurement so texts never overlap)
  ctx.save();
  const labelText = 'PÁDEL CONTROL SÉ  ·  BY';
  const sigText = 'Sairaf Engel';

  ctx.font = '600 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  const labelWidth = ctx.measureText(labelText).width;

  ctx.font = '42px "Great Vibes", cursive';
  const sigWidth = ctx.measureText(sigText).width;

  const gap = 16;
  const totalWidth = labelWidth + gap + sigWidth;
  const startX = Math.round((W - totalWidth) / 2);
  const baselineY = 1322;

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  // 1. Text "PÁDEL CONTROL SÉ · BY"
  ctx.fillStyle = '#a39e93';
  ctx.font = '600 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(labelText, startX, baselineY);

  // 2. Signature "Sairaf Engel" starting strictly after the label + gap
  ctx.fillStyle = '#ffe58f';
  ctx.font = '42px "Great Vibes", cursive';
  ctx.fillText(sigText, startX + labelWidth + gap, baselineY - 2);

  // Subtle luxury metallic line underneath
  const lineY = baselineY + 22;
  const lineGrad = ctx.createLinearGradient(startX + 20, lineY, startX + totalWidth - 20, lineY);
  lineGrad.addColorStop(0, 'rgba(212, 175, 55, 0)');
  lineGrad.addColorStop(0.5, 'rgba(212, 175, 55, 0.4)');
  lineGrad.addColorStop(1, 'rgba(212, 175, 55, 0)');
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(startX + 20, lineY);
  ctx.lineTo(startX + totalWidth - 20, lineY);
  ctx.stroke();

  ctx.restore();

  canvas.toBlob((blob) => {
    if (!blob) return;
    triggerBlobDownload(blob, `padel-control-se-${new Date(m.createdAt).toISOString().slice(0,10)}.png`);
    showToast('Imagen descargada');
  }, 'image/png');
}

function triggerBlobDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body?.appendChild?.(a);
  a.click();
  a.remove?.();
  if (typeof URL.revokeObjectURL === 'function') {
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}

function roundRect(ctx, x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
  ctx.fillStyle = fill;
  ctx.fill();
}

function pct(a, b) { return b > 0 ? Math.round((a * 100) / b) : 0; }

function getEffectiveSortKey(comp, scopeKey = 'daily') {
  const tag = comp ? comp.id : scopeKey;
  if (ui.playerSortScope === tag && ui.playerSort) return ui.playerSort;
  return isProyectoPadelComp(comp) ? 'elo' : 'pts';
}

function getCompSubtitle(comp, entityMode, scoring, groupSub = '') {
  const kindWord = comp.kind === 'league' ? 'Liga' : 'Torneo';
  const modeWord = entityMode === 'pairs' ? 'Parejas' : 'Individual';
  if (isProyectoPadelComp(comp)) {
    return `PRO PÁDEL${groupSub} · ${modeWord} · ${getCompScoringSummaryLabel(comp, scoring, false)}`;
  }
  return `${kindWord}${groupSub} · ${modeWord} · ${getCompScoringSummaryLabel(comp, scoring, false)}`;
}

function sortStandingsRows(rows, sortKey = 'pts', opts = {}) {
  const list = [...(rows || [])];
  if (sortKey === 'pts') {
    if (opts.tiebreakMode === 'games') {
      list.sort((a, b) =>
        ((b.pts || 0) - (a.pts || 0)) ||
        ((b.gamesWon || 0) - (a.gamesWon || 0)) ||
        ((b.gamesDiff || 0) - (a.gamesDiff || 0)) ||
        ((b.elo || 0) - (a.elo || 0)) ||
        (b.wins - a.wins)
      );
    } else {
      list.sort((a, b) =>
        ((b.pts || 0) - (a.pts || 0)) ||
        ((b.setsDiff || 0) - (a.setsDiff || 0)) ||
        ((b.gamesDiff || 0) - (a.gamesDiff || 0)) ||
        (b.wins - a.wins) ||
        (b.elo - a.elo)
      );
    }
  } else if (sortKey === 'elo') {
    list.sort((a, b) =>
      ((b.elo || 0) - (a.elo || 0)) ||
      ((b.pts || 0) - (a.pts || 0)) ||
      ((b.gamesWon || 0) - (a.gamesWon || 0)) ||
      ((b.gamesDiff || 0) - (a.gamesDiff || 0)) ||
      (b.wins - a.wins) ||
      (b.matches - a.matches)
    );
  } else if (sortKey === 'wins') {
    list.sort((a, b) => (b.wins - a.wins) || ((b.pts || 0) - (a.pts || 0)) || (b.elo - a.elo) || (b.matches - a.matches));
  } else if (sortKey === 'matches') {
    list.sort((a, b) => (b.matches - a.matches) || (b.wins - a.wins) || ((b.pts || 0) - (a.pts || 0)) || (b.elo - a.elo));
  }
  return list;
}

function assignPlayerRanks(players, sortKey = 'pts', opts = {}) {
  let currentRank = 1;
  for (let i = 0; i < players.length; i++) {
    if (i > 0) {
      const prev = players[i - 1];
      const curr = players[i];
      let isSame = false;
      if (sortKey === 'pts') {
        isSame = opts.tiebreakMode === 'games'
          ? ((curr.pts || 0) === (prev.pts || 0) && (curr.gamesWon || 0) === (prev.gamesWon || 0) && (curr.gamesDiff || 0) === (prev.gamesDiff || 0) && curr.elo === prev.elo)
          : ((curr.pts || 0) === (prev.pts || 0) && (curr.setsDiff || 0) === (prev.setsDiff || 0) && (curr.gamesDiff || 0) === (prev.gamesDiff || 0) && curr.wins === prev.wins);
      } else if (sortKey === 'elo') {
        isSame = (curr.elo === prev.elo && (curr.pts || 0) === (prev.pts || 0) && (curr.gamesWon || 0) === (prev.gamesWon || 0) && (curr.gamesDiff || 0) === (prev.gamesDiff || 0));
      } else if (sortKey === 'wins') {
        isSame = (curr.wins === prev.wins && curr.elo === prev.elo);
      } else if (sortKey === 'matches') {
        isSame = (curr.matches === prev.matches && curr.wins === prev.wins);
      }
      if (!isSame) {
        currentRank++;
      }
    }
    players[i].rank = currentRank;
  }
  return players;
}

function getCurrentRankingContext(overrideSort = null) {
  const scope = ui.playerScope || 'daily';

  if (scope === 'shared' || (ui.playerRankingView === 'shared' && ui.sharedRanking?.players?.length)) {
    const sr = ui.sharedRanking;
    const isSrElo = sr?.primaryMetric === 'elo';
    const sortKey = overrideSort || (ui.playerSortScope === 'shared' ? ui.playerSort : (isSrElo ? 'elo' : 'pts'));
    const raw = (sr?.players || []).map(p => ({ ...p, shots: { ...(p.shots || {}) } }));
    const players = assignPlayerRanks(sortStandingsRows(raw, sortKey, { tiebreakMode: isSrElo ? 'games' : 'sets' }), sortKey, { tiebreakMode: isSrElo ? 'games' : 'sets' });
    return {
      scope: 'shared',
      id: sr?.id || 'RK-EXT',
      title: sr?.name || 'Ranking Compartido',
      subtitle: sr?.subtitle || 'Ranking compartido',
      entityMode: sr?.entityMode || 'individual',
      primaryMetric: sr?.primaryMetric || 'pts',
      comp: null,
      scoring: null,
      sortKey,
      players
    };
  }

  if (scope === 'league' || scope === 'tournament') {
    const compsOfKind = competitionsList.filter(c => c.kind === scope);
    let selId = scope === 'league' ? ui.selectedLeagueId : ui.selectedTournId;
    if (!selId || !compsOfKind.some(c => c.id === selId)) {
      selId = compsOfKind[0]?.id || null;
      if (scope === 'league') ui.selectedLeagueId = selId;
      else ui.selectedTournId = selId;
    }
    const comp = getCompById(selId);
    if (!comp) {
      return {
        scope,
        id: prefs.rankingId || 'RK-OFFICIAL',
        title: scope === 'league' ? 'Ligas' : 'Torneos',
        subtitle: `Sin ${scope === 'league' ? 'ligas' : 'torneos'} todavía`,
        entityMode: 'pairs',
        primaryMetric: 'pts',
        comp: null,
        scoring: { winPts: 3, lossPts: 1, drawPts: 2, setBonusPts: 0, gameBonusPts: 0 },
        sortKey: overrideSort || 'pts',
        players: []
      };
    }
    const isPP = isProyectoPadelComp(comp);
    const sortKey = overrideSort || getEffectiveSortKey(comp, scope);
    const sortOpts = { tiebreakMode: isPP ? 'games' : 'sets' };
    const entityMode = comp.rankingMode === 'both'
      ? (ui.playerEntityMode || 'pairs')
      : (comp.rankingMode || 'pairs');
    const scoring = getCompetitionScoringConfig(comp);
    const compMatches = getCompetitionMatches(comp, false);

    let targetMatches = compMatches;
    let seedParts = comp.participants || [];
    let groupSub = '';
    if (comp.format === 'groups_playoff' && ui.selectedGroupFilter && ui.selectedGroupFilter !== 'all') {
      const gLet = ui.selectedGroupFilter;
      const gFxIds = new Set((comp.fixtures || []).filter(f => f.phase === 'group' && f.group === gLet).map(f => f.id));
      targetMatches = compMatches.filter(m => m.competition?.fixtureId && gFxIds.has(m.competition.fixtureId));
      seedParts = seedParts.filter(p => p.group === gLet);
      groupSub = ` · Grupo ${gLet}`;
    }

    const raw = computeScopeStandings(targetMatches, {
      ...scoring,
      entityMode,
      eloBaseMatches: compMatches,
      seedParticipants: seedParts
    });
    const players = assignPlayerRanks(sortStandingsRows(raw, sortKey, sortOpts), sortKey, sortOpts);
    return {
      scope,
      id: `${prefs.rankingId || 'RK'}-${comp.id.slice(-4).toUpperCase()}`,
      title: comp.name,
      subtitle: getCompSubtitle(comp, entityMode, scoring, groupSub),
      entityMode,
      primaryMetric: isPP ? 'elo' : 'pts',
      comp,
      scoring,
      sortKey,
      players
    };
  }

  // Default: 'daily' (Partido del Día)
  const sortKey = overrideSort || getEffectiveSortKey(null, 'daily');
  const entityMode = ui.playerEntityMode || 'individual';
  const todayOnly = (ui.dailyTimeFilter === 'today');
  const dailyMatches = historyList.filter(m => getMatchKind(m) === 'daily');
  const scoring = getCompetitionScoringConfig(null);
  const raw = computeScopeStandings(dailyMatches, {
    ...scoring,
    entityMode,
    todayOnly,
    todayDateKey: getDateKey(Date.now())
  });
  const players = assignPlayerRanks(sortStandingsRows(raw, sortKey), sortKey);
  const modeWord = entityMode === 'pairs' ? 'Parejas' : 'Individual';
  const timeWord = todayOnly ? 'Hoy' : 'Acumulado';
  return {
    scope: 'daily',
    id: prefs.rankingId || 'RK-OFFICIAL',
    title: `${prefs.rankingName || 'Mi Ranking'} · Partido del Día`,
    subtitle: `${timeWord} · ${modeWord} · +${scoring.winPts}V / +${scoring.lossPts}D + ELO`,
    entityMode,
    primaryMetric: 'pts',
    comp: null,
    scoring,
    sortKey,
    players
  };
}

function encodeRankingPayload(players, ctxMeta = null) {
  try {
    const isShared = (ui.playerScope === 'shared' || ui.playerRankingView === 'shared' || (!historyList.length && ui.sharedRanking?.players?.length));
    const rkId = ctxMeta?.id || ((isShared && ui.sharedRanking?.id) ? ui.sharedRanking.id : (prefs.rankingId || 'RK-OFFICIAL'));
    const rkName = ctxMeta?.title || ((isShared && ui.sharedRanking?.name) ? ui.sharedRanking.name : (prefs.rankingName || 'Mi Ranking'));

    const compact = {
      v: 2,
      id: rkId,
      n: rkName,
      sub: ctxMeta?.subtitle || '',
      em: ctxMeta?.entityMode || 'individual',
      pm: ctxMeta?.primaryMetric || 'pts',
      t: Date.now(),
      p: (players || []).map(p => [
        p.name,
        p.elo,
        p.wins,
        p.matches,
        p.lastDelta || 0,
        p.color || '#d4af37',
        p.winners || 0,
        p.ue || 0,
        p.firstServeIn || 0,
        p.srvPtsTotal || 0,
        p.srvPtsWon || 0,
        p.finishedMatches || p.matches || 0,
        p.pts || 0,
        p.losses || 0,
        p.setsDiff || 0,
        p.gamesDiff || 0,
        p.gamesWon || 0,
        p.draws || 0,
        p.gamesLost || 0
      ])
    };
    const json = JSON.stringify(compact);
    return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  } catch (e) {
    return '';
  }
}

function decodeRankingPayload(b64) {
  try {
    const norm = String(b64 || '').trim().replace(/-/g, '+').replace(/_/g, '/');
    if (!norm) return null;
    const json = decodeURIComponent(escape(atob(norm)));
    const c = JSON.parse(json);
    if (!c || !Array.isArray(c.p)) return null;
    const players = c.p.map(row => ({
      name: String(row[0] || 'Jugador'),
      key: String(row[0] || 'Jugador').toUpperCase(),
      elo: Number(row[1]) || 1000,
      wins: Number(row[2]) || 0,
      matches: Number(row[3]) || 0,
      lastDelta: Number(row[4]) || 0,
      color: String(row[5] || '#d4af37'),
      winners: Number(row[6]) || 0,
      ue: Number(row[7]) || 0,
      fe: 0,
      shots: {},
      firstServeIn: Number(row[8]) || 0,
      srvPtsTotal: Number(row[9]) || 0,
      srvPtsWon: Number(row[10]) || 0,
      finishedMatches: Number(row[11]) || Number(row[3]) || 0,
      pts: row[12] !== undefined ? Number(row[12]) : ((Number(row[2]) || 0) * 3),
      losses: row[13] !== undefined ? Number(row[13]) : Math.max(0, (Number(row[3]) || 0) - (Number(row[2]) || 0)),
      setsDiff: Number(row[14]) || 0,
      gamesDiff: Number(row[15]) || 0,
      gamesWon: Number(row[16]) || 0,
      draws: Number(row[17]) || 0,
      gamesLost: Number(row[18]) || 0
    }));
    return {
      version: c.v || 1,
      id: c.id || 'RK-EXT',
      name: c.n || 'Ranking Compartido',
      subtitle: c.sub || '',
      entityMode: c.em || 'individual',
      primaryMetric: c.pm || 'pts',
      timestamp: c.t || Date.now(),
      players
    };
  } catch (e) {
    return null;
  }
}

function saveSharedRankingToVault(ranking) {
  if (!ranking || !ranking.id) return;
  try {
    const vault = loadJSON('padel_ranking_vault', {});
    vault[ranking.id] = ranking;
    saveJSON('padel_ranking_vault', vault);
  } catch {}
}

function getRankingPlayersList(forceSource = null) {
  if (forceSource === 'shared' && ui.sharedRanking?.players?.length) {
    return ui.sharedRanking.players.map(p => ({ ...p, shots: { ...(p.shots || {}) } }));
  }
  return getCurrentRankingContext().players;
}

async function shortenUrl(longUrl) {
  if (!longUrl || longUrl.length < 60) return longUrl;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 2400);
    const res = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`, {
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if (res.ok) {
      const data = await res.json();
      if (data && data.shorturl) return data.shorturl;
    }
  } catch {}

  try {
    const ctrl2 = new AbortController();
    const timer2 = setTimeout(() => ctrl2.abort(), 2400);
    const res2 = await fetch(`https://v.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`, {
      signal: ctrl2.signal
    });
    clearTimeout(timer2);
    if (res2.ok) {
      const data2 = await res2.json();
      if (data2 && data2.shorturl) return data2.shorturl;
    }
  } catch {}

  return longUrl;
}

function publishRankingSnapshot(code, b64) {
  if (!code || !b64) return;
  const clean = String(code).replace(/^rk[-_]?/i, '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
  const topic = 'padel_se_rk_' + clean;
  fetch(`https://ntfy.sh/${topic}`, {
    method: 'POST',
    body: b64,
    headers: { 'Title': 'Padel Control SE Ranking', 'Cache': 'yes' }
  }).catch(() => {});
}

async function openShortSharedRanking(rawCode) {
  const clean = String(rawCode || '').replace(/^rk[-_]?/i, '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
  const topic = 'padel_se_rk_' + clean;
  try {
    const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=12h`, { cache: 'no-store' });
    if (res.ok) {
      const txt = await res.text();
      const lines = txt.trim().split('\n').filter(Boolean);
      let latestMsg = null;
      for (const line of lines) {
        try {
          const obj = JSON.parse(line);
          if (obj && obj.event === 'message' && obj.message) latestMsg = obj.message;
        } catch {}
      }
      if (latestMsg) {
        const decoded = decodeRankingPayload(latestMsg);
        if (decoded && Array.isArray(decoded.players) && decoded.players.length) {
          ui.sharedRanking = decoded;
          saveJSON('padel_shared_ranking', decoded);
          saveSharedRankingToVault(decoded);
          ui.playerRankingView = 'shared';
          ui.playerScope = 'shared';
          ui.route = 'players';
          render();
          showToast(`📡 ${decoded.name || 'Ranking'} (#${decoded.id || 'RK'}) cargado`);
          return;
        }
      }
    }
  } catch {}
  showToast('No se encontró el ranking compartido o expiró');
}

async function shareRankingText(overrideCtx = null) {
  const ctx = overrideCtx || getCurrentRankingContext();
  const rankingTitle = ctx.title || (prefs.rankingName || 'Mi Ranking');
  const rankingId = ctx.id || (prefs.rankingId || 'RK-OFFICIAL');
  const players = ctx.players || [];

  if (!players.length) {
    showToast('Todavía no hay jugadores registrados en este ranking');
    return;
  }

  const baseUrl = location.href.split('#')[0];
  const rkPayload = encodeRankingPayload(players, ctx);
  const fullUrl = rkPayload ? `${baseUrl}#rk=${rkPayload}` : `${baseUrl}#players`;

  // Publish to short channel as backup
  publishRankingSnapshot(rankingId, rkPayload);

  // Shorten url automatically to a clean short link (e.g. https://is.gd/...)
  let rankingUrl = fullUrl;
  try {
    rankingUrl = await shortenUrl(fullUrl);
  } catch {}

  const isEloPrimary = ctx.primaryMetric === 'elo' || isProyectoPadelComp(ctx.comp);
  const medals = { 1: '🥇 1º', 2: '🥈 2º', 3: '🥉 3º' };
  const topRows = players.slice(0, 10).map((p) => {
    const rankLabel = medals[p.rank] || `${p.rank}º`;
    const lvl = getEloLevel(p.elo);
    const winPct = pct(p.wins, p.matches);
    const trend = p.lastDelta > 0 ? ` (+${p.lastDelta})` : p.lastDelta < 0 ? ` (${p.lastDelta})` : '';
    if (isEloPrimary) {
      const gdStr = (p.gamesDiff || 0) > 0 ? `+${p.gamesDiff}` : String(p.gamesDiff || 0);
      return `${rankLabel} *${p.name}* · *${p.elo} ELO*${trend} · ${p.pts || 0} pts (${p.gamesWon || 0}G, ${gdStr}) · ${p.wins}G/${p.draws || 0}E/${p.losses || 0}P`;
    }
    return `${rankLabel} *${p.name}* · ${p.pts || 0} pts · ${p.elo} ELO${trend} · Nivel ${lvl.level} (${lvl.icon}) · ${p.wins}V/${p.matches}P (${winPct}%)`;
  }).join('\n');

  const moreCount = players.length > 10 ? `\n...y ${players.length - 10} más` : '';

  const text = `🎾 *RANKING OFICIAL · PÁDEL CONTROL SÉ*\n🏆 *${rankingTitle}* · ID: #${rankingId}\n📌 _${ctx.subtitle || 'Sistema Mixto: Puntos + ELO'}_\n\n📊 *Tabla de Posiciones:*\n${topRows}${moreCount}\n\n📲 Ver tabla completa interactiva y marcador:\n${rankingUrl}`;

  await shareOrCopyText({
    title: `🎾 Ranking: ${rankingTitle} (#${rankingId})`,
    text,
    copyText: text,
    toastMsg: '¡Ranking y enlace copiados al portapapeles!',
    promptMsg: 'Copiá el texto del ranking para compartir:'
  });
}

async function exportRankingImage(overrideCtx = null) {
  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch {}
  }

  const rCtx = overrideCtx || getCurrentRankingContext();
  const isShared = rCtx.scope === 'shared';
  const rankingTitle = rCtx.title || (prefs.rankingName || 'Mi Ranking');
  const rankingId = rCtx.id || (prefs.rankingId || 'RK-OFFICIAL');
  const players = rCtx.players || [];

  if (!players.length) {
    showToast('Todavía no hay jugadores registrados para exportar');
    return;
  }

  const topPlayers = players.slice(0, 8);
  const W = 1080;
  const H = Math.max(1200, 360 + topPlayers.length * 105);
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  // Background gradient (Obsidian & Gold)
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#050507');
  grad.addColorStop(0.5, '#0c0c10');
  grad.addColorStop(1, '#12100a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Outer Gold border
  ctx.strokeStyle = 'rgba(212, 175, 55, 0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(28, 28, W - 56, H - 56, 24) : ctx.rect(28, 28, W - 56, H - 56);
  ctx.stroke();

  // Header brand
  ctx.fillStyle = '#d4af37';
  ctx.font = '800 28px Inter, -apple-system, sans-serif';
  ctx.fillText('PÁDEL CONTROL SÉ  ·  RANKING OFICIAL', 64, 82);

  const imageDate = (isShared && ui.sharedRanking?.timestamp) ? new Date(ui.sharedRanking.timestamp) : new Date();
  const nowStr = imageDate.toLocaleDateString('es-AR', { day: 'numeric', month: 'long', year: 'numeric' });
  ctx.fillStyle = '#a39e93';
  ctx.font = '500 19px Inter, sans-serif';
  ctx.fillText(`${rankingTitle.toUpperCase()}  ·  ${rCtx.subtitle || ''}  ·  #${rankingId}  ·  ${nowStr}`, 64, 120);

  // Virtual signature top-right
  ctx.save();
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffe58f';
  ctx.font = '42px "Great Vibes", cursive';
  ctx.fillText('Sairaf Engel', W - 64, 96);
  ctx.restore();

  // Main Card container for table
  const cardY = 160;
  const cardH = H - cardY - 120;
  roundRect(ctx, 56, cardY, W - 112, cardH, 24, '#121218');

  const isEloPrimary = rCtx.primaryMetric === 'elo' || isProyectoPadelComp(rCtx.comp);
  // Table header bar
  roundRect(ctx, 56, cardY, W - 112, 58, 24, 'rgba(212, 175, 55, 0.12)');
  ctx.fillStyle = '#d4af37';
  ctx.font = '700 18px Inter, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('POS', 88, cardY + 36);
  ctx.fillText(rCtx.entityMode === 'pairs' ? 'PAREJA & NIVEL' : 'JUGADOR & NIVEL', 190, cardY + 36);
  ctx.textAlign = 'right';
  ctx.fillText('PARTIDOS', W - 360, cardY + 36);
  ctx.fillText(isEloPrimary ? 'PTS (G)' : 'ELO', W - 245, cardY + 36);
  ctx.fillText(isEloPrimary ? 'ELO' : 'PUNTOS', W - 92, cardY + 36);

  // Rows
  topPlayers.forEach((p, i) => {
    const rowY = cardY + 72 + i * 98;
    const isEven = i % 2 === 0;
    if (isEven) {
      roundRect(ctx, 64, rowY, W - 128, 86, 14, 'rgba(255, 255, 255, 0.025)');
    }

    // Rank Badge
    const rankX = 84, rankY = rowY + 18, rankSize = 50;
    let rankBg = 'rgba(255, 255, 255, 0.06)';
    let rankColor = '#a39e93';
    let rankTxt = `#${p.rank}`;
    if (p.rank === 1) { rankBg = '#d4af37'; rankColor = '#080602'; rankTxt = '1º'; }
    else if (p.rank === 2) { rankBg = '#cbd5e1'; rankColor = '#080602'; rankTxt = '2º'; }
    else if (p.rank === 3) { rankBg = '#d97706'; rankColor = '#080602'; rankTxt = '3º'; }

    roundRect(ctx, rankX, rankY, rankSize, rankSize, 14, rankBg);
    ctx.fillStyle = rankColor;
    ctx.font = '800 24px "Barlow Condensed", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(rankTxt, rankX + rankSize / 2, rankY + 34);

    // Player name & Level
    ctx.textAlign = 'left';
    ctx.fillStyle = p.rank <= 3 ? '#ffe58f' : '#f8f6f0';
    ctx.font = '800 30px "Barlow Condensed", sans-serif';
    ctx.fillText(p.name.toUpperCase().slice(0, 26), 156, rowY + 40);

    const lvl = getEloLevel(p.elo);
    ctx.fillStyle = lvl.color;
    ctx.font = '600 18px Inter, sans-serif';
    ctx.fillText(`Nivel ${lvl.level} · ${lvl.tier}`, 156, rowY + 68);

    // Record (Wins / Matches / Win%)
    const winPct = pct(p.wins, p.matches);
    const gdStr = (p.gamesDiff || 0) > 0 ? `+${p.gamesDiff}` : String(p.gamesDiff || 0);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#e2ded5';
    ctx.font = '700 22px "Barlow Condensed", sans-serif';
    ctx.fillText(isEloPrimary ? `${p.wins}G-${p.draws || 0}E-${p.losses || 0}P` : `${p.wins}V - ${p.losses ?? Math.max(0, p.matches - p.wins)}D`, W - 360, rowY + 40);
    ctx.fillStyle = '#a39e93';
    ctx.font = '500 16px Inter, sans-serif';
    ctx.fillText(isEloPrimary ? `${p.gamesWon || 0} GF · ${gdStr}` : `${winPct}% ef.`, W - 360, rowY + 66);

    // Secondary Metric + ELO trend
    ctx.textAlign = 'right';
    ctx.fillStyle = isEloPrimary ? '#e2ded5' : '#f5d061';
    ctx.font = '800 24px "Barlow Condensed", sans-serif';
    ctx.fillText(isEloPrimary ? `${p.pts || 0}` : String(p.elo), W - 245, rowY + 42);
    ctx.fillStyle = p.lastDelta > 0 ? '#10b981' : (p.lastDelta < 0 ? '#ef4444' : '#7d7461');
    ctx.font = '600 15px Inter, sans-serif';
    ctx.fillText(p.lastDelta > 0 ? `+${p.lastDelta}` : (p.lastDelta < 0 ? `${p.lastDelta}` : '—'), W - 245, rowY + 66);

    // Primary Pill (ELO for Proyecto Padel, PTS otherwise)
    const ptsW = 122, ptsH = 54;
    const ptsX = W - 214, ptsY = rowY + 16;
    roundRect(ctx, ptsX, ptsY, ptsW, ptsH, 12, 'rgba(212, 175, 55, 0.14)');
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(ptsX, ptsY, ptsW, ptsH, 12) : ctx.rect(ptsX, ptsY, ptsW, ptsH);
    ctx.stroke();

    ctx.fillStyle = '#ffe58f';
    ctx.font = '900 32px "Barlow Condensed", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(isEloPrimary ? `${p.elo}` : `${p.pts || 0}`, ptsX + ptsW / 2, ptsY + 37);
  });

  // Bottom watermark with dynamic measurement
  ctx.save();
  const labelText = 'PÁDEL CONTROL SÉ  ·  BY';
  const sigText = 'Sairaf Engel';

  ctx.font = '600 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  const labelWidth = ctx.measureText(labelText).width;

  ctx.font = '42px "Great Vibes", cursive';
  const sigWidth = ctx.measureText(sigText).width;

  const gap = 16;
  const totalWidth = labelWidth + gap + sigWidth;
  const startX = Math.round((W - totalWidth) / 2);
  const baselineY = H - 52;

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#a39e93';
  ctx.font = '600 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(labelText, startX, baselineY);

  ctx.fillStyle = '#ffe58f';
  ctx.font = '42px "Great Vibes", cursive';
  ctx.fillText(sigText, startX + labelWidth + gap, baselineY - 2);

  const lineY = baselineY + 22;
  const lineGrad = ctx.createLinearGradient(startX + 20, lineY, startX + totalWidth - 20, lineY);
  lineGrad.addColorStop(0, 'rgba(212, 175, 55, 0)');
  lineGrad.addColorStop(0.5, 'rgba(212, 175, 55, 0.4)');
  lineGrad.addColorStop(1, 'rgba(212, 175, 55, 0)');
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(startX + 20, lineY);
  ctx.lineTo(startX + totalWidth - 20, lineY);
  ctx.stroke();

  ctx.restore();

  canvas.toBlob((blob) => {
    if (!blob) return;
    triggerBlobDownload(blob, `ranking-padel-control-se-${new Date().toISOString().slice(0,10)}.png`);
    showToast('¡Imagen del Ranking descargada!');
  }, 'image/png');
}

const DEFAULT_CENTER_LOGO_LEGACY_REFS = new Set([
  '__default__',
  'logo-pro-padel.png',
  'Logo PRO PÁDEL.png',
  'Logo%20PRO%20P%C3%81DEL.png'
]);

function normalizeLogo2State(obj) {
  if (!obj) return;
  if (obj.logo2Disabled) {
    obj.logo2 = null;
    return;
  }
  if (!obj.logo2 || DEFAULT_CENTER_LOGO_LEGACY_REFS.has(obj.logo2)) {
    obj.logo2 = DEFAULT_CENTER_LOGO_URL;
  }
}

function openPlayerCardDB() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') {
      reject(new Error('IndexedDB unavailable'));
      return;
    }
    const req = indexedDB.open(PC_IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('cards')) {
        db.createObjectStore('cards', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('meta')) {
        db.createObjectStore('meta', { keyPath: 'key' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IDB open failed'));
  });
}

async function loadPlayerCardDataFromIDB() {
  try {
    const db = await openPlayerCardDB();
    const tx = db.transaction(['cards', 'meta'], 'readonly');
    const cardsReq = tx.objectStore('cards').getAll();
    const logosReq = tx.objectStore('meta').get('logos');
    const draftReq = tx.objectStore('meta').get('activeDraft');
    await new Promise((res) => {
      tx.oncomplete = res;
      tx.onerror = res;
    });
    if (Array.isArray(cardsReq.result)) {
      savedPlayerCards = cardsReq.result.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    }
    if (logosReq.result && logosReq.result.value) {
      playerCardLogos = Object.assign({ logo1: null, logo2: null, logo2Disabled: false, subTitle: '' }, logosReq.result.value);
    }
    normalizeLogo2State(playerCardLogos);
    if (draftReq.result && draftReq.result.value && !ui.playerCardDraftDirty) {
      ui.playerCardDraft = Object.assign(createDefaultPlayerCardDraft(), clone(draftReq.result.value));
      if (ui.route === 'player-card') {
        ui.playerCardAiStatus = ui.playerCardDraft.cutoutPhoto ? 'ok' : '';
        ui.playerCardAiText = ui.playerCardDraft.cutoutPhoto
          ? '✓ Borrador y recorte restaurados'
          : (ui.playerCardDraft.origPhoto ? '✓ Foto del borrador restaurada' : '');
      }
    }
    db.close();
  } catch {
    try {
      const fb = loadJSON(PC_LS_META_FALLBACK, null);
      if (fb) playerCardLogos = Object.assign({ logo1: null, logo2: null, logo2Disabled: false, subTitle: '' }, fb);
      normalizeLogo2State(playerCardLogos);
    } catch {}
  }
  if (ui.route === 'player-card' || ui.route === 'players' || ui.route === 'comp-detail') {
    render();
  }
}

async function saveActiveDraftToIDBNow() {
  if (!ui.playerCardDraft) return;
  try {
    const db = await openPlayerCardDB();
    const tx = db.transaction(['meta'], 'readwrite');
    tx.objectStore('meta').put({ key: 'activeDraft', value: clone(ui.playerCardDraft) });
    await new Promise((res) => {
      tx.oncomplete = res;
      tx.onerror = res;
    });
    db.close();
  } catch {}
}

function scheduleSaveActiveDraftToIDB(immediate = false) {
  clearTimeout(pcDraftSaveTimer);
  if (immediate) {
    pcDraftSaveTimer = null;
    saveActiveDraftToIDBNow();
    return;
  }
  pcDraftSaveTimer = setTimeout(() => {
    pcDraftSaveTimer = null;
    saveActiveDraftToIDBNow();
  }, 260);
}

async function savePlayerCardToIDB(cardObj) {
  const clean = {
    id: cardObj.id,
    name: cardObj.name || '',
    nickname: cardObj.nickname || '',
    nameKey: (cardObj.name || '').trim().toUpperCase(),
    category: cardObj.category || '6ta',
    age: cardObj.age || '',
    position: cardObj.position || 'Drive',
    hand: cardObj.hand || 'Diestro',
    bestShot: cardObj.bestShot || 'Víbora',
    theme: cardObj.theme || 'diamond',
    metalFinish: cardObj.metalFinish || 'chrome',
    bgMode: cardObj.bgMode || 'ai',
    showAppBrand: cardObj.showAppBrand !== false,
    zoom: Number(cardObj.zoom) || 1,
    offsetX: Number(cardObj.offsetX) || 0,
    offsetY: Number(cardObj.offsetY) || 0,
    origPhoto: cardObj.origPhoto || null,
    cutoutPhoto: cardObj.cutoutPhoto || null,
    origHasAlpha: !!cardObj.origHasAlpha,
    updatedAt: Date.now()
  };
  const idx = savedPlayerCards.findIndex(c => c.id === clean.id);
  if (idx >= 0) savedPlayerCards[idx] = clean;
  else savedPlayerCards.unshift(clean);
  savedPlayerCards.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  try {
    const db = await openPlayerCardDB();
    const tx = db.transaction('cards', 'readwrite');
    tx.objectStore('cards').put(clean);
    await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
    db.close();
    return true;
  } catch (e) {
    console.warn('Save card IDB error', e);
    return false;
  }
}

async function deletePlayerCardFromIDB(cardId) {
  savedPlayerCards = savedPlayerCards.filter(c => c.id !== cardId);
  try {
    const db = await openPlayerCardDB();
    const tx = db.transaction('cards', 'readwrite');
    tx.objectStore('cards').delete(cardId);
    await new Promise((res) => { tx.oncomplete = res; tx.onerror = res; });
    db.close();
  } catch {}
}

async function saveCardLogosToIDB() {
  try {
    const db = await openPlayerCardDB();
    const tx = db.transaction('meta', 'readwrite');
    tx.objectStore('meta').put({ key: 'logos', value: playerCardLogos });
    await new Promise((res) => { tx.oncomplete = res; tx.onerror = res; });
    db.close();
  } catch {
    try { saveJSON(PC_LS_META_FALLBACK, { subTitle: playerCardLogos.subTitle || '' }); } catch {}
  }
}

function createDefaultPlayerCardDraft(overrides = {}) {
  const prevTheme = ui.playerCardDraft?.theme || 'diamond';
  const thObj = PLAYER_CARD_THEMES[prevTheme] || PLAYER_CARD_THEMES.diamond;
  const prevMetal = ui.playerCardDraft?.metalFinish || thObj.defaultMetal || 'chrome';
  const prevCat = ui.playerCardDraft?.category || '6ta';
  const prevBrand = ui.playerCardDraft ? ui.playerCardDraft.showAppBrand !== false : true;
  return {
    id: 'pc_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
    name: '',
    nickname: '',
    category: prevCat,
    age: '',
    position: 'Drive',
    hand: 'Diestro',
    bestShot: 'Víbora',
    theme: prevTheme,
    metalFinish: prevMetal,
    bgMode: 'ai',
    showAppBrand: prevBrand,
    zoom: 1,
    offsetX: 0,
    offsetY: 0,
    origPhoto: null,
    cutoutPhoto: null,
    origHasAlpha: false,
    ...overrides
  };
}

function getActivePlayerCardDraft() {
  if (!ui.playerCardDraft) {
    ui.playerCardDraft = createDefaultPlayerCardDraft();
  }
  return ui.playerCardDraft;
}

function getSavedCardForPlayerName(name) {
  const key = String(name || '').trim().toUpperCase();
  if (!key) return null;
  return savedPlayerCards.find(c => (c.nameKey || c.name?.trim().toUpperCase()) === key) || null;
}

function openPlayerCardFor(playerName = '', opts = {}) {
  ui.playerCardReturnRoute = opts.returnRoute || ui.route || 'home';
  ui.playerCardTouchDrag = false;
  ui.playerCardDraftDirty = true;
  const cleanName = String(playerName || '').trim();
  const isPlaceholder = /^(DRIVE|REV[EÉ]S)\s*[12]?$/i.test(cleanName);
  const existing = (!isPlaceholder && cleanName) ? getSavedCardForPlayerName(cleanName) : null;

  if (existing) {
    ui.playerCardDraft = { ...clone(existing) };
    ui.playerCardAiStatus = existing.cutoutPhoto ? 'ok' : '';
    ui.playerCardAiText = existing.cutoutPhoto ? '✓ Tarjeta y recorte cargados' : '';
  } else {
    ui.playerCardDraft = createDefaultPlayerCardDraft({
      name: isPlaceholder ? '' : cleanName,
      position: opts.position || 'Drive'
    });
    ui.playerCardAiStatus = '';
    ui.playerCardAiText = '';
  }
  scheduleSaveActiveDraftToIDB(true);
  navigate('player-card');
}

function loadCachedCardImage(src) {
  if (!src) return Promise.resolve(null);
  const effectiveSrc = DEFAULT_CENTER_LOGO_LEGACY_REFS.has(src) ? DEFAULT_CENTER_LOGO_URL : src;
  const hit = pcImgCache.get(effectiveSrc);
  if (hit && hit.complete && hit.naturalWidth > 0) return Promise.resolve(hit);
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      if (pcImgCache.size > 40) {
        const firstKey = pcImgCache.keys().next().value;
        pcImgCache.delete(firstKey);
      }
      pcImgCache.set(effectiveSrc, img);
      resolve(img);
    };
    img.onerror = () => resolve(null);
    img.src = effectiveSrc;
  });
}

function getSyncCachedCardImage(src) {
  if (!src) return null;
  const effectiveSrc = DEFAULT_CENTER_LOGO_LEGACY_REFS.has(src) ? DEFAULT_CENTER_LOGO_URL : src;
  const hit = pcImgCache.get(effectiveSrc);
  if (hit) return (hit.complete && hit.naturalWidth > 0) ? hit : null;
  const img = new Image();
  img.onload = () => {
    if (pcImgCache.size > 40) {
      const firstKey = pcImgCache.keys().next().value;
      pcImgCache.delete(firstKey);
    }
    pcImgCache.set(effectiveSrc, img);
    if (ui.route === 'player-card') refreshPlayerCardPreview();
  };
  img.onerror = () => {
    pcImgCache.delete(effectiveSrc);
  };
  pcImgCache.set(effectiveSrc, img);
  img.src = effectiveSrc;
  return null;
}

async function readFileScaledToDataUrl(file, maxDim = 1500) {
  let bmp = null;
  let objUrl = '';
  let srcEl = null;
  let w = 0;
  let h = 0;
  try {
    if (typeof createImageBitmap === 'function') {
      try {
        bmp = await createImageBitmap(file);
        srcEl = bmp;
        w = bmp.width;
        h = bmp.height;
      } catch {
        bmp = null;
      }
    }
    if (!srcEl) {
      objUrl = URL.createObjectURL(file);
      srcEl = await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('No se pudo leer la imagen'));
        img.src = objUrl;
      });
      w = srcEl.naturalWidth || srcEl.width;
      h = srcEl.naturalHeight || srcEl.height;
    }
    const scale = Math.min(1, maxDim / Math.max(w || 1, h || 1));
    const tw = Math.max(1, Math.round((w || 1) * scale));
    const th = Math.max(1, Math.round((h || 1) * scale));
    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = tw;
    tmpCanvas.height = th;
    const tctx = tmpCanvas.getContext('2d');
    tctx.drawImage(srcEl, 0, 0, tw, th);
    const usePng = /png|webp|svg/i.test(file.type || file.name || '');
    const outUrl = usePng ? tmpCanvas.toDataURL('image/png') : tmpCanvas.toDataURL('image/jpeg', 0.9);
    tmpCanvas.width = 0;
    tmpCanvas.height = 0;
    return outUrl;
  } finally {
    if (bmp && typeof bmp.close === 'function') {
      try { bmp.close(); } catch {}
    }
    if (objUrl) {
      try { URL.revokeObjectURL(objUrl); } catch {}
    }
  }
}

async function readFileAsImage(file, maxDim = 1500) {
  const dataUrl = await readFileScaledToDataUrl(file, maxDim);
  return await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('No se pudo decodificar la imagen'));
    img.src = dataUrl;
  });
}

function detectImageAlpha(img) {
  try {
    const c = document.createElement('canvas');
    c.width = 48; c.height = 48;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, 48, 48);
    const data = ctx.getImageData(0, 0, 48, 48).data;
    for (let i = 3; i < data.length; i += 4) {
      if (data[i] < 245) return true;
    }
  } catch {}
  return false;
}

async function processUploadedPlayerPhoto(file) {
  if (!file) return;
  const draft = getActivePlayerCardDraft();
  ui.playerCardDraftDirty = true;
  ui.playerCardTouchDrag = false;
  ui.playerCardAiStatus = 'loading';
  ui.playerCardAiText = '⏳ Cargando y optimizando foto...';
  updatePcAiStatusDom();
  try {
    const img = await readFileAsImage(file);
    const maxDim = 960;
    const scale = Math.min(1, maxDim / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
    const w = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
    const h = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);

    const hasAlpha = detectImageAlpha(img);
    draft.origPhoto = hasAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.90);
    c.width = 0; c.height = 0;
    draft.origHasAlpha = hasAlpha;
    draft.cutoutPhoto = hasAlpha ? draft.origPhoto : null;
    draft.zoom = 1;
    draft.offsetX = 0;
    draft.offsetY = 0;
    scheduleSaveActiveDraftToIDB(true);

    if (hasAlpha) {
      ui.playerCardAiStatus = 'ok';
      ui.playerCardAiText = '✓ Imagen PNG sin fondo detectada';
      render();
      return;
    }

    if (draft.bgMode === 'ai') {
      render();
      await runPlayerPhotoAiCutout(draft);
    } else {
      ui.playerCardAiStatus = 'ok';
      ui.playerCardAiText = '⚡ Modo instantáneo activo';
      render();
    }
  } catch (err) {
    console.error(err);
    ui.playerCardAiStatus = '';
    ui.playerCardAiText = '';
    render();
    showToast('No se pudo cargar esa imagen');
  }
}

async function loadPlayerAiSegmenter() {
  if (!pcSegmenterPromise) {
    pcSegmenterPromise = (async () => {
      const mod = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs');
      const { FilesetResolver, ImageSegmenter } = mod;
      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm'
      );
      const modelAssetPath = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
      try {
        return await ImageSegmenter.createFromOptions(vision, {
          baseOptions: { modelAssetPath, delegate: 'GPU' },
          runningMode: 'IMAGE',
          outputConfidenceMasks: true,
          outputCategoryMask: false
        });
      } catch {
        return await ImageSegmenter.createFromOptions(vision, {
          baseOptions: { modelAssetPath, delegate: 'CPU' },
          runningMode: 'IMAGE',
          outputConfidenceMasks: true,
          outputCategoryMask: false
        });
      }
    })().catch((err) => {
      pcSegmenterPromise = null;
      throw err;
    });
  }
  return pcSegmenterPromise;
}

async function runPlayerPhotoAiCutout(draft) {
  if (!draft || !draft.origPhoto) return;
  if (draft.origHasAlpha) {
    draft.cutoutPhoto = draft.origPhoto;
    ui.playerCardAiStatus = 'ok';
    ui.playerCardAiText = '✓ Imagen transparente lista';
    render();
    return;
  }

  const token = ++pcAiRequestToken;
  ui.playerCardAiBusy = true;
  ui.playerCardAiStatus = 'loading';
  ui.playerCardAiText = '✨ Recortando fondo con IA (la 1ª vez carga ~3 MB)...';
  updatePcAiStatusDom();

  try {
    const segmenter = await loadPlayerAiSegmenter();
    if (token !== pcAiRequestToken) return;

    const srcImg = await loadCachedCardImage(draft.origPhoto);
    if (!srcImg || token !== pcAiRequestToken) return;

    const w = srcImg.naturalWidth || srcImg.width;
    const h = srcImg.naturalHeight || srcImg.height;
    const result = segmenter.segment(srcImg);
    const masks = result.confidenceMasks || [];
    const labels = typeof segmenter.getLabels === 'function' ? segmenter.getLabels() : [];

    let personMaskIdx = 0;
    if (masks.length > 1) {
      const found = labels.findIndex(l => /person|foreground|human/i.test(String(l)));
      personMaskIdx = found >= 0 ? found : 1;
    }

    const maskObj = masks[personMaskIdx];
    if (!maskObj) throw new Error('No mask returned');

    const mw = maskObj.width || w;
    const mh = maskObj.height || h;
    const conf = maskObj.getAsFloat32Array();

    // Build smooth alpha mask canvas
    const maskCanvas = document.createElement('canvas');
    maskCanvas.width = mw;
    maskCanvas.height = mh;
    const mCtx = maskCanvas.getContext('2d');
    const imgData = mCtx.createImageData(mw, mh);
    const d = imgData.data;

    let personPixels = 0;
    for (let i = 0; i < conf.length; i++) {
      const c = conf[i];
      // Smoothstep feathering around person boundary
      const t = Math.max(0, Math.min(1, (c - 0.30) / (0.70 - 0.30)));
      const alpha = Math.round(t * t * (3 - 2 * t) * 255);
      if (alpha > 128) personPixels++;
      const p = i * 4;
      d[p] = 255;
      d[p + 1] = 255;
      d[p + 2] = 255;
      d[p + 3] = alpha;
    }
    mCtx.putImageData(imgData, 0, 0);

    try { result.close?.(); } catch {}

    if (personPixels < (conf.length * 0.015)) {
      throw new Error('No se detectó claramente una persona en la foto');
    }

    const outCanvas = document.createElement('canvas');
    outCanvas.width = w;
    outCanvas.height = h;
    const oCtx = outCanvas.getContext('2d');
    try { oCtx.filter = 'blur(1.4px)'; } catch {}
    oCtx.drawImage(maskCanvas, 0, 0, w, h);
    try { oCtx.filter = 'none'; } catch {}
    oCtx.globalCompositeOperation = 'source-in';
    oCtx.drawImage(srcImg, 0, 0, w, h);
    oCtx.globalCompositeOperation = 'source-over';

    if (token !== pcAiRequestToken) return;
    draft.cutoutPhoto = outCanvas.toDataURL('image/png');
    maskCanvas.width = 0; maskCanvas.height = 0;
    outCanvas.width = 0; outCanvas.height = 0;
    draft.bgMode = 'ai';
    ui.playerCardAiBusy = false;
    ui.playerCardAiStatus = 'ok';
    ui.playerCardAiText = '✓ Fondo recortado automáticamente';
    ui.playerCardDraftDirty = true;
    scheduleSaveActiveDraftToIDB(true);
    updatePcAiStatusDom();
    refreshPlayerCardPreview();
  } catch (err) {
    if (token !== pcAiRequestToken) return;
    console.warn('AI cutout fallback:', err);
    ui.playerCardAiBusy = false;
    draft.bgMode = 'instant';
    ui.playerCardAiStatus = 'err';
    ui.playerCardAiText = 'No se pudo usar IA (sin conexión o foto compleja) · Aplicado Modo Instantáneo';
    ui.playerCardDraftDirty = true;
    scheduleSaveActiveDraftToIDB(true);
    render();
  }
}

function updatePcAiStatusDom() {
  const el = document.getElementById('pc-ai-status-box');
  if (!el) return;
  if (!ui.playerCardAiText) {
    el.style.display = 'none';
    return;
  }
  el.style.display = 'flex';
  el.className = 'pc-ai-status ' + (ui.playerCardAiStatus === 'ok' ? 'ok' : (ui.playerCardAiStatus === 'err' ? 'err' : ''));
  el.textContent = ui.playerCardAiText;
}

// ---------- Canvas Geometry & Vector Artwork Helpers ----------
function traceChamferedRect(ctx, x, y, w, h, cut) {
  ctx.beginPath();
  ctx.moveTo(x + cut, y);
  ctx.lineTo(x + w - cut, y);
  ctx.lineTo(x + w, y + cut);
  ctx.lineTo(x + w, y + h - cut);
  ctx.lineTo(x + w - cut, y + h);
  ctx.lineTo(x + cut, y + h);
  ctx.lineTo(x, y + h - cut);
  ctx.lineTo(x, y + cut);
  ctx.closePath();
}

function drawRoundedPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function fitCanvasFontSize(ctx, text, maxW, startSize, minSize, fontFmt) {
  let size = startSize;
  while (size > minSize) {
    ctx.font = fontFmt(size);
    if (ctx.measureText(text).width <= maxW) break;
    size -= 2;
  }
  ctx.font = fontFmt(size);
  return size;
}

function drawPadelControlEmblemCanvas(ctx, cx, cy, size, theme) {
  ctx.save();
  ctx.translate(cx, cy);
  const s = size / 120;
  ctx.scale(s, s);
  ctx.translate(-60, -60);

  const gGold = ctx.createLinearGradient(10, 10, 110, 110);
  if (theme.id === 'purple') {
    gGold.addColorStop(0, '#ffffff');
    gGold.addColorStop(0.35, '#e9d5ff');
    gGold.addColorStop(0.7, '#a855f7');
    gGold.addColorStop(1, '#f5d061');
  } else {
    gGold.addColorStop(0, '#fff6cc');
    gGold.addColorStop(0.35, '#f3d266');
    gGold.addColorStop(0.7, '#d4af37');
    gGold.addColorStop(1, '#a87910');
  }

  // Outer squircle
  drawRoundedPath(ctx, 4, 4, 112, 112, 26);
  ctx.fillStyle = '#09080f';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = gGold;
  ctx.stroke();

  // Inner Shield
  ctx.beginPath();
  ctx.moveTo(60, 14);
  ctx.lineTo(96, 27);
  ctx.lineTo(96, 59);
  ctx.quadraticCurveTo(96, 86, 60, 105);
  ctx.quadraticCurveTo(24, 86, 24, 59);
  ctx.lineTo(24, 27);
  ctx.closePath();
  ctx.fillStyle = 'rgba(12, 11, 20, 0.9)';
  ctx.fill();
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = gGold;
  ctx.stroke();

  // Tilted Racket
  ctx.save();
  ctx.translate(58, 57);
  ctx.rotate(-0.42);
  ctx.translate(-58, -57);
  ctx.beginPath();
  ctx.ellipse(60, 46, 20, 24, 0, 0, Math.PI * 2);
  ctx.fillStyle = gGold;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(60, 46, 15.5, 19, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#09090d';
  ctx.fill();
  // Grip
  drawRoundedPath(ctx, 56, 69, 8, 28, 3);
  ctx.fillStyle = gGold;
  ctx.fill();
  // Drilled holes
  ctx.fillStyle = gGold;
  [[-6, -9],[0,-10],[6,-9],[-9,-2],[-3,-2],[3,-2],[9,-2],[-8,5],[-2,5],[4,5],[10,5],[-5,11],[0,12],[5,11]].forEach(([hx, hy]) => {
    ctx.beginPath();
    ctx.arc(60 + hx, 46 + hy, 1.7, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();

  // Padel ball
  const ballG = ctx.createRadialGradient(75, 69, 2, 79, 73, 15);
  ballG.addColorStop(0, '#ffffff');
  ballG.addColorStop(0.5, theme.accentBright);
  ballG.addColorStop(1, theme.accent);
  ctx.beginPath();
  ctx.arc(79, 73, 14, 0, Math.PI * 2);
  ctx.fillStyle = ballG;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#070709';
  ctx.stroke();

  // Bottom SÉ pill
  drawRoundedPath(ctx, 41, 94, 38, 17, 8.5);
  ctx.fillStyle = '#09080c';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = gGold;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'italic 800 12.5px "Barlow Condensed", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('SÉ', 60, 103);

  ctx.restore();
}

let pcCarbonCanvasCache = null;
function getCarbonPattern(ctx) {
  if (!pcCarbonCanvasCache) {
    const c = document.createElement('canvas');
    c.width = 16;
    c.height = 16;
    const x = c.getContext('2d');
    x.fillStyle = '#05070d';
    x.fillRect(0, 0, 16, 16);
    // 2x2 diagonal twill carbon weave
    x.fillStyle = '#0e1422';
    x.fillRect(0, 0, 8, 8);
    x.fillRect(8, 8, 8, 8);
    x.fillStyle = 'rgba(255,255,255,0.065)';
    x.fillRect(0, 0, 8, 3);
    x.fillRect(8, 8, 8, 3);
    x.fillStyle = '#090d16';
    x.fillRect(8, 0, 8, 8);
    x.fillRect(0, 8, 8, 8);
    x.fillStyle = 'rgba(255,255,255,0.03)';
    x.fillRect(8, 4, 8, 2);
    x.fillRect(0, 12, 8, 2);
    pcCarbonCanvasCache = c;
  }
  return ctx.createPattern(pcCarbonCanvasCache, 'repeat');
}

function getMetalPalette(metalKey, theme) {
  return PLAYER_CARD_METALS[metalKey] || PLAYER_CARD_METALS[theme?.defaultMetal] || PLAYER_CARD_METALS.chrome;
}

function drawDiamondGlint(ctx, cx, cy, size, tint = '#ffffff') {
  ctx.save();
  ctx.translate(cx, cy);
  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.9);
  glow.addColorStop(0, '#ffffff');
  glow.addColorStop(0.28, tint + 'cc');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.9, 0, Math.PI * 2);
  ctx.fill();

  // Sharp 4-point star flare
  ctx.fillStyle = '#ffffff';
  const drawRays = (len, thick) => {
    ctx.beginPath();
    ctx.moveTo(0, -len);
    ctx.quadraticCurveTo(thick * 0.4, -thick * 0.4, len, 0);
    ctx.quadraticCurveTo(thick * 0.4, thick * 0.4, 0, len);
    ctx.quadraticCurveTo(-thick * 0.4, thick * 0.4, -len, 0);
    ctx.quadraticCurveTo(-thick * 0.4, -thick * 0.4, 0, -len);
    ctx.closePath();
    ctx.fill();
  };
  drawRays(size, size * 0.14);
  ctx.rotate(Math.PI / 4);
  ctx.globalAlpha = 0.55;
  drawRays(size * 0.46, size * 0.10);
  ctx.restore();
}

function drawMetallicText(ctx, text, x, y, opts = {}) {
  const metal = getMetalPalette(opts.metalKey, opts.theme);
  const fontSize = opts.fontSize || 48;
  const extrude = opts.extrude ?? Math.max(3, Math.round(fontSize * 0.08));
  const bevelWidth = opts.bevelWidth ?? Math.max(1.2, fontSize * 0.025);
  const isItalic = /italic/i.test(ctx.font || '');

  const m = ctx.measureText(text);
  const asc = m.actualBoundingBoxAscent || fontSize * 0.72;
  const desc = m.actualBoundingBoxDescent || fontSize * 0.08;
  const tb = ctx.textBaseline || 'alphabetic';
  let yTop, yBot;
  if (tb === 'middle') {
    yTop = y - asc * 0.54;
    yBot = y + asc * 0.54;
  } else if (tb === 'top' || tb === 'hanging') {
    yTop = y;
    yBot = y + asc;
  } else {
    yTop = y - asc;
    yBot = y + Math.max(2, desc);
  }
  if (yBot - yTop < 12) {
    yTop = y - fontSize * 0.5;
    yBot = y + fontSize * 0.5;
  }

  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // 1. Deep Ambient Drop Shadow + Optional Theme Rim Glow
  if (extrude > 0) {
    for (let s = extrude; s >= 1; s--) {
      ctx.save();
      if (s === extrude) {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.90)';
        ctx.shadowBlur = Math.max(8, extrude * 3.2);
        ctx.shadowOffsetX = extrude * 0.45;
        ctx.shadowOffsetY = extrude * 1.1;
      } else {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
      }
      ctx.fillStyle = s > extrude * 0.45 ? metal.extrudeDark : metal.extrudeMid;
      ctx.fillText(text, x + s * 0.46, y + s * 0.96);
      ctx.restore();
    }
  }

  // 2. Subtle outer glow for electric diamond separation
  if (opts.glowColor) {
    ctx.save();
    ctx.shadowColor = opts.glowColor;
    ctx.shadowBlur = opts.glowBlur || 22;
    ctx.fillStyle = 'rgba(255,255,255,0.01)';
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  // 3. Machined Bevel Stroke around characters
  if (bevelWidth > 0) {
    const bGrad = ctx.createLinearGradient(x, yTop, x + (isItalic ? 18 : 0), yBot);
    bGrad.addColorStop(0, metal.bevelTop);
    bGrad.addColorStop(0.5, metal.extrudeMid);
    bGrad.addColorStop(1, metal.bevelBot);
    ctx.lineWidth = bevelWidth * 2;
    ctx.strokeStyle = bGrad;
    ctx.strokeText(text, x, y);
  }

  // 4. Multi-stop Specular Horizon Metallic Face
  const xShift = isItalic ? Math.round((yBot - yTop) * 0.16) : 0;
  const fGrad = ctx.createLinearGradient(x, yTop, x + xShift, yBot);
  metal.stops.forEach(([pos, col]) => fGrad.addColorStop(pos, col));
  ctx.fillStyle = fGrad;
  ctx.fillText(text, x, y);

  // 5. Crisp top inner highlight sheen
  ctx.save();
  ctx.globalAlpha = 0.34;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(text, x - 0.6, y - 0.9);
  ctx.restore();

  ctx.restore();
}

function traceArmorPlatePath(ctx, x, y, w, h, cut = 20) {
  const r = 8;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - cut, y);
  ctx.lineTo(x + w, y + cut);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + cut, y + h);
  ctx.lineTo(x, y + h - cut);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function traceDiamondShieldPath(ctx, x, y, w, h) {
  ctx.beginPath();
  ctx.moveTo(x + 26, y);
  ctx.lineTo(x + w - 26, y);
  ctx.lineTo(x + w, y + 26);
  ctx.lineTo(x + w - 12, y + h * 0.72);
  ctx.lineTo(x + w * 0.50, y + h);
  ctx.lineTo(x + 12, y + h * 0.74);
  ctx.lineTo(x, y + 26);
  ctx.closePath();
}

function traceHexagonPath(ctx, cx, cy, rad) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI / 3) * i - Math.PI / 6;
    const px = cx + Math.cos(a) * rad;
    const py = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawLogoFit(ctx, img, boxX, boxY, boxW, boxH) {
  if (!img) return;
  const iw = img.naturalWidth || img.width;
  const ih = img.naturalHeight || img.height;
  if (!iw || !ih) return;
  const scale = Math.min(boxW / iw, boxH / ih);
  const dw = iw * scale;
  const dh = ih * scale;
  const dx = boxX + (boxW - dw) / 2;
  const dy = boxY + (boxH - dh) / 2;
  ctx.save();
  // Soft radial backing light so dark or metallic logos pop clearly
  const halo = ctx.createRadialGradient(dx + dw / 2, dy + dh / 2, 10, dx + dw / 2, dy + dh / 2, Math.max(dw, dh) * 0.68);
  halo.addColorStop(0, 'rgba(255, 255, 255, 0.14)');
  halo.addColorStop(1, 'transparent');
  ctx.fillStyle = halo;
  ctx.fillRect(boxX - 18, boxY - 14, boxW + 36, boxH + 28);

  ctx.shadowColor = 'rgba(0,0,0,0.85)';
  ctx.shadowBlur = 18;
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.restore();
}

function drawFacetedDiamondBackdrop(ctx, W, H, theme) {
  const facets = [
    [[24, 24], [380, 24], [190, 280], 'rgba(255,255,255,0.035)'],
    [[380, 24], [690, 24], [520, 240], 'rgba(255,255,255,0.018)'],
    [[690, 24], [1056, 24], [880, 310], 'rgba(255,255,255,0.045)'],
    [[24, 280], [190, 280], [340, 560], 'rgba(255,255,255,0.025)'],
    [[190, 280], [520, 240], [340, 560], 'rgba(0,0,0,0.18)'],
    [[520, 240], [880, 310], [640, 620], 'rgba(255,255,255,0.03)'],
    [[880, 310], [1056, 360], [1056, 740], 'rgba(0,0,0,0.22)'],
    [[24, 580], [340, 560], [210, 920], 'rgba(255,255,255,0.032)'],
    [[340, 560], [640, 620], [510, 960], 'rgba(255,255,255,0.02)'],
    [[640, 620], [1056, 740], [820, 1020], 'rgba(255,255,255,0.038)'],
    [[24, 920], [510, 960], [290, 1140], 'rgba(0,0,0,0.20)']
  ];
  ctx.save();
  facets.forEach(([p1, p2, p3, fill]) => {
    ctx.beginPath();
    ctx.moveTo(p1[0], p1[1]);
    ctx.lineTo(p2[0], p2[1]);
    ctx.lineTo(p3[0], p3[1]);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = theme.accentBright + '1c';
    ctx.stroke();
  });

  // Volumetric angled stadium light shafts
  const beams = [
    { x0: 140, x1: 420, bx0: 360, bx1: 680, alpha: 0.14 },
    { x0: 520, x1: 780, bx0: 200, bx1: 540, alpha: 0.11 },
    { x0: 760, x1: 990, bx0: 560, bx1: 940, alpha: 0.09 }
  ];
  beams.forEach((b) => {
    const bg = ctx.createLinearGradient((b.x0 + b.x1) / 2, 40, (b.bx0 + b.bx1) / 2, 980);
    bg.addColorStop(0, theme.accentBright + Math.round(b.alpha * 255).toString(16).padStart(2, '0'));
    bg.addColorStop(0.65, theme.accent + '14');
    bg.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.moveTo(b.x0, 20);
    ctx.lineTo(b.x1, 20);
    ctx.lineTo(b.bx1, 1020);
    ctx.lineTo(b.bx0, 1020);
    ctx.closePath();
    ctx.fillStyle = bg;
    ctx.fill();
  });

  // Deterministic diamond dust & micro sparkle particles
  for (let i = 0; i < 34; i++) {
    const px = 48 + ((i * 197 + 43) % 984);
    const py = 210 + ((i * 151 + 89) % 860);
    const sz = 2.2 + (i % 4) * 1.4;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(Math.PI / 4);
    ctx.globalAlpha = 0.18 + (i % 5) * 0.09;
    ctx.fillStyle = i % 3 === 0 ? '#ffffff' : theme.accentBright;
    ctx.fillRect(-sz / 2, -sz / 2, sz, sz);
    ctx.restore();
  }
  ctx.restore();
}

function drawMachinedDiamondFrame(ctx, W, H, framePad, innerCut, theme, metalKey) {
  const metal = getMetalPalette(metalKey, theme);
  const ox = framePad - 10, oy = framePad - 10, ow = W - ox * 2, oh = H - oy * 2, oCut = innerCut + 4;
  const ix = framePad + 6, iy = framePad + 6, iw = W - ix * 2, ih = H - iy * 2, iCut = innerCut - 3;

  const outerPts = [
    [ox + oCut, oy],
    [ox + ow - oCut, oy],
    [ox + ow, oy + oCut],
    [ox + ow, oy + oh - oCut],
    [ox + ow - oCut, oy + oh],
    [ox + oCut, oy + oh],
    [ox, oy + oh - oCut],
    [ox, oy + oCut]
  ];
  const innerPts = [
    [ix + iCut, iy],
    [ix + iw - iCut, iy],
    [ix + iw, iy + iCut],
    [ix + iw, iy + ih - iCut],
    [ix + iw - iCut, iy + ih],
    [ix + iCut, iy + ih],
    [ix, iy + ih - iCut],
    [ix, iy + iCut]
  ];

  // Beveled directional lighting per each of the 8 machined edge facets
  const paletteFaces = metal.edgeFaces || PLAYER_CARD_METALS.chrome.edgeFaces;

  ctx.save();
  for (let i = 0; i < 8; i++) {
    const n = (i + 1) % 8;
    const p1 = outerPts[i], p2 = outerPts[n], p3 = innerPts[n], p4 = innerPts[i];
    ctx.beginPath();
    ctx.moveTo(p1[0], p1[1]);
    ctx.lineTo(p2[0], p2[1]);
    ctx.lineTo(p3[0], p3[1]);
    ctx.lineTo(p4[0], p4[1]);
    ctx.closePath();

    const g = ctx.createLinearGradient(p1[0], p1[1], p3[0], p3[1]);
    const stops = paletteFaces[i];
    g.addColorStop(0, stops[0]);
    g.addColorStop(0.55, stops[1]);
    g.addColorStop(1, stops[2]);
    ctx.fillStyle = g;
    ctx.fill();

    // Subtle crisp CNC miter seam line between adjacent frame facets
    ctx.beginPath();
    ctx.moveTo(p1[0], p1[1]);
    ctx.lineTo(p4[0], p4[1]);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Outer perimeter razor outline
  traceChamferedRect(ctx, ox, oy, ow, oh, oCut);
  ctx.lineWidth = 2.2;
  ctx.strokeStyle = 'rgba(255,255,255,0.42)';
  ctx.stroke();

  // Inner recessed dark channel + glowing theme neon pinstripe
  traceChamferedRect(ctx, ix, iy, iw, ih, iCut);
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#03050a';
  ctx.stroke();

  traceChamferedRect(ctx, ix + 1.5, iy + 1.5, iw - 3, ih - 3, iCut - 1);
  ctx.lineWidth = 2.4;
  ctx.strokeStyle = theme.accentBright;
  ctx.shadowColor = theme.accent;
  ctx.shadowBlur = 16;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 4 Diamond Corner Rivets at the chamfer midpoints
  const corners = [
    [(outerPts[7][0] + outerPts[0][0]) / 2, (outerPts[7][1] + outerPts[0][1]) / 2],
    [(outerPts[1][0] + outerPts[2][0]) / 2, (outerPts[1][1] + outerPts[2][1]) / 2],
    [(outerPts[3][0] + outerPts[4][0]) / 2, (outerPts[3][1] + outerPts[4][1]) / 2],
    [(outerPts[5][0] + outerPts[6][0]) / 2, (outerPts[5][1] + outerPts[6][1]) / 2]
  ];
  corners.forEach(([cx, cy]) => {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#050811';
    ctx.fillRect(-7, -7, 14, 14);
    ctx.fillStyle = theme.accentBright;
    ctx.fillRect(-4.5, -4.5, 9, 9);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-2, -2, 4, 4);
    ctx.restore();
  });

  // High-grade diamond flares on key metallic edges (kept cleanly inside canvas bounds)
  drawDiamondGlint(ctx, ox + oCut + 16, oy + 12, 20, theme.accentBright);
  drawDiamondGlint(ctx, ox + ow - oCut - 10, oy + oh - 12, 18, theme.accentBright);

  ctx.restore();
}

function drawPlayerCardCanvas(canvas, draft, preloadedImgs = null) {
  if (!canvas || !draft) return;
  const W = 1080, H = 1350;
  if (canvas.width !== W) canvas.width = W;
  if (canvas.height !== H) canvas.height = H;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const theme = PLAYER_CARD_THEMES[draft.theme] || PLAYER_CARD_THEMES.diamond;
  const metalKey = draft.metalFinish || theme.defaultMetal || 'chrome';
  const metal = getMetalPalette(metalKey, theme);
  const carbonPat = getCarbonPattern(ctx);

  const getImg = (src) => {
    if (!src) return null;
    if (preloadedImgs && preloadedImgs.has(src)) return preloadedImgs.get(src);
    return getSyncCachedCardImage(src);
  };

  const photoSrc = (draft.bgMode === 'ai' && draft.cutoutPhoto) ? draft.cutoutPhoto : draft.origPhoto;
  const photoImg = getImg(photoSrc);
  const logo1Img = getImg(playerCardLogos.logo1);
  const logo2Img = getImg(playerCardLogos.logo2);

  ctx.clearRect(0, 0, W, H);

  // Outer dark chassis backing
  traceChamferedRect(ctx, 8, 8, W - 16, H - 16, 52);
  ctx.fillStyle = '#03050a';
  ctx.fill();

  // Inner chamfered card artwork clip
  const framePad = 24;
  const innerCut = 44;
  ctx.save();
  traceChamferedRect(ctx, framePad + 4, framePad + 4, W - (framePad + 4) * 2, H - (framePad + 4) * 2, innerCut - 2);
  ctx.clip();

  // 1. Deep Arena Gradient + Carbon Texture + Faceted Diamond Backdrop
  const bgG = ctx.createRadialGradient(390, 520, 40, 540, 640, 920);
  bgG.addColorStop(0, theme.bgMid);
  bgG.addColorStop(0.55, theme.bgTop);
  bgG.addColorStop(1, theme.bgBot);
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  if (carbonPat) {
    ctx.save();
    ctx.globalAlpha = 0.36;
    ctx.fillStyle = carbonPat;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // Dual electric atmosphere blooms
  const bloom1 = ctx.createRadialGradient(320, 540, 15, 320, 540, 480);
  bloom1.addColorStop(0, theme.courtGlow + '68');
  bloom1.addColorStop(0.5, theme.courtGlow2 + '24');
  bloom1.addColorStop(1, 'transparent');
  ctx.fillStyle = bloom1;
  ctx.fillRect(0, 0, W, H);

  const bloom2 = ctx.createRadialGradient(840, 220, 10, 840, 220, 440);
  bloom2.addColorStop(0, theme.accentBright + '42');
  bloom2.addColorStop(1, 'transparent');
  ctx.fillStyle = bloom2;
  ctx.fillRect(0, 0, W, H);

  // Perspective indoor court floor + crisp perspective court lines
  const floorG = ctx.createLinearGradient(0, 810, 0, H);
  floorG.addColorStop(0, 'rgba(0,0,0,0)');
  floorG.addColorStop(0.32, theme.courtGlow2 + '3a');
  floorG.addColorStop(1, theme.bgBot);
  ctx.fillStyle = floorG;

  ctx.restore();

  // Pro Athletic Padel Emblem + Diamond Crest on Bottom Right
  drawProPadelEmblem(ctx, 888, 1094, 1.30, theme, metalKey);

  if (draft.showAppBrand) {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(226, 232, 240, 0.52)';
    ctx.font = '700 15px "Chakra Petch", "Plus Jakarta Sans", sans-serif';
    ctx.fillText('PÁDEL CONTROL SÉ · DIAMOND EDITION', 74, H - 44);
  }
  ctx.restore();

  ctx.restore(); // End inner card clip

  // 8. Multi-Facet Machined Metallic Outer Diamond Frame
  drawMachinedDiamondFrame(ctx, W, H, framePad, innerCut, theme, metalKey);
}

function refreshPlayerCardPreview() {

async function renderExportPlayerCardBlob() {
  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch {}
  }
  const draft = getActivePlayerCardDraft();
  const photoSrc = (draft.bgMode === 'ai' && draft.cutoutPhoto) ? draft.cutoutPhoto : draft.origPhoto;
  const srcs = [photoSrc, playerCardLogos.logo1, playerCardLogos.logo2].filter(Boolean);
  const loaded = new Map();
  await Promise.all(srcs.map(async (s) => {
    const img = await loadCachedCardImage(s);
    if (img) loaded.set(s, img);
  }));

  const canvas = document.createElement('canvas');
  canvas.width = 1080;
  canvas.height = 1350;
  drawPlayerCardCanvas(canvas, draft, loaded);

  return new Promise((resolve) => {
    canvas.toBlob((blob) => resolve(blob), 'image/png');
  });
}

function getPlayerCardFileSlug(name) {
  const clean = String(name || 'jugador').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return `tarjeta-${clean || 'jugador'}-padel-se.png`;
}

async function downloadPlayerCardImage() {
  const draft = getActivePlayerCardDraft();
  const blob = await renderExportPlayerCardBlob();
  if (!blob) {
    showToast('No se pudo generar la imagen');
    return;
  }
  triggerBlobDownload(blob, getPlayerCardFileSlug(draft.name));
  showToast('¡Tarjeta HD descargada!');
}

async function saveCurrentPlayerCard() {

function navigate(route, extra = {}) {
  Object.assign(ui, extra);
  ui.route = route;
  ui.menuOpen = false;
  ui.shotSheet = null;
  ui.playerCardTouchDrag = false;
  try {
    const h = String(location.hash || '');
    const isSharedHash = /^#(v|live|s|r|rk_id|c|join|comp|share|rk|ranking)=/.test(h);
    const navHash = (route === 'comp-detail' && ui.compId) ? ('#comp=' + ui.compId) : ('#' + route);
    if ((route === 'player-card' || !isSharedHash) && h !== navHash) {
      history.replaceState(null, '', navHash);
    }
  } catch {}
  updateWakeLock();
  render();
  window.scrollTo(0, 0);
}

function getMatchContextBadgeHtml(m) {
  const kind = getMatchKind(m);
  const comp = getMatchCompId(m) ? getCompById(getMatchCompId(m)) : null;
  const stage = m?.competition?.stageLabel ? ` · ${m.competition.stageLabel}` : '';
  let badge = '';
  if (kind === 'league') {
    badge = `<span class="badge league">🏅 ${esc(comp?.name || m?.competition?.compName || 'Liga')}${esc(stage)}</span>`;
  } else if (kind === 'tournament') {
    badge = `<span class="badge tourn">🏆 ${esc(comp?.name || m?.competition?.compName || 'Torneo')}${esc(stage)}</span>`;
  } else {
    badge = `<span class="badge daily">☀️ Partido del Día</span>`;
  }
  if (m?.isWalkover) badge += `<span class="badge ab">W.O.</span>`;
  return badge;
}

function renderMatchCard(m) {
  const st = computeMatch(m);
  const w = st.matchWinner;
  const badgeHtml = m.status === 'playing'
    ? `<span class="badge live">En juego</span>`
    : m.status === 'abandoned'
      ? `<span class="badge ab">Incompleto</span>`
      : m.isWalkover
        ? `<span class="badge">Sin juego</span>`
        : `<span class="badge">${esc(fmtDurationLong(m.durationMs))}</span>`;

  let eloBadge = '';
  if ((w !== null || st.isDraw) && !m.isWalkover) {
    const eloInfo = calculateMatchEloPreview(m);
    if (eloInfo) {
      const p0Delta = eloInfo.pair0.players[0]?.delta || 0;
      const p1Delta = eloInfo.pair1.players[0]?.delta || 0;
      if (st.isDraw) {
        const dMax = Math.max(Math.abs(p0Delta), Math.abs(p1Delta));
        eloBadge = `<span class="badge">🤝 Empate</span>` + (dMax > 0 ? ` <span class="badge elo" title="Ajuste ELO por empate">⚡ ELO ±${dMax}</span>` : '');
      } else {
        const winPair = w === 0 ? eloInfo.pair0 : eloInfo.pair1;
        const pts = Math.abs(winPair.players[0]?.delta || 0);
        eloBadge = `<span class="badge elo" title="Puntos ELO en juego">⚡ ELO ±${pts}</span>`;
      }
    }
  } else if (st.isDraw) {
    eloBadge = `<span class="badge">🤝 Empate</span>`;
  }

  const renderRow = (t) => {
    const setsHtml = st.sets.map((s, idx) => {
      if (s.games[0] === 0 && s.games[1] === 0 && idx > 0 && s.winner === null) return '';
      const cls = s.winner === t ? 's w' : (s.winner === null && m.status === 'playing' ? 's cur' : 's');
      return `<span class="${cls}">${s.games[t]}</span>`;
    }).join('');
    return `
      <div class="mrow ${w===t?'win':''}">
        <span class="bar" style="--c:${esc(m.teams[t].color)}"></span>
        <span class="nm">${esc(teamLabel(m, t))}</span>
        ${w===t ? `<span class="tro">${ICONS.trophy}</span>` : ''}
        ${setsHtml}
      </div>`;
  };

  return `
  <button class="mcard" data-open-stats="${esc(m.id)}">
    <div class="mmeta">
      <span>${esc(fmtDateLong(m.createdAt))}</span>
      ${getMatchContextBadgeHtml(m)}
      ${eloBadge}
      ${badgeHtml}
    </div>
    ${renderRow(0)}
    ${renderRow(1)}
  </button>`;
}

      });
      const sorted = sortStandingsRows(leaderRows, isPP ? 'elo' : 'pts', { tiebreakMode: isPP ? 'games' : 'sets' });
      const leader = sorted[0];
      const matchesCount = getCompetitionMatches(c).filter(m => m.status === 'finished').length;
      return `
      <button class="comp-card" style="width:100%;text-align:left" data-open-comp="${esc(c.id)}">

              <span class="badge">${(c.participants||[]).length} inscriptos · ${matchesCount} PJ</span>
            </div>
            <div class="comp-card-title">${esc(c.name)}</div>
          </div>
        </div>
        ${leader && leader.matches > 0
          ? (isPP
            ? `<div class="comp-leader">🥇 Líder ELO: <b>${esc(leader.name)}</b> · ${leader.elo} ELO (${leader.pts} pts · ${leader.gamesWon || 0}G)</div>`
            : `<div class="comp-leader">🥇 Líder: <b>${esc(leader.name)}</b> · ${leader.pts} pts · ${leader.elo} ELO</div>`)
          : `<div class="comp-leader">Tocá para cargar resultados o ver tabla</div>`}
      </button>`;
    }).join('')}` : '';

  const recent = historyList.slice(0, 4);

function getKnownPlayerNames() {
  const set = new Set();
  historyList.forEach(m => m.teams.forEach(t => t.players.forEach(p => { if (p && p.trim()) set.add(p.trim()); })));
  competitionsList.forEach(c => (c.participants || []).forEach(p => {
    if (p.type === 'pair') (p.players || []).forEach(n => { if (n && n.trim()) set.add(n.trim()); });
    else if (p.name && p.name.trim()) set.add(p.name.trim());
  }));
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'es'));
}

function renderNewMatch() {
  const p = preset;
  const ctx = p.matchContext || 'daily';
  if ((ctx === 'league' || ctx === 'tournament')) {
    const matchingComps = competitionsList.filter(c => c.kind === ctx);
    if (!p.compId || !matchingComps.some(c => c.id === p.compId)) {
      p.compId = matchingComps[0]?.id || '';
      p.fixtureId = '';
    }
  } else {
    p.compId = '';
    p.fixtureId = '';
  }

  const totalSets = Math.max(1, Number(p.totalSets) || (p.setsToWin ? (p.setsToWin * 2 - 1) : 3));
  const gps = Math.max(1, Number(p.gamesPerSet) || 6);
  const tbPts = Math.max(1, Number(p.tiebreakPoints) || 7);
  const hasTB = p.tiebreakAt !== 0;
  const known = getKnownPlayerNames();
  const datalist = `<datalist id="known-players">${known.map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;

  // Server chips (always 2 vs 2 doubles)
  const srvChips = [];
  for (let t = 0; t < 2; t++) {
    for (let pi = 0; pi < 2; pi++) {
      const name = p.teams[t].players[pi] || (pi === 0 ? `DRIVE ${t+1}` : `REVÉS ${t+1}`);
      const isOn = p.firstServer[0] === t && p.firstServer[1] === pi;

        <button type="button" class="chip ${isOn?'on':''}" style="--c:${esc(col)};--f:${fgFor(col)}" data-set-srv="${t},${pi}">

  const partPairs = (selComp?.participants || []).filter(pt => pt.type === 'pair');

  let contextDetailHtml = '';

    contextDetailHtml = `

        ${compsOfKind.length ? `

            ${activePickedFx ? `

            ${partPairs.length ? `

                    ${partPairs.map(pt => `<option value="${esc(selComp.id)}:${esc(pt.id)}">${esc(formatPairLabel(pt.players?.[0], pt.players?.[1]))}</option>`).join('')}
                  </select>
                </div>
                <div class="field">
                  <label>Cargar pareja inscripta → Pareja 2</label>
                  <select class="inp" data-fill-pair-team="1">
                    <option value="">-- Elegir pareja --</option>
                    ${partPairs.map(pt => `<option value="${esc(selComp.id)}:${esc(pt.id)}">${esc(formatPairLabel(pt.players?.[0], pt.players?.[1]))}</option>`).join('')}
                  </select>

    ${[0,1].map(t => `
    <div class="card team-card" style="--c:${esc(p.teams[t].color)}">

            p.changeoverRule === 'set'

        </div>

function getAppShareUrl() {
  return location.href.split('#')[0];
}

function renderQRToCanvas(canvas, value, size = 200) {
  if (!canvas || !value) return;
  const str = String(value);
  try {
    if (typeof window.QRious !== 'undefined') {
      new window.QRious({
        element: canvas,
        value: str,
        size: size,
        level: str.length > 750 ? 'L' : (str.length > 260 ? 'M' : 'H'),
        padding: 8,
        background: '#ffffff',
        foreground: '#060609'
      });
      return;
    }
  } catch (err) {
    console.warn('QR canvas error:', err);
  }
  try {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const ctx = canvas.getContext('2d');
      if (ctx) ctx.drawImage(img, 0, 0, size, size);
    };
    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&margin=8&data=' + encodeURIComponent(str);
  } catch (e) {}
}

function downloadAppQR() {
  try {
    const url = getAppShareUrl();
    const qrCanvas = document.createElement('canvas');
    if (typeof window.QRious !== 'undefined') {
      new window.QRious({
        element: qrCanvas,
        value: url,
        size: 380,
        level: 'H',
        padding: 14,
        background: '#ffffff',
        foreground: '#060609'
      });
    }

    const W = 560, H = 740;
    const card = document.createElement('canvas');
    card.width = W;
    card.height = H;
    const ctx = card.getContext('2d');
    if (!ctx) return;

    // Dark luxury background
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#161410');
    bgGrad.addColorStop(0.5, '#0a0a0d');
    bgGrad.addColorStop(1, '#040406');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Outer Gold border
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 3;
    ctx.strokeRect(16, 16, W - 32, H - 32);

    // Inner subtle gold line
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(22, 22, W - 44, H - 44);

    // Title
    ctx.fillStyle = '#f5d061';
    ctx.font = 'bold italic 32px "Barlow Condensed", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PÁDEL CONTROL SÉ', W / 2, 75);

    // Subtitle Signature
    ctx.fillStyle = '#d4af37';
    ctx.font = 'italic 20px "Great Vibes", cursive, sans-serif';
    ctx.fillText('By Sairaf Engel', W / 2, 108);

    // White rounded card for QR
    const qrX = (W - 380) / 2;
    const qrY = 135;
    ctx.fillStyle = '#ffffff';
    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(qrX - 10, qrY - 10, 400, 400, 18);
      ctx.fill();
    } else {
      ctx.fillRect(qrX - 10, qrY - 10, 400, 400);
    }

    // Draw QR
    ctx.drawImage(qrCanvas, qrX, qrY, 380, 380);

    // Instruction text
    ctx.fillStyle = '#c2b8a3';
    ctx.font = '15px "Plus Jakarta Sans", sans-serif';
    ctx.fillText('Apuntá con la cámara de tu celular para abrir la app', W / 2, 580);

    // URL badge
    ctx.fillStyle = 'rgba(212, 175, 55, 0.12)';
    ctx.fillRect(36, 608, W - 72, 42);
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.45)';
    ctx.lineWidth = 1;
    ctx.strokeRect(36, 608, W - 72, 42);

    ctx.fillStyle = '#f5d061';
    ctx.font = 'bold 14px "Plus Jakarta Sans", monospace';
    ctx.fillText(url, W / 2, 634);

    // Footer
    ctx.fillStyle = '#7d7461';
    ctx.font = '12.5px "Plus Jakarta Sans", sans-serif';
    ctx.fillText('Marcador Profesional · Estadísticas · Voz · Transmisión en Vivo', W / 2, 692);

    // Download trigger
    const link = document.createElement('a');
    link.download = 'QR-Padel-Control-SE.png';
    link.href = card.toDataURL('image/png');
    link.click();
    showToast('¡Imagen del QR descargada!');
  } catch (err) {
    console.error('Error downloading QR card:', err);
    showToast('Error al descargar imagen');
  }
}

function getOBSPosition() {
  const h = (location.hash || '').slice(1);
  const qIdx = h.indexOf('?');
  const ampIdx = h.indexOf('&');
  const paramStr = qIdx >= 0 ? h.slice(qIdx + 1) : (ampIdx >= 0 ? h.slice(ampIdx + 1) : '');
  const sp = new URLSearchParams(paramStr);
  const p = sp.get('pos');
  if (['tl', 'tr', 'bl', 'br', 'bar'].includes(p)) return p;
  return 'tl';
}

    const ptVal = st.matchWinner !== null

    const winTeam = st.mp[0] ? 0 : 1;

}

function getOBSUrls(pos = 'tl') {
  const baseUrl = location.href.split('#')[0];
  const posParam = pos !== 'tl' ? `&pos=${pos}` : '';
  const localUrl = `${baseUrl}#obs${posParam}`;
  
  const m = activeMatch || ui.liveMatch;
  let remoteCode = '';
  if (m) {
    publishLiveMatchState(m, true, true);
    remoteCode = shortMatchCode(m.id);
  }
  const remoteUrl = remoteCode ? `${baseUrl}#obs&v=${remoteCode}${posParam}` : `${baseUrl}#obs${posParam}`;
  return { localUrl, remoteUrl, remoteCode };
}

function renderBoard(isDisplayOnly = false) {

  if (!m) {
    if (isRemoteLive) {
      return `
