      </div>`;
    }
    return `<div class="page"><div class="empty">No hay ningún partido activo.<br><br><button class="btn primary" data-nav="new">Crear Partido</button></div></div>`;
  }
  const st = computeMatch(m);
  const order = m.flipped ? [1, 0] : [0, 1];

  const renderHalf = (t) => {
    const col = m.teams[t].color;
    const fg = fgFor(col);
    const playersHtml = [];
    for (let pi = 0; pi < 2; pi++) {
      const isSrv = st.matchWinner === null && st.srvTeam === t && st.srvPlayer === pi;
      playersHtml.push(`
        <div class="pn ${isSrv?'srv':''}">
          <span class="ball"></span>
          <span class="nm">${esc(playerLabel(m, t, pi))}</span>
          ${isSrv && st.srvSide ? `<span class="srv-side-badge srv-side-${st.srvSide.toLowerCase()}" title="Saque desde la ${st.srvSide==='D'?'Derecha':'Revés'}">${st.srvSide}</span>` : ''}
          ${isSrv && m.pendingFault ? `<em class="fault">2º SAQUE</em>` : ''}
        </div>`);
    }

    const setsHtml = st.sets.map((s, idx) => {
      if (idx === st.curSetIdx && st.matchWinner === null) return '';
      if (s.games[0] === 0 && s.games[1] === 0 && s.winner === null) return '';
      const won = s.winner === t;
      const tbSup = s.tbScore ? `<sup>${s.tbScore[t]}</sup>` : '';
      return `<span class="${won?'won':''}">${s.games[t]}${tbSup}</span>`;
    }).join('');

    const ptVal = st.matchWinner !== null
      ? (st.matchWinner === t ? ICONS.trophy : '—')
      : esc(st.pointDisplay[t]);

    return `
    <div class="half" data-team="${t}" ${isDisplayOnly ? 'data-ro="1"' : 'tabindex="0" role="button"'} style="--tc:${esc(col)};--tf:${fg}">
      <div class="players">${playersHtml.join('')}</div>
      <div class="h-sets">${setsHtml}</div>
      <div class="h-games">
        <small>${st.isSuperTB ? 'SÚPER TB' : 'JUEGOS'}</small>
        <b>${st.curSet.games[t]}</b>
      </div>
      <div class="h-pts">${ptVal}</div>
    </div>`;
  };

  // Center status pills
  const tags = [];
  if (st.matchWinner !== null) {
    tags.push(`<span class="tag gold">FINALIZADO</span>`);
  } else {
    tags.push(`<span class="tag">${st.isSuperTB ? 'SÚPER TIE-BREAK' : st.isTB ? 'TIE-BREAK' : `SET ${st.curSetIdx + 1}`}</span>`);
    if (st.isStar) {
      tags.push(`<span class="tag gold">★ STAR POINT (PUNTO DECISIVO)</span>`);
    } else if (st.isGP) {
      tags.push(`<span class="tag gold">PUNTO DE ORO</span>`);
    } else if (m.rules.deuceRule === 'star' && !st.isTB && st.p[0] >= 3 && st.p[1] >= 3) {
      if (st.p[0] !== st.p[1]) {
        tags.push(`<span class="tag">${st.curAdvNumber}ª VENTAJA (DE 2)</span>`);
      } else if (st.curDeuceCount === 2) {
        tags.push(`<span class="tag">IGUALES (QUEDA 1 VENTAJA ANTES DEL ★ STAR POINT)</span>`);
      } else if (st.curDeuceCount === 1) {
        tags.push(`<span class="tag">IGUALES (HASTA 2 VENTAJAS)</span>`);
      }
    }
    for (let t = 0; t < 2; t++) {
      if (st.mp[t]) tags.push(`<span class="tag hot" style="--c:${esc(m.teams[t].color)};--f:${fgFor(m.teams[t].color)}">MATCH POINT · ${esc(teamLabel(m,t))}</span>`);
      else if (st.sp[t]) tags.push(`<span class="tag hot" style="--c:${esc(m.teams[t].color)};--f:${fgFor(m.teams[t].color)}">SET POINT · ${esc(teamLabel(m,t))}</span>`);
    }
    if (st.isBP && !st.isGP) {
      const rcv = 1 - st.srvTeam;
      tags.push(`<span class="tag warn">BOLA DE BREAK · ${esc(teamLabel(m, rcv))}</span>`);
    }
    if (ui.voiceListening) {
      tags.push(`<span class="tag mic">● MIC ACTIVO</span>`);
    }
    if (tags.length === 1 && !isDisplayOnly) {
      tags.push(`<span class="tag dim">Tocá el lado ganador del punto</span>`);
    }
  }

  return `
  <div class="board ${isDisplayOnly?'display':''}">
    <header class="sb-top">
      ${isRemoteLive ? `
        <button class="icon-btn" data-act="exit-live" title="Salir de la transmisión">${ICONS.back}</button>
        <div class="sb-clock">
          <span id="sb-clock-val">${esc(fmtClock(m.durationMs))}</span>
          <small><b class="red">● EN VIVO</b> · ${st.matchWinner !== null ? 'FINALIZADO' : `SET ${st.curSetIdx + 1} · SACA ${esc(playerLabel(m, st.srvTeam, st.srvPlayer))} (${st.srvSide === 'D' ? 'DERECHA' : 'REVÉS'})`}</small>
        </div>
        <button class="icon-btn ${prefs.voice?'on':''}" data-act="toggle-voice-tts" title="Activar voz de árbitro en vivo">${prefs.voice ? ICONS.vol : ICONS.mute}</button>
        <button class="icon-btn" data-open-stats="live" title="Estadísticas en tiempo real">${ICONS.chart}</button>
        <button class="icon-btn" data-act="fullscreen" title="Pantalla completa">${ICONS.full}</button>
      ` : isDisplayOnly ? `
        <button class="icon-btn" data-nav="board" title="Salir de modo TV">${ICONS.back}</button>
        <div class="sb-clock">
          <span id="sb-clock-val">${esc(fmtClock(m.durationMs))}</span>
          <small><b class="red">● EN VIVO</b> · ${esc(teamLabel(m,0))} vs ${esc(teamLabel(m,1))}</small>
        </div>
        <button class="icon-btn" data-act="fullscreen" title="Pantalla completa">${ICONS.full}</button>
      ` : `
        <button class="icon-btn" data-nav="home" title="Inicio">${ICONS.back}</button>
        <button class="icon-btn" data-act="share-live" title="Compartir partido en vivo por link">${ICONS.live}</button>
        <div class="sb-clock" data-act="toggle-pause" style="cursor:pointer" title="Tocar para pausar/reanudar reloj">
          <span id="sb-clock-val">${esc(fmtClock(m.durationMs))}</span>
          <small>${m.status==='paused' ? '<b class="red">PAUSADO</b>' : `SET ${st.curSetIdx + 1} · SACA ${esc(playerLabel(m, st.srvTeam, st.srvPlayer))} (${st.srvSide === 'D' ? 'DERECHA' : 'REVÉS'})`}</small>
        </div>
        <button class="icon-btn ${prefs.voice?'on':''}" data-act="toggle-voice-tts" title="Voz de árbitro">${prefs.voice ? ICONS.vol : ICONS.mute}</button>
        <button class="icon-btn ${ui.voiceListening?'on':''}" data-act="toggle-voice-rec" title="Control por voz manos libres">${ICONS.mic}</button>
        <button class="icon-btn" data-act="open-menu" title="Opciones">${ICONS.dots}</button>
      `}
    </header>

    <main class="court">
      ${renderHalf(order[0])}
      <div class="mid">${tags.join('')}</div>
      ${renderHalf(order[1])}
    </main>

    ${isDisplayOnly ? '' : `
    <footer class="sb-foot">
      <button data-act="undo" ${(!m.events.length && !m.pendingFault)?'disabled':''} title="Deshacer (Z / Backspace)">${ICONS.undo}<span class="lbl">Deshacer</span></button>
      <button data-act="redo" ${(!m.redoStack || !m.redoStack.length)?'disabled':''} title="Rehacer (Y)">${ICONS.redo}<span class="lbl">Rehacer</span></button>
      <button class="fault-btn ${m.pendingFault?'on':''}" data-act="fault" ${st.matchWinner!==null?'disabled':''} title="Falta de saque / Doble falta (F)">
        ${m.pendingFault ? 'DOBLE FALTA' : 'FALTA SAQUE'}
      </button>
      <button data-act="flip" title="Cambiar lados de cancha (S)">${ICONS.swap}<span class="lbl">Lados</span></button>
      <button data-open-stats="active" title="Ver estadísticas en vivo">${ICONS.chart}<span class="lbl">Stats</span></button>
    </footer>`}

    ${!isDisplayOnly ? renderBoardOverlays(m, st) : (isRemoteLive && st.matchWinner !== null && !ui.matchEndDismissed ? `
    <div class="overlay">
      <div class="big-ic">${ICONS.trophy}</div>

      <div class="ov-score">
        ${[0,1].map(t => `
          <div class="mrow">

// ==================== STATS & PDF REPORT RENDERER ====================
function getStatsTargetMatch() {
  if (ui.statsId === 'live' && ui.liveMatch) return ui.liveMatch;
  if (ui.statsId === 'shared' && ui.sharedMatch) return ui.sharedMatch;
  if (ui.statsId === 'active' && activeMatch) return activeMatch;
  const found = historyList.find(x => x.id === ui.statsId);
  if (found) return found;
  if (activeMatch && activeMatch.id === ui.statsId) return activeMatch;
  if (ui.liveMatch && ui.liveMatch.id === ui.statsId) return ui.liveMatch;
  return historyList[0] || activeMatch || ui.liveMatch || null;
}

function renderComparisonBar(label, val0, val1, num0, num1, c0, c1) {
  const n0 = Number(num0) || 0;
  const n1 = Number(num1) || 0;
  const sum = n0 + n1;
  const p0 = sum > 0 ? Math.round((n0 * 100) / sum) : (n0 === n1 && n0 > 0 ? 50 : 0);
  const p1 = sum > 0 ? (100 - p0) : 0;
  return `
  <div class="cmp">
    <div class="cmp-l">${esc(label)}</div>
    <div class="cmp-r">
      <b>${esc(val0)}</b>
      <div class="cbar">
        ${sum > 0 ? `
          <i style="width:${p0}%;background:${esc(c0)}"></i>
          <i style="width:${p1}%;background:${esc(c1)}"></i>
        ` : `<i style="width:100%;background:transparent"></i>`}
      </div>
      <b>${esc(val1)}</b>
    </div>
  </div>`;
}

function renderMomentumSVG(momentum, setBoundaries, c0, c1) {
  if (!momentum || momentum.length < 2) {
    return `<div class="muted" style="padding:18px 0;text-align:center">Se mostrará el gráfico cuando haya puntos jugados.</div>`;
  }
  const N = momentum.length - 1;
  const W = 720, H = 180, padX = 12, padY = 18;
  const plotW = W - padX * 2;
  const plotH = H - padY * 2;
  const maxAbs = Math.max(4, ...momentum.map(v => Math.abs(v)));
  const zeroY = padY + plotH / 2;

  const xAt = i => padX + (N > 0 ? (i / N) * plotW : 0);
  const yAt = v => zeroY - (v / maxAbs) * (plotH / 2);

  let dLine = '';
  momentum.forEach((v, i) => {
    const x = xAt(i).toFixed(1), y = yAt(v).toFixed(1);
    dLine += (i === 0 ? `M${x},${y}` : ` L${x},${y}`);
  });
  const dArea = `${dLine} L${xAt(N).toFixed(1)},${zeroY.toFixed(1)} L${xAt(0).toFixed(1)},${zeroY.toFixed(1)} Z`;

  const uid = 'mom_' + Math.random().toString(36).slice(2,7);
  const boundsSvg = setBoundaries.map(bIdx => {
    const bx = xAt(bIdx).toFixed(1);
    return `<line x1="${bx}" y1="${padY}" x2="${bx}" y2="${H-padY}" stroke="currentColor" stroke-opacity=".22" stroke-dasharray="4 4"/>`;
  }).join('');

  return `
  <svg class="mom" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <clipPath id="${uid}_top"><rect x="0" y="0" width="${W}" height="${zeroY}"/></clipPath>
      <clipPath id="${uid}_bot"><rect x="0" y="${zeroY}" width="${W}" height="${H - zeroY}"/></clipPath>
      <linearGradient id="${uid}_g0" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${esc(c0)}" stop-opacity=".55"/>
        <stop offset="100%" stop-color="${esc(c0)}" stop-opacity=".04"/>
      </linearGradient>
      <linearGradient id="${uid}_g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${esc(c1)}" stop-opacity=".04"/>
        <stop offset="100%" stop-color="${esc(c1)}" stop-opacity=".55"/>
      </linearGradient>
    </defs>
    <line x1="${padX}" y1="${padY}" x2="${W-padX}" y2="${padY}" stroke="currentColor" stroke-opacity=".08"/>
    <line x1="${padX}" y1="${zeroY}" x2="${W-padX}" y2="${zeroY}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 3"/>
    <line x1="${padX}" y1="${H-padY}" x2="${W-padX}" y2="${H-padY}" stroke="currentColor" stroke-opacity=".08"/>
    ${boundsSvg}
    <path d="${dArea}" fill="url(#${uid}_g0)" clip-path="url(#${uid}_top)"/>
    <path d="${dArea}" fill="url(#${uid}_g1)" clip-path="url(#${uid}_bot)"/>
    <path d="${dLine}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function renderStats() {
  const m = getStatsTargetMatch();
  if (!m) {
    return `<div class="page"><div class="empty">Partido no encontrado.<br><br><button class="btn" data-nav="home">Volver</button></div></div>`;
  }
  const f = ui.statsSetFilter || 'all';
  const S = computeStats(m, f);
  const st = S.st;
  const T = S.T;
  const c0 = m.teams[0].color, c1 = m.teams[1].color;
  const isRemoteLiveStats = (ui.statsId === 'live' && ui.liveMatch);
  const isLive = (activeMatch && activeMatch.id === m.id && activeMatch.status === 'playing') || (isRemoteLiveStats && m.status === 'playing');
  const backRoute = isRemoteLiveStats ? 'live' : (activeMatch && activeMatch.id === m.id && activeMatch.status === 'playing' ? 'board' : 'history');
  const isStarRule = m.rules.deuceRule === 'star';
  const gpLabel = isStarRule ? 'Star Points ganados' : 'Puntos de oro ganados';
  const gpSrvLabel = isStarRule ? 'Star Points ganados al saque' : 'Puntos de oro ganados al saque';
  const gpRetLabel = isStarRule ? 'Star Points ganados al resto' : 'Puntos de oro ganados al resto';

  const stComp = getMatchCompId(m) ? getCompById(getMatchCompId(m)) : null;
  const stScoring = getCompetitionScoringConfig(stComp);
  const stScopeName = stComp ? `${stComp.kind === 'league' ? 'Liga' : 'Torneo'}: ${stComp.name}` : 'Partido del Día';
  const eloInfo = m.isWalkover ? null : calculateMatchEloPreview(m);
  let eloCardHtml = '';
  if (eloInfo && (st.matchWinner !== null || st.isDraw)) {
    const p0 = eloInfo.pair0;
    const p1 = eloInfo.pair1;
    const swArr = st.sets.reduce((acc, s) => {
      if (s.winner === 0) acc[0]++;
      else if (s.winner === 1) acc[1]++;
      return acc;
    }, [0, 0]);
    const gmArr = st.sets.reduce((acc, s) => [acc[0] + (s.games?.[0] || 0), acc[1] + (s.games?.[1] || 0)], [0, 0]);
    const gb = stScoring.gameBonusPts || 0;
    const sb = stScoring.setBonusPts || 0;
    const base0 = st.isDraw ? (stScoring.drawPts ?? 2) : (st.matchWinner === 0 ? stScoring.winPts : stScoring.lossPts);
    const base1 = st.isDraw ? (stScoring.drawPts ?? 2) : (st.matchWinner === 1 ? stScoring.winPts : stScoring.lossPts);
    const t0Pts = base0 + (swArr[0] * sb) + (gmArr[0] * gb);
    const t1Pts = base1 + (swArr[1] * sb) + (gmArr[1] * gb);
    eloCardHtml = `
    <div class="sec-t">Ranking · ${esc(stScopeName)}</div>
    <div class="card elo-match-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div style="display:flex;align-items:center;gap:8px">
          ${ICONS.trophy}
          <h3 style="margin:0">${st.isDraw ? `Empate (+${t0Pts} / +${t1Pts} pts) & ELO` : `Puntos (+${t0Pts} / +${t1Pts}) & ELO`} (${esc(stScopeName)})</h3>
        </div>
        ${eloInfo.isBlowout ? `<span class="tag-gold" style="font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(212,175,55,0.15);color:var(--gold);border:1px solid rgba(212,175,55,0.35);font-weight:700">💥 Bonus x1.2 (+6 juegos de ventaja)</span>` : ''}
      </div>

      <div class="elo-teams-grid">
        <!-- Team 0 -->
        <div class="elo-team-col ${st.matchWinner===0?'winner-col':''}">
          <div class="elo-team-hdr">
            <span class="bar" style="--c:${esc(m.teams[0].color)}"></span>
            <b>${esc(teamLabel(m, 0))}</b>
            ${st.matchWinner===0?'<span class="tro">🏆</span>':''}
          </div>
          <div class="elo-team-meta">
            <span>Promedio previo: <b>${p0.avgBefore} pts</b></span>

          </div>
          <div class="elo-players-list">

              <div class="elo-player-row">

                <span class="p-delta ${pl.delta>=0?'up':'down'}">${sign}${pl.delta} pts</span>

        <!-- Team 1 -->

            <span class="bar" style="--c:${esc(m.teams[1].color)}"></span>

            }).join('')}
          </div>
        </div>
      </div>
    </div>`;
  }

  const playedSets = st.sets.filter((s, idx) => s.games[0] > 0 || s.games[1] > 0 || idx === 0);

  // Evolution chips per set
  const evoHtml = playedSets.map((s, sIdx) => {
    const chips = s.history.map(g => {
      const col = m.teams[g.winner].color;
      const fg = fgFor(col);
      const cls = g.isTB ? 'gch tb' : g.isBreak ? 'gch b' : 'gch';

    }).join('');
    return `
      <div class="evo-row">
        <span class="lb">SET ${sIdx + 1} · ${s.games[0]}-${s.games[1]}</span>
        <div class="evo-chips">${chips}</div>
      </div>`;
  }).join('');

  // Point-by-point games grouped by set
  const pbpHtml = playedSets.map((s, sIdx) => {
    if (f !== 'all' && Number(f) !== sIdx) return '';
    const gamesRows = s.history.map(g => {
      const seq = g.points.map(pt => {
        const wCol = m.teams[pt.w].color;

    return `

                const icon = { smash:'💥', volea:'🎾', bandeja:'🌀', bajada:'⚡', dejada:'🎯', passing:'🏹', globo:'🎈', otro:'✨' }[k] || '';

                return `<span class="tag-s" style="margin:2px;display:inline-flex;align-items:center;gap:3px;font-size:11px">${icon} ${v} ${name}</span>`;

            return `

                <div style="display:flex;flex-wrap:wrap">${shotList.length ? shotList.join('') : '<span class="muted" style="font-size:11px">Sin detalle de golpe</span>'}</div>
              </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="sec-t">Evolución</div>
    <div class="card">
      ${evoHtml}
      <div class="mom-leg" style="margin-top:14px">
        <span style="color:${esc(c0)}"><i style="--c:${esc(c0)}"></i>${esc(teamLabel(m,0))}</span>
        <span style="color:${esc(c1)}"><i style="--c:${esc(c1)}"></i>${esc(teamLabel(m,1))}</span>

      <p class="note">La línea sube cuando ${esc(teamLabel(m,0))} ganan un punto y baja cuando lo ganan ${esc(teamLabel(m,1))}. B = break.</p>
    </div>

    <div class="sec-t">Punto a Punto</div>
    <div class="card">
      ${pbpHtml}
    </div>

    <div class="btn-row no-print" style="margin-top:18px">
      <button class="btn primary" data-act="print-pdf">${ICONS.pdf} Exportar PDF / Imprimir</button>
      <button class="btn" data-act="export-png">${ICONS.img} Descargar Imagen</button>
      <button class="btn" data-act="share-link">${ICONS.share} Compartir Enlace</button>
      ${ui.statsId === 'shared' ? `<button class="btn primary" data-act="save-shared">Guardar en mi historial</button>` : ''}
      ${isRemoteLiveStats ? `<button class="btn primary" data-act="save-live">Guardar en mi historial</button>` : ''}
      ${!isLive && ui.statsId !== 'shared' && !isRemoteLiveStats ? `<button class="btn danger" data-del-match="${esc(m.id)}">${ICONS.trash} Eliminar partido</button>` : ''}
    </div>
    ${renderSignatureFooter()}
  </div>
  ${renderTabbar('history')}`;
}

// ==================== SHARED STANDINGS & COMPETITIONS VIEWS ====================
function formatFixtureScoreSummary(fx) {
  if (!fx) return { s0: '', s1: '' };
  if (fx.isBye) return { s0: fx.team0 ? 'BYE' : '', s1: fx.team1 ? 'BYE' : '' };
  const m = fx.matchId
    ? ((activeMatch && activeMatch.id === fx.matchId) ? activeMatch : historyList.find(x => x.id === fx.matchId))
    : null;
  if (!m) return { s0: '', s1: '' };
  if (m.isWalkover) {
    return {
      s0: fx.winnerSide === 0 ? 'G (W.O.)' : 'W.O.',
      s1: fx.winnerSide === 1 ? 'G (W.O.)' : 'W.O.'
    };
  }
  const st = computeMatch(m);
  const played = st.sets.filter((s, idx) => idx === 0 || s.winner !== null || s.games[0] > 0 || s.games[1] > 0);
  return {
    s0: played.map(s => s.games[0]).join(' '),
    s1: played.map(s => s.games[1]).join(' ')
  };
}

function renderSortBarHtml(sortKey, isEloPrimary = false) {
  const btns = isEloPrimary
    ? [
        ['elo', '⭐ ELO'],
        ['pts', '🏅 Puntos (G)'],
        ['wins', '🏆 Victorias'],
        ['matches', '🎾 Partidos']
      ]
    : [
        ['pts', '🏅 Puntos'],
        ['elo', '⭐ ELO'],
        ['wins', '🏆 Victorias'],
        ['matches', '🎾 Partidos']
      ];
  return `
    <div class="seg" style="margin-bottom:14px">
      ${btns.map(([k, lbl]) => `<button class="${sortKey===k?'on':''}" data-set-psort="${k}">${lbl}</button>`).join('')}
    </div>`;
}

function renderStandingsSectionHtml(players, rCtx, opts = {}) {
  if (!players || !players.length) {
    return `<div class="empty">${ICONS.trophy}<br>${esc(opts.emptyText || 'Todavía no hay jugadores o partidos en este ranking.')}</div>`;
  }
  const qualCount = Number(opts.qualCount) || 0;
  const entityLabel = rCtx?.entityMode === 'pairs' ? 'Pareja' : 'Jugador';
  const isEloPrimary = rCtx?.primaryMetric === 'elo' || isProyectoPadelComp(rCtx?.comp);
  const scoringBadge = rCtx?.scoring ? getCompScoringSummaryLabel(rCtx.comp, rCtx.scoring, false) : '';

  const tableHtml = `
  <div class="card" style="padding:12px 14px;margin-bottom:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap">
      <h3 style="margin:0;font-size:15px">${esc(opts.tableTitle || (isEloPrimary ? 'Tabla Oficial · ELO Principal' : 'Tabla de Posiciones (Puntos + ELO)'))}</h3>
      ${scoringBadge ? `<small class="muted">${esc(scoringBadge)}</small>` : ''}
    </div>
    <div class="tbl-wrap">
      <table class="stand-tbl">
        <thead>
          ${isEloPrimary ? `
          <tr>
            <th>Pos</th>
            <th>${entityLabel}</th>
            <th title="Partidos jugados">PJ</th>
            <th title="Ganados">G</th>
            <th title="Empates">E</th>
            <th title="Perdidos">P</th>
            <th title="Games ganados">GF</th>
            <th title="Diferencia de games">DJ</th>
            <th title="Puntos secundarios (Games + Bonus)">PTS</th>
            <th title="Rating ELO Principal">ELO</th>
          </tr>` : `
          <tr>
            <th>Pos</th>
            <th>${entityLabel}</th>
            <th title="Partidos jugados">PJ</th>
            <th title="Partidos ganados">PG</th>
            <th title="Partidos perdidos">PP</th>
            <th title="Diferencia de sets">DS</th>
            <th title="Diferencia de juegos">DJ</th>
            <th title="Rating ELO exclusivo de este ranking">ELO</th>
            <th title="Puntos acumulados">PTS</th>
          </tr>`}
        </thead>
        <tbody>
          ${players.map((p, idx) => {
            const medal = p.rank === 1 ? '🥇' : p.rank === 2 ? '🥈' : p.rank === 3 ? '🥉' : `#${p.rank}`;
            const lvl = getEloLevel(p.elo);
            const sd = (p.setsDiff || 0) > 0 ? `+${p.setsDiff}` : String(p.setsDiff || 0);
            const gd = (p.gamesDiff || 0) > 0 ? `+${p.gamesDiff}` : String(p.gamesDiff || 0);
            const qualCls = (qualCount > 0 && idx < qualCount) ? 'qual' : '';
            const deltaMini = p.lastDelta
              ? `<small style="font-size:11px;font-family:var(--font);font-weight:700;margin-left:3px;color:${p.lastDelta > 0 ? '#10b981' : '#ef4444'}">${p.lastDelta > 0 ? '+' : ''}${p.lastDelta}</small>`
              : '';
            return `
            <tr class="${qualCls}">
              <td><b>${medal}</b></td>
              <td>
                <div style="display:flex;align-items:center;gap:7px">
                  <span style="width:8px;height:8px;border-radius:50%;background:${esc(p.color || '#d4af37')};flex:none"></span>
                  <span style="font-weight:700;color:var(--tx)">${esc(p.name)}</span>
                  <span style="font-size:11px;color:${lvl.color};font-weight:700">${lvl.icon}${lvl.level}</span>
                </div>
              </td>
              ${isEloPrimary ? `
              <td>${p.matches}</td>
              <td>${p.wins}</td>
              <td>${p.draws || 0}</td>
              <td>${p.losses ?? Math.max(0, p.matches - p.wins - (p.draws || 0))}</td>
              <td>${p.gamesWon || 0}</td>
              <td>${gd}</td>
              <td><b>${p.pts ?? 0}</b></td>
              <td class="pts-cell">${p.elo}${deltaMini}</td>` : `
              <td>${p.matches}</td>
              <td>${p.wins}</td>
              <td>${p.losses ?? Math.max(0, p.matches - p.wins)}</td>
              <td>${sd}</td>
              <td>${gd}</td>
              <td><b>${p.elo}</b></td>
              <td class="pts-cell">${p.pts ?? 0}</td>`}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;

  if (opts.compactOnly) return tableHtml;

  const cardsHtml = players.map((p) => {
    const winPct = pct(p.wins, p.matches);
    const initials = (p.name || 'JG').split(/\s+/).filter(Boolean).map(x => x[0]).join('').slice(0, 2).toUpperCase() || 'JG';
    const lvl = getEloLevel(p.elo);
    const isCalib = (p.finishedMatches || 0) < CALIBRATION_MATCHES_THRESHOLD;
    const rankBadge = p.rank === 1
      ? `<div class="rank-pos rank-gold" title="1º del Ranking">🥇 1º</div>`
      : p.rank === 2
        ? `<div class="rank-pos rank-silver" title="2º del Ranking">🥈 2º</div>`
        : p.rank === 3
          ? `<div class="rank-pos rank-bronze" title="3º del Ranking">🥉 3º</div>`
          : `<div class="rank-pos" title="${p.rank}º del Ranking">#${p.rank}</div>`;

    const trendHtml = p.lastDelta > 0
      ? `<div class="elo-trend up">▲ +${p.lastDelta} ELO</div>`
      : p.lastDelta < 0
        ? `<div class="elo-trend down">▼ ${p.lastDelta} ELO</div>`
        : `<div class="elo-trend neu">Sin cambios</div>`;

    const shotBadges = [];
    if (!isEloPrimary && p.shots) {
      if (p.shots.smash) shotBadges.push(`💥 ${p.shots.smash} Smash`);
      if (p.shots.volea) shotBadges.push(`🎾 ${p.shots.volea} Volea`);
      if (p.shots.bandeja) shotBadges.push(`🌀 ${p.shots.bandeja} Bandeja`);
      if (p.shots.bajada) shotBadges.push(`⚡ ${p.shots.bajada} Bajada`);
      if (p.shots.dejada) shotBadges.push(`🎯 ${p.shots.dejada} Dejada`);
      if (p.shots.passing) shotBadges.push(`🏹 ${p.shots.passing} Passing`);
    }

    const sdStr = (p.setsDiff || 0) >= 0 ? `+${p.setsDiff || 0}` : `${p.setsDiff}`;
    const gdStr = (p.gamesDiff || 0) >= 0 ? `+${p.gamesDiff || 0}` : `${p.gamesDiff}`;

    return `
    <div class="pcard">
      ${rankBadge}
      <div class="avatar" style="--c:${esc(p.color || '#d4af37')};--f:${fgFor(p.color || '#d4af37')}">${esc(initials)}</div>
      <div class="info">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <b>${esc(p.name)}</b>
          <span class="tier-pill" style="--tcol:${lvl.color}">${lvl.icon} Nivel ${lvl.level} · ${lvl.tier}</span>
          ${isCalib
            ? `<span class="calib-pill calib" title="Factor K=50 para calibración rápida">Calib. (${p.finishedMatches || 0}/10)</span>`
            : `<span class="calib-pill fixed" title="Factor K=32 consolidado">K=32</span>`}
        </div>
        ${isEloPrimary
          ? `<small>${p.matches} PJ · ${p.wins}G ${p.draws || 0}E ${p.losses ?? 0}P (${winPct}%) · ${p.gamesWon || 0} GF / ${p.gamesLost || 0} GC (Dif ${gdStr})</small>`
          : `<small>${p.matches} PJ · ${p.wins} PG / ${p.losses ?? Math.max(0, p.matches - p.wins)} PP (${winPct}%) · Sets ${sdStr} · Juegos ${gdStr}</small>`}
        <div class="pstats">
          ${isEloPrimary ? `
            <span>Pts (Games+Bonus): <b>${p.pts ?? 0} pts</b></span>
            <span>Games ganados: <b>${p.gamesWon || 0}</b></span>
            <span>Dif. games: <b>${gdStr}</b></span>
          ` : `
            <span>Winners: <b>${p.winners || 0}</b></span>
            <span>ENF: <b>${p.ue || 0}</b></span>
            <span>1º Saque: <b>${pct(p.firstServeIn || 0, p.srvPtsTotal || 0)}%</b></span>
            <span>Gan. saque: <b>${pct(p.srvPtsWon || 0, p.srvPtsTotal || 0)}%</b></span>
          `}
        </div>
        ${shotBadges.length ? `
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">
          ${shotBadges.map(b => `<span class="tag-s" style="font-size:10px">${esc(b)}</span>`).join('')}
        </div>` : ''}
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">
          ${rCtx?.entityMode === 'pairs'
            ? p.name.split(/\s*[·\/]\s*/).filter(Boolean).slice(0, 2).map((nm, pIdx) => {
                const saved = getSavedCardForPlayerName(nm);
                const shortNm = nm.split(/\s+/)[0] || nm;
                return `<button class="pc-mini-btn" data-open-player-card="${esc(nm)}" data-pc-default-pos="${pIdx===0?'Drive':'Revés'}" title="Tarjeta de ${esc(nm)}">${ICONS.idCard} ${saved ? 'Editar' : 'Tarjeta'} ${esc(shortNm)}</button>`;
              }).join('')
            : `<button class="pc-mini-btn" data-open-player-card="${esc(p.name)}" title="Generar tarjeta personalizable de ${esc(p.name)}">${ICONS.idCard} ${getSavedCardForPlayerName(p.name) ? 'Ver / Editar Tarjeta' : 'Crear Tarjeta'}</button>`}
        </div>
      </div>
      <div class="pcard-pts-box">
        ${isEloPrimary ? `
          <span class="pcard-pts-main" style="font-size:32px">${p.elo}</span>
          <small>ELO</small>
          ${trendHtml}
          <div class="pcard-elo-sub" title="Puntaje secundario por games + bonus">🏅 ${p.pts ?? 0} pts · ${p.gamesWon || 0}G</div>
        ` : `
          <span class="pcard-pts-main">${p.pts ?? 0}</span>
          <small>PUNTOS</small>
          <div class="pcard-elo-sub">⚡ ${p.elo} ELO</div>
          ${trendHtml}
        `}
      </div>
    </div>`;
  }).join('');

  return tableHtml + cardsHtml;
}

function getCompFormatLabel(comp) {
  if (!comp) return '';
  if (comp.format === 'proyecto_padel') return '⚡ PRO PÁDEL';
  if (comp.format === 'league_rr') return 'Todos contra Todos';
  if (comp.format === 'league_rr2') return 'Ida y Vuelta';
  if (comp.format === 'knockout') return 'Eliminación Directa';
  if (comp.format === 'groups_playoff') return 'Grupos + Playoffs';
  return comp.kind === 'tournament' ? 'Libre / Americano' : 'Liga Libre';
}

function renderCompetitions() {
  const f = ui.compFilter || 'all';
  const leagues = competitionsList.filter(c => c.kind === 'league');
  const tourns = competitionsList.filter(c => c.kind === 'tournament');
  const shown = f === 'league' ? leagues : (f === 'tournament' ? tourns : competitionsList);

  return `
  <div class="page">
    <div class="page-h">
      <h1>Ligas y Torneos</h1>
      <div class="page-h-acts">
        <button class="btn sm" data-act="open-join-comp" title="Unirse con código o link">📲 Unirse</button>
        <button class="btn primary sm" data-act="new-comp" data-kind="league">${ICONS.plus} Liga</button>
        <button class="btn primary sm" data-act="new-comp" data-kind="tournament">${ICONS.plus} Torneo</button>
        <button class="icon-btn" data-nav="settings" title="Ajustes">${ICONS.gear}</button>
      </div>
    </div>
    <p class="muted" style="text-align:center;margin-bottom:14px">Cada Liga y Torneo mantiene su propia tabla de posiciones, ELO independiente, fixture, llaves eliminatorias y sincronización por QR.</p>

    <div class="seg" style="margin-bottom:14px">
      <button class="${f==='all'?'on':''}" data-set-cfilter="all">Todas (${competitionsList.length})</button>
      <button class="${f==='league'?'on':''}" data-set-cfilter="league">🏅 Ligas (${leagues.length})</button>
      <button class="${f==='tournament'?'on':''}" data-set-cfilter="tournament">🏆 Torneos (${tourns.length})</button>
    </div>

    ${shown.length ? shown.map(c => {
      const sc = getCompetitionScoringConfig(c);
      const isPP = isProyectoPadelComp(c);
      const matches = getCompetitionMatches(c, true);
      const finCount = matches.filter(m => m.status === 'finished').length;
      const pendingFx = (c.fixtures || []).filter(fx => !fx.isBye && fx.team0 && fx.team1 && fx.winnerSide === null).length;
      const entityMode = c.rankingMode === 'individual' ? 'individual' : 'pairs';
      const rows = sortStandingsRows(computeScopeStandings(getCompetitionMatches(c, false), {
        ...sc,
        entityMode,
        seedParticipants: c.participants || []
      }), isPP ? 'elo' : 'pts', { tiebreakMode: isPP ? 'games' : 'sets' });
      const leader = rows[0];
      const finalFx = (c.fixtures || []).find(fx => fx.phase === 'playoff' && fx.roundLabel === 'Final' && fx.winnerSide !== null);
      const champTeam = finalFx ? (finalFx.winnerSide === 0 ? finalFx.team0 : finalFx.team1) : null;

      return `
      <div class="comp-card">
        <div class="comp-card-top">

              <span class="badge">${esc(getCompScoringSummaryLabel(c, sc, true))}</span>
              ${c.syncCode ? `<span class="badge sync">📡 Sala #${esc(c.syncCode)}</span>` : ''}
            </div>
            <div class="comp-card-title">${esc(c.name)}</div>
          </div>
          <div style="display:flex;gap:4px">

            <button class="icon-btn" data-edit-comp="${esc(c.id)}" title="Editar configuración">${ICONS.edit}</button>
          </div>
        </div>

        <div style="font-size:12.5px;color:var(--tx2)">
          ${(c.participants || []).length} inscriptos · ${finCount} partidos jugados${pendingFx ? ` · ${pendingFx} cruces pendientes` : ''}
        </div>

        ${champTeam
          ? `<div class="comp-leader">🏆 Campeón: <b>${esc(champTeam.label || formatPairLabel(champTeam.players?.[0], champTeam.players?.[1]))}</b></div>`

    }).join('') : `
      <div class="empty">
        ${ICONS.award}<br>

          <button class="btn" data-act="open-join-comp">📲 Unirse con Código</button>
        </div>
      </div>
    `}
    ${renderSignatureFooter()}
  </div>
  ${renderTabbar('competitions')}`;
}

function renderBracketHtml(comp) {
  const playoffs = (comp.fixtures || []).filter(f => f.phase === 'playoff');
  if (!playoffs.length) return '';

  const roundsMap = new Map();
  playoffs.forEach(fx => {
    if (!roundsMap.has(fx.roundIdx)) roundsMap.set(fx.roundIdx, []);
    roundsMap.get(fx.roundIdx).push(fx);
  });
  const roundKeys = Array.from(roundsMap.keys()).sort((a, b) => a - b);
  const lastRound = roundsMap.get(roundKeys[roundKeys.length - 1]) || [];
  const finalFx = lastRound[0];
  const champTeam = (finalFx && finalFx.winnerSide !== null && finalFx.winnerSide !== undefined)
    ? (finalFx.winnerSide === 0 ? finalFx.team0 : finalFx.team1)
    : null;

  const champBanner = champTeam ? `
    <div class="champ-banner">
      <small>🏆 CAMPEONES DE ${esc(comp.name)}</small>
      <b>${esc(champTeam.label || formatPairLabel(champTeam.players?.[0], champTeam.players?.[1]))}</b>
    </div>` : '';

  const renderSlotTeam = (fx, side) => {
    const team = side === 0 ? fx.team0 : fx.team1;
    const isWin = fx.winnerSide === side;
    if (!team) {
      return `<div class="b-team tbd"><span class="bar"></span><span class="nm">${fx.isBye ? 'BYE (Libre)' : 'Por definir'}</span></div>`;
    }
    const scores = formatFixtureScoreSummary(fx);
    const sc = side === 0 ? scores.s0 : scores.s1;
    return `
      <div class="b-team ${isWin ? 'win' : ''}">
        <span class="bar" style="--c:${esc(team.color || '#d4af37')}"></span>
        <span class="nm">${esc(team.label || formatPairLabel(team.players?.[0], team.players?.[1]))}</span>
        ${sc ? `<span class="sc">${esc(sc)}</span>` : ''}
      </div>`;
  };

  return `
  ${champBanner}
  <div class="bracket-wrap">
    <div class="bracket-cols">
      ${roundKeys.map(rk => {
        const list = (roundsMap.get(rk) || []).slice().sort((a, b) => a.slotIdx - b.slotIdx);
        const rTitle = list[0]?.roundLabel || `Ronda ${rk + 1}`;
        return `
        <div class="bracket-round">
          <div class="bracket-round-title">${esc(rTitle)}</div>
          <div class="bracket-matches">
            ${list.map(fx => {
              const playable = !fx.isBye && fx.team0 && fx.team1 && fx.winnerSide === null;
              return `
              <div class="bracket-match ${fx.winnerSide !== null ? 'done' : ''}">
                ${renderSlotTeam(fx, 0)}
                ${renderSlotTeam(fx, 1)}
                <div class="b-actions">
                  ${playable ? `
                    <button class="btn primary sm" data-play-fixture="${esc(comp.id)}:${esc(fx.id)}">${ICONS.play} Jugar</button>
                    <button class="btn sm" data-quick-score="${esc(comp.id)}:${esc(fx.id)}">${ICONS.check} Resultado</button>
                  ` : fx.matchId ? `
                    <button class="btn sm" data-open-stats="${esc(fx.matchId)}">${ICONS.chart} Ver partido</button>
                  ` : ''}
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderFixtureListHtml(comp, fixturesList, title) {
  if (!fixturesList.length) return '';
  const groups = new Map();
  fixturesList.forEach(fx => {
    const key = fx.roundLabel || 'Cruces';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(fx);
  });

  let html = `<div class="sec-t">${esc(title)}</div>`;
  groups.forEach((items, label) => {
    html += `<div class="fx-round-hdr"><span>${esc(label)}</span><small class="muted">${items.filter(x => x.winnerSide !== null).length}/${items.length}</small></div>`;
    html += items.map(fx => {
      const sc = formatFixtureScoreSummary(fx);
      const isLiveFx = fx.matchId && activeMatch && activeMatch.id === fx.matchId && activeMatch.status === 'playing';
      const playable = !fx.isBye && fx.team0 && fx.team1 && fx.winnerSide === null;
      return `
      <div class="fx-card">
        <div class="fx-teams">
          <div class="fx-team-row ${fx.winnerSide===0?'win':''}">
            <span class="dot" style="--c:${esc(fx.team0?.color || '#d4af37')}"></span>
            <span>${esc(fx.team0 ? (fx.team0.label || formatPairLabel(fx.team0.players?.[0], fx.team0.players?.[1])) : (fx.isBye ? 'BYE' : 'Por definir'))}</span>
            ${sc.s0 ? `<span class="fx-sc">${esc(sc.s0)}</span>` : ''}
          </div>
          <div class="fx-team-row ${fx.winnerSide===1?'win':''}">
            <span class="dot" style="--c:${esc(fx.team1?.color || '#2f8cff')}"></span>
            <span>${esc(fx.team1 ? (fx.team1.label || formatPairLabel(fx.team1.players?.[0], fx.team1.players?.[1])) : (fx.isBye ? 'BYE' : 'Por definir'))}</span>
            ${sc.s1 ? `<span class="fx-sc">${esc(sc.s1)}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          ${isLiveFx ? `<span class="badge live">En juego</span>` : ''}
          ${playable ? `<button class="btn primary sm" data-play-fixture="${esc(comp.id)}:${esc(fx.id)}">${ICONS.play} Jugar</button>` : ''}
          ${playable ? `<button class="btn sm" data-quick-score="${esc(comp.id)}:${esc(fx.id)}">${ICONS.check} Resultado</button>` : ''}
          ${fx.matchId ? `<button class="btn sm" data-open-stats="${esc(fx.matchId)}">${ICONS.chart} Detalles</button>` : ''}
          ${!fx.matchId && !fx.isBye ? `<button class="icon-btn" data-del-fixture="${esc(comp.id)}:${esc(fx.id)}" title="Quitar cruce" style="width:34px;height:34px">${ICONS.trash}</button>` : ''}
        </div>
      </div>`;
    }).join('');
  });
  return html;
}

function syncQuickScoreStateFromDom() {
  const qs = ui.quickScoreState;
  if (!qs) return;
  const rInp = document.getElementById('qs-round');
  if (rInp) qs.stageLabel = rInp.value;

  const comp = qs.compId ? getCompById(qs.compId) : null;
  if (qs.mode === 'comp-adhoc' && !qs.useManualTeams) {
    const sel0 = document.getElementById('qs-sel0');
    const sel1 = document.getElementById('qs-sel1');
    if (sel0 && comp) {
      qs.selPartIds[0] = sel0.value;
      const t0 = participantToTeamObj((comp.participants || []).find(p => p.id === sel0.value));
      if (t0) qs.teams[0] = { players: t0.players, color: t0.color || '#d4af37' };
    }
    if (sel1 && comp) {
      qs.selPartIds[1] = sel1.value;
      const t1 = participantToTeamObj((comp.participants || []).find(p => p.id === sel1.value));
      if (t1) qs.teams[1] = { players: t1.players, color: t1.color || '#2f8cff' };
    }
  } else if (qs.mode === 'comp-adhoc' && qs.useManualTeams) {
    const p00 = document.getElementById('qs-t0p0')?.value;
    const p01 = document.getElementById('qs-t0p1')?.value;
    const p10 = document.getElementById('qs-t1p0')?.value;
    const p11 = document.getElementById('qs-t1p1')?.value;
    if (p00 !== undefined || p01 !== undefined) {
      qs.teams[0].players = [p00 ?? qs.teams[0].players[0], p01 ?? qs.teams[0].players[1]];
    }
    if (p10 !== undefined || p11 !== undefined) {
      qs.teams[1].players = [p10 ?? qs.teams[1].players[0], p11 ?? qs.teams[1].players[1]];
    }
  }

  for (let i = 0; i < (qs.sets?.length || 0); i++) {
    const inp0 = document.getElementById(`qs-s${i + 1}-0`);
    const inp1 = document.getElementById(`qs-s${i + 1}-1`);
    if (inp0) qs.sets[i][0] = inp0.value === '' ? null : Math.max(0, Number(inp0.value) || 0);
    if (inp1) qs.sets[i][1] = inp1.value === '' ? null : Math.max(0, Number(inp1.value) || 0);
  }
  const woEl = document.getElementById('qs-wo');
  if (woEl) qs.wo = !!woEl.checked;
  const winEl = document.getElementById('qs-winner');
  if (winEl) qs.winner = winEl.value || 'auto';
}

function formatQuickScorePreview(qs) {
  if (!qs) return 'Tocá los games de cada set para cargar el resultado';
  const comp = qs.compId ? getCompById(qs.compId) : null;
  const isPP = isProyectoPadelComp(comp);
  const sc = getCompetitionScoringConfig(comp);
  const n0 = formatPairLabel(qs.teams[0]?.players?.[0] || 'DRIVE 1', qs.teams[0]?.players?.[1] || 'REVÉS 1');
  const n1 = formatPairLabel(qs.teams[1]?.players?.[0] || 'DRIVE 2', qs.teams[1]?.players?.[1] || 'REVÉS 2');
  if (qs.wo) {
    if (qs.winner === '0') return `✓ Victoria por W.O. para ${n0}`;
    if (qs.winner === '1') return `✓ Victoria por W.O. para ${n1}`;
    return '⚠️ Activaste W.O.: elegí qué pareja ganó abajo';
  }
  const valid = (qs.sets || []).filter(s => s[0] !== null && s[1] !== null);
  if (!valid.length) return isPP ? 'Tocá los games finales de cada pareja (ej. 4 y 2, o 3 y 3)' : 'Tocá los games de cada set (0–7) para calcular el ganador';
  const scoreTxt = valid.map(s => `${s[0]}-${s[1]}`).join(' · ');
  let w0 = 0, w1 = 0, g0 = 0, g1 = 0;
  valid.forEach(s => {
    const a = Number(s[0]) || 0, b = Number(s[1]) || 0;
    g0 += a; g1 += b;
    if (a > b) w0++; else if (b > a) w1++;
  });
  if (isPP) {
    const gb = sc.gameBonusPts || 0;
    if (qs.winner === '0' || (qs.winner === 'auto' && w0 > w1)) {
      return `✓ Gana ${n0} (${scoreTxt}) · +${sc.winPts + g0 * gb} pts vs +${sc.lossPts + g1 * gb} pts · + ELO`;
    }
    if (qs.winner === '1' || (qs.winner === 'auto' && w1 > w0)) {
      return `✓ Gana ${n1} (${scoreTxt}) · +${sc.winPts + g1 * gb} pts vs +${sc.lossPts + g0 * gb} pts · + ELO`;
    }
    if ((qs.winner === 'draw' || qs.winner === 'auto') && g0 === g1) {
      return `🤝 Empate ${scoreTxt} · Ambos +${(sc.drawPts ?? 2) + g0 * gb} pts (${sc.drawPts ?? 2}E + ${g0}G) · Ajuste ELO`;
    }
  }
  if (qs.winner === '0') return `✓ Gana ${n0} (${scoreTxt})`;
  if (qs.winner === '1') return `✓ Gana ${n1} (${scoreTxt})`;
  if (qs.winner === 'draw' && g0 === g1) return `🤝 Empate (${scoreTxt})`;
  if (w0 > w1) return `✓ Gana ${n0} (${w0}-${w1} sets · ${scoreTxt})`;
  if (w1 > w0) return `✓ Gana ${n1} (${w1}-${w0} sets · ${scoreTxt})`;
  return `Empate ${w0}-${w1} en sets (${scoreTxt}) — Agregá otro set o elegí ganador`;
}

function updateQuickScorePreviewDom() {
  const qs = ui.quickScoreState;
  if (!qs) return;
  syncQuickScoreStateFromDom();
  const prevEl = document.getElementById('qs-preview');
  if (prevEl) prevEl.textContent = formatQuickScorePreview(qs);
}

          <h2>${ui.compModal === 'edit' ? 'Editar' : 'Crear'} ${isTourn ? 'Torneo' : 'Liga'}</h2>
          <button type="button" class="icon-btn" data-close-comp-modal="1" title="Cerrar" style="width:36px;height:36px;border-radius:12px;font-size:15px;font-weight:700">✕</button>
        </div>

        <div class="field" style="margin-bottom:10px">
          <label>Tipo</label>
          <div class="pills">
            <button type="button" class="pill ${!isTourn?'on':''}" data-cf-kind="league">🏅 Liga</button>
            <button type="button" class="pill ${isTourn?'on':''}" data-cf-kind="tournament">🏆 Torneo</button>
          </div>
        </div>

        <div class="field" style="margin-bottom:10px">
          <label>Nombre</label>
          <input class="inp" id="cf-name" value="${esc(f.name || '')}" placeholder="${isPP ? 'Ej: Torneo PRO PÁDEL #1' : (isTourn ? 'Ej: Copa Nocturna / Open SÉ' : 'Ej: Liga del Jueves / Apertura')}">
        </div>

        <div class="field" style="margin-bottom:10px">
          <label>Formato</label>
          <div class="pills">
            ${formats.map(([k, lbl]) => `<button type="button" class="pill ${f.format===k?'on':''}" data-cf-fmt="${k}">${lbl}</button>`).join('')}
          </div>
        </div>

        ${isPP ? `
          <div style="padding:10px 12px;border-radius:12px;background:rgba(212,175,55,0.10);border:1px solid rgba(212,175,55,0.32);margin-bottom:10px;font-size:12.5px;color:var(--tx2);line-height:1.4">
            <b style="color:var(--gold2);display:block;margin-bottom:2px">⚡ Modo PRO PÁDEL · ELO Principal</b>
            Carga directa de resultados finales (ej. <i>Lucía-Juan vs Marcos-Noelia 4-2</i> o empate <i>3-3</i>), sin fiscalización ni marcador punto a punto. Contabiliza ranking <b>Individual por ELO</b> y puntaje secundario por <b>Games + Bonus</b>.
          </div>
        ` : ''}

        ${f.format === 'groups_playoff' ? `
          <div class="row wrap" style="margin-bottom:10px">
            <div class="field">
              <label>Cantidad de grupos</label>
              <select class="inp" id="cf-ngroups">
                ${[2,3,4].map(n => `<option value="${n}" ${(Number(f.numGroups)||2)===n?'selected':''}>${n} grupos</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>Clasifican por grupo</label>
              <select class="inp" id="cf-adv">
                ${[1,2,3,4].map(n => `<option value="${n}" ${(Number(f.advancePerGroup)||2)===n?'selected':''}>Top ${n}</option>`).join('')}
              </select>
            </div>
          </div>` : ''}

        ${!isPP ? `
          <div class="field" style="margin-bottom:10px">
            <label>Ranking por</label>
            <div class="pills">
              <button type="button" class="pill ${f.rankingMode==='pairs'?'on':''}" data-cf-rmode="pairs">👥 Parejas Fijas</button>
              <button type="button" class="pill ${f.rankingMode==='individual'?'on':''}" data-cf-rmode="individual">👤 Individual</button>
              <button type="button" class="pill ${f.rankingMode==='both'?'on':''}" data-cf-rmode="both">🔀 Ambos</button>
            </div>
          </div>
        ` : ''}

        <div class="row pts-grid" style="margin-bottom:10px">
          <div class="field">
            <label>Pts Victoria</label>
            <input type="number" class="inp" id="cf-wpts" min="0" max="50" value="${Number(f.winPts ?? 3)}">
          </div>
          ${isPP ? `
            <div class="field">
              <label>Pts Empate</label>
              <input type="number" class="inp" id="cf-dpts" min="0" max="50" value="${Number(f.drawPts ?? 2)}">
            </div>
          ` : ''}
          <div class="field">
            <label>Pts Derrota</label>
            <input type="number" class="inp" id="cf-lpts" min="0" max="50" value="${Number(f.lossPts ?? 1)}">
          </div>
          ${isPP ? `
            <div class="field">
              <label>Pts / Game</label>
              <input type="number" class="inp" id="cf-gpts" min="0" max="20" value="${Number(f.gameBonusPts ?? 1)}">
            </div>
          ` : `
            <div class="field">
              <label>Bonus / Set</label>
              <input type="number" class="inp" id="cf-spts" min="0" max="10" value="${Number(f.setBonusPts ?? 0)}">
            </div>
          `}
        </div>

        ${!isPP ? `
          <div class="row wrap" style="margin-bottom:14px">
            <div class="field">
              <label>Sets por defecto</label>
              <select class="inp" id="cf-sets">
                <option value="1" ${(Number(dr.totalSets)||3)===1?'selected':''}>1 Set único</option>
                <option value="3" ${(Number(dr.totalSets)||3)===3?'selected':''}>Al mejor de 3 sets</option>
              </select>
            </div>
            <div class="field">
              <label>En el 40-40</label>
              <select class="inp" id="cf-deuce">
                <option value="golden" ${(dr.deuceRule||'golden')==='golden'?'selected':''}>Punto de Oro</option>
                <option value="adv" ${dr.deuceRule==='adv'?'selected':''}>Ventajas</option>
                <option value="star" ${dr.deuceRule==='star'?'selected':''}>Star Point (FIP)</option>
              </select>
            </div>
          </div>
        ` : ''}

        <div class="btn-row" style="margin-top:12px">
          <button class="btn primary block" data-act="save-comp-modal">${ui.compModal === 'edit' ? 'Guardar Cambios' : (isPP ? 'Crear Torneo' : 'Crear y Gestionar')}</button>
          <button class="btn block" data-close-comp-modal="1">Cancelar</button>
        </div>
      </div>
    </div>`;
  }

  if (ui.compModal === 'quick-score' && (ui.quickScoreState || ui.quickScoreFixtureId)) {
    if (!ui.quickScoreState && ui.quickScoreFixtureId) {
      ui.quickScoreState = buildQuickScoreState({ mode: 'fixture', fixtureKey: ui.quickScoreFixtureId });
    }
    const qs = ui.quickScoreState;
    const comp = qs.compId ? getCompById(qs.compId) : null;
    const isPP = isProyectoPadelComp(comp);
    const pairParts = comp ? (comp.participants || []).filter(pt => pt.type === 'pair') : [];
    const compPool = comp ? getCompQuickPlayerPool(comp) : [];
    const compPlayerSuggestions = comp
      ? Array.from(new Set([...compPool, ...getKnownPlayerNames()]))
      : getKnownPlayerNames();
    const n0 = formatPairLabel(qs.teams[0]?.players?.[0] || 'DRIVE 1', qs.teams[0]?.players?.[1] || 'REVÉS 1');
    const n1 = formatPairLabel(qs.teams[1]?.players?.[0] || 'DRIVE 2', qs.teams[1]?.players?.[1] || 'REVÉS 2');
    const titleSuffix = qs.mode === 'fixture'
      ? ` (${esc(qs.stageLabel || 'Cruce')})`
      : (comp ? ` · ${esc(comp.name)}` : ' · Partido del Día');
    const showQuickTen = (sIdx) => sIdx >= 2;
    const assignedKeys = new Set([
      qs.teams[0]?.players?.[0], qs.teams[0]?.players?.[1],
      qs.teams[1]?.players?.[0], qs.teams[1]?.players?.[1]
    ].map(x => String(x || '').trim().toUpperCase()).filter(Boolean));
    const slotCls = (idx) => `inp qs-slot-inp ${qs.activeSlot === idx ? 'active-slot' : ''}`;

    return `
    <div class="scrim" data-close-comp-modal="1">
      <div class="sheet" style="max-width:520px">
        ${qs.mode === 'comp-adhoc' ? `<datalist id="qs-known-players">${compPlayerSuggestions.map(nm => `<option value="${esc(nm)}">`).join('')}</datalist>` : ''}
        <div class="sheet-hdr">
          <h2 style="font-size:21px">⚡ Cargar Resultado${titleSuffix}</h2>
          <button class="icon-btn" data-close-comp-modal="1" title="Cerrar" style="width:36px;height:36px;border-radius:12px;font-size:15px;font-weight:700">✕</button>
        </div>

        ${qs.mode === 'comp-adhoc' ? `
          <div class="field" style="margin-bottom:10px">
            <label>${isPP ? 'Turno / Ronda (opcional)' : 'Etapa / Ronda (opcional)'}</label>
            <input class="inp" id="qs-round" value="${esc(qs.stageLabel || '')}" placeholder="${isPP ? 'Ej: Turno 1 / Cancha 2 (opcional)' : 'Ej: Fecha 2 / Grupo A / Libre'}">
          </div>
          ${pairParts.length >= 2 && !qs.useManualTeams ? `
            <div class="row wrap" style="margin-bottom:8px">
              <div class="field">
                <label>Pareja 1</label>
                <select class="inp" id="qs-sel0">
                  ${pairParts.map(pt => `<option value="${esc(pt.id)}" ${qs.selPartIds?.[0]===pt.id?'selected':''}>${esc(formatPairLabel(pt.players?.[0], pt.players?.[1]))}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label>Pareja 2</label>
                <select class="inp" id="qs-sel1">
                  ${pairParts.map(pt => `<option value="${esc(pt.id)}" ${qs.selPartIds?.[1]===pt.id?'selected':''}>${esc(formatPairLabel(pt.players?.[0], pt.players?.[1]))}</option>`).join('')}
                </select>
              </div>
            </div>
            <div style="margin-bottom:12px">
              <button type="button" class="pill sm" data-act="qs-toggle-manual-teams">✏️ Escribir nombres / Armar parejas libres</button>
            </div>
          ` : `
            <div class="row wrap" style="margin-bottom:8px">
              <div class="field"><label>Pareja 1 · Jugador 1</label><input class="${slotCls(0)}" id="qs-t0p0" data-qs-slot="0" list="qs-known-players" value="${esc(qs.teams[0].players[0]||'')}" placeholder="Ej: Lucía"></div>
              <div class="field"><label>Pareja 1 · Jugador 2</label><input class="${slotCls(1)}" id="qs-t0p1" data-qs-slot="1" list="qs-known-players" value="${esc(qs.teams[0].players[1]||'')}" placeholder="Ej: Juan"></div>
            </div>
            <div class="row wrap" style="margin-bottom:8px">
              <div class="field"><label>Pareja 2 · Jugador 1</label><input class="${slotCls(2)}" id="qs-t1p0" data-qs-slot="2" list="qs-known-players" value="${esc(qs.teams[1].players[0]||'')}" placeholder="Ej: Marcos"></div>
              <div class="field"><label>Pareja 2 · Jugador 2</label><input class="${slotCls(3)}" id="qs-t1p1" data-qs-slot="3" list="qs-known-players" value="${esc(qs.teams[1].players[1]||'')}" placeholder="Ej: Noelia"></div>
            </div>
            ${compPool.length ? `
              <div style="margin-bottom:10px">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px">
                  <small class="muted" style="font-size:11px">Tocá jugadores para llenar rápido (casilla ${(qs.activeSlot || 0) + 1}/4):</small>
                  <button type="button" class="pill sm" data-act="qs-clear-players" style="min-height:24px;padding:2px 8px;font-size:11px">Limpiar nombres</button>
                </div>
                <div class="qs-player-chips">
                  ${compPool.map(nm => `<button type="button" class="qs-p-chip ${assignedKeys.has(nm.toUpperCase())?'used':''}" data-qs-pick-player="${esc(nm)}">+ ${esc(nm)}</button>`).join('')}
                </div>
              </div>
            ` : `
              <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
                <button type="button" class="pill sm" data-act="qs-clear-players" style="min-height:24px;padding:2px 8px;font-size:11px">Limpiar nombres</button>
              </div>
            `}
            ${pairParts.length >= 2 ? `<div style="margin-bottom:12px"><button type="button" class="pill sm" data-act="qs-toggle-manual-teams">👥 Elegir parejas inscriptas</button></div>` : ''}
          `}
        ` : `
          <p class="muted" style="margin-bottom:12px"><b>${esc(n0)}</b> vs <b>${esc(n1)}</b> · Tocá los games de cada set sin anotar punto por punto.</p>
        `}

        ${qs.sets.map((sVals, sIdx) => {
          const gChoices = showQuickTen(sIdx) ? [0,1,2,3,4,5,6,7,10] : [0,1,2,3,4,5,6,7];
          const isStbHint = sIdx === 2 && qs.hasSuperTbFinal;
          return `
          <div class="qs-set-card">
            <div class="qs-set-hdr">
              <b>${isPP ? 'Marcador Final (Games)' : `Set ${sIdx + 1}${isStbHint ? ' / Súper TB' : (sIdx >= 2 ? ' (Opcional)' : '')}`}</b>
              <button type="button" class="pill sm" data-qs-clear-set="${sIdx}" style="min-height:26px;padding:2px 8px;font-size:11px">Limpiar</button>
            </div>
            ${[0, 1].map(side => {
              const tCol = qs.teams[side]?.color || (side === 0 ? '#d4af37' : '#2f8cff');
              const tName = side === 0 ? n0 : n1;
              const val = sVals[side];
              const strVal = (val === null || val === undefined) ? '' : String(val);
              return `
              <div class="qs-team-row">
                <div class="qs-team-top">
                  <span class="qs-team-lbl" style="--c:${esc(tCol)}"><span class="dot"></span>${esc(tName)}</span>
                  <input type="number" class="inp qs-num" id="qs-s${sIdx+1}-${side}" min="0" max="30" value="${esc(strVal)}" placeholder="–">
                </div>
                <div class="qs-pills" data-qs-row="${sIdx}:${side}">
                  ${gChoices.map(g => `<button type="button" class="qs-g-pill ${val===g?'on':''}" style="--c:${esc(tCol)};--f:${fgFor(tCol)}" data-qs-pick="${sIdx}:${side}:${g}">${g}</button>`).join('')}
                </div>
              </div>`;
            }).join('')}
          </div>`;
        }).join('')}

        ${!isPP && qs.sets.length < 5 ? `
          <button type="button" class="btn sm block" data-act="qs-add-set" style="margin-bottom:8px">
            ${ICONS.plus} Agregar Set ${qs.sets.length + 1}${qs.sets.length === 2 ? ' / Súper TB' : ''}
          </button>` : ''}

        <div class="qs-preview" id="qs-preview">${esc(formatQuickScorePreview(qs))}</div>

        ${!isPP ? `
          <div class="tog" style="border:none;padding:4px 0">
            <div><b>Victoria por Walkover (W.O.)</b><small>Otorga puntos de tabla y avanza sin alterar ELO</small></div>
            <label class="sw"><input type="checkbox" id="qs-wo" ${qs.wo?'checked':''}><span></span></label>
          </div>
        ` : ''}

        <div class="field" style="margin:8px 0 14px">
          <label>${isPP ? 'Definición del resultado (auto detecta empate)' : 'Ganador (si empatan sets o en W.O.)'}</label>
          <select class="inp" id="qs-winner">
            <option value="auto" ${qs.winner==='auto'?'selected':''}>${isPP ? 'Automático por marcador (o Empate)' : 'Automático por sets'}</option>
            <option value="0" ${qs.winner==='0'?'selected':''}>Gana ${esc(n0)}</option>
            <option value="1" ${qs.winner==='1'?'selected':''}>Gana ${esc(n1)}</option>
            ${isPP ? `<option value="draw" ${qs.winner==='draw'?'selected':''}>🤝 Empate oficial</option>` : ''}
          </select>
        </div>

        <div class="btn-row">
          <button class="btn primary block" data-act="save-quick-score" data-target="${esc(qs.fixtureKey || ui.quickScoreFixtureId || '')}">${ICONS.check} Guardar Resultado</button>
          <button class="btn block" data-close-comp-modal="1">Cancelar</button>
        </div>
      </div>
    </div>`;
  }

  if (ui.compModal === 'add-fixture') {
    const comp = getCompById(ui.compId);
    if (!comp) return '';
    const pairParts = (comp.participants || []).filter(p => p.type === 'pair');
    return `
    <div class="scrim" data-close-comp-modal="1">
      <div class="sheet" style="max-width:500px">
        <h2>Agregar Cruce Manual</h2>
        <div class="field" style="margin-bottom:10px">
          <label>Etapa / Fecha</label>
          <input class="inp" id="af-round" value="Fecha 1" placeholder="Ej: Fecha 1 / Semifinal">
        </div>
        ${pairParts.length >= 2 ? `
          <div class="field" style="margin-bottom:10px">
            <label>Pareja 1 (inscripta)</label>
            <select class="inp" id="af-sel0">
              ${pairParts.map(pt => `<option value="${esc(pt.id)}">${esc(formatPairLabel(pt.players?.[0], pt.players?.[1]))}</option>`).join('')}
            </select>
          </div>
          <div class="field" style="margin-bottom:14px">
            <label>Pareja 2 (inscripta)</label>
            <select class="inp" id="af-sel1">
              ${pairParts.map((pt, idx) => `<option value="${esc(pt.id)}" ${idx===1?'selected':''}>${esc(formatPairLabel(pt.players?.[0], pt.players?.[1]))}</option>`).join('')}
            </select>
          </div>
        ` : `
          <div class="row wrap" style="margin-bottom:10px">
            <div class="field"><label>Pareja 1 · Drive</label><input class="inp" id="af-t0p0" placeholder="Drive 1"></div>
            <div class="field"><label>Pareja 1 · Revés</label><input class="inp" id="af-t0p1" placeholder="Revés 1"></div>
          </div>
          <div class="row wrap" style="margin-bottom:14px">
            <div class="field"><label>Pareja 2 · Drive</label><input class="inp" id="af-t1p0" placeholder="Drive 2"></div>
            <div class="field"><label>Pareja 2 · Revés</label><input class="inp" id="af-t1p1" placeholder="Revés 2"></div>
          </div>
        `}
        <div class="btn-row">
          <button class="btn primary block" data-act="save-manual-fixture" data-comp="${esc(comp.id)}">Agregar Cruce</button>
          <button class="btn block" data-close-comp-modal="1">Cancelar</button>
        </div>
      </div>
    </div>`;
  }

  if (ui.compModal === 'sync-qr') {
    const comp = getCompById(ui.compId);
    if (!comp) return '';
    const syncCode = ensureCompSyncCode(comp);
    const shareUrl = getCompShareUrl(comp, false);
    const kindWord = comp.kind === 'tournament' ? 'Torneo' : 'Liga';

    return `
    <div class="scrim" data-close-comp-modal="1">
      <div class="sheet" style="max-width:480px">
        <div class="sheet-hdr">
          <h2>📡 Conectar Dispositivos</h2>
          <button class="icon-btn" data-close-comp-modal="1" title="Cerrar" style="width:36px;height:36px;border-radius:12px;font-size:15px;font-weight:700">✕</button>
        </div>
        <p class="muted" style="margin-bottom:12px">Todos los celulares que escaneen este QR o abran el enlace se conectan al mismo <b>${kindWord}: ${esc(comp.name)}</b> y suman sus resultados automáticamente al finalizar cada partido.</p>

        <div style="text-align:center;margin:10px 0 14px">
          <div style="display:inline-block;padding:12px;background:#fff;border-radius:16px;border:3px solid var(--gold);box-shadow:0 8px 28px rgba(0,0,0,.45)">
            <canvas id="comp-sync-qr-canvas" width="230" height="230" style="display:block;border-radius:6px"></canvas>
          </div>
          <div style="margin-top:10px">
            <span class="muted" style="font-size:11.5px;display:block;letter-spacing:.8px;text-transform:uppercase">Código de Sala</span>
            <b style="font-family:var(--fd);font-size:28px;letter-spacing:4px;color:var(--gold)">#${esc(syncCode)}</b>
          </div>
        </div>

        <div class="field" style="margin-bottom:10px">
          <label>Enlace directo de invitación</label>
          <div style="display:flex;gap:6px">
            <input class="inp" id="sync-comp-url-inp" readonly value="${esc(shareUrl)}" style="font-size:12px">
            <button class="btn primary sm" data-copy-input="sync-comp-url-inp" style="flex:none">${ICONS.copy} Copiar</button>
          </div>
        </div>

        <div class="btn-row" style="margin-top:10px">
          <button class="btn primary block" data-act="share-comp-invite">${ICONS.share} Enviar Enlace (WhatsApp)</button>
          <button class="btn block" data-act="dl-comp-qr">${ICONS.dl} Descargar QR HD</button>
        </div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn sm block" data-act="republish-comp-sync">↻ Actualizar datos en la nube</button>
          <button class="btn sm block" data-close-comp-modal="1">Cerrar</button>
        </div>

        <div style="margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:12px;color:var(--tx2);line-height:1.45">
          <b style="color:var(--tx);display:block;margin-bottom:4px">¿Cómo se usa en varias canchas?</b>
          1. Cada árbitro o jugador escanea este QR (o entra en <i>Ligas y Torneos → Unirse</i> con el código <b>#${esc(syncCode)}</b>).<br>
          2. Cada cancha inicia su cruce o partido desde esta competencia.<br>
          3. Al terminar cada partido, los puntos, ELO, fixture y llaves se fusionan en todos los dispositivos conectados.
        </div>
      </div>
    </div>`;
  }

  if (ui.compModal === 'join-comp') {
    return `
    <div class="scrim" data-close-comp-modal="1">
      <div class="sheet" style="max-width:440px">
        <div class="sheet-hdr">
          <h2>📲 Unirse a Liga o Torneo</h2>
          <button class="icon-btn" data-close-comp-modal="1" title="Cerrar" style="width:36px;height:36px;border-radius:12px;font-size:15px;font-weight:700">✕</button>
        </div>
        <p class="muted" style="margin-bottom:14px">Ingresá el código de sala (6 letras/números) o pegá el enlace compartido por el organizador para conectarte desde este dispositivo.</p>
        <div class="field" style="margin-bottom:14px">
          <label>Código de Sala o Enlace</label>
          <input class="inp" id="join-comp-code" placeholder="Ej: 7K4M9P o pegá el link #c=...">
        </div>
        <div class="btn-row">
          <button class="btn primary block" data-act="submit-join-comp">Conectarme ahora</button>
          <button class="btn block" data-close-comp-modal="1">Cancelar</button>
        </div>
      </div>
    </div>`;
  }

  return '';
}

// ==================== HISTORY, PLAYERS & SETTINGS VIEWS ====================
function renderHistory() {
  const q = (ui.histQuery || '').toLowerCase().trim();
  const hf = ui.histFilter || 'all';
  const list = historyList.filter(m => {
    const mk = getMatchKind(m);
    if (hf !== 'all' && mk !== hf) return false;
    if (!q) return true;
    const names = m.teams.flatMap(t => t.players).join(' ').toLowerCase();
    const compTitle = (m.competition?.compName || getCompById(getMatchCompId(m))?.name || '').toLowerCase();
    return names.includes(q) || compTitle.includes(q) || fmtDateLong(m.createdAt).toLowerCase().includes(q);
  });

  return `
  <div class="page">
    <div class="page-h">
      <h1>Historial (${historyList.length})</h1>

function renderPlayers() {
  const vault = loadJSON('padel_ranking_vault', {});
  const sharedList = Object.values(vault);
  const hasShared = !!(ui.sharedRanking && Array.isArray(ui.sharedRanking.players) && ui.sharedRanking.players.length > 0);
  if (!historyList.length && !competitionsList.length && hasShared && ui.playerRankingView === 'shared') {
    ui.playerScope = 'shared';
  }

  const rCtx = getCurrentRankingContext();
  const scope = rCtx.scope;
  const currentSort = rCtx.sortKey || 'pts';
  const players = rCtx.players || [];

  let scopeSubHtml = '';
  if (scope === 'daily') {
    const tf = ui.dailyTimeFilter || 'all';
    const em = ui.playerEntityMode || 'individual';
    const winP = Number(prefs.dailyWinPts ?? 3);
    const lossP = Number(prefs.dailyLossPts ?? 1);
    scopeSubHtml = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(135deg,rgba(212,175,55,0.08) 0%,rgba(16,16,22,0.92) 80%);border:1px solid rgba(212,175,55,0.25);border-radius:12px;padding:8px 14px;margin-bottom:12px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden">
          <span style="font-size:16px">☀️</span>
          <div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            <span style="font-size:13px;font-weight:700;color:var(--tx)">${esc(prefs.rankingName || 'Mi Ranking')} · Partido del Día</span>
            <span style="font-family:monospace;font-size:11px;color:var(--gold);margin-left:6px;background:rgba(212,175,55,0.12);padding:2px 6px;border-radius:6px;font-weight:700">#${esc(prefs.rankingId)}</span>
          </div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn sm" data-act="open-daily-pts" style="padding:4px 9px;font-size:11.5px;height:auto">+${winP}V / +${lossP}D</button>
          <button class="btn sm" data-act="prompt-ranking-name" style="padding:4px 9px;font-size:11.5px;height:auto">✏️ Renombrar</button>
        </div>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <div class="seg" style="flex:1 1 180px">
          <button class="${tf==='all'?'on':''}" data-set-daily-time="all">📅 Acumulado</button>
          <button class="${tf==='today'?'on':''}" data-set-daily-time="today">☀️ Hoy</button>
        </div>
        <div class="seg" style="flex:1 1 180px">
          <button class="${em==='individual'?'on':''}" data-set-pentity="individual">👤 Individual</button>
          <button class="${em==='pairs'?'on':''}" data-set-pentity="pairs">👥 Por Parejas</button>
        </div>
      </div>`;
  } else if (scope === 'league' || scope === 'tournament') {
    const compsOfKind = competitionsList.filter(c => c.kind === scope);
    if (!compsOfKind.length) {
      scopeSubHtml = `
      <div class="card" style="text-align:center;margin-bottom:14px">
        <p class="muted" style="margin-bottom:10px">Todavía no creaste ${scope === 'league' ? 'ninguna Liga' : 'ningún Torneo'}.</p>
        <button class="btn primary sm" data-act="new-comp" data-kind="${scope}">${ICONS.plus} Crear ${scope === 'league' ? 'Liga' : 'Torneo'}</button>
      </div>`;
    } else {
      const selComp = rCtx.comp;
      const gLetters = selComp ? Array.from(new Set((selComp.participants || []).map(p => p.group).filter(Boolean))).sort() : [];
      const em = rCtx.entityMode || 'pairs';
      scopeSubHtml = `
      <div class="card" style="margin-bottom:12px;padding:12px 14px">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <select class="inp" style="flex:1 1 190px;min-height:38px" data-act="sel-rank-comp">
            ${compsOfKind.map(c => `<option value="${esc(c.id)}" ${c.id===selComp?.id?'selected':''}>${esc(c.name)}</option>`).join('')}
          </select>
          ${selComp ? `<button class="btn sm" data-open-comp="${esc(selComp.id)}">Gestionar</button>` : ''}
          <button class="btn sm" data-act="new-comp" data-kind="${scope}">${ICONS.plus}</button>
        </div>
        ${selComp?.rankingMode === 'both' ? `
          <div class="seg" style="margin-top:10px">
            <button class="${em==='pairs'?'on':''}" data-set-pentity="pairs">👥 Por Parejas</button>
            <button class="${em==='individual'?'on':''}" data-set-pentity="individual">👤 Individual</button>
          </div>` : ''}
        ${selComp?.format === 'groups_playoff' && gLetters.length ? `
          <div class="pills" style="margin-top:10px">
            <button class="pill ${(ui.selectedGroupFilter||'all')==='all'?'on':''}" data-set-gfilter="all">Todos</button>
            ${gLetters.map(g => `<button class="pill ${ui.selectedGroupFilter===g?'on':''}" data-set-gfilter="${esc(g)}">Grupo ${esc(g)}</button>`).join('')}
          </div>` : ''}
      </div>`;
    }
  } else if (scope === 'shared') {
    const dateStr = ui.sharedRanking?.timestamp ? ` · ${new Date(ui.sharedRanking.timestamp).toLocaleDateString('es-AR', {day:'numeric', month:'short'})}` : '';
    scopeSubHtml = `
    ${sharedList.length > 1 ? `
      <div class="seg" style="margin-bottom:12px;overflow-x:auto;white-space:nowrap">
        ${sharedList.map(sr => `
          <button class="${ui.sharedRanking?.id === sr.id ? 'on' : ''}" data-select-ranking="${esc(sr.id)}">📡 ${esc(sr.name || 'Compartido')} (#${esc(sr.id)})</button>
        `).join('')}
      </div>` : ''}
    ${hasShared ? `
      <div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,rgba(212,175,55,0.14) 0%,rgba(16,16,22,0.96) 60%);border:1px solid rgba(212,175,55,0.38);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:24px">📡</span>
          <div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <b style="font-size:14px;color:var(--acc-ink)">${esc(ui.sharedRanking.name || 'Ranking Compartido')}</b>
              <span style="font-family:monospace;font-size:11.5px;color:var(--gold);background:rgba(212,175,55,0.15);padding:1px 6px;border-radius:6px;font-weight:700">#${esc(ui.sharedRanking.id || 'RK-EXT')}</span>
            </div>
            <small style="color:var(--tx2);font-size:12px">${esc(ui.sharedRanking.subtitle || `${players.length} participantes`)}${dateStr}</small>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <button class="btn sm" data-set-pscope="daily">Ver mi ranking</button>
          <button class="btn sm" data-act="clear-shared-ranking" title="Cerrar ranking compartido">✕</button>
        </div>
      </div>` : ''}`;
  }

  return `
  <div class="page">
    <div class="page-h">
      <h1>Rankings</h1>
      <div class="page-h-acts">
        <button class="btn primary sm" data-act="share-ranking" title="Compartir Ranking por WhatsApp o enlace">${ICONS.share} Compartir</button>
        <button class="btn sm" data-act="export-ranking-img" title="Descargar imagen oficial del Ranking">${ICONS.img} Imagen</button>
        <button class="icon-btn" data-nav="settings" title="Ajustes">${ICONS.gear}</button>
      </div>
    </div>
    <p class="muted" style="text-align:center;margin-bottom:12px">Rankings separados por competencia: Partido del Día (acumulado u hoy), Ligas y Torneos.</p>

    <div class="seg" style="margin-bottom:12px">
      <button class="${scope==='daily'?'on':''}" data-set-pscope="daily">☀️ Partido del Día</button>
      <button class="${scope==='league'?'on':''}" data-set-pscope="league">🏅 Ligas</button>
      <button class="${scope==='tournament'?'on':''}" data-set-pscope="tournament">🏆 Torneos</button>
      ${(hasShared || sharedList.length > 0) ? `<button class="${scope==='shared'?'on':''}" data-set-pscope="shared">📡 Guardados</button>` : ''}
    </div>

    ${scopeSubHtml}

    ${renderSortBarHtml(currentSort, rCtx.primaryMetric === 'elo' || isProyectoPadelComp(rCtx.comp))}

    ${renderStandingsSectionHtml(players, rCtx, {
      tableTitle: rCtx.title || 'Tabla de Posiciones',
      emptyText: scope === 'daily'
        ? (ui.dailyTimeFilter === 'today' ? 'Todavía no hay Partidos del Día registrados hoy.' : 'Todavía no hay Partidos del Día guardados.')
        : 'Sin partidos ni inscriptos cargados en esta competencia.'
    })}

    ${players.length ? `
    <div class="btn-row" style="margin-top:14px;margin-bottom:14px">
      <button class="btn primary big" data-act="share-ranking">${ICONS.share} Compartir Ranking</button>
      <button class="btn big" data-act="export-ranking-img">${ICONS.img} Descargar Imagen en HD</button>
    </div>` : ''}

    <!-- Expandable ELO & Mixed Points explanation guide -->
    <details class="elo-guide-card">
      <summary>
        <span>ℹ️ ¿Cómo funciona el Sistema Mixto (Puntos + ELO Aparte)?</span>
        <span style="font-size:12px;opacity:0.8">Tocar para ver</span>
      </summary>
      <div class="elo-guide-content">
        <div class="guide-item">
          <b>🔀 Rankings 100% Independientes</b>
          <p>Los Partidos del Día, cada Liga y cada Torneo suman puntos y calculan su propio ELO únicamente con los partidos jugados dentro de ese ranking.</p>
        </div>
        <div class="guide-item">
          <b>🏅 Puntos de Tabla configurables</b>
          <p>Por defecto cada victoria suma +3 pts y cada derrota +1 pt (editable para el Día o individualmente por Liga/Torneo, con bonus opcional por set).</p>
        </div>
        <div class="guide-item">
          <b>🎯 Base 1000 ELO & Factor K dinámico</b>
          <p>Inician en 1000 pts (Nivel Playtomic 2.50). K=50 los primeros 10 partidos y K=32 luego, con bonus x1.2 por +6 juegos de diferencia.</p>
        </div>
        <div class="guide-item">
          <b>🏅 Escala Playtomic (1.00 a 7.00)</b>
          <p>Iniciación (1.00-1.99) · Intermedio (2.00-3.99) · Avanzado (4.00-4.99) · Competición (5.00-5.99) · Pro / Élite (6.00-7.00).</p>
        </div>
      </div>
    </details>

    ${renderSignatureFooter()}
  </div>
  ${renderTabbar('players')}`;
}
