// ==================== MATCH ENGINE (DETERMINISTIC REPLAY) ====================
function createMatchFromPreset(p) {
  const t0 = p.teams[0], t1 = p.teams[1];
  const players0 = [t0.players[0]?.trim() || 'JUGADOR 1', t0.players[1]?.trim() || 'JUGADOR 2'];
  const players1 = [t1.players[0]?.trim() || 'JUGADOR 3', t1.players[1]?.trim() || 'JUGADOR 4'];
  const fs = p.firstServer || [0,0];
  const totalSets = Math.max(1, Number(p.totalSets) || (p.setsToWin ? (Number(p.setsToWin) * 2 - 1) : 3));
  const setsToWin = Math.floor(totalSets / 2) + 1;
  return {
    id: Math.random().toString(36).slice(2, 5) + Date.now().toString(36).slice(-3),
    createdAt: Date.now(),
    durationMs: 0,
    status: 'playing', // 'playing' | 'paused' | 'finished' | 'abandoned'
    mode: 'doubles',
    teams: [
      {players: players0, color: t0.color || '#d4af37'},
      {players: players1, color: t1.color || '#2f8cff'}
    ],
    rules: {
      totalSets,
      setsToWin,
      gamesPerSet: Math.max(1, Number(p.gamesPerSet) || 6),
      deuceRule: p.deuceRule || 'golden',
      tiebreakAt: p.tiebreakAt !== undefined ? Number(p.tiebreakAt) : Math.max(1, Number(p.gamesPerSet) || 6),
      tiebreakPoints: Math.max(1, Number(p.tiebreakPoints) || 7),
      finalSet: p.finalSet || 'normal',
      changeoverRule: p.changeoverRule || 'odd'
    },
    firstServer: [fs[0] || 0, fs[1] || 0],
    secondServerIdx: p.secondServerIdx ?? null,
    shotPrompt: p.shotPrompt !== undefined ? !!p.shotPrompt : true,
    flipped: false,
    pendingFault: false,
    events: [],
    redoStack: []
  };
}

function getServerRotation(m) {
  const tA = m.firstServer[0];
  const pA1 = m.firstServer[1] || 0;
  const pA2 = 1 - pA1;
  const tB = 1 - tA;
  const pB1 = m.secondServerIdx ?? 0;
  const pB2 = 1 - pB1;
  return [[tA, pA1], [tB, pB1], [tA, pA2], [tB, pB2]];
}

function regularPointCall(p0, p1, deuceRule, deuceCount) {
  const MAP = ['0','15','30','40'];
  if (p0 < 3 || p1 < 3) return `${MAP[Math.min(p0,3)]}-${MAP[Math.min(p1,3)]}`;
  if (p0 === p1) return (deuceRule === 'star' && deuceCount >= 3) ? '40-40 ★' : '40-40';
  return p0 > p1 ? 'AD-40' : '40-AD';
}

function isBreakPointSituation(srvTeam, p0, p1, deuceRule, deuceCount) {
  const sp = srvTeam === 0 ? p0 : p1;
  const rp = srvTeam === 0 ? p1 : p0;
  if (rp < 3) return false;
  if (sp < 3) return true; // 0-40, 15-40, 30-40
  if (deuceRule === 'golden') return sp === 3 && rp === 3;
  if (deuceRule === 'star') return (sp === rp && deuceCount >= 3) || (rp > sp);
  return rp > sp; // advantage receiver
}

function isGoldenPointSituation(p0, p1, deuceRule, deuceCount) {
  if (p0 < 3 || p1 < 3 || p0 !== p1) return false;
  if (deuceRule === 'golden') return true;
  if (deuceRule === 'star' && deuceCount >= 3) return true;
  return false;
}

function isStarPointSituation(p0, p1, deuceRule, deuceCount) {
  return deuceRule === 'star' && p0 >= 3 && p1 >= 3 && p0 === p1 && deuceCount >= 3;
}

function isSetPointFor(m, st, curSet, isTB, isSuperTB, p0, p1, team) {
  const R = m.rules;
  const opp = 1 - team;
  const tp = team === 0 ? p0 : p1;
  const op = team === 0 ? p1 : p0;
  if (isSuperTB) {
    return tp >= 9 && (tp - op) >= 1;
  }
  if (isTB) {
    const target = R.tiebreakPoints || 7;
    return tp >= (target - 1) && (tp - op) >= 1;
  }
  // Does winning this game win the set for `team`?
  const gT = curSet.games[team] + 1;
  const gO = curSet.games[opp];
  const gps = R.gamesPerSet || 6;
  const winsSetIfGame = (gT >= gps && (gT - gO) >= 2);
  if (!winsSetIfGame) return false;
  // Is this point a game point for `team`?
  if (tp < 3) return false;
  if (op < 3) return true;
  if (R.deuceRule === 'golden') return tp === 3 && op === 3;
  if (R.deuceRule === 'star' && tp === op && st.deuceCount >= 3) return true;
  return tp > op;
}

function computeMatch(m) {
  const R = m.rules;
  const rot = getServerRotation(m);
  let rotIdx = 0;

  const sets = [{games:[0,0], history:[], winner:null, tbScore:null, isSuperTB:false}];
  let curSetIdx = 0;
  let setsWon = [0,0];
  let matchWinner = null;

  // Current game state
  let p = [0,0];
  let deuceCount = 0;
  let curGamePoints = [];
  let totalGamesPlayed = 0;

  // Enriched point list for stats
  const allPoints = [];

  function checkIsSuperTB(sIdx) {
    if (R.finalSet !== 'supertb') return false;
    const maxSets = R.totalSets || (R.setsToWin * 2 - 1);
    return maxSets > 1 && (sIdx === maxSets - 1) && setsWon[0] === setsWon[1];
  }
  function checkIsTB(s) {
    if (s.isSuperTB) return true;
    const tbAt = R.tiebreakAt;
    if (!tbAt || tbAt <= 0) return false;
    return s.games[0] === tbAt && s.games[1] === tbAt;
  }
  function getCurServer(isTB, tbPtsPlayed) {
    if (!isTB) return rot[rotIdx % 4];
    if (tbPtsPlayed === 0) return rot[rotIdx % 4];
    const k = Math.floor((tbPtsPlayed + 1) / 2);
    return rot[(rotIdx + k) % 4];
  }

  let lastTransition = null; // {type, ...}

  for (let idx = 0; idx < m.events.length; idx++) {
    if (matchWinner !== null) break;
    const ev = m.events[idx];
    const curSet = sets[curSetIdx];
    curSet.isSuperTB = checkIsSuperTB(curSetIdx);
    const isSuperTB = curSet.isSuperTB;
    const isTB = checkIsTB(curSet);
    const tbPtsPlayed = p[0] + p[1];
    const srv = getCurServer(isTB, tbPtsPlayed);
    const srvTeam = srv[0], srvPlayer = srv[1];

    if (p[0] >= 3 && p[1] >= 3 && p[0] === p[1] && !isTB) {
      if (p[0] === 3) deuceCount = 1;
      else deuceCount++;
    }

    const scoreBefore = isTB
      ? `${p[0]}-${p[1]}`
      : regularPointCall(p[0], p[1], R.deuceRule, deuceCount);

    const isGP = !isTB && isGoldenPointSituation(p[0], p[1], R.deuceRule, deuceCount);
    const isStar = !isTB && isStarPointSituation(p[0], p[1], R.deuceRule, deuceCount);
    const isBP = !isTB && isBreakPointSituation(srvTeam, p[0], p[1], R.deuceRule, deuceCount);
    const isKey = !isTB && (isBP || (p[0] >= 2 && p[1] >= 2));

    const w = ev.w;
    const pBefore = [p[0], p[1]];
    p[w]++;

    const scoreAfter = isTB
      ? `${p[0]}-${p[1]}`
      : regularPointCall(p[0], p[1], R.deuceRule, deuceCount);

    const ptRecord = {
      idx,
      setIdx: curSetIdx,
      gameIdx: curSet.history.length,
      w,
      srvTeam,
      srvPlayer,
      firstServeIn: ev.fs !== false,
      doubleFault: ev.type === 'df',
      shotType: ev.type || 'pt', // 'winner' | 'ue' | 'fe' | 'df' | 'pt'
      subType: ev.sub || null,   // 'smash' | 'volea' | 'bandeja' | 'bajada' | 'dejada' | 'passing' | 'globo' | 'winner'
      byPlayer: ev.by || null,   // [team, playerIdx]
      scoreBefore,
      scoreAfter,
      pBefore,
      isTB,
      isSuperTB,
      isGP,
      isStar,
      isBP,
      isKey
    };

    curGamePoints.push(ptRecord);
    allPoints.push(ptRecord);

    // Check if game/TB won
    let gameWinner = null;
    if (isTB) {
      const target = isSuperTB ? 10 : (R.tiebreakPoints || 7);
      if (p[w] >= target && (p[w] - p[1 - w]) >= 2) gameWinner = w;
    } else {
      if (isGP) {
        gameWinner = w;
      } else if (p[w] >= 4 && (p[w] - p[1 - w]) >= 2) {
        gameWinner = w;
      }
    }

    lastTransition = null;
    if (gameWinner !== null) {
      const wasBreak = !isTB && (gameWinner !== srvTeam);
      curSet.games[gameWinner]++;
      const gAfter = [curSet.games[0], curSet.games[1]];
      const gameObj = {
        setIdx: curSetIdx,
        gameIdx: curSet.history.length,
        srvTeam,
        srvPlayer,
        winner: gameWinner,
        isBreak: wasBreak,
        isTB,
        isSuperTB,
        tbScore: isTB ? [p[0], p[1]] : null,
        gamesAfter: gAfter,
        points: curGamePoints
      };
      curSet.history.push(gameObj);
      totalGamesPlayed++;

      // Advance server rotation
      rotIdx = (rotIdx + 1) % 4;

      // Check if set won
      const gps = R.gamesPerSet || 6;
      let setWinner = null;
      if (isTB) {
        setWinner = gameWinner;
        curSet.tbScore = [p[0], p[1]];
      } else if (curSet.games[gameWinner] >= gps && (curSet.games[gameWinner] - curSet.games[1 - gameWinner]) >= 2) {
        setWinner = gameWinner;
      }

      // Reset game state
      p = [0,0];
      deuceCount = 0;
      curGamePoints = [];

      if (setWinner !== null) {
        curSet.winner = setWinner;
        setsWon[setWinner]++;
        const coRule = R.changeoverRule || 'odd';
        const sumSetG = curSet.games[0] + curSet.games[1];
        const setCo = coRule === 'set' ? true : (coRule === 'odd' ? (sumSetG % 2 === 1) : false);
        const maxSets = R.totalSets || (R.setsToWin * 2 - 1);
        if (setsWon[setWinner] >= R.setsToWin || (setsWon[0] + setsWon[1]) >= maxSets) {
          matchWinner = setsWon[0] >= setsWon[1] ? 0 : 1;
          lastTransition = {type:'match', winner: matchWinner, setIdx: curSetIdx};
        } else {
          const finishedSetIdx = curSetIdx;
          curSetIdx++;
          sets.push({games:[0,0], history:[], winner:null, tbScore:null, isSuperTB: checkIsSuperTB(curSetIdx)});
          lastTransition = {type:'set', winner: setWinner, setIdx: finishedSetIdx, changeover: setCo};
        }
      } else {
        const coRule = R.changeoverRule || 'odd';
        const sumG = curSet.games[0] + curSet.games[1];
        const needPrompt2nd = (totalGamesPlayed === 1 && m.secondServerIdx === null);
        lastTransition = {
          type: 'game',
          winner: gameWinner,
          wasBreak,
          changeover: (coRule === 'odd') && (sumG % 2 === 1),
          needSecondServerPrompt: needPrompt2nd
        };
      }
    } else if (isTB && (R.changeoverRule || 'odd') === 'odd') {
      const sumTB = p[0] + p[1];
      if (sumTB > 0 && sumTB % 6 === 0) {
        lastTransition = {type:'tb_changeover', tbScore:[p[0], p[1]]};
      }
    }
  }

  const curSet = sets[curSetIdx];
  curSet.isSuperTB = checkIsSuperTB(curSetIdx);
  const isSuperTB = curSet.isSuperTB;
  const isTB = checkIsTB(curSet);
  const srv = getCurServer(isTB, p[0] + p[1]);
  const srvTeam = srv[0], srvPlayer = srv[1];

  let curDeuceCount = deuceCount;
  let curAdvNumber = 0;
  if (!isTB && p[0] >= 3 && p[1] >= 3) {
    if (p[0] === p[1]) {
      curDeuceCount = (p[0] - 3) + 1;
    } else {
      curAdvNumber = Math.min(p[0], p[1]) - 3 + 1; // 1 = 1ª ventaja, 2 = 2ª ventaja
    }
  }

  const isGP = !isTB && isGoldenPointSituation(p[0], p[1], R.deuceRule, curDeuceCount);
  const isStar = !isTB && isStarPointSituation(p[0], p[1], R.deuceRule, curDeuceCount);
  const isBP = !isTB && isBreakPointSituation(srvTeam, p[0], p[1], R.deuceRule, curDeuceCount);
  const sp0 = isSetPointFor(m, {deuceCount:curDeuceCount}, curSet, isTB, isSuperTB, p[0], p[1], 0);
  const sp1 = isSetPointFor(m, {deuceCount:curDeuceCount}, curSet, isTB, isSuperTB, p[0], p[1], 1);
  const mp0 = sp0 && setsWon[0] === (R.setsToWin - 1);
  const mp1 = sp1 && setsWon[1] === (R.setsToWin - 1);

  let pointDisplay = ['0','0'];
  if (isTB) {
    pointDisplay = [String(p[0]), String(p[1])];
  } else {
    const MAP = ['0','15','30','40'];
    if (p[0] < 3 || p[1] < 3) {
      pointDisplay = [MAP[Math.min(p[0],3)], MAP[Math.min(p[1],3)]];
    } else if (p[0] === p[1]) {
      pointDisplay = isStar ? ['40 ★','40 ★'] : ['40','40'];
    } else if (p[0] > p[1]) {
      pointDisplay = ['AD','40'];
    } else {
      pointDisplay = ['40','AD'];
    }
  }

  return {
    sets,
    curSetIdx,
    curSet,
    setsWon,
    matchWinner,
    p,
    pointDisplay,
    srvTeam,
    srvPlayer,
    isTB,
    isSuperTB,
    isGP,
    isStar,
    curDeuceCount,
    curAdvNumber,
    isBP,
    sp: [sp0, sp1],
    mp: [mp0, mp1],
    curGamePoints,
    allPoints,
    totalGamesPlayed,
    lastTransition
  };
}

// ==================== ANALYTICS & STATS ENGINE ====================
function computeStats(m, setFilter = 'all') {
  const st = computeMatch(m);
  const filterIdx = setFilter === 'all' ? null : Number(setFilter);
  const pts = st.allPoints.filter(pt => filterIdx === null || pt.setIdx === filterIdx);
  const games = [];
  st.sets.forEach((s, sIdx) => {
    if (filterIdx === null || sIdx === filterIdx) {
      s.history.forEach(g => games.push(g));
    }
  });

  // Team aggregates
  const T = [0,1].map(() => ({
    ptsWon: 0,
    winners: 0,
    ue: 0,
    fe: 0,
    shots: { smash: 0, volea: 0, bandeja: 0, bajada: 0, dejada: 0, passing: 0, globo: 0, otro: 0 },
    srvPtsWon: 0,
    srvPtsTotal: 0,
    retPtsWon: 0,
    retPtsTotal: 0,
    firstServeIn: 0,
    doubleFaults: 0,
    bpWon: 0,
    bpTotal: 0,
    bpSaved: 0,
    bpFaced: 0,
    gpWon: 0,
    gpTotal: 0,
    gpSrvWon: 0,
    gpSrvTotal: 0,
    gpRetWon: 0,
    gpRetTotal: 0,
    keyWon: 0,
    keyTotal: 0,
    maxPtStreak: 0,
    gamesWon: 0,
    srvGamesWon: 0,
    srvGamesTotal: 0,
    maxGameStreak: 0
  }));

  // Player aggregates: key = `${t}_${p}`
  const P = {};
  for (let t = 0; t < 2; t++) {
    for (let pi = 0; pi < 2; pi++) {
      P[`${t}_${pi}`] = {
        team: t,
        playerIdx: pi,
        name: playerLabel(m, t, pi),
        color: m.teams[t].color,
        winners: 0,
        ue: 0,
        fe: 0,
        shots: { smash: 0, volea: 0, bandeja: 0, bajada: 0, dejada: 0, passing: 0, globo: 0, otro: 0 },
        srvPtsTotal: 0,
        srvPtsWon: 0,
        firstServeIn: 0,
        doubleFaults: 0,
        srvGamesWon: 0,
        srvGamesTotal: 0
      };
    }
  }

  let curPtStreak = [0,0];
  const momentum = [0]; // diff (team0 - team1) after each point
  const setBoundaries = []; // point index where each set ends
  let lastSetSeen = 0;

  pts.forEach((pt, i) => {
    if (pt.setIdx !== lastSetSeen && i > 0) {
      setBoundaries.push(i);
      lastSetSeen = pt.setIdx;
    }
    const w = pt.w;
    const l = 1 - w;
    T[w].ptsWon++;

    curPtStreak[w]++;
    curPtStreak[l] = 0;
    if (curPtStreak[w] > T[w].maxPtStreak) T[w].maxPtStreak = curPtStreak[w];

    momentum.push(momentum[momentum.length - 1] + (w === 0 ? 1 : -1));

    const stTeam = pt.srvTeam;
    const rtTeam = 1 - stTeam;
    const pKeySrv = `${stTeam}_${pt.srvPlayer}`;
    const pSrv = P[pKeySrv];

    T[stTeam].srvPtsTotal++;
    T[rtTeam].retPtsTotal++;
    if (pSrv) pSrv.srvPtsTotal++;

    if (pt.doubleFault) {
      T[stTeam].doubleFaults++;
      if (pSrv) pSrv.doubleFaults++;
    } else if (pt.firstServeIn) {
      T[stTeam].firstServeIn++;
      if (pSrv) pSrv.firstServeIn++;
    }

    if (w === stTeam) {
      T[stTeam].srvPtsWon++;
      if (pSrv) pSrv.srvPtsWon++;
    } else {
      T[rtTeam].retPtsWon++;
    }

    // Shot attribution
    if (pt.shotType === 'winner') {
      const bt = pt.byPlayer ? pt.byPlayer[0] : w;
      const bp = pt.byPlayer ? pt.byPlayer[1] : 0;
      T[bt].winners++;
      const pk = `${bt}_${bp}`;
      const sub = (pt.subType && ['smash','volea','bandeja','bajada','dejada','passing','globo'].includes(pt.subType))
        ? pt.subType
        : (pt.subType === 'winner' ? 'otro' : (pt.subType || 'otro'));
      T[bt].shots[sub] = (T[bt].shots[sub] || 0) + 1;
      if (P[pk]) {
        P[pk].winners++;
        P[pk].shots[sub] = (P[pk].shots[sub] || 0) + 1;
      }
    } else if (pt.shotType === 'ue') {
      const bt = pt.byPlayer ? pt.byPlayer[0] : l;
      const bp = pt.byPlayer ? pt.byPlayer[1] : 0;
      T[bt].ue++;
      const pk = `${bt}_${bp}`;
      if (P[pk]) P[pk].ue++;
    } else if (pt.shotType === 'fe') {
      const bt = pt.byPlayer ? pt.byPlayer[0] : l;
      const bp = pt.byPlayer ? pt.byPlayer[1] : 0;
      T[bt].fe++;
      const pk = `${bt}_${bp}`;
      if (P[pk]) P[pk].fe++;
    } else if (pt.shotType === 'df') {
      T[stTeam].ue++;
      if (pSrv) pSrv.ue++;
    }

    // Break points
    if (pt.isBP) {
      T[rtTeam].bpTotal++;
      T[stTeam].bpFaced++;
      if (w === rtTeam) T[rtTeam].bpWon++;
      else T[stTeam].bpSaved++;
    }

    // Golden points / Star points
    if (pt.isGP) {
      T[0].gpTotal++;
      T[1].gpTotal++;
      T[w].gpWon++;
      T[stTeam].gpSrvTotal++;
      T[rtTeam].gpRetTotal++;
      if (w === stTeam) T[stTeam].gpSrvWon++;
      else T[rtTeam].gpRetWon++;
    }

    // Key points (break points + points from 30-30 onwards)
    if (pt.isKey) {
      T[0].keyTotal++;
      T[1].keyTotal++;
      T[w].keyWon++;
    }
  });

  // Games stats
  let curGStreak = [0,0];
  games.forEach(g => {
    const gw = g.winner;
    const gl = 1 - gw;
    T[gw].gamesWon++;
    curGStreak[gw]++;
    curGStreak[gl] = 0;
    if (curGStreak[gw] > T[gw].maxGameStreak) T[gw].maxGameStreak = curGStreak[gw];

    if (!g.isTB) {
      const stTeam = g.srvTeam;
      T[stTeam].srvGamesTotal++;
      const pk = `${stTeam}_${g.srvPlayer}`;
      if (P[pk]) P[pk].srvGamesTotal++;
      if (gw === stTeam) {
        T[stTeam].srvGamesWon++;
        if (P[pk]) P[pk].srvGamesWon++;
      }
    }
  });

  // Generate automated narrative analysis (just like the reference PDF)
  const insights = [];
  const name0 = teamLabel(m, 0);
  const name1 = teamLabel(m, 1);
  const totalPts = T[0].ptsWon + T[1].ptsWon;

  if (totalPts > 0) {
    // 1. Breaks difference
    if (T[0].bpTotal + T[1].bpTotal > 0) {
      const wSide = T[1].bpWon > T[0].bpWon ? 1 : 0;
      const oSide = 1 - wSide;
      const wName = wSide === 0 ? name0 : name1;
      const oName = oSide === 0 ? name0 : name1;
      insights.push(`Los breaks marcaron la diferencia: ${wName} convirtió ${T[wSide].bpWon} de ${T[wSide].bpTotal}, ${oName} ${T[oSide].bpWon} de ${T[oSide].bpTotal}.`);
    }
    // 2. Break points saved
    const bestSaver = T[1].bpSaved >= T[0].bpSaved ? 1 : 0;
    if (T[bestSaver].bpFaced >= 2 && T[bestSaver].bpSaved > 0) {
      insights.push(`${bestSaver === 0 ? name0 : name1} salvó ${T[bestSaver].bpSaved} de ${T[bestSaver].bpFaced} bolas de break.`);
    }
    // 3. Points difference
    const diff = Math.abs(T[0].ptsWon - T[1].ptsWon);
    if (diff === 0) {
      insights.push(`Máxima igualdad: empate exacto a ${T[0].ptsWon} puntos ganados por pareja.`);
    } else if (diff <= 6) {
      insights.push(`Solo ${diff} ${diff === 1 ? 'punto' : 'puntos'} de diferencia en todo el partido.`);
    } else {
      const dom = T[0].ptsWon > T[1].ptsWon ? name0 : name1;
      insights.push(`${dom} dominó el global con +${diff} puntos de ventaja (${T[0].ptsWon} a ${T[1].ptsWon}).`);
    }
    // 4. Golden points / Star points (40-40)
    if (T[0].gpTotal > 0) {
      const gpLeader = T[1].gpWon >= T[0].gpWon ? 1 : 0;
      const lbl = m.rules.deuceRule === 'star' ? 'Star Points (tras 2 ventajas)' : 'Puntos decisivos con 40-40';
      insights.push(`${lbl}: ${gpLeader === 0 ? name0 : name1} ganó ${T[gpLeader].gpWon} de ${T[gpLeader].gpTotal}.`);
    }
    // 5. Most winners individual & specific shot highlights
    const pArr = Object.values(P);
    pArr.sort((a,b) => b.winners - a.winners);
    if (pArr[0] && pArr[0].winners > 0) {
      insights.push(`${pArr[0].name} hizo más ganadores que nadie: ${pArr[0].winners}.`);
    }
    pArr.forEach(pl => {
      const best = Object.entries(pl.shots || {})
        .filter(([k, v]) => v >= 2 && k !== 'otro')
        .sort((a, b) => b[1] - a[1])[0];
      if (best) {
        const labels = { smash: 'smash / remates', volea: 'voleas ganadoras', bandeja: 'bandejas', bajada: 'bajadas de pared', dejada: 'dejadas', passing: 'passings', globo: 'globos ganadores' };
        insights.push(`${pl.name} se destacó en ataque con ${best[1]} ${labels[best[0]] || best[0]}.`);
      }
    });
    // 6. Best streak
    const strkLeader = T[1].maxPtStreak >= T[0].maxPtStreak ? 1 : 0;
    if (T[strkLeader].maxPtStreak >= 3) {
      insights.push(`Mejor racha del partido: ${T[strkLeader].maxPtStreak} puntos seguidos para ${strkLeader === 0 ? name0 : name1}.`);
    }
  }

  return { st, T, P: Object.values(P), pts, games, momentum, setBoundaries, insights, totalPts };
}

// ==================== AUDIO, VOICE, VIBRATION & WAKE LOCK ====================
let audioCtx = null;
function playTone(kind) {
  if (!prefs.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const notes = {
      point: [[880, 0, 0.06]],
      undo: [[520, 0, 0.05], [380, 0.06, 0.07]],
      fault: [[320, 0, 0.11]],
      game: [[660, 0, 0.08], [880, 0.09, 0.14]],
      set: [[587, 0, 0.09], [784, 0.1, 0.09], [1046, 0.2, 0.18]],
      match: [[523, 0, 0.1], [659, 0.11, 0.1], [784, 0.22, 0.1], [1046, 0.33, 0.26]]
    }[kind] || [[880, 0, 0.06]];

    notes.forEach(([freq, delay, dur]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + delay);
      gain.gain.setValueAtTime(0.18, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + dur + 0.01);
    });
  } catch {}
}

function vibrate(pattern) {
  if (prefs.vibrate && navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch {}
  }
}

function speakScore(m, st) {
  if (!prefs.voice || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    let text = '';
    if (st.lastTransition) {
      const tr = st.lastTransition;
      const wName = teamLabel(m, tr.winner).replace(/·/g, ' y ');
      if (tr.type === 'match') {
        text = `Juego, set y partido para ${wName}.`;
      } else if (tr.type === 'set') {
        const s = st.sets[tr.setIdx];
        text = `Juego y set ${wName}, ${s.games[0]} a ${s.games[1]}.${tr.changeover ? ' Cambio de lado.' : ''}`;
      } else if (tr.type === 'game') {
        const g = st.curSet.games;
        text = `${tr.wasBreak ? 'Break y juego' : 'Juego'} para ${wName}. ${g[0]} a ${g[1]}.${tr.changeover ? ' Cambio de lado.' : ''}`;
      } else if (tr.type === 'tb_changeover') {
        text = `${st.p[0]} a ${st.p[1]}. Cambio de lado.`;
      }
    } else if (st.isTB) {
      const srv = st.srvTeam;
      const a = st.p[srv], b = st.p[1 - srv];
      text = a === b ? `${a} iguales` : `${a} a ${b}, saca ${playerLabel(m, st.srvTeam, st.srvPlayer)}`;
    } else {
      const srv = st.srvTeam;
      const dS = st.pointDisplay[srv], dR = st.pointDisplay[1 - srv];
      const word = v => ({'0':'cero','15':'quince','30':'treinta','40':'cuarenta','40 ★':'cuarenta'}[v] || v);
      if (st.isStar) {
        text = 'Cuarenta iguales. Star Point, punto decisivo.';
      } else if (st.isGP) {
        text = 'Cuarenta iguales. Punto de oro.';
      } else if (dS.startsWith('40') && dR.startsWith('40')) {
        text = (m.rules.deuceRule === 'star' && st.curDeuceCount === 2)
          ? 'Iguales. Segunda ventaja.'
          : 'Iguales.';
      } else if (dS === 'AD') {
        const vTxt = (m.rules.deuceRule === 'star' && st.curAdvNumber === 2) ? 'Segunda ventaja' : 'Ventaja';
        text = `${vTxt} al saque, ${teamLabel(m, srv).replace(/·/g, ' y ')}.`;
      } else if (dR === 'AD') {
        const vTxt = (m.rules.deuceRule === 'star' && st.curAdvNumber === 2) ? 'Segunda ventaja' : 'Ventaja';
        text = `${vTxt} al resto, ${teamLabel(m, 1 - srv).replace(/·/g, ' y ')}.`;
      } else if (dS === dR) {
        text = `${word(dS)} iguales.`;
      } else {
        text = `${word(dS)}, ${word(dR)}.`;
      }
      if (st.mp[0] || st.mp[1]) text += ' Punto de partido.';
      else if (st.sp[0] || st.sp[1]) text += ' Punto de set.';
      else if (st.isBP && !st.isGP) text += ' Bola de break.';
    }
    if (text) {
      isSpeakingTTS = true;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-ES';
      u.rate = 1.05;
      const resumeMic = () => {
        setTimeout(() => { isSpeakingTTS = false; }, 280);
      };
      u.onend = resumeMic;
      u.onerror = resumeMic;
      setTimeout(resumeMic, 2800);
      window.speechSynthesis.speak(u);
    }
  } catch {}
}

// Wake Lock
let wakeLockSentinel = null;
async function updateWakeLock() {
  const isPlayingLocal = (ui.route === 'board' || ui.route === 'display') && activeMatch && activeMatch.status === 'playing';
  const isPlayingRemote = (ui.route === 'live') && ui.liveMatch && ui.liveMatch.status === 'playing';
  const want = prefs.wakeLock && (isPlayingLocal || isPlayingRemote);
  if (!('wakeLock' in navigator)) return;
  try {
    if (want && !wakeLockSentinel) {
      wakeLockSentinel = await navigator.wakeLock.request('screen');
      wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
    } else if (!want && wakeLockSentinel) {
      await wakeLockSentinel.release();
      wakeLockSentinel = null;
    }
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') updateWakeLock();
});

// Hands-Free Speech Recognition
let speechRec = null;
let isSpeakingTTS = false;
let speechBlocked = false;
let interimTimer = null;
let lastInterimText = '';
let lastProcessedAt = 0;
let lastProcessedCmd = '';

function isInAppWebView() {
  return /Instagram|FBAN|FBAV|Line\/|MicroMessenger/i.test(navigator.userAgent || '');
}

function dispatchRecognizedSpeech(text) {
  const clean = normVoiceStr(text);
  if (!clean) return;
  const now = Date.now();
  // Deduplicate if both interim fallback and isFinal fire for the same phrase within 1.4s
  if (clean === lastProcessedCmd && (now - lastProcessedAt) < 1400) return;
  lastProcessedCmd = clean;
  lastProcessedAt = now;
  clearTimeout(interimTimer);
  lastInterimText = '';
  handleVoiceCommand(text);
}

function startSpeechSession() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || !ui.voiceListening || ui.route !== 'board') return;
  try {
    if (!speechRec) {
      speechRec = new SR();
      speechRec.lang = 'es-AR';
      speechRec.continuous = true;
      speechRec.interimResults = true;
      speechRec.maxAlternatives = 3;

      speechRec.onresult = (ev) => {
        if (!activeMatch || ui.route !== 'board' || isSpeakingTTS) return;
        const last = ev.results[ev.results.length - 1];
        if (!last) return;
        const combined = Array.from(last).map(a => a.transcript).join(' ').trim();
        if (!combined) return;

        if (last.isFinal) {
          dispatchRecognizedSpeech(combined);
        } else {
          lastInterimText = combined;
          clearTimeout(interimTimer);
          interimTimer = setTimeout(() => {
            if (lastInterimText) {
              const txt = lastInterimText;
              lastInterimText = '';
              dispatchRecognizedSpeech(txt);
            }
          }, 700);
        }
      };

      speechRec.onerror = (ev) => {
        const err = ev && ev.error ? ev.error : '';
        if (err === 'not-allowed' || err === 'service-not-allowed') {
          speechBlocked = true;
          ui.voiceListening = false;
          render();
          showToast('Permiso de micrófono bloqueado en el navegador');
        }
      };

      speechRec.onend = () => {
        if (lastInterimText && !isSpeakingTTS) {
          const txt = lastInterimText;
          lastInterimText = '';
          dispatchRecognizedSpeech(txt);
        }
        if (ui.voiceListening && !speechBlocked && ui.route === 'board') {
          setTimeout(() => {
            if (ui.voiceListening && !speechBlocked && ui.route === 'board') {
              try { speechRec.start(); } catch {}
            }
          }, 350);
        } else if (!ui.voiceListening || speechBlocked) {
          ui.voiceListening = false;
          render();
        }
      };
    }

    try { speechRec.start(); } catch {}
  } catch {
    ui.voiceListening = false;
    render();
    showToast('No se pudo iniciar el micrófono');
  }
}

function toggleVoiceControl() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showToast('Tu navegador no soporta control por voz');
    return;
  }
  if (ui.voiceListening) {
    ui.voiceListening = false;
    speechBlocked = false;
    clearTimeout(interimTimer);
    lastInterimText = '';
    if (speechRec) {
      try { speechRec.stop(); } catch {}
    }
    showToast('Control por voz desactivado');
    render();
    return;
  }

  if (isInAppWebView() && /Android/i.test(navigator.userAgent || '')) {
    showToast('Tip: tocá ••• → "Abrir en Chrome" para mejor reconocimiento de voz');
  }

  speechBlocked = false;
  ui.voiceListening = true;
  render();
  showToast('🎤 Micrófono activo');
  startSpeechSession();
}

function normVoiceStr(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}

function findPlayerInCommand(cmd, m) {
  const c = normVoiceStr(cmd);
  if (!c) return null;

  // 0. Explicit "jugador 1..4" / "jugador uno..cuatro"
  if (/\bjugador\s*(1|uno)\b/.test(c)) return { team: 0, playerIdx: 0, name: playerLabel(m, 0, 0) };
  if (/\bjugador\s*(2|dos)\b/.test(c)) return { team: 0, playerIdx: 1, name: playerLabel(m, 0, 1) };
  if (/\bjugador\s*(3|tres)\b/.test(c)) return { team: 1, playerIdx: 0, name: playerLabel(m, 1, 0) };
  if (/\bjugador\s*(4|cuatro)\b/.test(c)) return { team: 1, playerIdx: 1, name: playerLabel(m, 1, 1) };

  const words = c.split(/\s+/);
  // 1. Exact full name or exact token match (3+ chars, excluding generic "jugador")
  for (let t = 0; t < 2; t++) {
    for (let pi = 0; pi < 2; pi++) {
      const raw = m.teams[t].players[pi] || '';
      const fn = normVoiceStr(raw);
      if (!fn) continue;
      if (c.includes(fn)) return { team: t, playerIdx: pi, name: playerLabel(m, t, pi) };
      const parts = fn.split(/\s+/).filter(w => w.length >= 3 && w !== 'jugador');
      for (const part of parts) {
        if (words.includes(part) || c.includes(part)) {
          return { team: t, playerIdx: pi, name: playerLabel(m, t, pi) };
        }
      }
    }
  }
  // 2. Prefix match (4+ chars, e.g., "mati" in "matias", excluding "jugador")
  for (let t = 0; t < 2; t++) {
    for (let pi = 0; pi < 2; pi++) {
      const raw = m.teams[t].players[pi] || '';
      const first = normVoiceStr(raw).split(/\s+/)[0] || '';
      if (first.length >= 4 && first !== 'jugador') {
        const pref = first.slice(0, 4);
        if (words.some(w => w.startsWith(pref))) {
          return { team: t, playerIdx: pi, name: playerLabel(m, t, pi) };
        }
      }
    }
  }
  return null;
}

function findTeamInCommand(cmd, m) {
  const c = normVoiceStr(cmd);
  const c0 = normVoiceStr(COLORS.find(x => x.c === m.teams[0].color)?.n || 'dorado');
  const c1 = normVoiceStr(COLORS.find(x => x.c === m.teams[1].color)?.n || 'azul');
  const isGold0 = m.teams[0].color === '#d4af37' && (c.includes('oro') || c.includes('amarillo'));
  const isGold1 = m.teams[1].color === '#d4af37' && (c.includes('oro') || c.includes('amarillo'));
  if (c.includes(c0) || isGold0 || c.includes('pareja 1') || c.includes('pareja uno') || c.includes('equipo 1') || c.includes('equipo uno') || c.includes('izquierda') || c.includes('arriba') || c.includes('nosotros')) return 0;
  if (c.includes(c1) || isGold1 || c.includes('pareja 2') || c.includes('pareja dos') || c.includes('equipo 2') || c.includes('equipo dos') || c.includes('derecha') || c.includes('abajo') || c.includes('ellos')) return 1;
  return null;
}

function setServerToPlayer(targetTeam, targetPlayer) {
  if (!activeMatch) return;
  const st = computeMatch(activeMatch);
  const rotIdx = st.totalGamesPlayed % 4;
  if (rotIdx % 2 === 0) {
    const pA1 = (rotIdx === 0) ? targetPlayer : (1 - targetPlayer);
    activeMatch.firstServer = [targetTeam, pA1];
  } else {
    const prevP = activeMatch.firstServer ? activeMatch.firstServer[1] : 0;
    activeMatch.firstServer = [1 - targetTeam, prevP];
    const pB1 = (rotIdx === 1) ? targetPlayer : (1 - targetPlayer);
    activeMatch.secondServerIdx = pB1;
  }
  ui.secondSrvPrompt = false;
  persistActive();
  render();
  showToast(`🎤 Al saque: ${playerLabel(activeMatch, targetTeam, targetPlayer)}`);
}

function handleVoiceCommand(rawCmd) {
  if (!activeMatch) return;
  const cmd = normVoiceStr(rawCmd);
  if (!cmd) return;

  // 1. History & modal navigation commands
  if (cmd.includes('deshacer') || cmd.includes('atras') || cmd.includes('corregir')) { undoPoint(); showToast('🎤 Punto deshecho'); return; }
  if (cmd.includes('rehacer')) { redoPoint(); showToast('🎤 Punto rehecho'); return; }
  if (cmd.includes('cancelar') || cmd.includes('cerrar')) {
    if (ui.shotSheet || ui.menuOpen || ui.changeoverOverlay) {
      ui.shotSheet = null; ui.menuOpen = false; ui.changeoverOverlay = null;
      render();
      return;
    }
  }
  if (ui.changeoverOverlay && (cmd.includes('continuar') || cmd.includes('reanudar') || cmd.includes('listo'))) {
    ui.changeoverOverlay = null;
    render();
    return;
  }
  if (cmd.includes('cambio de lado') || cmd.includes('cambiar de lado') || cmd.includes('cambiar lado') || cmd === 'lado' || cmd === 'lados') {
    flipSides();
    showToast('🎤 Lados cambiados');
    return;
  }

  // 2. Serve faults (check before generic "saque" command)
  const st = computeMatch(activeMatch);
  if (cmd.includes('doble falta')) {
    activeMatch.pendingFault = false;
    showToast(`🎤 Doble falta de ${playerLabel(activeMatch, st.srvTeam, st.srvPlayer)}`);
    scorePoint(1 - st.srvTeam, 'df', [st.srvTeam, st.srvPlayer]);
    return;
  }
  if (cmd.includes('falta') || cmd.includes('segundo saque')) {
    recordFault();
    return;
  }

  // 3. Choosing 2nd server modal OR explicit serve assignment ("saca [nombre]", "al saque [nombre]", "siguiente al saque [nombre]")
  const isServeAssignCmd = /\b(saca|saque|sirve|sacador|servir)\b/.test(cmd);
  if (ui.secondSrvPrompt || isServeAssignCmd) {
    const pl = findPlayerInCommand(cmd, activeMatch);
    if (ui.secondSrvPrompt) {
      const tB = 1 - activeMatch.firstServer[0];
      if (pl && pl.team === tB) {
        activeMatch.secondServerIdx = pl.playerIdx;
        ui.secondSrvPrompt = false;
        persistActive();
        render();
        showToast(`🎤 Al saque: ${pl.name}`);
        return;
      }
      if (pl) {
        setServerToPlayer(pl.team, pl.playerIdx);
        return;
      }
      if (cmd.includes('uno') || cmd.includes('primer')) {
        activeMatch.secondServerIdx = 0;
        ui.secondSrvPrompt = false;
        persistActive();
        render();
        showToast(`🎤 Al saque: ${playerLabel(activeMatch, tB, 0)}`);
        return;
      }
      if (cmd.includes('dos') || cmd.includes('segund')) {
        activeMatch.secondServerIdx = 1;
        ui.secondSrvPrompt = false;
        persistActive();
        render();
        showToast(`🎤 Al saque: ${playerLabel(activeMatch, tB, 1)}`);
        return;
      }
      return;
    }

    // Explicit serve assignment command outside the prompt
    if (pl) {
      const isNextKeyword = cmd.includes('siguiente') || cmd.includes('proximo') || cmd.includes('despues');
      if (isNextKeyword && pl.team === (1 - activeMatch.firstServer[0]) && st.totalGamesPlayed === 0) {
        activeMatch.secondServerIdx = pl.playerIdx;
        persistActive();
        render();
        showToast(`🎤 Próximo saque (${teamLabel(activeMatch, pl.team)}): ${pl.name}`);
        return;
      }
      setServerToPlayer(pl.team, pl.playerIdx);
      return;
    }
    // Generic "cambiar sacador" / "siguiente sacador"
    const nextPi = 1 - st.srvPlayer;
    setServerToPlayer(st.srvTeam, nextPi);
    return;
  }

  // 4. Detect detailed shot type: Unforced Error (ue), Forced Error (fe), or Winner (winner)
  const isUE = cmd.includes('no forzado') || cmd.includes('error no') || cmd.includes('fallo') || cmd.includes('afuera') || cmd.includes('a la red') || cmd.includes('en la red') || cmd.includes('al cristal') || cmd.includes('a la reja') || (cmd.includes('error') && !cmd.includes('forzado'));
  const isFE = !isUE && cmd.includes('forzado');
  const isWinner = !isUE && !isFE && (cmd.includes('winner') || cmd.includes('ganador') || cmd.includes('smash') || cmd.includes('remate') || cmd.includes('por tres') || cmd.includes('por 3') || cmd.includes('por cuatro') || cmd.includes('por 4') || cmd.includes('bajada') || cmd.includes('volea') || cmd.includes('bandeja') || cmd.includes('vibora') || cmd.includes('dejada') || cmd.includes('chiquita') || cmd.includes('passing') || cmd.includes('globo'));

  function detectSpecificWinnerShot(str) {
    if (str.includes('smash') || str.includes('remate') || str.includes('por tres') || str.includes('por 3') || str.includes('por cuatro') || str.includes('por 4')) return 'smash';
    if (str.includes('volea')) return 'volea';
    if (str.includes('bandeja') || str.includes('vibora') || str.includes('víbora')) return 'bandeja';
    if (str.includes('bajada')) return 'bajada';
    if (str.includes('dejada') || str.includes('chiquita')) return 'dejada';
    if (str.includes('passing') || str.includes('paralelo')) return 'passing';
    if (str.includes('globo')) return 'globo';
    return 'winner';
  }
  const SHOT_NAMES = { smash:'Smash', volea:'Volea', bandeja:'Bandeja', bajada:'Bajada de pared', dejada:'Dejada', passing:'Passing', globo:'Globo', winner:'Winner' };

  if (isUE || isFE) {
    const sType = isUE ? 'ue' : 'fe';
    const sLabel = isUE ? 'Error no forzado' : 'Error forzado';
    // Look for player mentioned after "error"/"forzado"/"fallo" first (handles "Punto Mati por error no forzado de Fabián")
    const errMatch = cmd.match(/(?:no forzado|forzado|error|fallo|red|cristal|reja|afuera)(.*)$/);
    const plAfter = errMatch && errMatch[1] ? findPlayerInCommand(errMatch[1], activeMatch) : null;
    const pl = plAfter || findPlayerInCommand(cmd, activeMatch);

    if (pl) {
      const winTeam = 1 - pl.team;
      showToast(`🎤 ${sLabel} de ${pl.name} → Punto ${teamLabel(activeMatch, winTeam)}`);
      scorePoint(winTeam, sType, [pl.team, pl.playerIdx]);
      return;
    }
    if (ui.shotSheet) {
      const w = ui.shotSheet.team;
      const l = 1 - w;
      const pi = (cmd.includes('dos') || cmd.includes('segund')) ? 1 : 0;
      const errName = playerLabel(activeMatch, l, pi);
      showToast(`🎤 ${sLabel} de ${errName}`);
      scorePoint(w, sType, [l, pi]);
      return;
    }
    const tmErr = findTeamInCommand(cmd, activeMatch);
    if (tmErr !== null) {
      const winTeam = 1 - tmErr;
      showToast(`🎤 ${sLabel} de ${teamLabel(activeMatch, tmErr)} → Punto ${teamLabel(activeMatch, winTeam)}`);
      scorePoint(winTeam, sType, [tmErr, 0]);
      return;
    }
    showToast(`🎤 Decí el jugador: "${sLabel.toLowerCase()} de [nombre]"`);
    return;
  }

  if (isWinner) {
    const subShot = detectSpecificWinnerShot(cmd);
    const subLabel = SHOT_NAMES[subShot] || 'Winner';
    const winMatch = cmd.match(/(?:winner|ganador|smash|remate|volea|bandeja|vibora|bajada|dejada|chiquita|passing|globo)(.*)$/);
    const plAfter = winMatch && winMatch[1] ? findPlayerInCommand(winMatch[1], activeMatch) : null;
    const pl = plAfter || findPlayerInCommand(cmd, activeMatch);
    if (pl) {
      showToast(`🎤 ${subLabel} de ${pl.name}`);
      scorePoint(pl.team, 'winner', [pl.team, pl.playerIdx], subShot);
      return;
    }
    if (ui.shotSheet) {
      const w = ui.shotSheet.team;
      const pi = (cmd.includes('dos') || cmd.includes('segund')) ? 1 : 0;
      const wName = playerLabel(activeMatch, w, pi);
      showToast(`🎤 ${subLabel} de ${wName}`);
      scorePoint(w, 'winner', [w, pi], subShot);
      return;
    }
    const tmWin = findTeamInCommand(cmd, activeMatch);
    if (tmWin !== null) {
      showToast(`🎤 ${subLabel} de ${teamLabel(activeMatch, tmWin)}`);
      scorePoint(tmWin, 'winner', [tmWin, 0], subShot);
      return;
    }
  }

  // 5. If shot attribution modal is open and user says a player name or "punto rápido"
  if (ui.shotSheet) {
    const w = ui.shotSheet.team;
    if (cmd.includes('rapido') || cmd.includes('sin detalle') || cmd.includes('normal')) {
      scorePoint(w, 'pt', null);
      return;
    }
    const pl = findPlayerInCommand(cmd, activeMatch);
    if (pl) {
      if (pl.team === w) {
        const subShot = detectSpecificWinnerShot(cmd);
        const subLabel = SHOT_NAMES[subShot] || 'Winner';
        showToast(`🎤 ${subLabel} de ${pl.name}`);
        scorePoint(w, 'winner', [w, pl.playerIdx], subShot);
      } else {
        showToast(`🎤 Error no forzado de ${pl.name}`);
        scorePoint(w, 'ue', [pl.team, pl.playerIdx]);
      }
      return;
    }
  }

  // 6. Player name said directly -> Winner for that player (populates player stats!)
  const plDirect = findPlayerInCommand(cmd, activeMatch);
  if (plDirect) {
    showToast(`🎤 Punto (Winner) de ${plDirect.name}`);
    scorePoint(plDirect.team, 'winner', [plDirect.team, plDirect.playerIdx]);
    return;
  }

  // 7. Team color / number / side said directly -> Quick point for that team
  const tmDirect = findTeamInCommand(cmd, activeMatch);
  if (tmDirect !== null) {
    showToast(`🎤 Punto ${teamLabel(activeMatch, tmDirect)}`);
    scorePoint(tmDirect, 'pt', null);
    return;
  }
  if (cmd.includes('uno')) { scorePoint(0, 'pt', null); return; }
  if (cmd.includes('dos')) { scorePoint(1, 'pt', null); return; }
  showToast(`🎤 Escuché: "${rawCmd.trim()}"`);
}

// ==================== TIMERS (MATCH CLOCK & CHANGEOVER) ====================
let lastTickAt = Date.now();
setInterval(() => {
  const now = Date.now();
  const dt = Math.min(2500, Math.max(0, now - lastTickAt));
  lastTickAt = now;

  if (activeMatch && activeMatch.status === 'playing' && ui.route === 'board' && !ui.changeoverOverlay) {
    activeMatch.durationMs = (activeMatch.durationMs || 0) + dt;
    const clkEl = document.getElementById('sb-clock-val');
    if (clkEl) clkEl.textContent = fmtClock(activeMatch.durationMs);
  } else if (ui.route === 'live' && ui.liveMatch && ui.liveMatch.status === 'playing') {
    ui.liveMatch.durationMs = (ui.liveMatch.durationMs || 0) + dt;
    const clkEl = document.getElementById('sb-clock-val');
    if (clkEl) clkEl.textContent = fmtClock(ui.liveMatch.durationMs);
  }

  if (ui.changeoverOverlay && ui.changeoverOverlay.secondsLeft > 0) {
    ui.changeoverOverlay.secondsLeft = Math.max(0, ui.changeoverOverlay.secondsLeft - 1);
    const cdEl = document.getElementById('co-countdown');
    if (cdEl) cdEl.textContent = `${ui.changeoverOverlay.secondsLeft}s`;
    if (ui.changeoverOverlay.secondsLeft === 0) {
      playTone('game');
      vibrate([120, 80, 120]);
    }
  }
}, 1000);

function fmtClock(ms) {
  const totalSec = Math.floor((ms || 0) / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function fmtDurationLong(ms) {
  const min = Math.max(1, Math.round((ms || 0) / 60000));
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h > 0 ? `${h} h ${String(m).padStart(2,'0')}'` : `${m} min`;
}
function fmtDateLong(ts) {
  try {
    const d = new Date(ts);
    const dateStr = d.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    const timeStr = d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', hour12:false});
    return `${dateStr} · ${timeStr}`;
  } catch { return ''; }
}

// ==================== TOAST HELPER ====================
let toastTimer = null;
function showToast(msg) {
  let el = document.getElementById('live-toast');
  if (el) el.remove();
  el = document.createElement('div');
  el.id = 'live-toast';
  el.className = 'toast';

// ==================== MATCH ACTIONS ====================
function onTapTeam(team) {
  if (!activeMatch || activeMatch.status !== 'playing') return;
  const st = computeMatch(activeMatch);
  if (st.matchWinner !== null) return;
  if (activeMatch.shotPrompt) {
    ui.shotSheet = { team };
    render();
  } else {
    scorePoint(team, 'pt', null);
  }
}

function scorePoint(team, shotType = 'pt', byPlayer = null, subType = null) {
  if (!activeMatch) return;
  const stBefore = computeMatch(activeMatch);
  if (stBefore.matchWinner !== null) return;

  const fs = !activeMatch.pendingFault;
  activeMatch.pendingFault = false;
  activeMatch.redoStack = [];
  activeMatch.events.push({
    w: team,
    type: shotType,
    by: byPlayer,
    fs,
    sub: subType || null
  });
  ui.shotSheet = null;

  const stAfter = computeMatch(activeMatch);
  const tr = stAfter.lastTransition;

  if (tr) {
    if (tr.type === 'match') {
      activeMatch.status = 'finished';
      ui.matchEndDismissed = false;
      archiveMatchToHistory(activeMatch);
      playTone('match');
      vibrate([100, 60, 100, 60, 220]);
    } else if (tr.type === 'set') {
      playTone('set');
      vibrate([90, 50, 140]);
      const setG = stAfter.sets[tr.setIdx].games;
      if (tr.changeover) activeMatch.flipped = !activeMatch.flipped;
      if (prefs.changeoverAlerts) {
        ui.changeoverOverlay = {
          title: tr.changeover ? `FIN DEL SET ${tr.setIdx + 1} · CAMBIO DE LADO` : `FIN DEL SET ${tr.setIdx + 1}`,
          sub: `${teamLabel(activeMatch, tr.winner)} ganó el set ${setG[0]}-${setG[1]}`,
          secondsLeft: 120
        };
      }
    } else if (tr.type === 'game') {
      playTone('game');
      vibrate([80, 50, 80]);
      if (tr.changeover) {
        activeMatch.flipped = !activeMatch.flipped;
        if (prefs.changeoverAlerts) {
          const g = stAfter.curSet.games;
          ui.changeoverOverlay = {
            title: 'CAMBIO DE LADO',
            sub: `Marcador del set: ${g[0]} - ${g[1]}`,
            secondsLeft: Number(prefs.changeoverTimer) || 90
          };
        }
      }
      if (tr.needSecondServerPrompt) {
        ui.secondSrvPrompt = true;
      }
    } else if (tr.type === 'tb_changeover') {
      playTone('game');
      vibrate([70, 50, 70]);
      activeMatch.flipped = !activeMatch.flipped;
      if (prefs.changeoverAlerts) {
        ui.changeoverOverlay = {
          title: 'CAMBIO DE LADO (TIE-BREAK)',
          sub: `Tie-break: ${tr.tbScore[0]} - ${tr.tbScore[1]}`,
          secondsLeft: 20
        };
      }
    }
  } else {
    playTone('point');
    vibrate(35);
  }

  persistActive();
  render();
  speakScore(activeMatch, stAfter);

  // Visual flash on scored half
  requestAnimationFrame(() => {
    const halfEl = document.querySelector(`.half[data-team="${team}"]`);
    if (halfEl) {
      halfEl.classList.add('flash');
      setTimeout(() => halfEl.classList.remove('flash'), 550);
    }
  });
}

function recordFault() {
  if (!activeMatch || activeMatch.status !== 'playing') return;
  const st = computeMatch(activeMatch);
  if (st.matchWinner !== null) return;

  if (!activeMatch.pendingFault) {
    activeMatch.pendingFault = true;
    playTone('fault');
    vibrate(45);
    showToast(`2º saque · ${playerLabel(activeMatch, st.srvTeam, st.srvPlayer)}`);
    persistActive();
    render();
  } else {
    // Double fault -> point to receiver, UE attributed to server
    const srvTeam = st.srvTeam;
    const srvPlayer = st.srvPlayer;
    activeMatch.pendingFault = false;
    showToast(`Doble falta de ${playerLabel(activeMatch, srvTeam, srvPlayer)}`);
    scorePoint(1 - srvTeam, 'df', [srvTeam, srvPlayer]);
  }
}

function undoPoint() {
  if (!activeMatch) return;
  if (activeMatch.pendingFault) {
    activeMatch.pendingFault = false;
    playTone('undo');
    persistActive();
    render();
    return;
  }
  if (!activeMatch.events.length) return;
  const ev = activeMatch.events.pop();
  activeMatch.redoStack = activeMatch.redoStack || [];
  activeMatch.redoStack.push(ev);
  if (activeMatch.status === 'finished') activeMatch.status = 'playing';
  ui.changeoverOverlay = null;
  ui.secondSrvPrompt = false;
  playTone('undo');
  vibrate(30);
  persistActive();
  render();
}

function redoPoint() {
  if (!activeMatch || !activeMatch.redoStack || !activeMatch.redoStack.length) return;
  const ev = activeMatch.redoStack.pop();
  activeMatch.events.push(ev);
  const stAfter = computeMatch(activeMatch);
  if (stAfter.matchWinner !== null) {
    activeMatch.status = 'finished';
    archiveMatchToHistory(activeMatch);
  }
  playTone('point');
  persistActive();
  render();
}

function flipSides() {
  if (!activeMatch) return;
  activeMatch.flipped = !activeMatch.flipped;
  persistActive();
  render();
}

function finishMatchEarly() {
  if (!activeMatch) return;
  const st = computeMatch(activeMatch);
  activeMatch.status = st.matchWinner !== null ? 'finished' : 'abandoned';
  archiveMatchToHistory(activeMatch);
  publishLiveMatchState(activeMatch, true);
  const finishedId = activeMatch.id;
  activeMatch = null;
  persistActive();
  ui.menuOpen = false;
  ui.statsId = finishedId;
  ui.statsSetFilter = 'all';
  navigate('stats');
  showToast('Partido guardado en el historial');
}

function startNewMatch() {
  activeMatch = createMatchFromPreset(preset);
  saveJSON(LS_PRESET, preset);
  persistActive();
  ui.shotSheet = null;
  ui.changeoverOverlay = null;
  ui.secondSrvPrompt = false;
  ui.matchEndDismissed = false;
  navigate('board');
}

// ==================== URL SHARING, LIVE BROADCAST & EXPORT (PDF / PNG / LINK) ====================
const SUB_TYPES = ['winner', 'smash', 'volea', 'bandeja', 'bajada', 'dejada', 'passing', 'globo'];

function encodeMatchShare(m) {
  try {
    // Compact payload for URL sharing & real-time live broadcast
    const compact = {
      id: m.id,
      ts: Date.now(),
      c: m.createdAt,
      d: m.durationMs,
      s: m.status,
      m: m.mode,
      t: m.teams,
      r: m.rules,
      fs: m.firstServer,
      ss: m.secondServerIdx,
      fl: m.flipped ? 1 : 0,
      pf: m.pendingFault ? 1 : 0,
      // Pack events into compact array: [w, typeCode, byTeam, byPlayer, fsBit, subCode]
      e: m.events.map(ev => {
        const subIdx = ev.sub ? SUB_TYPES.indexOf(ev.sub) : 0;
        return [
          ev.w,
          {pt:0, winner:1, ue:2, fe:3, df:4}[ev.type || 'pt'] || 0,
          ev.by ? ev.by[0] : -1,
          ev.by ? ev.by[1] : -1,
          ev.fs === false ? 0 : 1,
          subIdx > 0 ? subIdx : 0
        ];
      })
    };
    const json = JSON.stringify(compact);
    const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    return b64;
  } catch (e) { return ''; }
}

function decodeMatchShare(b64) {
  try {
    const norm = String(b64 || '').trim().replace(/-/g,'+').replace(/_/g,'/');
    if (!norm) return null;
    const json = decodeURIComponent(escape(atob(norm)));
    const c = JSON.parse(json);
    const TMAP = ['pt','winner','ue','fe','df'];
    return {
      id: c.id || ('shared_' + (c.c || Date.now())),
      _ts: c.ts || 0,
      createdAt: c.c || Date.now(),
      durationMs: c.d || 0,
      status: c.s || 'finished',
      mode: c.m || 'doubles',
      teams: c.t,
      rules: c.r,
      firstServer: c.fs || [0,0],
      secondServerIdx: c.ss ?? 0,
      shotPrompt: true,
      flipped: !!c.fl,
      pendingFault: !!c.pf,
      events: (c.e || []).map(a => ({
        w: a[0],
        type: TMAP[a[1]] || 'pt',
        by: a[2] >= 0 ? [a[2], a[3]] : null,
        fs: a[4] !== 0,
        sub: (a[5] && a[5] > 0 && SUB_TYPES[a[5]]) ? SUB_TYPES[a[5]] : null
      })),
      redoStack: []
    };
  } catch { return null; }
}

// Serverless Real-Time Live Broadcast (Pub/Sub via ntfy.sh SSE + JSON cache)
let livePubTimer = null;
let liveEvtSource = null;
let livePollTimer = null;
let lastPublishedB64 = '';
let lastAppliedSig = '';

function shortMatchCode(id) {
  const clean = String(id || 'default').replace(/^m_/, '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
  return clean.slice(-6) || 'padel1';
}

function cleanLiveTopic(id) {
  return 'padel_se_live_' + shortMatchCode(id);
}

function matchStateSignature(m) {
  if (!m) return '';
  const lastEv = m.events && m.events.length ? m.events[m.events.length - 1] : null;
  return [
    m.id,
    m.status,
    m.events ? m.events.length : 0,
    lastEv ? `${lastEv.w}:${lastEv.type}:${lastEv.fs}` : '',
    m.pendingFault ? 1 : 0,
    m.flipped ? 1 : 0,
    m.firstServer ? m.firstServer.join(',') : '',
    m.secondServerIdx ?? '',
    m.teams ? m.teams.map(t => t.players.join(',') + ':' + t.color).join('|') : ''
  ].join('#');
}

function publishLiveMatchState(m, immediate = false) {
  if (!m || !m.id) return;
  const sendNow = () => {
    const b64 = encodeMatchShare(m);
    if (!b64 || (!immediate && b64 === lastPublishedB64)) return;
    lastPublishedB64 = b64;
    const topic = cleanLiveTopic(m.id);
    fetch(`https://ntfy.sh/${topic}`, {
      method: 'POST',
      body: b64,
      headers: { 'Title': 'Padel Control SE Live', 'Cache': 'yes' }
    }).catch(() => {});
  };
  clearTimeout(livePubTimer);
  if (immediate) {
    sendNow();
  } else {
    livePubTimer = setTimeout(sendNow, 120);
  }
}

async function shareLiveMatchLink(m) {
  if (!m) return;
  publishLiveMatchState(m, true);
  const code = shortMatchCode(m.id);
  const baseUrl = location.href.split('#')[0];
  const url = `${baseUrl}#v=${code}`;
  const playersLine = `${teamLabel(m,0)} vs ${teamLabel(m,1)}`;
  const waText = `🎾 *Seguí mi partido en vivo:*\n*${playersLine}*\n${url}`;
  if (navigator.share) {
    try {
      await navigator.share({
        title: `🎾 Seguí mi partido en vivo · ${playersLine}`,
        text: `🎾 Seguí mi partido en vivo: ${playersLine}`,
        url
      });
      return;
    } catch {}
  }
  try {
    await navigator.clipboard.writeText(waText);
    showToast('📡 Invitación corta EN VIVO copiada para pegar en WhatsApp');
  } catch {
    prompt('Copiá este mensaje para compartir el partido en vivo:', waText);
  }
}

function applyIncomingLiveSnapshot(b64, isInitial = false) {
  const incoming = decodeMatchShare(b64);
  if (!incoming || !incoming.teams) return;
  if (ui.liveId && incoming.id && shortMatchCode(incoming.id) !== shortMatchCode(ui.liveId)) return;

  const sig = matchStateSignature(incoming);
  const prev = ui.liveMatch;
  const prevSig = matchStateSignature(prev);

  if (prev && sig === prevSig) {
    // Sync clock if incoming timestamp is newer
    if (incoming.durationMs > (prev.durationMs || 0)) {
      prev.durationMs = incoming.durationMs;
    }
    return;
  }

  // Detect what changed to trigger live sound, voice & court flash for spectator
  const prevLen = prev && prev.events ? prev.events.length : null;
  const newLen = incoming.events ? incoming.events.length : 0;
  const prevFault = prev ? !!prev.pendingFault : false;

  ui.liveMatch = incoming;
  lastAppliedSig = sig;

  if (!isInitial && prev !== null) {
    if (prevLen !== null && newLen > prevLen) {
      const stAfter = computeMatch(incoming);
      const lastEv = incoming.events[newLen - 1];
      const tr = stAfter.lastTransition;
      if (tr) {
        if (tr.type === 'match') {
          ui.matchEndDismissed = false;
          playTone('match');
          vibrate([100, 60, 100, 60, 220]);
        } else if (tr.type === 'set') {
          playTone('set');
          vibrate([90, 50, 140]);
        } else if (tr.type === 'game' || tr.type === 'tb_changeover') {
          playTone('game');
          vibrate([80, 50, 80]);
        }
      } else {
        playTone('point');
        vibrate(35);
      }
      speakScore(incoming, stAfter);
      if (lastEv && (lastEv.w === 0 || lastEv.w === 1)) {
        requestAnimationFrame(() => {
          const halfEl = document.querySelector(`.half[data-team="${lastEv.w}"]`);
          if (halfEl) {
            halfEl.classList.add('flash');
            setTimeout(() => halfEl.classList.remove('flash'), 550);
          }
        });
      }
    } else if (prevLen !== null && newLen < prevLen) {
      playTone('undo');
    } else if (incoming.pendingFault && !prevFault) {
      playTone('fault');
    }
  }

  if (ui.route === 'live' || (ui.route === 'stats' && ui.statsId === 'live')) {
    render();
  }
}

async function pollLiveChannelOnce(topic) {
  try {
    const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=12h`, { cache: 'no-store' });
    if (!res.ok) return;
    const txt = await res.text();
    const lines = txt.trim().split('\n').filter(Boolean);
    let latestMsg = null;
    for (const line of lines) {
      try {
        const obj = JSON.parse(line);
        if (obj && obj.event === 'message' && obj.message) {
          latestMsg = obj.message;
        }
      } catch {}
    }
    if (latestMsg) {
      applyIncomingLiveSnapshot(latestMsg, false);
    }
  } catch {}
}

function connectLiveSpectator(rawParam) {
  const cleanRaw = String(rawParam || '').trim();
  if (!cleanRaw) return;
  const dotIdx = cleanRaw.indexOf('.');
  const matchId = decodeURIComponent(dotIdx >= 0 ? cleanRaw.slice(0, dotIdx) : cleanRaw);
  const initialSnap = dotIdx >= 0 ? cleanRaw.slice(dotIdx + 1) : '';

  const isSameChannel = (ui.liveId === matchId && liveEvtSource);
  ui.liveId = matchId;
  ui.route = 'live';

  if (initialSnap && !ui.liveMatch) {
    applyIncomingLiveSnapshot(initialSnap, true);
  }
  render();
  updateWakeLock();

  if (isSameChannel) return;

  disconnectLiveStreamOnly();
  const topic = cleanLiveTopic(matchId);

  // 1. Immediate fetch of latest cached message from channel
  pollLiveChannelOnce(topic);

  // 2. Real-time Server-Sent Events (SSE) stream
  if ('EventSource' in window) {
    try {
      liveEvtSource = new EventSource(`https://ntfy.sh/${topic}/sse`);
      liveEvtSource.onopen = () => {
        ui.liveConnected = true;
      };
      liveEvtSource.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (data && (data.event === 'message' || !data.event) && data.message) {
            ui.liveConnected = true;
            applyIncomingLiveSnapshot(data.message, false);
          }
        } catch {}
      };
      liveEvtSource.onerror = () => {
        ui.liveConnected = false;
      };
    } catch {}
  }

  // 3. Fallback polling every 3.5s for strict mobile networks/firewalls
  livePollTimer = setInterval(() => {
    if (!ui.liveId) return;
    pollLiveChannelOnce(topic);
  }, 3500);
}

function disconnectLiveStreamOnly() {
  if (liveEvtSource) {
    try { liveEvtSource.close(); } catch {}
    liveEvtSource = null;
  }
  if (livePollTimer) {
    clearInterval(livePollTimer);
    livePollTimer = null;
  }
  ui.liveConnected = false;
}

function disconnectLiveSpectator() {
  disconnectLiveStreamOnly();
  ui.liveId = null;
  ui.liveMatch = null;
  if (location.hash.startsWith('#live=') || location.hash.startsWith('#v=')) {
    history.replaceState(null, '', location.pathname + location.search);
  }
}

async function openShortSharedMatch(rawCode) {
  const code = shortMatchCode(rawCode);
  const topic = cleanLiveTopic(code);
  try {
    const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=12h`, { cache: 'no-store' });
    if (res.ok) {
      const txt = await res.text();
      const lines = txt.trim().split('\n').filter(Boolean);
      let latestMsg = null;
      for (const line of lines) {
        try {
          const obj = JSON.parse(line);
          if (obj && obj.event === 'message' && obj.message) latestMsg = obj.message;
        } catch {}
      }
      if (latestMsg) {
        const m = decodeMatchShare(latestMsg);
        if (m) {
          ui.sharedMatch = m;
          ui.statsId = 'shared';
          ui.route = 'stats';
          render();
          return;
        }
      }
    }
  } catch {}
  showToast('No se encontró el partido compartido o expiró');
}

async function exportMatchSummaryImage(m) {
  const stats = computeStats(m, 'all');
  const st = stats.st;
  const T = stats.T;
  const W = 1080, H = 1400;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Background gradient (Obsidian & Gold)
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#050507');
  grad.addColorStop(0.5, '#0c0c10');
  grad.addColorStop(1, '#12100a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Header brand
  ctx.fillStyle = '#d4af37';
  ctx.font = '800 28px Inter, sans-serif';
  ctx.fillText('PÁDEL CONTROL SÉ · RESUMEN DEL PARTIDO', 64, 78);

  ctx.fillStyle = '#a39e93';
  ctx.font = '500 24px Inter, sans-serif';
  ctx.fillText(`${fmtDateLong(m.createdAt)} · Duración ${fmtDurationLong(m.durationMs)}`, 64, 118);

  // Virtual signature top-right
  ctx.save();
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffe58f';
  ctx.font = '42px "Great Vibes", cursive';
  ctx.fillText('Sairaf Engel', W - 64, 96);
  ctx.restore();

  // Scoreboard Card
  roundRect(ctx, 56, 152, W - 112, 250, 28, '#121218');
  for (let t = 0; t < 2; t++) {
    const y = 225 + t * 105;
    ctx.fillStyle = m.teams[t].color;
    roundRect(ctx, 88, y - 38, 12, 54, 6, m.teams[t].color);
    ctx.fillStyle = st.matchWinner === t ? '#ffe58f' : '#e5e0d5';
    ctx.font = `${st.matchWinner === t ? '800' : '700'} 44px "Barlow Condensed", sans-serif`;
    ctx.fillText(teamLabel(m, t).toUpperCase(), 120, y + 6);

    // Sets
    st.sets.forEach((s, idx) => {
      if (s.games[0] === 0 && s.games[1] === 0 && idx > 0 && s.winner === null) return;
      const bx = W - 110 - (st.sets.length - 1 - idx) * 86;
      const won = s.winner === t;
      roundRect(ctx, bx - 54, y - 42, 68, 64, 14, won ? '#d4af37' : '#1b1b24');
      ctx.fillStyle = won ? '#080602' : '#a39e93';
      ctx.font = '800 42px "Barlow Condensed", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(s.games[t]), bx - 20, y + 5);
      ctx.textAlign = 'left';
    });
  }

  // Stats comparison bars
  const rows = [
    ['Puntos ganados', T[0].ptsWon, T[1].ptsWon, T[0].ptsWon, T[1].ptsWon],
    ['Golpes ganadores', T[0].winners, T[1].winners, T[0].winners, T[1].winners],
    ['Errores no forzados', T[0].ue, T[1].ue, T[0].ue, T[1].ue],
    ['Puntos de break', `${T[0].bpWon}/${T[0].bpTotal}`, `${T[1].bpWon}/${T[1].bpTotal}`, T[0].bpWon, T[1].bpWon],
    ['Puntos de oro / Star Point', `${T[0].gpWon}/${T[0].gpTotal}`, `${T[1].gpWon}/${T[1].gpTotal}`, T[0].gpWon, T[1].gpWon],
    ['Puntos ganados al saque', pct(T[0].srvPtsWon, T[0].srvPtsTotal)+'%', pct(T[1].srvPtsWon, T[1].srvPtsTotal)+'%', pct(T[0].srvPtsWon, T[0].srvPtsTotal), pct(T[1].srvPtsWon, T[1].srvPtsTotal)],
    ['Primeros saques dentro', pct(T[0].firstServeIn, T[0].srvPtsTotal)+'%', pct(T[1].firstServeIn, T[1].srvPtsTotal)+'%', pct(T[0].firstServeIn, T[0].srvPtsTotal), pct(T[1].firstServeIn, T[1].srvPtsTotal)],
    ['Mejor racha de puntos', T[0].maxPtStreak, T[1].maxPtStreak, T[0].maxPtStreak, T[1].maxPtStreak]
  ];

  roundRect(ctx, 56, 434, W - 112, 820, 28, '#121218');
  rows.forEach((r, i) => {
    const y = 505 + i * 94;
    ctx.fillStyle = '#d4af37';
    ctx.font = '600 22px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(r[0].toUpperCase(), W / 2, y - 16);

    ctx.fillStyle = '#f8f6f0';
    ctx.font = '800 34px "Barlow Condensed", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(String(r[1]), 96, y + 22);
    ctx.textAlign = 'right';
    ctx.fillText(String(r[2]), W - 96, y + 22);

    const barX = 210, barW = W - 420, barY = y + 8;
    roundRect(ctx, barX, barY, barW, 14, 7, '#22222c');
    const sum = (Number(r[3]) || 0) + (Number(r[4]) || 0);
    const p0 = sum > 0 ? (Number(r[3]) / sum) : 0.5;
    const w0 = Math.round(barW * p0);
    if (w0 > 0) roundRect(ctx, barX, barY, w0, 14, 7, m.teams[0].color);
    if (barW - w0 > 0) roundRect(ctx, barX + w0, barY, barW - w0, 14, 7, m.teams[1].color);
  });

  // Bottom signature watermark
  ctx.textAlign = 'center';
  ctx.fillStyle = '#a39e93';
  ctx.font = '600 18px Inter, sans-serif';
  ctx.fillText('PÁDEL CONTROL SÉ · BY', W / 2 - 75, 1320);
  ctx.fillStyle = '#ffe58f';
  ctx.font = '40px "Great Vibes", cursive';
  ctx.fillText('Sairaf Engel', W / 2 + 80, 1324);
  ctx.textAlign = 'left';

  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], `padel-control-se-${m.id}.png`, {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file], title:'Pádel Control SÉ'}); return; } catch {}
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `padel-control-se-${new Date(m.createdAt).toISOString().slice(0,10)}.png`;
    a.click();
    showToast('Imagen descargada');
  }, 'image/png');
}

function roundRect(ctx, x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
  ctx.fillStyle = fill;
  ctx.fill();
}

function pct(a, b) { return b > 0 ? Math.round((a * 100) / b) : 0; }

        <div class="stepper">
          <button type="button" class="step-btn" data-step="tiebreakPoints:-1" ${tbPts<=1?'disabled':''} aria-label="Menos puntos de tie-break">−</button>
          <span class="step-val">${tbPts}</span>
          <button type="button" class="step-btn" data-step="tiebreakPoints:1" ${tbPts>=30?'disabled':''} aria-label="Más puntos de tie-break">+</button>
        </div>` : ''}
      </div>
      <div class="rule-block" style="padding-top:0">
        <div class="pills">
          <button type="button" class="pill ${hasTB?'on':''}" data-preset="tb:${tbPts}">Con Tie-break (${tbPts} ptos)</button>
          <button type="button" class="pill ${!hasTB?'on':''}" data-preset="tb:0">Sin Tie-break</button>
        </div>
      </div>

      ${totalSets > 1 ? `
      <div class="rule-block">
        <div class="rb-head">
          <b>Set decisivo (${totalSets}º set)</b>
          <small>${p.finalSet==='supertb' ? 'Súper Tie-Break a 10 puntos en caso de empate a sets' : 'Se juega como un set normal'}</small>
        </div>
        <div class="pills">
          <button type="button" class="pill ${p.finalSet==='normal'?'on':''}" data-preset="finalSet:normal">Set normal</button>
          <button type="button" class="pill ${p.finalSet==='supertb'?'on':''}" data-preset="finalSet:supertb">Súper TB (10)</button>
        </div>
      </div>` : ''}

      <div class="rule-block">
        <div class="rb-head">
          <b>Cambio de lado automático</b>
          <small>${
            p.changeoverRule === 'set'
              ? 'No se cambia de lado durante el set, solo al finalizar cada set'
              : p.changeoverRule === 'none'
                ? 'No se cambia de lado automáticamente'
                : 'Cambio de lado en juegos impares (1, 3, 5...) y cada 6 tantos de Tie-Break'
          }</small>
        </div>
        <div class="pills">
          <button type="button" class="pill ${(p.changeoverRule||'odd')==='odd'?'on':''}" data-preset="changeoverRule:odd">Juegos impares</button>
          <button type="button" class="pill ${p.changeoverRule==='set'?'on':''}" data-preset="changeoverRule:set">Al terminar el set</button>
          <button type="button" class="pill ${p.changeoverRule==='none'?'on':''}" data-preset="changeoverRule:none">Sin cambio</button>
        </div>
      </div>
    </div>

    <div class="sec-t">Durante el partido</div>
    <div class="card">
      <div class="field">
        <label>¿Quién empieza sacando?</label>
        <div class="chips" id="srv-chips-box">${srvChips.join('')}</div>
      </div>
      <div class="tog">
        <div>
          <b>Estadísticas avanzadas por golpe</b>
          <small>Pregunta Winner, Error no forzado o Error forzado por jugador al anotar.</small>
        </div>
        <label class="sw"><input type="checkbox" ${p.shotPrompt?'checked':''} data-preset-bool="shotPrompt"><span></span></label>
      </div>
    </div>

    <button class="btn primary big block" data-act="start-match">${ICONS.play} Empezar Partido</button>
    ${renderSignatureFooter()}
  </div>
  ${renderTabbar('new')}`;
}

// ==================== SCOREBOARD & MODALS RENDERER ====================
function renderBoard(isDisplayOnly = false) {
  const isRemoteLive = (ui.route === 'live');
  const m = isRemoteLive ? ui.liveMatch : activeMatch;

  if (!m) {
    if (isRemoteLive) {
      return `
      <div class="page">
        <div class="empty">
          ${ICONS.live}<br>
          <b>Conectando con la cancha en vivo...</b><br>
          <span class="muted">Esperando señal en tiempo real del partido.</span><br><br>
          <button class="btn" data-act="exit-live">Salir al inicio</button>
        </div>
      </div>`;
    }
    return `<div class="page"><div class="empty">No hay ningún partido activo.<br><br><button class="btn primary" data-nav="new">Crear Partido</button></div></div>`;
  }
  const st = computeMatch(m);
  const order = m.flipped ? [1, 0] : [0, 1];

  const renderHalf = (t) => {
    const col = m.teams[t].color;
    const fg = fgFor(col);
    const playersHtml = [];
    for (let pi = 0; pi < 2; pi++) {
      const isSrv = st.matchWinner === null && st.srvTeam === t && st.srvPlayer === pi;
      playersHtml.push(`
        <div class="pn ${isSrv?'srv':''}">
          <span class="ball"></span>
          <span class="nm">${esc(playerLabel(m, t, pi))}</span>
          ${isSrv && m.pendingFault ? `<em class="fault">2º SAQUE</em>` : ''}
        </div>`);
    }

    const setsHtml = st.sets.map((s, idx) => {
      if (idx === st.curSetIdx && st.matchWinner === null) return '';
      if (s.games[0] === 0 && s.games[1] === 0 && s.winner === null) return '';
      const won = s.winner === t;
      const tbSup = s.tbScore ? `<sup>${s.tbScore[t]}</sup>` : '';
      return `<span class="${won?'won':''}">${s.games[t]}${tbSup}</span>`;
    }).join('');

    const ptVal = st.matchWinner !== null
      ? (st.matchWinner === t ? ICONS.trophy : '—')
      : esc(st.pointDisplay[t]);

    return `
    <div class="half" data-team="${t}" ${isDisplayOnly ? 'data-ro="1"' : 'tabindex="0" role="button"'} style="--tc:${esc(col)};--tf:${fg}">
      <div class="players">${playersHtml.join('')}</div>
      <div class="h-sets">${setsHtml}</div>
      <div class="h-games">
        <small>${st.isSuperTB ? 'SÚPER TB' : 'JUEGOS'}</small>
        <b>${st.curSet.games[t]}</b>
      </div>
      <div class="h-pts">${ptVal}</div>
    </div>`;
  };

  // Center status pills
  const tags = [];
  if (st.matchWinner !== null) {
    tags.push(`<span class="tag gold">FINALIZADO</span>`);
  } else {
    tags.push(`<span class="tag">${st.isSuperTB ? 'SÚPER TIE-BREAK' : st.isTB ? 'TIE-BREAK' : `SET ${st.curSetIdx + 1}`}</span>`);
    if (st.isStar) {
      tags.push(`<span class="tag gold">★ STAR POINT (PUNTO DECISIVO)</span>`);
    } else if (st.isGP) {
      tags.push(`<span class="tag gold">PUNTO DE ORO</span>`);
    } else if (m.rules.deuceRule === 'star' && !st.isTB && st.p[0] >= 3 && st.p[1] >= 3) {
      if (st.p[0] !== st.p[1]) {
        tags.push(`<span class="tag">${st.curAdvNumber}ª VENTAJA (DE 2)</span>`);
      } else if (st.curDeuceCount === 2) {
        tags.push(`<span class="tag">IGUALES (QUEDA 1 VENTAJA ANTES DEL ★ STAR POINT)</span>`);
      } else if (st.curDeuceCount === 1) {
        tags.push(`<span class="tag">IGUALES (HASTA 2 VENTAJAS)</span>`);
      }
    }
    for (let t = 0; t < 2; t++) {
      if (st.mp[t]) tags.push(`<span class="tag hot" style="--c:${esc(m.teams[t].color)};--f:${fgFor(m.teams[t].color)}">MATCH POINT · ${esc(teamLabel(m,t))}</span>`);
      else if (st.sp[t]) tags.push(`<span class="tag hot" style="--c:${esc(m.teams[t].color)};--f:${fgFor(m.teams[t].color)}">SET POINT · ${esc(teamLabel(m,t))}</span>`);
    }
    if (st.isBP && !st.isGP) {
      const rcv = 1 - st.srvTeam;
      tags.push(`<span class="tag warn">BOLA DE BREAK · ${esc(teamLabel(m, rcv))}</span>`);
    }
    if (ui.voiceListening) {
      tags.push(`<span class="tag mic">● MIC ACTIVO</span>`);
    }
    if (tags.length === 1 && !isDisplayOnly) {
      tags.push(`<span class="tag dim">Tocá el lado ganador del punto</span>`);
    }
  }

  return `
  <div class="board ${isDisplayOnly?'display':''}">
    <header class="sb-top">
      ${isRemoteLive ? `
        <button class="icon-btn" data-act="exit-live" title="Salir de la transmisión">${ICONS.back}</button>
        <div class="sb-clock">
          <span id="sb-clock-val">${esc(fmtClock(m.durationMs))}</span>
          <small><b class="red">● EN VIVO</b> · ${st.matchWinner !== null ? 'FINALIZADO' : `SET ${st.curSetIdx + 1} · SACA ${esc(playerLabel(m, st.srvTeam, st.srvPlayer))}`}</small>
        </div>
        <button class="icon-btn ${prefs.voice?'on':''}" data-act="toggle-voice-tts" title="Activar voz de árbitro en vivo">${prefs.voice ? ICONS.vol : ICONS.mute}</button>
        <button class="icon-btn" data-open-stats="live" title="Estadísticas en tiempo real">${ICONS.chart}</button>
        <button class="icon-btn" data-act="fullscreen" title="Pantalla completa">${ICONS.full}</button>
      ` : isDisplayOnly ? `
        <button class="icon-btn" data-nav="board" title="Salir de modo TV">${ICONS.back}</button>
        <div class="sb-clock">
          <span id="sb-clock-val">${esc(fmtClock(m.durationMs))}</span>
          <small><b class="red">● EN VIVO</b> · ${esc(teamLabel(m,0))} vs ${esc(teamLabel(m,1))}</small>
        </div>
        <button class="icon-btn" data-act="fullscreen" title="Pantalla completa">${ICONS.full}</button>
      ` : `
        <button class="icon-btn" data-nav="home" title="Inicio">${ICONS.back}</button>
        <button class="icon-btn" data-act="share-live" title="Compartir partido en vivo por link">${ICONS.live}</button>
        <div class="sb-clock" data-act="toggle-pause" style="cursor:pointer" title="Tocar para pausar/reanudar reloj">
          <span id="sb-clock-val">${esc(fmtClock(m.durationMs))}</span>
          <small>${m.status==='paused' ? '<b class="red">PAUSADO</b>' : `SET ${st.curSetIdx + 1} · SACA ${esc(playerLabel(m, st.srvTeam, st.srvPlayer))}`}</small>
        </div>
        <button class="icon-btn ${prefs.voice?'on':''}" data-act="toggle-voice-tts" title="Voz de árbitro">${prefs.voice ? ICONS.vol : ICONS.mute}</button>
        <button class="icon-btn ${ui.voiceListening?'on':''}" data-act="toggle-voice-rec" title="Control por voz manos libres">${ICONS.mic}</button>
        <button class="icon-btn" data-act="open-menu" title="Opciones">${ICONS.dots}</button>
      `}
    </header>

    <main class="court">
      ${renderHalf(order[0])}
      <div class="mid">${tags.join('')}</div>
      ${renderHalf(order[1])}
    </main>

    ${isDisplayOnly ? '' : `
    <footer class="sb-foot">
      <button data-act="undo" ${(!m.events.length && !m.pendingFault)?'disabled':''} title="Deshacer (Z / Backspace)">${ICONS.undo}<span class="lbl">Deshacer</span></button>
      <button data-act="redo" ${(!m.redoStack || !m.redoStack.length)?'disabled':''} title="Rehacer (Y)">${ICONS.redo}<span class="lbl">Rehacer</span></button>
      <button class="fault-btn ${m.pendingFault?'on':''}" data-act="fault" ${st.matchWinner!==null?'disabled':''} title="Falta de saque / Doble falta (F)">
        ${m.pendingFault ? 'DOBLE FALTA' : 'FALTA SAQUE'}
      </button>
      <button data-act="flip" title="Cambiar lados de cancha (S)">${ICONS.swap}<span class="lbl">Lados</span></button>
      <button data-open-stats="active" title="Ver estadísticas en vivo">${ICONS.chart}<span class="lbl">Stats</span></button>
    </footer>`}

    ${!isDisplayOnly ? renderBoardOverlays(m, st) : (isRemoteLive && st.matchWinner !== null && !ui.matchEndDismissed ? `
    <div class="overlay">
      <div class="big-ic">${ICONS.trophy}</div>
      <p>¡PARTIDO FINALIZADO EN VIVO!</p>
      <h2>${esc(teamLabel(m, st.matchWinner))}</h2>
      <div class="ov-score">
        ${[0,1].map(t => `
          <div class="mrow">
            <span class="bar" style="--c:${esc(m.teams[t].color)}"></span>
            <span class="nm">${esc(teamLabel(m, t))}</span>
            ${st.sets.map(s => `<span class="s ${s.winner===t?'w':''}">${s.games[t]}</span>`).join('')}
          </div>`).join('')}
      </div>
      <div class="btn-row">
        <button class="btn primary big" data-open-stats="live">${ICONS.chart} Ver Estadísticas del Partido</button>
        <button class="btn big" data-act="save-live">Guardar en mi historial</button>
      </div>
    </div>` : '')}
  </div>`;
}

    html += `

              <span class="k">${i+3}</span>
              ${esc(nm)}
              <small>Error no forzado</small>
            </button>`).join('')}

        <div class="opt-sec">Error forzado de ${esc(teamLabel(m, l))}</div>

        ${st.srvTeam === l ? `

          <span class="k">F</span>

        <div class="btn-row">

  // 2. Second server prompt (after Game 1 in doubles if not yet chosen)

    <div class="scrim">
      <div class="sheet">

          <div class="mrow">
            <span class="bar" style="--c:${esc(m.teams[t].color)}"></span>
            <span class="nm">${esc(teamLabel(m, t))}</span>

      </div>
